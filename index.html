<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proton Force Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a1a;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #toolbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: #12122a;
    border-bottom: 1px solid #2a2a4a;
    z-index: 10;
    flex-wrap: wrap;
  }

  #toolbar h1 {
    font-size: 18px;
    font-weight: 600;
    color: #ff6b6b;
    margin-right: 8px;
    white-space: nowrap;
  }

  .btn {
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }

  #goBtn {
    background: #22c55e;
    color: #fff;
  }
  #goBtn:hover { background: #16a34a; }
  #goBtn.running {
    background: #ef4444;
  }
  #goBtn.running:hover { background: #dc2626; }

  #clearBtn {
    background: #374151;
    color: #e0e0e0;
  }
  #clearBtn:hover { background: #4b5563; }

  #addClusterBtn {
    background: #6366f1;
    color: #fff;
  }
  #addClusterBtn:hover { background: #4f46e5; }

  .slider-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .slider-group label {
    font-size: 13px;
    color: #9ca3af;
    white-space: nowrap;
  }

  .slider-group input[type="range"] {
    width: 100px;
    accent-color: #6366f1;
  }

  #stats {
    font-size: 13px;
    color: #9ca3af;
    margin-left: auto;
    white-space: nowrap;
  }

  #main {
    flex: 1;
    display: flex;
    position: relative;
  }

  #canvas {
    flex: 1;
    display: block;
    cursor: crosshair;
  }

  #energyPanel {
    width: 260px;
    background: #12122a;
    border-left: 1px solid #2a2a4a;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 12px;
  }

  #energyPanel h2 {
    font-size: 14px;
    font-weight: 600;
    color: #9ca3af;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .energy-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
  }

  .energy-label {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .energy-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .energy-value {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  #graphCanvas {
    width: 100%;
    height: 160px;
    border-radius: 6px;
    background: #0a0a1a;
    border: 1px solid #2a2a4a;
  }

  #instructions {
    position: absolute;
    bottom: 20px;
    left: calc(50% - 130px);
    transform: translateX(-50%);
    background: rgba(18, 18, 42, 0.85);
    border: 1px solid #2a2a4a;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 13px;
    color: #9ca3af;
    pointer-events: none;
    text-align: center;
    transition: opacity 0.5s;
  }
</style>
</head>
<body>

<div id="toolbar">
  <h1>Proton Simulation</h1>
  <button class="btn" id="goBtn">Go</button>
  <button class="btn" id="clearBtn">Clear</button>
  <button class="btn" id="addClusterBtn">Add Cluster</button>
  <div class="slider-group">
    <label>Speed: <span id="speedVal">1.0</span>x</label>
    <input type="range" id="speedSlider" min="0.01" max="1" step="0.01" value="1">
  </div>
  <span id="stats">Protons: 0</span>
</div>

<div id="main">
  <canvas id="canvas"></canvas>

  <div id="energyPanel">
    <h2>Energy</h2>
    <div class="energy-row">
      <span class="energy-label"><span class="energy-dot" style="background:#f59e0b"></span> Energy in motion</span>
      <span class="energy-value" id="kineticVal">0</span>
    </div>
    <div class="energy-row">
      <span class="energy-label"><span class="energy-dot" style="background:#3b82f6"></span> Energy in interactions</span>
      <span class="energy-value" id="potentialVal">0</span>
    </div>
    <div class="energy-row" style="border-top: 1px solid #2a2a4a; padding-top: 8px;">
      <span class="energy-label"><span class="energy-dot" style="background:#22c55e"></span> Total</span>
      <span class="energy-value" id="totalVal">0</span>
    </div>
    <canvas id="graphCanvas"></canvas>
  </div>

  <div id="instructions">Click to place protons, then press <strong>Go</strong> to watch them repel!</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const graphCanvas = document.getElementById('graphCanvas');
const gctx = graphCanvas.getContext('2d');
const goBtn = document.getElementById('goBtn');
const clearBtn = document.getElementById('clearBtn');
const addClusterBtn = document.getElementById('addClusterBtn');
const speedSlider = document.getElementById('speedSlider');
const speedValEl = document.getElementById('speedVal');
const stats = document.getElementById('stats');
const instructions = document.getElementById('instructions');
const kineticVal = document.getElementById('kineticVal');
const potentialVal = document.getElementById('potentialVal');
const totalVal = document.getElementById('totalVal');

let protons = [];
let running = false;
let animId = null;
let speed = 1.0;
const PROTON_RADIUS = 10;
const COULOMB_K = 800;
const MIN_DIST = 4;

// Energy history for graph
const MAX_HISTORY = 200;
let energyHistory = [];

function resize() {
  const toolbarH = document.getElementById('toolbar').offsetHeight;
  const mainH = window.innerHeight - toolbarH;
  canvas.width = canvas.parentElement.offsetWidth - 260;
  canvas.height = mainH;
  graphCanvas.width = graphCanvas.offsetWidth * devicePixelRatio;
  graphCanvas.height = graphCanvas.offsetHeight * devicePixelRatio;
  gctx.scale(devicePixelRatio, devicePixelRatio);
  if (!running) { draw(); drawGraph(); }
}
window.addEventListener('resize', resize);
setTimeout(resize, 0);

function createProton(x, y) {
  return { x, y, vx: 0, vy: 0 };
}

// Click to add protons
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  protons.push(createProton(x, y));
  updateStats();
  if (!running) { computeEnergy(); draw(); drawGraph(); }
  hideInstructions();
});

// Add a cluster of protons
addClusterBtn.addEventListener('click', () => {
  const cx = canvas.width / 2 + (Math.random() - 0.5) * 100;
  const cy = canvas.height / 2 + (Math.random() - 0.5) * 100;
  const count = 10 + Math.floor(Math.random() * 10);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = Math.random() * 40;
    protons.push(createProton(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r));
  }
  updateStats();
  if (!running) { computeEnergy(); draw(); drawGraph(); }
  hideInstructions();
});

// Go / Stop
goBtn.addEventListener('click', () => {
  running = !running;
  goBtn.textContent = running ? 'Stop' : 'Go';
  goBtn.classList.toggle('running', running);
  if (running) loop();
  else cancelAnimationFrame(animId);
});

// Clear
clearBtn.addEventListener('click', () => {
  protons = [];
  energyHistory = [];
  running = false;
  goBtn.textContent = 'Go';
  goBtn.classList.remove('running');
  cancelAnimationFrame(animId);
  updateStats();
  computeEnergy();
  draw();
  drawGraph();
});

// Speed slider
speedSlider.addEventListener('input', () => {
  speed = parseFloat(speedSlider.value);
  speedValEl.textContent = speed.toFixed(2);
});

function hideInstructions() {
  instructions.style.opacity = '0';
  setTimeout(() => instructions.style.display = 'none', 500);
}

function updateStats() {
  stats.textContent = `Protons: ${protons.length}`;
}

// Compute energies
function computeEnergy() {
  let kinetic = 0;
  let potential = 0;
  const n = protons.length;

  for (let i = 0; i < n; i++) {
    const p = protons[i];
    kinetic += 0.5 * (p.vx * p.vx + p.vy * p.vy);
  }

  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const dx = protons[j].x - protons[i].x;
      const dy = protons[j].y - protons[i].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 0) {
        potential += COULOMB_K / dist;
      }
    }
  }

  kineticVal.textContent = kinetic.toFixed(1);
  potentialVal.textContent = potential.toFixed(1);
  totalVal.textContent = (kinetic + potential).toFixed(1);

  if (running) {
    energyHistory.push({ kinetic, potential, total: kinetic + potential });
    if (energyHistory.length > MAX_HISTORY) energyHistory.shift();
  }

  return { kinetic, potential };
}

// Draw energy graph
function drawGraph() {
  const w = graphCanvas.offsetWidth;
  const h = graphCanvas.offsetHeight;
  gctx.clearRect(0, 0, w, h);

  if (energyHistory.length < 2) {
    gctx.fillStyle = '#4a4a6a';
    gctx.font = '11px sans-serif';
    gctx.textAlign = 'center';
    gctx.fillText('Graph appears when running', w / 2, h / 2);
    return;
  }

  // Find max value for scaling
  let maxVal = 1;
  for (const e of energyHistory) {
    maxVal = Math.max(maxVal, e.kinetic, e.potential, e.total);
  }
  maxVal *= 1.1;

  const len = energyHistory.length;
  const xStep = w / (MAX_HISTORY - 1);
  const xOff = (MAX_HISTORY - len) * xStep;

  function drawLine(key, color) {
    gctx.strokeStyle = color;
    gctx.lineWidth = 1.5;
    gctx.beginPath();
    for (let i = 0; i < len; i++) {
      const x = xOff + i * xStep;
      const y = h - (energyHistory[i][key] / maxVal) * (h - 8) - 4;
      if (i === 0) gctx.moveTo(x, y);
      else gctx.lineTo(x, y);
    }
    gctx.stroke();
  }

  drawLine('potential', '#3b82f6');
  drawLine('kinetic', '#f59e0b');
  drawLine('total', '#22c55e');
}

// Physics step
function step(dt) {
  const n = protons.length;

  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const a = protons[i];
      const b = protons[j];
      let dx = b.x - a.x;
      let dy = b.y - a.y;
      let distSq = dx * dx + dy * dy;
      if (distSq < MIN_DIST * MIN_DIST) distSq = MIN_DIST * MIN_DIST;
      const dist = Math.sqrt(distSq);
      const force = COULOMB_K / distSq;
      const fx = force * (dx / dist);
      const fy = force * (dy / dist);
      a.vx -= fx * dt;
      a.vy -= fy * dt;
      b.vx += fx * dt;
      b.vy += fy * dt;
    }
  }

  for (let i = 0; i < n; i++) {
    const p = protons[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
}

// Drawing
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (running) {
    for (let i = 0; i < protons.length; i++) {
      for (let j = i + 1; j < protons.length; j++) {
        const a = protons[i];
        const b = protons[j];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 150) {
          const alpha = Math.max(0, 0.3 * (1 - dist / 150));
          ctx.strokeStyle = `rgba(255, 100, 100, ${alpha})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }
  }

  for (const p of protons) {
    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, PROTON_RADIUS * 2.5);
    gradient.addColorStop(0, 'rgba(255, 80, 80, 0.4)');
    gradient.addColorStop(1, 'rgba(255, 80, 80, 0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(p.x, p.y, PROTON_RADIUS * 2.5, 0, Math.PI * 2);
    ctx.fill();

    const bodyGrad = ctx.createRadialGradient(p.x - 3, p.y - 3, 1, p.x, p.y, PROTON_RADIUS);
    bodyGrad.addColorStop(0, '#ff9999');
    bodyGrad.addColorStop(0.7, '#ff4444');
    bodyGrad.addColorStop(1, '#cc2222');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, PROTON_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('+', p.x, p.y + 1);
  }
}

// Animation loop
function loop() {
  if (!running) return;
  step(speed);
  computeEnergy();
  draw();
  drawGraph();
  animId = requestAnimationFrame(loop);
}

draw();
</script>
</body>
</html>
