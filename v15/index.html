// ─── Energy model ─────────────────────────────────────────────────────────────
// NO sharp changes anywhere — every transition is cosine-smooth.
//   BEFORE                    : KE flat 0.62, EIE flat 0.38
//   Neutron hit               : +0.006 KE step (very tiny, intentional)
//   DURING  (wobbleSignal)    : KE oscillates keHigh↔keLow per mode
//   AFTER fission             : symmetric S-curve KE 0.15 → 0.72
//   AFTER stable (no fission) : smooth return KE → 0.62
function computeEnergy(frac) {
  if (frac < NEUTRON_FRAC) return { ke: 0.62, eie: 0.38 };

  const ff = (frac - NEUTRON_FRAC) / (1 - NEUTRON_FRAC);
  const t  = PH1_END + ff * (ANIM_T_END - PH1_END);

  if (t <= PH2_END) {
    const ph2        = (t - PH1_END) / (PH2_END - PH1_END);
    const normWobble = wobbleSignal(ph2, wobbleMode);
    // keHigh: circular baseline drifts down gently (0.626 → 0.566)
    // keLow:  oblong floor (0.626 → 0.15).  Polynomial f = 2ph2−ph2² has f(0)=0, f(1)=1,
    //         f'(1)=0 — so the descent flattens to zero slope right at the minimum,
    //         rounding the bottom of the dip.
    const keHigh = 0.626 - 0.06 * ph2;
    const keLow  = wobbleMode === 'stable'
                   ? 0.626 - 0.35 * Math.sqrt(ph2)                   // stable: shallower dip
                   : 0.626 - 0.476 * (2 * ph2 - ph2 * ph2);          // fission: → 0.15, zero slope at ph2=1
    const t01 = (1 - Math.cos(normWobble * Math.PI)) / 2;
    const ke  = keHigh - (keHigh - keLow) * t01;
    return { ke, eie: 1 - ke };
  }

  const ph3 = (t - PH2_END) / (ANIM_T_END - PH2_END);
  if (wobbleMode === 'stable') {
    // No fission — nucleus relaxes back toward pre-neutron KE (S-curve)
    const s  = (1 - Math.cos(ph3 * Math.PI)) / 2;
    const ke = 0.566 + 0.054 * s;   // 0.566 → 0.62 smoothly
    return { ke, eie: 1 - ke };
  }
  // Fission: Coulomb energy converts to KE.  exp(−k·ph3²) starts with zero slope
  // (rounds the bottom of the dip), peaks rate around ph3≈0.18 (≈9 time units),
  // then decelerates.  k=15 → ~74 % done by ph3=0.30 (≈15 time units), ~95 % by ph3=0.45.
  const s  = 1 - Math.exp(-ph3 * ph3 * 15);
  const ke = 0.15 + 0.57 * s;       // 0.15 → 0.72
  return { ke, eie: Math.max(0.05, 1 - ke) };
}

function drawEnergyGraph() {
  const W = egCanvas.width, H = egCanvas.height;
  const PAD = 8;
  const gH  = H - PAD * 2;
  const zs = egZoomStart, ze = egZoomEnd, zLen = ze - zs;

  egCtx.clearRect(0, 0, W, H);

  // Faint horizontal grid at 25 / 50 / 75%
  egCtx.strokeStyle = 'rgba(255,255,255,0.06)';
  egCtx.lineWidth = 1;
  for (let i = 1; i <= 3; i++) {
    const y = PAD + gH * (1 - i / 4);
    egCtx.beginPath(); egCtx.moveTo(0, y); egCtx.lineTo(W, y); egCtx.stroke();
  }

  // Dashed phase-boundary markers mapped into zoom window
  const ph2EndFrac = NEUTRON_FRAC +
    ((PH2_END - PH1_END) / (ANIM_T_END - PH1_END)) * (1 - NEUTRON_FRAC);
  egCtx.setLineDash([2, 4]);
  egCtx.strokeStyle = 'rgba(255,200,50,0.25)';
  egCtx.lineWidth = 1;
  for (const fx of [NEUTRON_FRAC, ph2EndFrac]) {
    if (fx < zs || fx > ze) continue;
    const x = ((fx - zs) / zLen) * W;
    egCtx.beginPath(); egCtx.moveTo(x, PAD); egCtx.lineTo(x, H - PAD); egCtx.stroke();
  }
  egCtx.setLineDash([]);

  // Advance high-water mark then compute reveal and cursor pixels
  maxRevealedFrac = Math.max(maxRevealedFrac, currentScrubFrac);
  const revealFrac = Math.max(zs, Math.min(ze, maxRevealedFrac));
  const revealPx   = Math.round((revealFrac - zs) / zLen * (W - 1));
  const curFrac = Math.max(zs, Math.min(ze, currentScrubFrac));
  const curPx   = Math.round((curFrac - zs) / zLen * (W - 1));

  // Bottom axis — always visible
  egCtx.save();
  egCtx.shadowBlur  = 6;
  egCtx.shadowColor = 'rgba(0,200,255,0.5)';
  egCtx.strokeStyle = 'rgba(0,200,255,0.35)';
  egCtx.lineWidth   = 1;
  egCtx.beginPath(); egCtx.moveTo(0, H - PAD); egCtx.lineTo(W, H - PAD); egCtx.stroke();
  egCtx.restore();

  // Neon line: full graph always shown, cursor marks current position
  function plotLine(color, glowColor, getVal) {
    const ys = new Float32Array(W);
    for (let px = 0; px < W; px++) {
      const frac = zs + (px / (W - 1)) * zLen;
      ys[px] = PAD + gH * (1 - getVal(computeEnergy(frac)));
    }
    function strokeSeg(fromPx, toPx, lw, blur, alpha) {
      if (fromPx > toPx) return;
      egCtx.save();
      egCtx.globalAlpha = alpha;
      egCtx.shadowBlur  = blur;
      egCtx.shadowColor = glowColor;
      egCtx.strokeStyle = color;
      egCtx.lineWidth   = lw;
      egCtx.beginPath();
      for (let px = fromPx; px <= toPx; px++) {
        if (px === fromPx) egCtx.moveTo(px, ys[px]); else egCtx.lineTo(px, ys[px]);
      }
      egCtx.stroke();
      egCtx.restore();
    }
    // Draw up to the high-water mark — traces live, stays drawn after scrub
    strokeSeg(0, revealPx, 8,  28, 0.25);
    strokeSeg(0, revealPx, 3,  10, 0.55);
    strokeSeg(0, revealPx, 1.5, 0, 1.00);
  }

  plotLine('#7b6fff', 'rgba(120,100,255,0.9)', e => e.eie);  // Energy in Fields — neon indigo
  plotLine('#ff3a6e', 'rgba(255,45,100,0.9)',  e => e.ke);   // Energy in Motion — neon pink-red

  // Legend — top of graph, side by side
  const legend = [
    { text: 'Energy in Fields', color: '#7b6fff', glow: 'rgba(120,100,255,0.9)' },
    { text: 'Energy in Motion', color: '#ff3a6e', glow: 'rgba(255,45,100,0.9)'  },
  ];
  egCtx.font = 'bold 14px "Share Tech Mono", monospace';
  const LLINE = 14, LGAP = 4;
  const ty = PAD + 11;   // just below top edge
  let lx = 10;
  legend.forEach(lbl => {
    egCtx.save();
    egCtx.shadowBlur  = 10;
    egCtx.shadowColor = lbl.glow;
    egCtx.strokeStyle = lbl.color;
    egCtx.lineWidth   = 2;
    egCtx.beginPath(); egCtx.moveTo(lx, ty - 4); egCtx.lineTo(lx + LLINE, ty - 4); egCtx.stroke();
    egCtx.fillStyle  = lbl.color;
    egCtx.shadowBlur = 7;
    egCtx.fillText(lbl.text, lx + LLINE + LGAP, ty);
    egCtx.restore();
    lx += LLINE + LGAP + egCtx.measureText(lbl.text).width + 20;
  });

  // Drag-to-zoom selection overlay
  if (egDragStartPx !== null && egDragCurPx !== null) {
    const x0 = Math.min(egDragStartPx, egDragCurPx);
    const x1 = Math.max(egDragStartPx, egDragCurPx);
    egCtx.fillStyle   = 'rgba(120,100,255,0.12)';
    egCtx.fillRect(x0, 0, x1 - x0, H);
    egCtx.strokeStyle = 'rgba(120,100,255,0.6)';
    egCtx.lineWidth   = 1;
    egCtx.strokeRect(x0, 0, x1 - x0, H);
  }

  // Cursor — neon white with glow
  const cx = curPx;
  egCtx.save();
  egCtx.shadowBlur  = 8;
  egCtx.shadowColor = 'rgba(255,255,255,0.7)';
  egCtx.strokeStyle = 'rgba(255,255,255,0.85)';
  egCtx.lineWidth   = 1;
  egCtx.beginPath(); egCtx.moveTo(cx, 0); egCtx.lineTo(cx, H); egCtx.stroke();
  egCtx.restore();
}

  if (egDragStartPx === null) return;

  const x1 = Math.max(egDragStartPx, e.offsetX);
  egDragStartPx = null; egDragCurPx = null;

  const prevStart = egZoomStart, zLen = egZoomEnd - egZoomStart;
  egZoomStart = prevStart + (x0 / W) * zLen;
  egZoomEnd   = prevStart + (x1 / W) * zLen;
  drawEnergyGraph();

  if (egDragStartPx !== null) { egDragStartPx = null; egDragCurPx = null; drawEnergyGraph(); }

// ── SideSim — mini fission playback for notepad cards ─────────
// Uses the page's own renderAtFrac: saves globals, renders to main
// canvas, copies to card canvas, then restores. All synchronous —
// no flicker because the browser paints only after all RAF callbacks.
var SideSim = (function() {
  let _raf = cb => requestAnimationFrame(cb);
  let _caf = id => cancelAnimationFrame(id);

  let _cv        = null;   // active card canvas
  let _state     = null;   // parsed state object for active card
  let _playBtn   = null;
  let _timeSl    = null;
  let _playing   = false;
  let _rafId     = null;
  let _zoom      = 1;
  let _frac      = 0;
  let _startFrac = 0;
  let _startTime = null; // set lazily from first RAF timestamp to avoid cross-window time-origin mismatch

  const PLAY_DURATION = 5000; // ms for a full 0→1 scrub

  // Fit the card canvas to its CSS-laid-out pixel size × source aspect ratio
  function _fitCanvas(targetCv, state) {
    const srcW = state.canvasWidth  || canvas.width;
    const srcH = state.canvasHeight || canvas.height;
    const w = Math.max(1, Math.round(targetCv.offsetWidth || targetCv.clientWidth || 300));
    targetCv.width  = w;
    targetCv.height = Math.max(1, Math.round(w * srcH / srcW));
  }

  // Core: temporarily set sim globals, render to main canvas, copy to card
  function _renderToCard(targetCv, state, frac, overrideZoom) {
    if (!targetCv || !targetCv.width || !targetCv.height) return;

    // ── Save all globals that renderAtFrac reads ──────────────
    const sv_seed         = currentSeed;
    const sv_zoom         = viewZoom;
    const sv_wobble       = wobbleMode;
    const sv_nstate       = neutronState;
    const sv_sfrac        = currentScrubFrac;
    const sv_parent       = animParent;
    const sv_prod1        = animProd1;
    const sv_prod2        = animProd2;
    const sv_prod1R       = prod1R;
    const sv_prod2R       = prod2R;
    const sv_animMap      = animMap;
    const sv_enrich       = enrichSites;
    const sv_chain        = chainNeutrons;
    const sv_mainNeut     = mainNeutronsEmitted;
    const sv_prerender    = prerenderActive;

    // ── Apply card state ──────────────────────────────────────
    viewZoom          = overrideZoom !== undefined ? overrideZoom : (state.viewZoom || 1);
    wobbleMode        = state.wobbleMode || 'dip1';
    // Neutron visibility: show neutron flying for any frac > 0
    neutronState      = frac > 0 ? 'fission' : (state.neutronState || 'idle');
    currentScrubFrac  = frac;
    enrichSites       = [];   // don't replay live chain reaction in card
    chainNeutrons     = [];
    mainNeutronsEmitted = false;
    prerenderActive   = false; // prevent captureFrame() from corrupting prerender buffer

    // Regenerate nuclei if the saved seed differs from current session seed
    const seedChanged = state.seed !== undefined && state.seed !== currentSeed;
    if (seedChanged) {
      currentSeed = state.seed;
      initNuclei();
    }

    // ── Render to main canvas, copy to card ───────────────────
    renderAtFrac(frac);
    const cardCtx = targetCv.getContext('2d');
    cardCtx.drawImage(canvas, 0, 0, targetCv.width, targetCv.height);

    // ── Restore all globals ───────────────────────────────────
    prerenderActive     = sv_prerender;
    enrichSites         = sv_enrich;
    chainNeutrons       = sv_chain;
    mainNeutronsEmitted = sv_mainNeut;
    neutronState        = sv_nstate;
    wobbleMode          = sv_wobble;
    viewZoom            = sv_zoom;
    currentScrubFrac    = sv_sfrac;
    if (seedChanged) {
      currentSeed = sv_seed;
      animParent  = sv_parent;
      animProd1   = sv_prod1;
      animProd2   = sv_prod2;
      prod1R      = sv_prod1R;
      prod2R      = sv_prod2R;
      animMap     = sv_animMap;
    }

    // Restore main canvas to its pre-card-render state
    renderAtFrac(sv_sfrac);
  }

  // Animation loop for card playback
  function _loop(now) {
    if (!_playing || !_cv || !_state) return;
    if (_startTime === null) _startTime = now; // latch on first RAF tick
    const elapsed  = now - _startTime;
    _frac = Math.min(1, _startFrac + (elapsed / PLAY_DURATION) * (1 - _startFrac));
    _renderToCard(_cv, _state, _frac, _zoom);
    if (_timeSl) { _timeSl.disabled = false; _timeSl.value = Math.round(_frac * 1000); }
    if (_frac < 1) {
      _rafId = _raf(_loop);
    } else {
      _playing = false;
      _rafId   = null;
      if (_playBtn) _playBtn.innerHTML = '&#9654;';
    }
  }

  return {
    setRafFns(rafFn, cafFn) { _raf = rafFn; _caf = cafFn; },

    isCurrentCanvas(cv) { return cv === _cv; },

    stop() {
      if (_rafId) { _caf(_rafId); _rafId = null; }
      _playing = false;
      _cv = _state = null;
      if (_playBtn) { _playBtn.innerHTML = '&#9654;'; _playBtn = null; }
      if (_timeSl)  { _timeSl.disabled = true;        _timeSl  = null; }
    },

    drawFirstFrame(targetCv, state) {
      if (_playing && _cv === targetCv) return;
      _fitCanvas(targetCv, state);
      if (!targetCv.width || !targetCv.height) return;
      _renderToCard(targetCv, state, state.scrubFrac || 0);
    },

    drawStaticAt(targetCv, state, zoom) {
      if (_playing && _cv === targetCv) return;
      _zoom = zoom;
      _renderToCard(targetCv, state, _cv === targetCv ? _frac : (state.scrubFrac || 0), zoom);
    },

    setZoom(zoom) {
      _zoom = zoom;
      if (_cv && _state) _renderToCard(_cv, _state, _frac, zoom);
    },

    loadAndPlay(simStateJson, targetCv, playBtn, timeSl) {
      this.stop();
      let state;
      try { state = JSON.parse(simStateJson); } catch(e) { return; }

      _fitCanvas(targetCv, state);
      _cv      = targetCv;
      _state   = state;
      _playBtn = playBtn;
      _timeSl  = timeSl;
      _zoom    = state.viewZoom || 1;
      _frac    = 0;
      _playing = true;
      _startFrac = 0;
      _startTime = null;

      if (timeSl) { timeSl.max = '1000'; timeSl.disabled = false; timeSl.value = '0'; }
      if (playBtn) playBtn.innerHTML = '⏸';

      _rafId = _raf(_loop);
    },

    toggle() {
      if (!_cv || !_state) return;
      if (_playing) {
        if (_rafId) { _caf(_rafId); _rafId = null; }
        _playing = false;
        if (_playBtn) _playBtn.innerHTML = '&#9654;';
      } else {
        _playing   = true;
        _startFrac = _frac;
        _startTime = null;
        if (_playBtn) _playBtn.innerHTML = '⏸';
        _rafId = _raf(_loop);
      }
    },

    startScrub() {
      if (_playing) {
        if (_rafId) { _caf(_rafId); _rafId = null; }
        _playing = false;
        if (_playBtn) _playBtn.innerHTML = '&#9654;';
      }
    },

    scrubTo(val) {
      if (!_cv || !_state) return;
      _frac = val / 1000;
      _renderToCard(_cv, _state, _frac, _zoom);
    },

    endScrub(val) {
      if (!_cv || !_state) return;
      _frac = val / 1000;
      _renderToCard(_cv, _state, _frac, _zoom);
    },
  };
})();

function captureCanvasAtWidth(src, maxW) {
  const scale = Math.min(1, maxW / src.width);
  const w = Math.round(src.width  * scale);
  const h = Math.round(src.height * scale);
  const tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  tmp.getContext('2d').drawImage(src, 0, 0, w, h);
  return tmp.toDataURL('image/jpeg', 0.88);
}

async function doSave(isPublic) {
  if (!npPendingCapture) return;
  captureSaveBtn.disabled  = true;
  captureShareBtn.disabled = true;
  captureSaveBtn.textContent = 'Saving…';
  captureError.textContent = '';

  const note = {
    id:          npPendingCapture.id,
    student_id:  npStudentId,
    timestamp:   new Date().toISOString(),
    sim_version: 'v15',
    sim_state:   npPendingCapture.simState,
    text:        captureAnnotation.value.trim(),
    is_public:   isPublic,
  };
  npLocalScreenshots.set(note.id, npPendingCapture.screenshot);

  try {
    await SHEETS.appendNote(note);
  } catch(e) {
    if (!e.message.includes('Failed to fetch')) {
      captureError.textContent = 'Save failed: ' + e.message;
      captureSaveBtn.disabled  = false;
      captureShareBtn.disabled = false;
      captureSaveBtn.textContent = 'Save';
      return;
    }
  }
  closeCaptureModal();
  openNotepadPanel();
  npShowMyTab();
  npObsList.innerHTML = '';
  npObsList.appendChild(buildNoteCard(note, true));
  const hint = document.createElement('div');
  hint.className = 'obs-empty';
  hint.style.fontSize = '10px';
  hint.textContent = 'Saved! Loading your notes…';
  npObsList.appendChild(hint);
  setTimeout(() => npLoadMyNotes(note.id), 1800);
}

captureSaveBtn.addEventListener('click',  () => doSave(false));
captureShareBtn.addEventListener('click', () => doSave(true));

// ── Note loading ──────────────────────────────────────────────
async function npLoadMyNotes(confirmId) {
  if (!confirmId) npObsList.innerHTML = '<div class="obs-empty">Loading…</div>';
  try {
    const notes = await SHEETS.readStudentNotes(npStudentId);
    if (notes.length === 0) {
      npObsList.innerHTML = '<div class="obs-empty">No observations yet.<br>Press <strong>+ Notepad</strong> to capture your first one.</div>';
      return;
    }
    npObsList.innerHTML = '';
    if (confirmId) {
      const confirmed = notes.some(n => n.id === confirmId);
      const banner = document.createElement('div');
      banner.className = 'obs-empty';
      banner.style.cssText = `font-size:10px;padding:6px 8px;color:${confirmed ? '#4ade80' : '#f87171'}`;
      banner.textContent = confirmed ? '✓ Saved!' : '⚠ Note may not have saved — try again.';
      npObsList.appendChild(banner);
    }
    for (const note of notes) npObsList.appendChild(buildNoteCard(note, true));
  } catch(e) {
    npObsList.innerHTML = `<div class="obs-empty">Couldn't load: ${e.message}</div>`;
  }
}

async function npLoadClassFeed() {
  npFeedList.innerHTML = '<div class="obs-empty">Loading…</div>';
  try {
    const notes = await SHEETS.readPublicNotes();
    if (notes.length === 0) {
      npFeedList.innerHTML = '<div class="obs-empty">No shared observations yet.</div>';
      return;
    }
    npFeedList.innerHTML = '';
    npFeedNotes = notes;
    for (const note of notes) npFeedList.appendChild(buildNoteCard(note, false));
  } catch(e) {
    npFeedList.innerHTML = `<div class="obs-empty">Couldn't load feed: ${e.message}</div>`;
  }
}

  var field     = document.getElementById('cv-field');
  var masterZoom = 1;

  // Inject popup RAF into both SideSims so playback isn't throttled
  // when the opener window is in the background.
  if (v15SS) v15SS.setRafFns(
    function(cb) { return requestAnimationFrame(cb); },
    function(id) { cancelAnimationFrame(id); }
  );
  if (v12SS) v12SS.setRafFns(
    function(cb) { return requestAnimationFrame(cb); },
    function(id) { cancelAnimationFrame(id); }
  );
  window.addEventListener('beforeunload', function() {
    if (v15SS) { v15SS.stop(); v15SS.setRafFns(function(cb){return opener.requestAnimationFrame(cb);}, function(id){opener.cancelAnimationFrame(id);}); }
    if (v12SS) { v12SS.stop(); v12SS.setRafFns(function(cb){return opener.requestAnimationFrame(cb);}, function(id){opener.cancelAnimationFrame(id);}); }
  });

  var masterZoomSlider = document.getElementById('masterZoomSlider');
  var masterZoomLabel  = document.getElementById('masterZoomLabel');
  masterZoomSlider.addEventListener('input', function() {
    masterZoom = parseFloat(masterZoomSlider.value);
    masterZoomLabel.textContent = Math.round(masterZoom * 100) + '%';
    field.style.transform = 'scale(' + masterZoom + ')';
  });

  var COLS = 3, GAP = 30;
  var CARD_W_ZOOMED = 460 * 0.75;
  var CARD_H_ZOOMED = 520 * 0.75;

  var cardRecords = [];

  function getSS(note) {
    var ps = null;
    try { if (note.sim_state) ps = JSON.parse(note.sim_state); } catch(e) {}
    var ver = (ps && ps.simVersion) || note.sim_version || 'v15';
    if (ver === 'v12') return v12SS;
    return v15SS;
  }

  function resetOthers(activeCv) {
    cardRecords.forEach(function(r) {
      if (r.simCv !== activeCv && r.simCv && r.parsedState) {
        var ss = getSS(r.note);
        if (ss) ss.drawFirstFrame(r.simCv, r.parsedState);
      }
    });
  }

  notes.forEach(function(note, i) {
    var wrap = document.createElement('div');
    wrap.className = 'cv-wrap';
    var col = i % COLS, row = Math.floor(i / COLS);
    wrap.style.left = (GAP + col * (CARD_W_ZOOMED + GAP)) + 'px';
    wrap.style.top  = (GAP + row * (CARD_H_ZOOMED + GAP)) + 'px';
    wrap.style.zIndex = i + 1;

    var parsedState = null;
    try { if (note.sim_state) parsedState = JSON.parse(note.sim_state); } catch(e) {}
    var noteVer = (parsedState && parsedState.simVersion) || note.sim_version || 'v15';
    var ss = noteVer === 'v12' ? v12SS : v15SS;

    var card = document.createElement('div');
    card.className = 'obs-card';
    var thumbWrap = document.createElement('div');
    thumbWrap.className = 'obs-thumb-wrap';

    var simCv = null;
    var simStateJson = note.sim_state || null;

    if (parsedState && ss) {
      var srcW = parsedState.canvasWidth || 1280;
      var srcH = parsedState.canvasHeight || 800;
      simCv = document.createElement('canvas');
      simCv.className = 'obs-sim-canvas';
      simCv.style.aspectRatio = srcW + ' / ' + srcH;
      thumbWrap.appendChild(simCv);

      var cardZoom = parsedState.zoom || parsedState.viewZoom || 1;

      requestAnimationFrame((function(cv, ps, s) { return function() { s.drawFirstFrame(cv, ps); }; })(simCv, parsedState, ss));

      var controls = document.createElement('div');
      controls.className = 'obs-controls';

      var replayBtn = document.createElement('button');
      replayBtn.className = 'obs-ctrl-btn'; replayBtn.title = 'Replay'; replayBtn.textContent = '\u21BA';

      var playBtn = document.createElement('button');
      playBtn.className = 'obs-ctrl-btn'; playBtn.title = 'Play / Pause'; playBtn.innerHTML = '&#9654;';

      var timeSlider = document.createElement('input');
      timeSlider.type = 'range'; timeSlider.className = 'obs-time-slider';
      timeSlider.min = '0'; timeSlider.max = '1000'; timeSlider.value = '0'; timeSlider.disabled = true;

      var zoomSlider = document.createElement('input');
      zoomSlider.type = 'range'; zoomSlider.className = 'obs-zoom-slider';
      zoomSlider.min = '0.2'; zoomSlider.max = '4'; zoomSlider.step = '0.1'; zoomSlider.value = cardZoom;

      (function(cv, zs, ps, ts, pb, rb, sj, s) {
        var cz = cardZoom;
        zs.addEventListener('input', function() { cz = parseFloat(zs.value); s.drawStaticAt(cv, ps, cz); });
        ts.addEventListener('mousedown', function() { if (s.isCurrentCanvas(cv)) s.startScrub(); });
        ts.addEventListener('input',     function() { if (s.isCurrentCanvas(cv)) s.scrubTo(parseInt(ts.value)); });
        ts.addEventListener('mouseup',   function() { if (s.isCurrentCanvas(cv)) s.endScrub(parseInt(ts.value)); });
        pb.addEventListener('click', function() {
          if (s.isCurrentCanvas(cv)) { s.toggle(); }
          else {
            v15SS.stop(); if (v12SS) v12SS.stop();
            resetOthers(cv);
            s.loadAndPlay(sj, cv, pb, ts); s.setZoom(cz);
          }
        });
        rb.addEventListener('click', function() {
          v15SS.stop(); if (v12SS) v12SS.stop();
          resetOthers(cv);
          s.loadAndPlay(sj, cv, pb, ts); s.setZoom(cz);
        });
      })(simCv, zoomSlider, parsedState, timeSlider, playBtn, replayBtn, simStateJson, ss);

      var zoomGroup = document.createElement('div');
      zoomGroup.className = 'obs-zoom-group';
      var zoomIcon = document.createElement('span'); zoomIcon.textContent = '\uD83D\uDD0D';
      zoomGroup.appendChild(zoomSlider); zoomGroup.appendChild(zoomIcon);
      controls.appendChild(replayBtn); controls.appendChild(playBtn);
      controls.appendChild(timeSlider); controls.appendChild(zoomGroup);
      thumbWrap.appendChild(controls);
    } else {
      var ph = document.createElement('div');
      ph.style.cssText = 'height:80px;display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(255,255,255,0.15)';
      ph.textContent = ss ? '' : '[' + noteVer + ' sim — loading]';
      thumbWrap.appendChild(ph);
    }
    card.appendChild(thumbWrap);

    var meta = document.createElement('div'); meta.className = 'obs-meta';
    var nm = document.createElement('span'); nm.className = 'obs-student';
    nm.textContent = opener.npGetStudentName(note.student_id); meta.appendChild(nm);
    var ts2 = document.createElement('span');
    ts2.textContent = new Date(note.timestamp).toLocaleString(); meta.appendChild(ts2);
    var vb = document.createElement('span'); vb.className = 'obs-version-badge';
    vb.textContent = noteVer; meta.appendChild(vb);
    card.appendChild(meta);

    if (note.text) {
      var ro = document.createElement('div'); ro.className = 'obs-annotation-ro';
      ro.textContent = note.text; card.appendChild(ro);
    }

    var inner = document.createElement('div'); inner.className = 'cv-inner';
    inner.appendChild(card); wrap.appendChild(inner); field.appendChild(wrap);

    cardRecords.push({ wrap: wrap, simCv: simCv, parsedState: parsedState, note: note });

    // Drag
    var ox = 0, oy = 0, fieldRect;
    wrap.addEventListener('pointerdown', function(e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
      v15SS.stop(); if (v12SS) v12SS.stop();
      resetOthers(null);
      wrap.setPointerCapture(e.pointerId);
      wrap.classList.add('grabbing');
      fieldRect = field.getBoundingClientRect();
      ox = (e.clientX - fieldRect.left) / masterZoom - wrap.offsetLeft;
      oy = (e.clientY - fieldRect.top)  / masterZoom - wrap.offsetTop;
      wrap.style.zIndex = Date.now() % 1000000;
    });
    wrap.addEventListener('pointermove', function(e) {
      if (!wrap.hasPointerCapture(e.pointerId)) return;
      wrap.style.left = ((e.clientX - fieldRect.left) / masterZoom - ox) + 'px';
      wrap.style.top  = ((e.clientY - fieldRect.top)  / masterZoom - oy) + 'px';
    });
    wrap.addEventListener('pointerup', function(e) {
      wrap.releasePointerCapture(e.pointerId); wrap.classList.remove('grabbing');
    });
  });

  var rows = Math.ceil(notes.length / COLS);
  field.style.minHeight = (GAP + rows * (CARD_H_ZOOMED + GAP)) + 'px';
  field.style.minWidth  = (GAP + COLS * (CARD_W_ZOOMED + GAP)) + 'px';
})();

  win.document.close();

// ── Note card builder ─────────────────────────────────────────
function npGetStudentName(sid) {
  if (npRosterCache) { const r = npRosterCache.find(r => r.id === sid); if (r) return r.name; }
  return sid;
}

function buildNoteCard(note, isOwn) {
  const card = document.createElement('div');
  card.className = 'obs-card';

  const wrap = document.createElement('div');
  wrap.className = 'obs-thumb-wrap';

  let parsedState = null;
  try { if (note.sim_state) parsedState = JSON.parse(note.sim_state); } catch(e) {}
  const noteVersion = (parsedState && parsedState.simVersion) || note.sim_version || null;
  const isV15State  = !noteVersion || noteVersion === 'v15';

  if (isV15State && parsedState) {
    // ── v15 note: live SideSim canvas + playback controls ─────
    const srcW = parsedState.canvasWidth  || canvas.width;
    const srcH = parsedState.canvasHeight || canvas.height;
    const simCv = document.createElement('canvas');
    simCv.className = 'obs-sim-canvas';
    simCv.style.aspectRatio = `${srcW} / ${srcH}`;
    wrap.appendChild(simCv);

    let cardZoom = parsedState.viewZoom || 1;
    requestAnimationFrame(() => SideSim.drawFirstFrame(simCv, parsedState));

    const controls = document.createElement('div');
    controls.className = 'obs-controls';

    const replayBtn = document.createElement('button');
    replayBtn.className = 'obs-ctrl-btn';
    replayBtn.title = 'Replay from start';
    replayBtn.textContent = '↺';

    const playBtn = document.createElement('button');
    playBtn.className = 'obs-ctrl-btn';
    playBtn.title = 'Play / Pause';
    playBtn.innerHTML = '&#9654;';

    const timeSlider = document.createElement('input');
    timeSlider.type = 'range';
    timeSlider.className = 'obs-time-slider';
    timeSlider.min = '0'; timeSlider.max = '1000';
    timeSlider.value = '0'; timeSlider.disabled = true;

    const zoomSlider = document.createElement('input');
    zoomSlider.type = 'range';
    zoomSlider.className = 'obs-zoom-slider';
    zoomSlider.min = '0.2'; zoomSlider.max = '3'; zoomSlider.step = '0.05';
    zoomSlider.value = cardZoom;

    zoomSlider.addEventListener('input', () => {
      cardZoom = parseFloat(zoomSlider.value);
      SideSim.drawStaticAt(simCv, parsedState, cardZoom);
    });
    timeSlider.addEventListener('mousedown', () => { if (SideSim.isCurrentCanvas(simCv)) SideSim.startScrub(); });
    timeSlider.addEventListener('input',     () => { if (SideSim.isCurrentCanvas(simCv)) SideSim.scrubTo(parseInt(timeSlider.value)); });
    timeSlider.addEventListener('mouseup',   () => { if (SideSim.isCurrentCanvas(simCv)) SideSim.endScrub(parseInt(timeSlider.value)); });

    playBtn.addEventListener('click', () => {
      if (SideSim.isCurrentCanvas(simCv)) {
        SideSim.toggle();
      } else {
        SideSim.loadAndPlay(note.sim_state, simCv, playBtn, timeSlider);
        SideSim.setZoom(cardZoom);
      }
    });
    replayBtn.addEventListener('click', () => {
      SideSim.loadAndPlay(note.sim_state, simCv, playBtn, timeSlider);
      SideSim.setZoom(cardZoom);
    });

    const zoomGroup = document.createElement('div');
    zoomGroup.className = 'obs-zoom-group';
    const zoomIcon = document.createElement('span');
    zoomIcon.textContent = '🔍';
    zoomGroup.appendChild(zoomSlider);
    zoomGroup.appendChild(zoomIcon);

    controls.appendChild(replayBtn);
    controls.appendChild(playBtn);
    controls.appendChild(timeSlider);
    controls.appendChild(zoomGroup);
    wrap.appendChild(controls);
  } else if (noteVersion === 'v12' && parsedState) {
    // ── v12 note: render via the hidden v12 iframe's SideSim ──
    const srcW = parsedState.canvasWidth  || 1280;
    const srcH = parsedState.canvasHeight || 800;
    const simCv = document.createElement('canvas');
    simCv.className = 'obs-sim-canvas';
    simCv.style.aspectRatio = `${srcW} / ${srcH}`;
    wrap.appendChild(simCv);

    let cardZoom = parsedState.zoom || 1;

    // Draw first frame once v12SideSim is available
    function tryDrawFirstFrame() {
      if (v12SideSim) { v12SideSim.drawFirstFrame(simCv, parsedState); }
      else { requestAnimationFrame(tryDrawFirstFrame); }
    }
    requestAnimationFrame(tryDrawFirstFrame);

    const controls = document.createElement('div');
    controls.className = 'obs-controls';

    const replayBtn = document.createElement('button');
    replayBtn.className = 'obs-ctrl-btn';
    replayBtn.title = 'Replay from start';
    replayBtn.textContent = '↺';

    const playBtn = document.createElement('button');
    playBtn.className = 'obs-ctrl-btn';
    playBtn.title = 'Play / Pause';
    playBtn.innerHTML = '&#9654;';

    const timeSlider = document.createElement('input');
    timeSlider.type = 'range';
    timeSlider.className = 'obs-time-slider';
    timeSlider.min = '0'; timeSlider.max = '0';
    timeSlider.value = '0'; timeSlider.disabled = true;

    const zoomSlider = document.createElement('input');
    zoomSlider.type = 'range';
    zoomSlider.className = 'obs-zoom-slider';
    zoomSlider.min = '0.5'; zoomSlider.max = '6'; zoomSlider.step = '0.25';
    zoomSlider.value = cardZoom;

    zoomSlider.addEventListener('input', () => {
      cardZoom = parseFloat(zoomSlider.value);
      if (v12SideSim) v12SideSim.drawStaticAt(simCv, parsedState, cardZoom);
    });
    timeSlider.addEventListener('mousedown', () => { if (v12SideSim && v12SideSim.isCurrentCanvas(simCv)) v12SideSim.startScrub(); });
    timeSlider.addEventListener('input',     () => { if (v12SideSim && v12SideSim.isCurrentCanvas(simCv)) v12SideSim.scrubTo(parseInt(timeSlider.value)); });
    timeSlider.addEventListener('mouseup',   () => { if (v12SideSim && v12SideSim.isCurrentCanvas(simCv)) v12SideSim.endScrub(parseInt(timeSlider.value)); });

    playBtn.addEventListener('click', () => {
      if (!v12SideSim) return;
      if (v12SideSim.isCurrentCanvas(simCv)) { v12SideSim.toggle(); }
      else { v12SideSim.loadAndPlay(note.sim_state, simCv, playBtn, timeSlider); v12SideSim.setZoom(cardZoom); }
    });
    replayBtn.addEventListener('click', () => {
      if (!v12SideSim) return;
      v12SideSim.loadAndPlay(note.sim_state, simCv, playBtn, timeSlider);
      v12SideSim.setZoom(cardZoom);
    });

    const zoomGroup = document.createElement('div');
    zoomGroup.className = 'obs-zoom-group';
    const zoomIcon = document.createElement('span'); zoomIcon.textContent = '🔍';
    zoomGroup.appendChild(zoomSlider); zoomGroup.appendChild(zoomIcon);

    controls.appendChild(replayBtn); controls.appendChild(playBtn);
    controls.appendChild(timeSlider); controls.appendChild(zoomGroup);
    wrap.appendChild(controls);
  } else {
    // ── Unknown version: screenshot or dim label ──────────────
    const localShot = npLocalScreenshots.get(note.id);
    const shotSrc   = localShot || note.screenshot || null;
    if (shotSrc) {
      const img = document.createElement('img');
      img.className = 'obs-sim-canvas';
      img.style.cssText = 'width:100%;display:block;border-radius:4px';
      img.src = shotSrc;
      wrap.appendChild(img);
    } else if (noteVersion) {
      const ph = document.createElement('div');
      ph.style.cssText = 'height:80px;display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(255,255,255,0.15)';
      ph.textContent = `[${noteVersion} sim]`;
      wrap.appendChild(ph);
    }
  }
  card.appendChild(wrap);

  const meta = document.createElement('div');
  meta.className = 'obs-meta';
  if (!isOwn) {
    const nm = document.createElement('span');
    nm.className = 'obs-student';
    nm.textContent = npGetStudentName(note.student_id);
    meta.appendChild(nm);
  }
  const ts = document.createElement('span');
  ts.textContent = new Date(note.timestamp).toLocaleString();
  meta.appendChild(ts);
  if (isOwn && note.is_public) {
    const badge = document.createElement('span');
    badge.style.cssText = 'color:#a78bfa;font-size:10px';
    badge.textContent = '✓ Shared';
    meta.appendChild(badge);
  }
  card.appendChild(meta);

  if (note.text) {
    const ro = document.createElement('div');
    ro.className = 'obs-annotation-ro';
    ro.textContent = note.text;
    card.appendChild(ro);
  }

  if (isOwn && !note.is_public) {
    const actions = document.createElement('div');
    actions.className = 'obs-actions';
    const shareBtn = document.createElement('button');
    shareBtn.className = 'obs-btn obs-btn-share';
    shareBtn.textContent = 'Share to class feed';
    shareBtn.addEventListener('click', async () => {
      shareBtn.disabled = true;
      shareBtn.textContent = 'Sharing…';
      try {
        await SHEETS.updateNote(note.id, { is_public: true });
        note.is_public = true;
        card.replaceWith(buildNoteCard(note, true));
      } catch(e) {
        shareBtn.disabled = false;
        shareBtn.textContent = 'Share to class feed';
      }
    });
    actions.appendChild(shareBtn);
    card.appendChild(actions);
  }

  return card;
}

// ── Sim state capture ─────────────────────────────────────────
function captureSimState() {
  return {
    simVersion:    'v15',
    canvasWidth:   canvas.width,
    canvasHeight:  canvas.height,
    currentTab,
    scrubFrac:     currentScrubFrac,
    viewZoom,
    wobbleMode,
    neutronState,  // needed so static card shows neutron if it was in flight
    seed:          currentSeed,
  };
}
