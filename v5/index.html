<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuclear Simulation v5</title>
<style>
  /* ========================================
     RESET & BASE STYLES
     ======================================== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a1a;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow-x: auto;
    overflow-y: hidden;
    height: 100vh;
    min-width: 860px;       /* Prevent layout collapse on narrow viewports */
    display: flex;
    flex-direction: column;
  }

  /* ========================================
     TOOLBAR
     ======================================== */
  #toolbar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 20px;
    background: #12122a;
    border-bottom: 1px solid #2a2a4a;
    z-index: 10;
  }

  .toolbar-row {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  #toolbar h1 {
    font-size: 18px;
    font-weight: 600;
    color: #ff6b6b;
    margin-right: 8px;
    white-space: nowrap;
  }

  /* ========================================
     BUTTONS
     ======================================== */
  .btn {
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }

  #goBtn {
    background: #22c55e;
    color: #fff;
  }
  #goBtn:hover { background: #16a34a; }
  #goBtn.running {
    background: #ef4444;
  }
  #goBtn.running:hover { background: #dc2626; }

  #clearBtn {
    background: #374151;
    color: #e0e0e0;
  }
  #clearBtn:hover { background: #4b5563; }

  #addClusterBtn {
    background: #6366f1;
    color: #fff;
  }
  #addClusterBtn:hover { background: #4f46e5; }

  #clearOffscreenBtn {
    background: #374151;
    color: #e0e0e0;
  }
  #clearOffscreenBtn:hover { background: #4b5563; }

  #replayBtn {
    background: #0e7490;
    color: #fff;
  }
  #replayBtn:hover { background: #0891b2; }
  #replayBtn:disabled {
    background: #1e293b;
    color: #4b5563;
    cursor: not-allowed;
  }

  /* ========================================
     SLIDER & TOGGLE CONTROLS
     ======================================== */
  .slider-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .slider-group label {
    font-size: 12px;
    color: #9ca3af;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .slider-group label span {
    display: inline-block;
    min-width: 3.2em;
    text-align: right;
  }

  .slider-group input[type="range"] {
    width: 80px;
    accent-color: #6366f1;
  }

  .toggle-label {
    font-size: 13px;
    color: #9ca3af;
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    white-space: nowrap;
  }

  .toggle-label input[type="checkbox"] {
    accent-color: #f59e0b;
  }

  /* ========================================
     STATS DISPLAY
     ======================================== */
  #stats {
    font-size: 13px;
    color: #9ca3af;
    margin-left: auto;
    white-space: nowrap;
  }

  /* ========================================
     MAIN LAYOUT
     ======================================== */
  #main {
    flex: 1;
    display: flex;
    position: relative;
  }

  #canvas {
    flex: 1;
    display: block;
    cursor: default;
  }

  /* ========================================
     ENERGY PANEL (right sidebar)
     ======================================== */
  #energyPanel {
    width: 260px;
    min-width: 220px;
    flex-shrink: 0;
    background: #12122a;
    border-left: 1px solid #2a2a4a;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 12px;
  }

  #energyPanel h2 {
    font-size: 14px;
    font-weight: 600;
    color: #9ca3af;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .energy-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
  }

  .energy-label {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .energy-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .energy-value {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  #graphWrap {
    position: relative;
  }

  #graphCanvas {
    width: 100%;
    height: 160px;
    border-radius: 6px;
    background: #0a0a1a;
    border: 1px solid #2a2a4a;
    cursor: crosshair;
  }

  #graphTooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(18, 18, 42, 0.92);
    border: 1px solid #4a4a6a;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 11px;
    color: #e0e0e0;
    white-space: nowrap;
    display: none;
    z-index: 10;
    font-variant-numeric: tabular-nums;
  }

  #graphControls {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
  }

  #graphControls button {
    padding: 2px 8px;
    font-size: 11px;
    background: #1e1e3a;
    color: #9ca3af;
    border: 1px solid #3a3a5a;
    border-radius: 4px;
    cursor: pointer;
  }
  #graphControls button:hover { background: #2a2a4a; color: #e0e0e0; }

  #graphControls span {
    font-size: 11px;
    color: #6b7280;
  }

  /* ========================================
     PARTICLE BUCKETS (drag sources)
     ======================================== */
  .particle-bucket {
    position: absolute;
    bottom: 20px;
    width: 60px;
    height: 70px;
    background: #1e1e3a;
    border: 2px solid #4a4a6a;
    border-radius: 0 0 12px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: grab;
    user-select: none;
    z-index: 5;
  }

  .particle-bucket:hover {
    background: #2a2a4a;
  }

  #protonBucket { left: 20px; }
  #protonBucket:hover, #protonBucket.selected { border-color: #ff6b6b; }
  #protonBucket.selected { background: #2a2a4a; box-shadow: 0 0 8px rgba(255,107,107,0.4); }

  #neutronBucket { left: 90px; }
  #neutronBucket:hover, #neutronBucket.selected { border-color: #aaaacc; }
  #neutronBucket.selected { background: #2a2a4a; box-shadow: 0 0 8px rgba(170,170,204,0.4); }

  #trashCan {
    position: absolute;
    bottom: 20px;
    left: 160px;
    width: 60px;
    height: 70px;
    background: #1e1e3a;
    border: 2px solid #4a4a6a;
    border-radius: 0 0 12px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    z-index: 5;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
  }
  #trashCan .trash-icon {
    font-size: 22px;
    line-height: 1;
  }
  #trashCan .bucket-label {
    font-size: 10px;
    color: #9ca3af;
    margin-top: 4px;
  }
  #trashCan.drag-hover {
    border-color: #ef4444;
    background: #3a1a1a;
    box-shadow: 0 0 12px rgba(239,68,68,0.5);
  }

  .particle-bucket .bucket-label {
    font-size: 10px;
    color: #9ca3af;
    margin-top: 4px;
  }

  .particle-bucket .bucket-ball {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: bold;
    font-size: 14px;
  }

  .bucket-ball.proton {
    background: radial-gradient(circle at 40% 40%, #ff9999, #ff4444 60%, #cc2222);
  }

  .bucket-ball.neutron {
    background: radial-gradient(circle at 40% 40%, #ccccdd, #8888aa 60%, #666688);
  }

  /* ========================================
     INSTRUCTIONS OVERLAY
     ======================================== */
  #instructions {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(18, 18, 42, 0.85);
    border: 1px solid #2a2a4a;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 13px;
    color: #9ca3af;
    pointer-events: none;
    text-align: center;
    transition: opacity 0.5s;
  }
</style>
</head>
<body>

<!-- ========================================
     TOOLBAR HTML
     ======================================== -->
<div id="toolbar">
  <div class="toolbar-row">
    <h1>Nuclear Simulation</h1>
    <button class="btn" id="goBtn">Go</button>
    <button class="btn" id="clearBtn">Clear</button>
    <button class="btn" id="addClusterBtn">Add Cluster</button>
    <button class="btn" id="clearOffscreenBtn">Clear Offscreen</button>
    <button class="btn" id="replayBtn" disabled>Replay</button>
    <span id="stats">Protons: 0 &nbsp; Neutrons: 0</span>
  </div>
  <div class="toolbar-row">
    <div class="slider-group">
      <label>Speed: <span id="speedVal">3.0</span>x</label>
      <input type="range" id="speedSlider" min="0" max="20" step="1" value="13">
    </div>
    <div class="slider-group">
      <label>Zoom: <span id="zoomVal">2.0</span>x</label>
      <input type="range" id="zoomSlider" min="5" max="40" step="1" value="20">
    </div>
    <label class="toggle-label"><input type="checkbox" id="fieldEnergyToggle" checked> <span style="color:#7dd3fc">Field energy</span></label>
    <label class="toggle-label"><input type="checkbox" id="electricArrowToggle" checked> <span style="color:#fb923c">Electric force</span></label>
    <label class="toggle-label"><input type="checkbox" id="strongArrowToggle" checked> <span style="color:#22d3ee">Strong force</span></label>
    <label class="toggle-label"><input type="checkbox" id="singleParticleToggle"> <span>Forces on one particle</span></label>
  </div>
</div>


<!-- ========================================
     MAIN CONTENT: Canvas + Energy Panel + Buckets
     ======================================== -->
<div id="main">
  <canvas id="canvas"></canvas>

  <div id="energyPanel">
    <h2>Energy</h2>
    <div class="energy-row">
      <span class="energy-label"><span class="energy-dot" style="background:#f59e0b"></span> Energy in motion</span>
      <span class="energy-value" id="kineticVal">0</span>
    </div>
    <div class="energy-row">
      <span class="energy-label"><span class="energy-dot" style="background:#3b82f6"></span> Energy in interactions</span>
      <span class="energy-value" id="potentialVal">0</span>
    </div>
    <div class="energy-row" style="border-top: 1px solid #2a2a4a; padding-top: 8px;">
      <span class="energy-label"><span class="energy-dot" style="background:#22c55e"></span> Total</span>
      <span class="energy-value" id="totalVal">0</span>
    </div>
    <div class="slider-group" style="margin-top: 10px;">
      <label>IE offset: <span id="ieOffsetVal">0</span></label>
      <input type="range" id="ieOffsetSlider" min="0" max="20000" step="1" value="0" style="flex:1">
    </div>
    <div id="graphWrap">
      <canvas id="graphCanvas"></canvas>
      <div id="graphTooltip"></div>
    </div>
    <div id="graphControls">
      <button id="graphAutoFit">Auto-fit</button>
      <button id="graphGoLive">Go live</button>
      <span id="graphHint">Scroll: zoom Y &middot; Drag: pan time</span>
    </div>
  </div>

  <div class="particle-bucket" id="protonBucket">
    <div class="bucket-ball proton">+</div>
    <span class="bucket-label">Proton</span>
  </div>

  <div class="particle-bucket" id="neutronBucket">
    <div class="bucket-ball neutron">n</div>
    <span class="bucket-label">Neutron</span>
  </div>

  <div id="trashCan">
    <span class="trash-icon">🗑</span>
    <span class="bucket-label">Delete</span>
  </div>

  <div id="instructions">Click to place protons, drag from buckets, or drag existing particles to reposition.</div>
</div>

<script>
// ============================================================
//  DOM ELEMENT REFERENCES
// ============================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const graphCanvas = document.getElementById('graphCanvas');
const gctx = graphCanvas.getContext('2d');
const goBtn = document.getElementById('goBtn');
const clearBtn = document.getElementById('clearBtn');
const addClusterBtn = document.getElementById('addClusterBtn');
const clearOffscreenBtn = document.getElementById('clearOffscreenBtn');
const replayBtn = document.getElementById('replayBtn');
const speedSlider = document.getElementById('speedSlider');
const speedValEl = document.getElementById('speedVal');
const statsEl = document.getElementById('stats');
const instructionsEl = document.getElementById('instructions');
const kineticVal = document.getElementById('kineticVal');
const potentialVal = document.getElementById('potentialVal');
const totalVal = document.getElementById('totalVal');
const protonBucket = document.getElementById('protonBucket');
const neutronBucket = document.getElementById('neutronBucket');
const trashCan = document.getElementById('trashCan');

// ============================================================
//  STATE & CONSTANTS
// ============================================================
// Particles: { x, y, vx, vy, type: 'proton'|'neutron' }
let particles = [];
let running = false;
let animId = null;
let speed = 1.5;
const coulombVizMode = 'ribbon';
let showFieldEnergy = true;
let showElectricArrows = true;
let showStrongArrows = true;
let singleParticleMode = false;  // When on, only show arrows for the clicked particle
let selectedParticle = null;  // Index of particle whose arrows are shown in front
let zoom = 2.0;
const PARTICLE_RADIUS = 10;
const MIN_DIST = 20;  // Clamp distance so force doesn't blow up at overlap

// ============================================================
//  PHYSICS PARAMETERS (fixed)
// ============================================================
const coulombStrength = 139;
const strongForceStrength = 0.5;
const strongForceRange = 1.1;
const equilibriumRatio = 0.6;
const damping = 1.00;
let ieOffset = 0;               // Display-only offset added to IE and Total (not stored in history)
const SUBSTEPS = 20;            // Subdivisions per frame for integration accuracy

// ============================================================
//  HEATMAP OFFSCREEN CANVAS (half resolution for performance)
// ============================================================
const hmCanvas = document.createElement('canvas');
const hmCtx = hmCanvas.getContext('2d');

// ============================================================
//  DRAG STATE
// ============================================================
let dragging = null;       // Index of particle being dragged, or null
let draggingNew = false;   // True if dragging a new particle from a bucket
let draggingType = 'proton';
let dragOffsetX = 0;
let dragOffsetY = 0;
let selectedBucketType = 'proton';  // Which particle type canvas clicks place

// ============================================================
//  ENERGY HISTORY (for graph)
// ============================================================
const MAX_HISTORY = 6000;  // Large buffer so we can scroll back in time
let energyHistory = [];

// ============================================================
//  GRAPH INTERACTION STATE
// ============================================================
let graphViewEnd = -1;      // -1 = "live" (pinned to latest). Otherwise index into energyHistory
const GRAPH_WINDOW = 600;   // How many samples are visible at once
let graphYZoom = 1.0;       // Y-axis zoom multiplier (>1 = zoomed in)
let graphYAutoFit = true;   // Auto-scale Y to fit visible data
let graphDragging = false;
let graphDragStartX = 0;
let graphDragStartEnd = 0;
let graphHoverX = -1;       // Mouse X position in CSS coords, -1 = not hovering

// ============================================================
//  LAYOUT / RESIZE
// ============================================================
function resize() {
  const toolbarH = document.getElementById('toolbar').offsetHeight;
  const mainH = window.innerHeight - toolbarH;
  const panelW = document.getElementById('energyPanel').offsetWidth;
  canvas.width = Math.max(canvas.parentElement.offsetWidth - panelW, 200);
  canvas.height = mainH;
  graphCanvas.width = graphCanvas.offsetWidth * devicePixelRatio;   // HiDPI: scale canvas buffer
  graphCanvas.height = graphCanvas.offsetHeight * devicePixelRatio;
  gctx.scale(devicePixelRatio, devicePixelRatio);  // Match CSS pixel coords
  if (!running) { draw(); drawGraph(); }
}
window.addEventListener('resize', resize);
setTimeout(resize, 0);

// ============================================================
//  PARTICLE HELPERS: create, position, hit-test
// ============================================================
function createParticle(x, y, type) {
  return { x, y, vx: 0, vy: 0, type: type || 'proton' };
}

function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  // Invert the centered zoom transform applied in draw()
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  return { x: (sx - cx) / zoom + cx, y: (sy - cy) / zoom + cy };
}

function findParticleAt(x, y) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const dx = p.x - x;
    const dy = p.y - y;
    if (dx * dx + dy * dy <= (PARTICLE_RADIUS + 4) * (PARTICLE_RADIUS + 4)) {  // +4px hit margin
      return i;
    }
  }
  return -1;
}

// ============================================================
//  OVERLAP RESOLUTION
// ============================================================
function separateOverlaps() {
  const minSep = PARTICLE_RADIUS * 2;
  for (let iter = 0; iter < 10; iter++) {
    let moved = false;
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const a = particles[i];
        const b = particles[j];
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < minSep && dist > 0) {
          const overlap = (minSep - dist) / 2;
          const nx = dx / dist;
          const ny = dy / dist;
          a.x -= nx * overlap;
          a.y -= ny * overlap;
          b.x += nx * overlap;
          b.y += ny * overlap;
          moved = true;
        } else if (dist === 0) {
          b.x += (Math.random() - 0.5) * minSep;
          b.y += (Math.random() - 0.5) * minSep;
          moved = true;
        }
      }
    }
    if (!moved) break;
  }
}

// ============================================================
//  BUCKET SELECTION & DRAG
//  Clicking a bucket selects it (highlights it); canvas clicks
//  then place the selected particle type. Dragging from a bucket
//  also selects it and starts dragging a new particle.
// ============================================================
function selectBucket(type) {
  selectedBucketType = type;
  protonBucket.classList.toggle('selected', type === 'proton');
  neutronBucket.classList.toggle('selected', type === 'neutron');
}
selectBucket('proton');  // Default selection

function setupBucketDrag(bucketEl, type) {
  bucketEl.addEventListener('mousedown', (e) => {
    e.preventDefault();
    selectBucket(type);
    const pos = getCanvasPos(e);
    const newP = createParticle(pos.x, pos.y, type);
    particles.push(newP);
    dragging = particles.length - 1;
    draggingNew = true;
    draggingType = type;
    updateStats();
    hideInstructions();
    if (!running) { draw(); }
  });
}
setupBucketDrag(protonBucket, 'proton');
setupBucketDrag(neutronBucket, 'neutron');

// ============================================================
//  CANVAS MOUSE EVENTS: click to place, drag existing particles
// ============================================================
let didDrag = false;
canvas.addEventListener('mousedown', (e) => {
  const pos = getCanvasPos(e);
  const idx = findParticleAt(pos.x, pos.y);
  didDrag = false;
  if (idx >= 0) {
    dragging = idx;
    draggingNew = false;
    dragOffsetX = particles[idx].x - pos.x;
    dragOffsetY = particles[idx].y - pos.y;
    particles[idx].vx = 0;
    particles[idx].vy = 0;
    canvas.style.cursor = 'grabbing';
    selectedParticle = idx;
    if (!running) draw();
  } else {
    selectedParticle = null;
    if (!running) draw();
  }
});

function isOverTrash(e) {
  const rect = trashCan.getBoundingClientRect();
  return e.clientX >= rect.left && e.clientX <= rect.right &&
         e.clientY >= rect.top && e.clientY <= rect.bottom;
}

window.addEventListener('mousemove', (e) => {
  if (dragging === null) {
    const pos = getCanvasPos(e);
    const idx = findParticleAt(pos.x, pos.y);
    canvas.style.cursor = idx >= 0 ? 'grab' : 'default';
    return;
  }
  const pos = getCanvasPos(e);
  const p = particles[dragging];
  didDrag = true;
  if (draggingNew) {
    p.x = pos.x;
    p.y = pos.y;
  } else {
    p.x = pos.x + dragOffsetX;
    p.y = pos.y + dragOffsetY;
  }
  p.vx = 0;
  p.vy = 0;
  // Highlight trash can when dragging over it
  trashCan.classList.toggle('drag-hover', isOverTrash(e));
  if (!running) { computeEnergy(); draw(); drawGraph(); }
});

// Click on empty canvas = place the selected particle type
canvas.addEventListener('click', (e) => {
  if (didDrag) return;
  const pos = getCanvasPos(e);
  if (findParticleAt(pos.x, pos.y) >= 0) return;
  particles.push(createParticle(pos.x, pos.y, selectedBucketType));
  separateOverlaps();
  updateStats();
  computeEnergy();
  draw();
  drawGraph();
  hideInstructions();
});

window.addEventListener('mouseup', (e) => {
  if (dragging !== null) {
    if (isOverTrash(e)) {
      // Delete the dragged particle
      particles.splice(dragging, 1);
      selectedParticle = null;
      updateStats();
    } else {
      separateOverlaps();
    }
    if (!running) { computeEnergy(); draw(); drawGraph(); }
  }
  dragging = null;
  draggingNew = false;
  trashCan.classList.remove('drag-hover');
  canvas.style.cursor = 'default';
});

// ============================================================
//  ADD CLUSTER BUTTON
// ============================================================
addClusterBtn.addEventListener('click', () => {
  const cx = canvas.width / 2 + (Math.random() - 0.5) * 100;
  const cy = canvas.height / 2 + (Math.random() - 0.5) * 100;
  const totalCount = 10 + Math.floor(Math.random() * 10);

  // Estimate N/Z ratio: light elements ~1:1, heavier ~1.5:1 neutrons:protons
  const existingProtons = particles.filter(p => p.type === 'proton').length;
  const existingNeutrons = particles.filter(p => p.type === 'neutron').length;
  const totalExisting = existingProtons + existingNeutrons;

  // As we get more particles, shift toward more neutrons
  const neutronRatio = Math.min(1.5, 1.0 + totalExisting / 80);
  const protonFraction = 1 / (1 + neutronRatio);

  // Decide exact counts upfront so the ratio is predictable
  let numProtons = Math.round(totalCount * protonFraction);
  let numNeutrons = totalCount - numProtons;
  // Small jitter: shift at most 1 either way
  const jitter = Math.floor(Math.random() * 3) - 1; // -1, 0, or 1
  numProtons = Math.max(1, Math.min(totalCount - 1, numProtons + jitter));
  numNeutrons = totalCount - numProtons;

  // Build shuffled type array
  const types = [];
  for (let i = 0; i < numProtons; i++) types.push('proton');
  for (let i = 0; i < numNeutrons; i++) types.push('neutron');
  // Fisher-Yates shuffle for placement order
  for (let i = types.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = types[i]; types[i] = types[j]; types[j] = tmp;
  }

  for (let i = 0; i < totalCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = PARTICLE_RADIUS * 2 + Math.random() * 40;
    particles.push(createParticle(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r, types[i]));
  }
  separateOverlaps();
  updateStats();
  if (!running) { computeEnergy(); draw(); drawGraph(); }
  hideInstructions();
});

let snapshot = null;  // Deep copy of particles at simulation start

function takeSnapshot() {
  snapshot = particles.map(p => ({ x: p.x, y: p.y, vx: p.vx, vy: p.vy, type: p.type }));
  replayBtn.disabled = false;
}

function restoreSnapshot() {
  if (!snapshot) return;
  particles = snapshot.map(p => ({ x: p.x, y: p.y, vx: p.vx, vy: p.vy, type: p.type }));
}

// ============================================================
//  FORCE MODEL: Coulomb + Strong Nuclear Force
//  Coulomb: K/r² repulsion (proton-proton only)
//  Strong: constant attractive force within cutoff range (no repulsive core)
// ============================================================
function strongCutoff() {
  return PARTICLE_RADIUS * 2 * strongForceRange;
}

// Compute forces between two particles (returns net force magnitude along the line)
// Positive = repulsive, negative = attractive
function pairForce(dist, distSq, aType, bType) {
  let force = 0;
  // Coulomb: only between protons (1/r² with softening to prevent blow-up)
  if (aType === 'proton' && bType === 'proton') {
    const softDistSq = Math.max(distSq, PARTICLE_RADIUS * PARTICLE_RADIUS);
    force += coulombStrength / softDistSq;
  }
  // Strong nuclear force: constant attraction within cutoff, no repulsive core
  const cutoff = strongCutoff();
  if (dist < cutoff) {
    force -= strongForceStrength;
  }
  return force;
}

// ============================================================
//  ENERGY COMPUTATION
// ============================================================
function computeEnergy() {
  let kinetic = 0;
  let potential = 0;
  const n = particles.length;

  for (let i = 0; i < n; i++) {
    const p = particles[i];
    kinetic += 0.5 * (p.vx * p.vx + p.vy * p.vy);  // KE = ½mv² (unit mass)
  }

  const cutoff = strongCutoff();
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const dx = particles[j].x - particles[i].x;
      const dy = particles[j].y - particles[i].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 0) {
        // Coulomb potential: between protons only (with softening)
        if (particles[i].type === 'proton' && particles[j].type === 'proton') {
          const softDist = Math.max(dist, PARTICLE_RADIUS);
          potential += coulombStrength / softDist;
        }
        // Strong force potential: V = -S * (cutoff - r), zero at cutoff, deepens linearly inward
        if (dist < cutoff) {
          potential -= strongForceStrength * (cutoff - dist);
        }
      }
    }
  }

  kineticVal.textContent = kinetic.toFixed(1);
  potentialVal.textContent = (potential + ieOffset).toFixed(1);
  totalVal.textContent = (kinetic + potential + ieOffset).toFixed(1);

  energyHistory.push({ kinetic, potential, total: kinetic + potential });
  if (energyHistory.length > MAX_HISTORY) energyHistory.shift();

  return { kinetic, potential };
}

// ============================================================
//  ENERGY GRAPH (interactive: pan, zoom, crosshair)
// ============================================================
const graphTooltip = document.getElementById('graphTooltip');
const graphAutoFitBtn = document.getElementById('graphAutoFit');
const graphGoLiveBtn = document.getElementById('graphGoLive');

function getVisibleRange() {
  const len = energyHistory.length;
  if (len === 0) return { start: 0, end: 0 };
  // "live" mode: show the latest GRAPH_WINDOW samples
  let end = (graphViewEnd < 0) ? len - 1 : Math.min(graphViewEnd, len - 1);
  let start = Math.max(0, end - GRAPH_WINDOW + 1);
  end = start + Math.min(GRAPH_WINDOW, len) - 1;  // Clamp if fewer samples
  return { start, end };
}

function drawGraph() {
  const w = graphCanvas.offsetWidth;
  const h = graphCanvas.offsetHeight;
  gctx.clearRect(0, 0, w, h);

  const len = energyHistory.length;
  if (len < 2) return;

  const { start, end } = getVisibleRange();
  const visCount = end - start + 1;
  if (visCount < 2) return;

  // Y-axis scaling: auto-fit to visible data or use manual zoom
  let maxVal = 1;
  for (let i = start; i <= end; i++) {
    const e = energyHistory[i];
    maxVal = Math.max(maxVal, Math.abs(e.kinetic), Math.abs(e.potential + ieOffset), Math.abs(e.total + ieOffset));
  }
  maxVal *= 1.1;
  if (!graphYAutoFit) {
    maxVal /= graphYZoom;  // Manual zoom: smaller maxVal = more zoomed in
  }

  const xStep = w / (GRAPH_WINDOW - 1);
  // Align so the visible samples fill from left to right
  const xOff = (GRAPH_WINDOW - visCount) * xStep;

  function drawLine(key, color, offset = 0) {
    gctx.strokeStyle = color;
    gctx.lineWidth = 1.5;
    gctx.beginPath();
    for (let i = 0; i < visCount; i++) {
      const x = xOff + i * xStep;
      const val = energyHistory[start + i][key] + offset;
      const y = h - (val / maxVal) * (h - 8) - 4;
      if (i === 0) gctx.moveTo(x, y);
      else gctx.lineTo(x, y);
    }
    gctx.stroke();
  }

  drawLine('potential', '#3b82f6', ieOffset);
  drawLine('kinetic', '#f59e0b');
  drawLine('total', '#22c55e', ieOffset);

  // Draw crosshair and tooltip at hover position
  if (graphHoverX >= 0 && graphHoverX <= w) {
    // Map mouse X to sample index
    const sampleF = (graphHoverX - xOff) / xStep;
    const sampleI = Math.round(sampleF);
    if (sampleI >= 0 && sampleI < visCount) {
      const e = energyHistory[start + sampleI];
      const crossX = xOff + sampleI * xStep;

      // Vertical crosshair line
      gctx.strokeStyle = 'rgba(255,255,255,0.25)';
      gctx.lineWidth = 1;
      gctx.beginPath();
      gctx.moveTo(crossX, 0);
      gctx.lineTo(crossX, h);
      gctx.stroke();

      // Dots on each line
      const lines = [
        { key: 'kinetic',   color: '#f59e0b', offset: 0 },
        { key: 'potential', color: '#3b82f6', offset: ieOffset },
        { key: 'total',     color: '#22c55e', offset: ieOffset },
      ];
      for (const l of lines) {
        const y = h - ((e[l.key] + l.offset) / maxVal) * (h - 8) - 4;
        gctx.fillStyle = l.color;
        gctx.beginPath();
        gctx.arc(crossX, y, 3, 0, Math.PI * 2);
        gctx.fill();
      }

      // Position tooltip
      graphTooltip.style.display = 'block';
      graphTooltip.innerHTML =
        `<span style="color:#f59e0b">KE</span> ${e.kinetic.toFixed(1)}<br>` +
        `<span style="color:#3b82f6">IE</span> ${(e.potential + ieOffset).toFixed(1)}<br>` +
        `<span style="color:#22c55e">Tot</span> ${(e.total + ieOffset).toFixed(1)}<br>` +
        `<span style="color:#6b7280">t=${start + sampleI}</span>`;
      // Place tooltip: prefer right of cursor, flip if near edge
      const tipW = graphTooltip.offsetWidth;
      let tipX = graphHoverX + 12;
      if (tipX + tipW > w) tipX = graphHoverX - tipW - 8;
      graphTooltip.style.left = tipX + 'px';
      graphTooltip.style.top = '4px';
    } else {
      graphTooltip.style.display = 'none';
    }
  } else {
    graphTooltip.style.display = 'none';
  }

  // Show "not live" indicator when scrolled back
  if (graphViewEnd >= 0 && graphViewEnd < len - 1) {
    gctx.fillStyle = 'rgba(255,100,100,0.7)';
    gctx.font = '10px sans-serif';
    gctx.textAlign = 'right';
    gctx.fillText('PAUSED', w - 4, 12);
  }
}

// ============================================================
//  PHYSICS STEP (Coulomb + Strong Force + Hard-Sphere Collisions)
//  Called once per frame; internally subdivides into SUBSTEPS
//  for integration accuracy and energy conservation.
// ============================================================
function step(dt) {
  const n = particles.length;
  const subDt = dt / SUBSTEPS;  // Divide timestep for accuracy

  for (let sub = 0; sub < SUBSTEPS; sub++) {
    // Compute pairwise forces
    for (let i = 0; i < n; i++) {
      if (i === dragging) continue;
      for (let j = i + 1; j < n; j++) {
        if (j === dragging) continue;
        const a = particles[i];
        const b = particles[j];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const distSq = dx * dx + dy * dy;
        const dist = Math.sqrt(distSq);
        if (dist < 0.01) continue;  // Skip coincident particles
        const force = pairForce(dist, distSq, a.type, b.type);
        const fx = force * (dx / dist);
        const fy = force * (dy / dist);
        a.vx -= fx * subDt;
        a.vy -= fy * subDt;
        b.vx += fx * subDt;
        b.vy += fy * subDt;
      }
    }

    // Dragged particle still exerts force on others
    if (dragging !== null) {
      const d = particles[dragging];
      for (let j = 0; j < n; j++) {
        if (j === dragging) continue;
        const b = particles[j];
        const dx = b.x - d.x;
        const dy = b.y - d.y;
        const distSq = dx * dx + dy * dy;
        const dist = Math.sqrt(distSq);
        if (dist < 0.01) continue;
        const force = pairForce(dist, distSq, d.type, b.type);
        const fx = force * (dx / dist);
        const fy = force * (dy / dist);
        b.vx += fx * subDt;
        b.vy += fy * subDt;
      }
    }

    // Integrate positions (symplectic Euler)
    for (let i = 0; i < n; i++) {
      if (i === dragging) continue;
      const p = particles[i];
      p.x += p.vx * subDt;
      p.y += p.vy * subDt;
    }

    // Hard-sphere constraint with elastic collision for approaching pairs.
    // The force softening above caps repulsion, so this prevents residual
    // overlap.  Only swap normal velocity when particles are approaching
    // — this is an elastic equal-mass collision (conserves KE).
    const minSep = PARTICLE_RADIUS * 2;
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const a = particles[i];
        const b = particles[j];
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        const dSq = dx * dx + dy * dy;
        if (dSq >= minSep * minSep) continue;
        let d = Math.sqrt(dSq);
        if (d < 0.001) { dx = 1; dy = 0; d = 0.001; }
        const nx = dx / d;
        const ny = dy / d;
        const overlap = minSep - d;
        const aFixed = (i === dragging);
        const bFixed = (j === dragging);

        // Position correction
        if (aFixed && !bFixed) {
          b.x += nx * overlap; b.y += ny * overlap;
        } else if (bFixed && !aFixed) {
          a.x -= nx * overlap; a.y -= ny * overlap;
        } else if (!aFixed && !bFixed) {
          a.x -= nx * overlap * 0.5; a.y -= ny * overlap * 0.5;
          b.x += nx * overlap * 0.5; b.y += ny * overlap * 0.5;
        }

        // Inelastic velocity correction: zero out approaching velocity
        // (the strong force handles the rebound; this is just a safety net)
        const dvx = b.vx - a.vx;
        const dvy = b.vy - a.vy;
        const dvDotN = dvx * nx + dvy * ny;
        if (dvDotN < 0) {  // approaching
          const half = dvDotN * 0.5;
          if (aFixed) {
            b.vx -= dvDotN * nx; b.vy -= dvDotN * ny;
          } else if (bFixed) {
            a.vx += dvDotN * nx; a.vy += dvDotN * ny;
          } else {
            a.vx += half * nx; a.vy += half * ny;
            b.vx -= half * nx; b.vy -= half * ny;
          }
        }
      }
    }
  }  // end substep loop

  // Apply damping once per frame (not per substep)
  if (damping < 1.0) {
    for (let i = 0; i < n; i++) {
      if (i === dragging) continue;
      particles[i].vx *= damping;
      particles[i].vy *= damping;
    }
  }
}

// ============================================================
//  COLORMAP: warm sequential — transparent → deep red → orange → yellow
// ============================================================
const COLORMAP = new Uint8Array(256 * 4);
(function buildColormap() {
  const stops = [
    { t: 0.0,  r: 0,   g: 0,   b: 0,   a: 0 },    // Transparent at zero energy
    { t: 0.2,  r: 5,   g: 20,  b: 140, a: 77 },   // Bluish?
    { t: 0.5,  r: 20,  g: 70,  b: 220, a: 153 },  // Bluish?
    { t: 0.8,  r: 60,  g: 160, b: 255, a: 217 },  // Bluish?
    { t: 1.0,  r: 200, g: 235, b: 255, a: 255 },  // Near-white at max energy
  ];
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    let s0 = stops[0], s1 = stops[1];
    for (let s = 0; s < stops.length - 1; s++) {
      if (t >= stops[s].t && t <= stops[s + 1].t) {
        s0 = stops[s]; s1 = stops[s + 1]; break;
      }
    }
    const f = (t - s0.t) / (s1.t - s0.t);
    const idx = i * 4;
    COLORMAP[idx]     = s0.r + (s1.r - s0.r) * f;
    COLORMAP[idx + 1] = s0.g + (s1.g - s0.g) * f;
    COLORMAP[idx + 2] = s0.b + (s1.b - s0.b) * f;
    COLORMAP[idx + 3] = s0.a + (s1.a - s0.a) * f;
  }
})();

// ============================================================
//  HEATMAP RENDERING
//  Coulomb interaction energy density at half resolution.
//  Shows only the cross-term 2(Ei·Ej) between proton pairs.
// ============================================================
function drawHeatmap() {
  const fullW = canvas.width;
  const fullH = canvas.height;
  const scale = 0.5;
  const w = Math.ceil(fullW * scale);
  const h = Math.ceil(fullH * scale);
  const invScale = 1 / scale;

  hmCanvas.width = w;
  hmCanvas.height = h;

  const imageData = hmCtx.createImageData(w, h);
  const data = imageData.data;

  // Only protons contribute to Coulomb field
  const protonList = [];
  for (let i = 0; i < particles.length; i++) {
    if (particles[i].type === 'proton') protonList.push(particles[i]);
  }
  const np = protonList.length;
  if (np < 2) return;

  const minR = PARTICLE_RADIUS;
  const minRSq = minR * minR;

  const exArr = new Float32Array(np);
  const eyArr = new Float32Array(np);

  // Log-scale normalization: maps energy density to 0–1 for colormap
  const sensitivity = 5000.0; // How quickly dim values become visible
  const refMax = 0.02;        // Energy density that maps to colormap=1.0
  const logNorm = Math.log(1.0 + sensitivity * refMax);
  const invLogNorm = 1.0 / logNorm;

  for (let py = 0; py < h; py++) {
    const worldY = py * invScale;
    for (let px = 0; px < w; px++) {
      const worldX = px * invScale;

      // Coulomb field from each proton
      for (let i = 0; i < np; i++) {
        const dx = worldX - protonList[i].x;
        const dy = worldY - protonList[i].y;
        let rSq = dx * dx + dy * dy;
        if (rSq < minRSq) rSq = minRSq;
        const r = Math.sqrt(rSq);
        const fieldMag = coulombStrength / (rSq * r);  // E-field magnitude: K/r²×(1/r) for direction
        exArr[i] = dx * fieldMag;  // E-field x-component from this proton
        eyArr[i] = dy * fieldMag;
      }

      // Cross-terms 2(Ei·Ej) isolate the interaction energy density,
      // excluding each proton's self-energy (which is always positive).
      let interaction = 0;
      for (let i = 0; i < np; i++) {
        for (let j = i + 1; j < np; j++) {
          interaction += 2 * (exArr[i] * exArr[j] + eyArr[i] * eyArr[j]);
        }
      }

      // Negative cross-term = fields oppose = energy stored in the overlap region
      if (interaction < 0) {
        const absVal = -interaction;
        let magnitude = Math.log(1.0 + sensitivity * absVal) * invLogNorm;  // Log compression
        if (magnitude > 1.0) magnitude = 1.0;
        const ci = (magnitude * 255) | 0;
        const di = (py * w + px) * 4;
        const ci4 = ci * 4;
        data[di]     = COLORMAP[ci4];
        data[di + 1] = COLORMAP[ci4 + 1];
        data[di + 2] = COLORMAP[ci4 + 2];
        data[di + 3] = COLORMAP[ci4 + 3];
      }
    }
  }

  hmCtx.putImageData(imageData, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(hmCanvas, 0, 0, fullW, fullH);
}

// ============================================================
//  COULOMB VIZ — Ribbon and Cloud modes
// ============================================================
function drawCoulombViz() {
  const protonList = particles.filter(p => p.type === 'proton');
  if (protonList.length < 2) return;
  const refEnergy = coulombStrength / (PARTICLE_RADIUS * 2);
  for (let i = 0; i < protonList.length; i++) {
    for (let j = i + 1; j < protonList.length; j++) {
      const a = protonList[i];
      const b = protonList[j];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist === 0) continue;
      const mag = Math.min(1, (coulombStrength / dist) / refEnergy);
      if (mag < 0.005) continue;
      if (coulombVizMode === 'ribbon') {
        const lineW = dist <= 30
          ? PARTICLE_RADIUS * 2
          : Math.max(0.5, PARTICLE_RADIUS * 2 - (dist - 30) * (15 / 270));
        ctx.lineWidth = lineW;
        ctx.strokeStyle = `rgba(120, 190, 255, ${Math.min(1, mag * 3.0)})`;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      } else {
        const mx = (a.x + b.x) / 2;
        const my = (a.y + b.y) / 2;
        const blobRadius = dist * 0.8 + 40;
        const coreEdge = Math.min(0.92, 20 / blobRadius);
        const coreAlpha = Math.min(1, mag * mag * mag * 20);
        const cloudAlpha = Math.min(0.45, mag * 1.8);
        const centerAlpha = Math.max(coreAlpha, cloudAlpha);
        const grad = ctx.createRadialGradient(mx, my, 0, mx, my, blobRadius);
        grad.addColorStop(0,        `rgba(220, 240, 255, ${centerAlpha})`);
        grad.addColorStop(coreEdge, `rgba(140, 200, 255, ${cloudAlpha})`);
        grad.addColorStop(0.55,     `rgba(70, 140, 240, ${cloudAlpha * 0.2})`);
        grad.addColorStop(0.75,     `rgba(30, 80, 200, 0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(mx, my, blobRadius, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}

// ============================================================
//  MAIN DRAW
// ============================================================
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Centered zoom: scale around canvas center so existing particles stay visible
  const _cx = canvas.width / 2, _cy = canvas.height / 2;
  ctx.save();
  ctx.translate(_cx, _cy);
  ctx.scale(zoom, zoom);
  ctx.translate(-_cx, -_cy);

  if (showFieldEnergy && particles.length >= 2) {
    drawCoulombViz();
  }

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const isProton = p.type === 'proton';

    // Glow: radial gradient fading to transparent, larger than the particle
    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, PARTICLE_RADIUS * 2.5);
    if (isProton) {
      gradient.addColorStop(0, 'rgba(255, 80, 80, 0.4)');
      gradient.addColorStop(1, 'rgba(255, 80, 80, 0)');
    } else {
      gradient.addColorStop(0, 'rgba(160, 160, 200, 0.3)');
      gradient.addColorStop(1, 'rgba(160, 160, 200, 0)');
    }
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(p.x, p.y, PARTICLE_RADIUS * 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Body: offset inner highlight (-3,-3) gives a 3D spherical look
    const bodyGrad = ctx.createRadialGradient(p.x - 3, p.y - 3, 1, p.x, p.y, PARTICLE_RADIUS);
    if (isProton) {
      bodyGrad.addColorStop(0, '#ff9999');
      bodyGrad.addColorStop(0.7, '#ff4444');
      bodyGrad.addColorStop(1, '#cc2222');
    } else {
      bodyGrad.addColorStop(0, '#ccccdd');
      bodyGrad.addColorStop(0.7, '#8888aa');
      bodyGrad.addColorStop(1, '#666688');
    }
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, PARTICLE_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    // Label
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(isProton ? '+' : 'n', p.x, p.y + 1);
  }

  // Arrows on top of particles
  if (showElectricArrows || showStrongArrows) {
    if (singleParticleMode) {
      // Only draw arrows for the clicked particle (if one is selected)
      if (selectedParticle !== null && selectedParticle < particles.length) {
        drawForceArrows(selectedParticle);
      }
    } else {
      drawForceArrows();
      // Redraw selected particle's arrows last so they appear over neighbors
      if (selectedParticle !== null && selectedParticle < particles.length) {
        drawForceArrows(selectedParticle);
      }
    }
  }

  ctx.restore();
}

// ============================================================
//  FORCE ARROWS
//  For each pair (i,j): draw force of j on i as an arrow on particle i.
//  Orange = Coulomb (always repulsive), Cyan = Strong (attractive or repulsive).
//  Length: sqrt(|F| / F_ref) * MAX_LEN, capped at MAX_LEN.
// ============================================================
function drawArrow(fromX, fromY, nx, ny, len, color, w = PARTICLE_RADIUS * 0.5) {
  if (len < 1) return;
  const W    = w;
  const HEAD = W * 2.5;                 // arrowhead length proportional to shaft
  const px = -ny, py = nx;             // perpendicular unit vector
  const tipX = fromX + nx * len;
  const tipY = fromY + ny * len;
  const baseX = tipX - nx * HEAD;
  const baseY = tipY - ny * HEAD;

  ctx.fillStyle = color;
  ctx.strokeStyle = color;
  ctx.lineWidth = W * 2;
  ctx.globalAlpha = 0.9;
  ctx.lineCap = 'round';

  // Shaft from particle center to arrowhead base
  ctx.beginPath();
  ctx.moveTo(fromX, fromY);
  ctx.lineTo(baseX, baseY);
  ctx.stroke();

  // Filled arrowhead triangle
  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(baseX + px * W * 2, baseY + py * W * 2);
  ctx.lineTo(baseX - px * W * 2, baseY - py * W * 2);
  ctx.closePath();
  ctx.fill();

  ctx.globalAlpha = 1.0;
  ctx.lineCap = 'butt';
}

function drawForceArrows(forIndex = null) {
  const MAX_LEN = 55;
  const cutoff = strongCutoff();
  const indices = forIndex !== null
    ? [forIndex]
    : particles.map((_, k) => k);

  for (const i of indices) {
    const pi = particles[i];
    for (let j = 0; j < particles.length; j++) {
      if (i === j) continue;
      const pj = particles[j];
      const dx = pi.x - pj.x;
      const dy = pi.y - pj.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist === 0) continue;
      const nx = dx / dist;
      const ny = dy / dist;

      // Coulomb: repulsive, arrow points away from j. Length ∝ 1/r², max at touching.
      if (showElectricArrows && pi.type === 'proton' && pj.type === 'proton') {
        const refDist = PARTICLE_RADIUS * 2;
        const len = MAX_LEN * 0.6 * Math.min(1, (refDist / Math.max(dist, refDist)) ** 2);
        drawArrow(pi.x, pi.y, nx, ny, len, '#fb923c', PARTICLE_RADIUS * 0.15);
      }

      // Strong: attractive, arrow points toward j. Ramps up steeply inside cutoff.
      if (showStrongArrows && dist < cutoff) {
        const len = MAX_LEN * 0.6 * Math.pow(1 - dist / cutoff, 0.3);
        const ox = -ny * PARTICLE_RADIUS * 0.5;
        const oy =  nx * PARTICLE_RADIUS * 0.5;
        drawArrow(pi.x + ox, pi.y + oy, -nx, -ny, len, '#22d3ee', PARTICLE_RADIUS * 0.15);
      }
    }
  }
}

// ============================================================
//  ANIMATION LOOP
// ============================================================
function loop() {
  if (!running) return;
  step(speed);
  computeEnergy();
  draw();
  drawGraph();
  animId = requestAnimationFrame(loop);
}

// Initial draw
draw();
</script>
