<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuclear Simulation v8</title>
<style>
  /* ========================================
     RESET & BASE STYLES
     ======================================== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a1a;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow-x: auto;
    overflow-y: hidden;
    height: 100vh;
    min-width: 860px;       /* Prevent layout collapse on narrow viewports */
    display: flex;
    flex-direction: column;
  }

  /* ========================================
     TOOLBAR
     ======================================== */
  #toolbar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 20px;
    background: #12122a;
    border-bottom: 1px solid #2a2a4a;
    z-index: 10;
  }

  .toolbar-row {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  #toolbar h1 {
    font-size: 18px;
    font-weight: 600;
    color: #ff6b6b;
    margin-right: 8px;
    white-space: nowrap;
  }

  /* ========================================
     BUTTONS
     ======================================== */
  .btn {
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }

  #goBtn {
    background: #7c3aed;
    color: #fff;
  }
  #goBtn:hover { background: #6d28d9; }
  #goBtn.running {
    background: #ef4444;
  }
  #goBtn.running:hover { background: #dc2626; }

  #addClusterBtn {
    background: #6366f1;
    color: #fff;
  }
  #addClusterBtn:hover { background: #4f46e5; }

  .proton-add-btn, .nucleus-add-btn {
    background: #dc2626;
    color: #fff;
  }
  .proton-add-btn:hover, .nucleus-add-btn:hover { background: #b91c1c; }

  .particle-frame {
    background: #0d0d20;
    border: 1px solid #2a2a4a;
    border-radius: 10px;
    padding: 8px 16px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .particle-frame-title {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 4px;
    color: #d1d5db;
    text-transform: uppercase;
    text-align: center;
    line-height: 1;
  }

  .particle-frame-controls {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  /* ========================================
     NEUTRON SLIDER
     ======================================== */
  .neutron-slider-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .neutron-slider-label {
    font-size: 13px;
    font-weight: 600;
    color: #9ca3af;
    min-width: 2em;
    font-variant-numeric: tabular-nums;
  }

  #neutronSlider {
    -webkit-appearance: none;
    appearance: none;
    width: 160px;
    height: 8px;
    border-radius: 4px;
    background: linear-gradient(180deg, #1a1a2e 0%, #2a2a4a 50%, #1a1a2e 100%);
    border: 1px solid #3a3a5a;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
    outline: none;
    cursor: pointer;
  }

  #neutronSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 32px;
    border-radius: 4px;
    background: linear-gradient(180deg,
      #e5e7eb 0%,
      #d1d5db 15%,
      #9ca3af 40%,
      #6b7280 55%,
      #9ca3af 70%,
      #d1d5db 85%,
      #e5e7eb 100%
    );
    border: 1px solid #4b5563;
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.5),
      inset 0 -1px 1px rgba(0,0,0,0.3),
      0 2px 6px rgba(0,0,0,0.5);
    cursor: grab;
    transition: background 0.1s, box-shadow 0.1s;
  }

  #neutronSlider::-webkit-slider-thumb:active {
    cursor: grabbing;
    background: linear-gradient(180deg,
      #f3f4f6 0%,
      #e5e7eb 15%,
      #b0b8c1 40%,
      #8a9299 55%,
      #b0b8c1 70%,
      #e5e7eb 85%,
      #f3f4f6 100%
    );
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.6),
      inset 0 -1px 1px rgba(0,0,0,0.2),
      0 3px 8px rgba(0,0,0,0.6);
  }

  #neutronSlider::-moz-range-thumb {
    width: 18px;
    height: 32px;
    border-radius: 4px;
    background: linear-gradient(180deg,
      #e5e7eb 0%,
      #d1d5db 15%,
      #9ca3af 40%,
      #6b7280 55%,
      #9ca3af 70%,
      #d1d5db 85%,
      #e5e7eb 100%
    );
    border: 1px solid #4b5563;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    cursor: grab;
  }

  .cluster-inputs {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .cluster-label {
    font-size: 12px;
    color: #9ca3af;
    display: flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
  }

  .cluster-label input[type="number"] {
    background: #1e1e3a;
    border: 1px solid #3a3a5a;
    border-radius: 4px;
    color: #e0e0e0;
    padding: 4px 6px;
    font-size: 13px;
  }

  #replayBtn {
    background: #0e7490;
    color: #fff;
  }
  #replayBtn:hover { background: #0891b2; }
  #replayBtn:disabled {
    background: #1e293b;
    color: #4b5563;
    cursor: not-allowed;
  }

  /* ========================================
     SLIDER & TOGGLE CONTROLS
     ======================================== */
  .slider-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .slider-group label {
    font-size: 12px;
    color: #9ca3af;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .slider-group label span {
    display: inline-block;
    min-width: 3.2em;
    text-align: right;
  }

  .slider-group input[type="range"] {
    width: 80px;
    accent-color: #6366f1;
  }

  .toggle-label {
    font-size: 13px;
    color: #9ca3af;
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    white-space: nowrap;
  }

  .toggle-label input[type="checkbox"] {
    accent-color: #f59e0b;
  }

  /* ========================================
     ARROW TOGGLE
     ======================================== */
  .arrow-toggle-group {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .arrow-btn {
    padding: 3px 10px;
    border: 1px solid #3a3a5a;
    border-radius: 4px;
    background: transparent;
    color: #6b7280;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }

  .arrow-btn.active {
    background: #6366f1;
    color: #fff;
    border-color: #6366f1;
  }

  .arrow-btn:hover:not(.active) {
    color: #e0e0e0;
    border-color: #6366f1;
  }

  /* ========================================
     STATS DISPLAY
     ======================================== */
  #stats {
    font-size: 13px;
    color: #9ca3af;
    margin-left: auto;
    white-space: nowrap;
  }

  /* ========================================
     MAIN LAYOUT
     ======================================== */
  #main {
    flex: 1;
    display: flex;
    position: relative;
  }

  #canvas {
    flex: 1;
    display: block;
    cursor: default;
  }

  /* ========================================
     TAB BAR
     ======================================== */
  #tabBar {
    display: flex;
    gap: 4px;
    padding-bottom: 2px;
  }

  .tab-btn {
    padding: 4px 14px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: #6b7280;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }

  .tab-btn:hover { color: #e0e0e0; }

  .tab-btn.active {
    color: #e0e0e0;
    border-bottom-color: #6366f1;
  }

  /* ========================================
     INSTRUCTIONS OVERLAY
     ======================================== */
  #instructions {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(18, 18, 42, 0.85);
    border: 1px solid #2a2a4a;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 13px;
    color: #9ca3af;
    pointer-events: none;
    text-align: center;
    transition: opacity 0.5s;
  }
</style>
</head>
<body>

<!-- ========================================
     TOOLBAR HTML
     ======================================== -->
<div id="toolbar">
  <div id="tabBar">
    <button class="tab-btn active" id="tabA">Protons</button>
    <button class="tab-btn" id="tabB">Protons + Neutrons</button>
    <button class="tab-btn" id="tabC" style="display:none">Quantum</button>
  </div>
  <div class="toolbar-row" style="align-items:flex-start;gap:10px">
    <!-- NEUTRONS frame: visible in Tab B, invisible-but-present in Tab A to hold position -->
    <div id="neutronFrame" class="particle-frame" style="visibility:hidden">
      <div class="particle-frame-title">NEUTRONS</div>
      <div class="particle-frame-controls">
        <div class="neutron-slider-wrap">
          <button id="neutronDecBtn" style="width:24px;height:24px;padding:0;font-size:14px;line-height:1;background:#1e293b;color:#cbd5e1;border:1px solid #334155;border-radius:4px;cursor:pointer;flex-shrink:0;">&#9664;</button>
          <input type="range" id="neutronSlider" min="0" max="50" step="1" value="2">
          <button id="neutronIncBtn" style="width:24px;height:24px;padding:0;font-size:14px;line-height:1;background:#1e293b;color:#cbd5e1;border:1px solid #334155;border-radius:4px;cursor:pointer;flex-shrink:0;">&#9654;</button>
          <span class="neutron-slider-label"><span id="neutronSliderVal">2</span></span>
        </div>
      </div>
    </div>
    <!-- PROTONS frame: always in this position; buttons swap per tab -->
    <div class="particle-frame">
      <div class="particle-frame-title">PROTONS</div>
      <div class="particle-frame-controls">
        <div id="protonBtns" style="display:flex;gap:6px">
          <button class="btn proton-add-btn" data-count="1">1</button>
          <button class="btn proton-add-btn" data-count="2">2</button>
          <button class="btn proton-add-btn" data-count="6">6</button>
          <button class="btn proton-add-btn" data-count="20">20</button>
          <button class="btn proton-add-btn" data-count="36">36</button>
        </div>
        <div id="nucleusBtns" style="display:none;gap:6px">
          <button class="btn nucleus-add-btn" data-count="1">1</button>
          <button class="btn nucleus-add-btn" data-count="2">2</button>
          <button class="btn nucleus-add-btn" data-count="6">6</button>
          <button class="btn nucleus-add-btn" data-count="20">20</button>
          <button class="btn nucleus-add-btn" data-count="36">36</button>
        </div>
      </div>
    </div>
    <!-- GO + REPLAY always visible, bottom-aligned with the button rows -->
    <div style="display:flex;flex-direction:column;justify-content:flex-end;align-self:stretch;gap:6px;padding-bottom:10px">
      <button class="btn" id="goBtn">Go</button>
      <button class="btn" id="replayBtn" disabled>Replay</button>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-left:8px;align-self:center">
      <span id="stats">Protons: 0 &nbsp; Neutrons: 0</span>
      <button class="btn" id="centerBtn" style="display:none;font-size:11px;padding:2px 8px">Center</button>
    </div>
  </div>
  <div class="toolbar-row">
    <div class="slider-group">
      <label>Speed: <span id="speedVal">3.0</span>x</label>
      <input type="range" id="speedSlider" min="0" max="20" step="1" value="13">
    </div>
    <div class="slider-group">
      <label>Zoom: <span id="zoomVal">2.0</span>x</label>
      <input type="range" id="zoomSlider" min="5" max="40" step="1" value="20">
    </div>
    <label class="toggle-label"><input type="checkbox" id="electricFieldToggle" checked> <span style="color:#7dd3fc">Electric field</span></label>
    <label class="toggle-label"><input type="checkbox" id="strongFieldToggle" checked> <span style="color:#fb923c">Strong field</span></label>
    <div id="arrowToggle" class="arrow-toggle-group">
      <span style="font-size:12px;color:#9ca3af">Arrows:</span>
      <button class="arrow-btn active" data-mode="0">Force arrows off</button>
      <button class="arrow-btn" data-mode="1">Show all forces</button>
      <button class="arrow-btn" data-mode="2">Show total forces</button>
    </div>
    <div class="slider-group">
      <label>Strong F: <span id="strongFVal">0.25</span></label>
      <input type="range" id="strongFSlider" min="1" max="100" step="1" value="25">
    </div>
  </div>
</div>


<!-- ========================================
     MAIN CONTENT: Canvas
     ======================================== -->
<div id="main">
  <canvas id="canvas"></canvas>

  <div id="instructions">Drag particles to reposition. Use "Add Cluster" to place particles.</div>
</div>

<script>
// ============================================================
//  DOM ELEMENT REFERENCES
// ============================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const goBtn = document.getElementById('goBtn');
const replayBtn = document.getElementById('replayBtn');
const speedSlider = document.getElementById('speedSlider');
const speedValEl = document.getElementById('speedVal');
const statsEl = document.getElementById('stats');
const instructionsEl = document.getElementById('instructions');

// ============================================================
//  SIMULATION STATE
//  All mutable state lives here. Particles are plain objects:
//  { x, y, vx, vy, type: 'proton'|'neutron' }
// ============================================================
let particles = [];
let running = false;
let animId = null;
let speed = 1.5;  // Internal dt per frame (display speed = speed * 2)

// ---- Visualization toggles ----
let showElectricField = true;   // Toggle for Coulomb heatmap
let showStrongField = true;     // Toggle for strong nuclear heatmap

const antispin = true;            // Always on; suppresses runaway cluster spin

// ---- Selection & force arrows ----
let selectedParticle = null;  // Index of the clicked particle
let arrowMode = 0;            // 0=off, 1=per-source arrows, 2=net force arrow
let currentTabIsProton = true; // true = Tab A (protons only)
let currentTab = 'proton';    // 'proton' | 'nucleus' | 'quantum'

// ============================================================
//  QUANTUM: NUCLEAR STABILITY + NEUTRON DECAY CASCADE
// ============================================================
const STABILITY_TABLE = { 1:2, 2:2, 3:4, 4:6, 5:6, 6:8, 7:8, 8:10, 9:10, 10:12 };
function maxStableNeutrons(z) {
  if (z <= 0) return 0;
  return STABILITY_TABLE[z] !== undefined ? STABILITY_TABLE[z] : Math.floor(z * 1.5);
}

const QUANTUM_ESCAPE_SPEED = 4.0;  // px/frame for ejected neutron
const COHESION_K = 0.004;          // Spring constant toward cluster CM (Quantum tab only)
let quantumEjectAt      = null;    // performance.now() when next ejection fires
let quantumTimerStartAt = null;    // when current timer began
let quantumFlashes      = [];      // [{x,y,startTime}] brief ejection flashes

function ejectDelayRange(excessRatio) {
  if (excessRatio >= 4) return [ 20,  50];
  if (excessRatio >= 3) return [ 50, 100];
  if (excessRatio >= 2) return [100, 200];
  if (excessRatio >= 1) return [200, 400];
  return                       [400, 800];
}

function ejectCount(excessRatio) {
  if (excessRatio >= 4) return 4;
  if (excessRatio >= 3) return 3;
  if (excessRatio >= 2) return 2;
  return 1;
}

function updateQuantumStability() {
  if (currentTab !== 'quantum' && currentTab !== 'nucleus') return;

  for (const p of particles) {
    if (!p.ejected) { p.unstable = false; p.strongScale = 1.0; }
  }

  // Evaluate each cluster independently; cache each cluster's CM on its particles
  // so step() can apply the cohesion spring without re-clustering every substep.
  const clusters = findAllClusters();
  for (const cluster of clusters) {
    let cmx = 0, cmy = 0;
    for (const p of cluster) { cmx += p.x; cmy += p.y; }
    cmx /= cluster.length; cmy /= cluster.length;
    for (const p of cluster) { p.clusterCmx = cmx; p.clusterCmy = cmy; }
  }

  let maxExcessRatio = 0;
  const unstableClusters = [];

  for (const cluster of clusters) {
    const Z       = cluster.filter(p => p.type === 'proton').length;
    const neutrons = cluster.filter(p => p.type === 'neutron');
    const excess  = neutrons.length - maxStableNeutrons(Z);
    if (excess <= 0) continue;

    const excessRatio = Z > 0 ? excess / Z : excess;
    if (excessRatio > maxExcessRatio) maxExcessRatio = excessRatio;

    let cx = 0, cy = 0;
    for (const p of cluster) { cx += p.x; cy += p.y; }
    cx /= cluster.length; cy /= cluster.length;

    const protons = cluster.filter(p => p.type === 'proton');
    const sorted = neutrons.map(p => {
      let nearestDist = Infinity;
      for (const pr of protons) {
        const d = Math.hypot(p.x - pr.x, p.y - pr.y);
        if (d < nearestDist) nearestDist = d;
      }
      if (!isFinite(nearestDist)) nearestDist = Math.hypot(p.x - cx, p.y - cy);
      return { p, d: nearestDist };
    }).sort((a, b) => b.d - a.d);

    for (let i = 0; i < excess; i++) {
      sorted[i].p.unstable    = true;
      sorted[i].p.strongScale = 0.2;
    }

    unstableClusters.push({ cluster, sorted, excess, excessRatio, cx, cy });
  }

  if (unstableClusters.length === 0) {
    quantumEjectAt = quantumTimerStartAt = null;
    return;
  }

  const now = performance.now();
  if (quantumEjectAt === null) {
    const [lo, hi] = ejectDelayRange(maxExcessRatio);
    quantumTimerStartAt = now;
    quantumEjectAt      = now + lo + Math.random() * (hi - lo);
  } else if (now >= quantumEjectAt) {
    // Eject from every unstable cluster simultaneously
    for (const { cluster, sorted, excessRatio, cx, cy } of unstableClusters) {
      const count   = Math.min(ejectCount(excessRatio), sorted.length);
      const targets = sorted.slice(0, count).map(s => s.p);
      let totalRecoilVx = 0, totalRecoilVy = 0;

      for (const target of targets) {
        const dx = target.x - cx, dy = target.y - cy;
        const d  = Math.sqrt(dx * dx + dy * dy);
        const nx = d > 0.01 ? dx / d : Math.random() * 2 - 1;
        const ny = d > 0.01 ? dy / d : Math.random() * 2 - 1;
        target.vx = nx * QUANTUM_ESCAPE_SPEED;
        target.vy = ny * QUANTUM_ESCAPE_SPEED;
        target.ejected = true; target.unstable = false; target.strongScale = 0;
        delete target.clusterCmx; delete target.clusterCmy;
        totalRecoilVx -= target.vx; totalRecoilVy -= target.vy;
        quantumFlashes.push({ x: target.x, y: target.y, startTime: now });
      }

      const remaining = cluster.filter(p => !p.ejected);
      if (remaining.length > 0) {
        const rvx = totalRecoilVx / remaining.length;
        const rvy = totalRecoilVy / remaining.length;
        for (const p of remaining) { p.vx += rvx; p.vy += rvy; }
      }
    }
    quantumEjectAt = quantumTimerStartAt = null;
  }
}

// ---- View ----
let zoom = 2.0;  // Canvas zoom centered on canvas midpoint

// ---- Sizing ----
const PARTICLE_RADIUS = 10;  // px — display radius and physics hard-sphere radius
const MIN_DIST = 20;         // Minimum distance for force calc = 2*PARTICLE_RADIUS (softening floor)

// ============================================================
//  PHYSICS PARAMETERS
//  These are fixed — changing them changes the whole character
//  of the simulation (equilibrium distance, fusion threshold, etc.)
// ============================================================
const coulombStrength = 139;      // K in F = K/r² (Coulomb repulsion, proton-proton only)
let strongForceStrength = 0.25;   // Constant attractive force magnitude within cutoff
let strongForceRange = 1.2;       // Cutoff = PARTICLE_RADIUS * 2 * strongForceRange
const COULOMB_CUTOFF_SQ = (PARTICLE_RADIUS * 40) ** 2;  // 400px — Coulomb force negligible beyond this
const equilibriumRatio = 0.6;     // Ratio r_eq / r_cutoff (informational, not used directly)
const damping = 1.00;             // Velocity multiplier per frame; 1.0 = no damping
const SUBSTEPS = 20;              // Physics substeps per animation frame for integration accuracy


// ============================================================
//  HEATMAP OFFSCREEN CANVAS (half resolution for performance)
// ============================================================
const hmCanvas = document.createElement('canvas');
const hmCtx = hmCanvas.getContext('2d');

// Composite canvas: holds the fully-blended heatmap at full resolution.
// Cached between frames so we can skip recomputation every other frame.
const hmComposite = document.createElement('canvas');
const hmcCtx = hmComposite.getContext('2d');

// Pre-allocated pixel buffers; resized when canvas dimensions change.
let hmW = 0, hmH = 0;
let hmDataElec = null, hmDataStrong = null;
let hmImgElec  = null, hmImgStrong  = null;
let hmFrameCounter = 0;

function ensureHmBuffers(w, h) {
  if (hmW === w && hmH === h) return;
  hmW = w; hmH = h;
  hmCanvas.width = w; hmCanvas.height = h;
  hmDataElec   = new Uint8ClampedArray(w * h * 4);
  hmDataStrong = new Uint8ClampedArray(w * h * 4);
  hmImgElec    = new ImageData(hmDataElec,   w, h);
  hmImgStrong  = new ImageData(hmDataStrong, w, h);
}

// ============================================================
//  DRAG STATE
// ============================================================
let dragging = null;       // Index of particle being dragged, or null
let dragOffsetX = 0;
let dragOffsetY = 0;

// ============================================================
//  LAYOUT / RESIZE
// ============================================================
function resize() {
  const toolbarH = document.getElementById('toolbar').offsetHeight;
  const mainH = window.innerHeight - toolbarH;
  canvas.width = Math.max(canvas.parentElement.offsetWidth, 200);
  canvas.height = mainH;
  if (!running) draw();
}
window.addEventListener('resize', resize);
setTimeout(resize, 0);

// ============================================================
//  PARTICLE HELPERS: create, position, hit-test
// ============================================================
function createParticle(x, y, type) {
  return { x, y, vx: 0, vy: 0, type: type || 'proton' };
}

function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  // Invert the centered zoom transform applied in draw()
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  return { x: (sx - cx) / zoom + cx, y: (sy - cy) / zoom + cy };
}

function findParticleAt(x, y) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const dx = p.x - x;
    const dy = p.y - y;
    if (dx * dx + dy * dy <= (PARTICLE_RADIUS + 4) * (PARTICLE_RADIUS + 4)) {  // +4px hit margin
      return i;
    }
  }
  return -1;
}

// ============================================================
//  OVERLAP RESOLUTION
//  Iterative position-correction pass: push overlapping pairs
//  apart by half the overlap distance, up to 10 iterations.
//  Used after placing or adding particles, not during physics
//  (the physics step handles collisions with its own constraint).
// ============================================================
function separateOverlaps() {
  const minSep = PARTICLE_RADIUS * 2;
  for (let iter = 0; iter < 10; iter++) {
    let moved = false;
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const a = particles[i];
        const b = particles[j];
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < minSep && dist > 0) {
          const overlap = (minSep - dist) / 2;
          const nx = dx / dist;
          const ny = dy / dist;
          a.x -= nx * overlap;
          a.y -= ny * overlap;
          b.x += nx * overlap;
          b.y += ny * overlap;
          moved = true;
        } else if (dist === 0) {
          b.x += (Math.random() - 0.5) * minSep;
          b.y += (Math.random() - 0.5) * minSep;
          moved = true;
        }
      }
    }
    if (!moved) break;
  }
}

// ============================================================
//  CANVAS MOUSE EVENTS
//  mousedown  — start dragging an existing particle (or deselect)
//  mousemove  — drag particle / initiate bucket drag once threshold met
//  mouseup    — drop particle; delete if released over trash can
//  click      — place a new particle of the selected type on empty space
//  didDrag flag prevents click from firing after a drag release
// ============================================================
let didDrag = false;
canvas.addEventListener('mousedown', (e) => {
  const pos = getCanvasPos(e);
  const idx = findParticleAt(pos.x, pos.y);
  didDrag = false;
  if (idx >= 0) {
    dragging = idx;
    dragOffsetX = particles[idx].x - pos.x;
    dragOffsetY = particles[idx].y - pos.y;
    particles[idx].vx = 0;
    particles[idx].vy = 0;
    canvas.style.cursor = 'grabbing';
    selectedParticle = idx;
    if (!running) draw();
  } else {
    selectedParticle = null;
    if (!running) draw();
  }
});

window.addEventListener('mousemove', (e) => {
  if (dragging === null) {
    const pos = getCanvasPos(e);
    const idx = findParticleAt(pos.x, pos.y);
    canvas.style.cursor = idx >= 0 ? 'grab' : 'default';
    return;
  }
  const pos = getCanvasPos(e);
  const p = particles[dragging];
  didDrag = true;
  p.x = pos.x + dragOffsetX;
  p.y = pos.y + dragOffsetY;
  p.vx = 0;
  p.vy = 0;
  if (!running) { computeEnergy(); draw(); }
});

window.addEventListener('mouseup', (e) => {
  if (dragging !== null) {
    separateOverlaps();
    if (!running) { computeEnergy(); draw(); }
  }
  dragging = null;
  canvas.style.cursor = 'default';
});

// ============================================================
//  PACKED CLUSTER BUILDER
//  Returns an array of { x, y, type } in a hex close-packed
//  arrangement centered on (0, 0).  Particles are placed at
//  touching distance (2 * PARTICLE_RADIUS) from their neighbors.
//
//  Proton assignment — farthest-point greedy:
//    1. Seed the first proton at the outermost position.
//    2. Each subsequent proton goes to the open slot whose
//       minimum distance to any already-placed proton is largest.
//  This maximises the spread of positive charge across the cluster.
// ============================================================
function buildPackedCluster(numProtons, numNeutrons, spacing = PARTICLE_RADIUS * 2) {
  if (numProtons + numNeutrons === 0) return [];

  const D    = spacing;               // 1 diameter — fine grid spacing
  const rowH = D * Math.sqrt(3) / 2;
  const jitter = () => (Math.random() - 0.5) * D * 0.3;

  // Generate a large fine hex grid (enough for all particles plus room for proton spacing)
  const span = Math.ceil(Math.sqrt(numProtons * 4 + numNeutrons)) + 4;
  const grid = [];
  for (let row = -span; row <= span; row++) {
    const xOff = (Math.abs(row) % 2 === 1) ? D / 2 : 0;
    for (let col = -span; col <= span; col++) {
      const x = col * D + xOff + jitter();
      const y = row * rowH + jitter();
      grid.push({ x, y, dist2: x * x + y * y });
    }
  }
  grid.sort((a, b) => a.dist2 - b.dist2);

  // Step 1: pick proton slots — innermost positions at least 1.5 diameters apart.
  const protonMinDist2 = (D * 1.0) * (D * 1.0);
  const protonSlots = [];
  const usedIdx = new Set();
  for (let i = 0; i < grid.length && protonSlots.length < numProtons; i++) {
    let tooClose = false;
    for (const pp of protonSlots) {
      const dx = grid[i].x - pp.x, dy = grid[i].y - pp.y;
      if (dx * dx + dy * dy < protonMinDist2) { tooClose = true; break; }
    }
    if (!tooClose) { protonSlots.push(grid[i]); usedIdx.add(i); }
  }

  // Step 2: pick neutron slots — innermost positions not already used by protons.
  const neutronSlots = [];
  for (let i = 0; i < grid.length && neutronSlots.length < numNeutrons; i++) {
    if (!usedIdx.has(i)) neutronSlots.push(grid[i]);
  }

  return [
    ...protonSlots.map(p => ({ x: p.x, y: p.y, type: 'proton'  })),
    ...neutronSlots.map(p => ({ x: p.x, y: p.y, type: 'neutron' })),
  ];
}

// ============================================================
//  RANDOM PROTON PLACER (Tab A)
//  Poisson-disk rejection sampling: each proton is placed at a
//  random position in a disk, retrying until it is farther than
//  minDist from every already-placed proton.  minDist is set well
//  above the strong-force cutoff so no interactions start.
// ============================================================
function buildRandomProtons(n) {
  if (n === 0) return [];
  const minDist = strongCutoff() * 1.8;          // clear margin above strong range
  const radius  = minDist * Math.sqrt(n) * 0.85; // disk sized for n non-overlapping protons
  const placed  = [];

  for (let i = 0; i < n; i++) {
    let best = null, bestMinD = -1;
    const attempts = 300;
    for (let a = 0; a < attempts; a++) {
      // Uniform random point inside disk
      const angle = Math.random() * 2 * Math.PI;
      const r     = Math.sqrt(Math.random()) * radius;
      const x = r * Math.cos(angle), y = r * Math.sin(angle);

      let minD = Infinity;
      for (const p of placed) {
        const dx = p.x - x, dy = p.y - y;
        const d  = Math.sqrt(dx * dx + dy * dy);
        if (d < minD) minD = d;
      }
      if (placed.length === 0 || minD >= minDist) { best = { x, y }; break; }
      if (minD > bestMinD) { bestMinD = minD; best = { x, y }; }
    }
    placed.push(best);
  }
  return placed.map(p => ({ x: p.x, y: p.y, type: 'proton' }));
}

// ============================================================
//  CLUSTER PLACEMENT
//  placeProtons(n)     — Tab A: random layout, no strong force
//  placeNucleus(p, n)  — Tab B: tight hex pack, called by

  running = false;

function placeCluster(numProtons, numNeutrons, spacing) {
  resetSim();

  const nzRatio = numProtons > 0 ? numNeutrons / numProtons : 1.0;
  strongForceStrength = Math.min(1.0, Math.max(0.01, 2 * nzRatio - 1));
  document.getElementById('strongFSlider').value = Math.round(strongForceStrength * 100);
  document.getElementById('strongFVal').textContent = strongForceStrength.toFixed(2);

  const cx = canvas.width / 2, cy = canvas.height / 2;
  const cluster = buildPackedCluster(numProtons, numNeutrons, spacing);
  for (const p of cluster) particles.push(createParticle(cx + p.x, cy + p.y, p.type));
  updateStats();
  computeEnergy();
  draw();
  hideInstructions();
}

function placeProtons(n) {
  resetSim();
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const pts = buildRandomProtons(n);
  for (const p of pts) particles.push(createParticle(cx + p.x, cy + p.y, 'proton'));
  updateStats();
  computeEnergy();
  draw();
  hideInstructions();
}

function findAllClusters() {
  const active = particles.filter(p => !p.ejected);
  if (active.length === 0) return [];
  const threshold = strongCutoff() * 1.5;
  const visited = new Array(active.length).fill(false);
  const clusters = [];
  for (let i = 0; i < active.length; i++) {
    if (visited[i]) continue;
    const cluster = [];
    const queue = [i];
    visited[i] = true;
    while (queue.length) {
      const idx = queue.shift();
      cluster.push(active[idx]);
      for (let j = 0; j < active.length; j++) {
        if (visited[j]) continue;
        const dx = active[idx].x - active[j].x;
        const dy = active[idx].y - active[j].y;
        if (dx * dx + dy * dy <= threshold * threshold) {
          visited[j] = true;
          queue.push(j);
        }
      }
    }
    clusters.push(cluster);
  }
  return clusters;
}

function findBiggestCluster() {
  return findAllClusters().reduce((best, c) => c.length > best.length ? c : best, []);
}

  cx /= cluster.length; cy /= cluster.length;
  const dx = canvas.width / 2 - cx;
  const dy = canvas.height / 2 - cy;
  for (const p of particles) { p.x += dx; p.y += dy; }

  cvx /= cluster.length; cvy /= cluster.length;

  if (!running) draw();
});

// ============================================================
//  FORCE MODEL
//  Two forces act between particles:
//
//  Coulomb repulsion (proton-proton only):
//    F = coulombStrength / r²  (softened: r clamped to PARTICLE_RADIUS)
//
//  Strong nuclear force (all pairs within cutoff):
//    F = -strongForceStrength  (constant attraction, no r-dependence)
//    Cutoff = PARTICLE_RADIUS * 2 * strongForceRange
//
//  The combination creates a potential well: particles repel at long
//  range (protons), attract strongly once close, and can bind into
//  nuclei when kinetic energy is low enough to stay in the well.
// ============================================================
function strongCutoff() {
  return PARTICLE_RADIUS * 2 * strongForceRange;
}

// Returns net force magnitude along the axis between two particles.
// Positive = repulsive (pushes apart), negative = attractive (pulls together).
function pairForce(dist, distSq, aType, bType, strongScale) {
  let force = 0;
  // Coulomb: only between protons (1/r² with softening to prevent blow-up)
  if (aType === 'proton' && bType === 'proton') {
    const softDistSq = Math.max(distSq, PARTICLE_RADIUS * PARTICLE_RADIUS);
    force += coulombStrength / softDistSq;
  }
  // Strong nuclear force: constant attraction within cutoff, no repulsive core
  const cutoff = strongCutoff();
  if (dist < cutoff) {
    force -= strongForceStrength * (strongScale ?? 1.0);
  }
  return force;
}

// ============================================================
//  ENERGY COMPUTATION
//  Computes true kinetic and potential energy from particle state,
//  then applies display transformations before writing to the UI
//  and energy history.
//
//  KE = Σ ½mv²  (unit mass, so just ½v²)
//  IE = Coulomb potential + Strong potential
//
//  Potential integrals match the force model:
//    Coulomb: V = K/r  (softened)
//    Strong:  V = -S*(cutoff - r)  (linear well, zero at cutoff)
// ============================================================
function computeEnergy() {
  let kinetic = 0;
  let eiePotential = 0;  // Coulomb (electric) potential energy
  let siePotential = 0;  // Strong nuclear potential energy
  const n = particles.length;

  for (let i = 0; i < n; i++) {
    const p = particles[i];
    kinetic += 0.5 * (p.vx * p.vx + p.vy * p.vy);  // KE = ½mv² (unit mass)
  }

  const cutoff = strongCutoff();
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const dx = particles[j].x - particles[i].x;
      const dy = particles[j].y - particles[i].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 0) {
        // Coulomb potential: between protons only (with softening)
        if (particles[i].type === 'proton' && particles[j].type === 'proton') {
          const softDist = Math.max(dist, PARTICLE_RADIUS);
          eiePotential += coulombStrength / softDist;
        }
        // Strong force potential: V = -S * (cutoff - r), zero at cutoff, deepens linearly inward
        if (dist < cutoff) {
          siePotential -= strongForceStrength * (cutoff - dist);
        }
      }
    }
  }
  const potential = eiePotential + siePotential;

  // Update inline energy display in toolbar

  return { kinetic, potential };  // Return true values for callers that need them
}

// ============================================================
//  PHYSICS STEP
//  Called once per animation frame with dt = speed.
//  Internally subdivides into SUBSTEPS for accuracy.
//
//  Each substep:
//    1. Compute pairwise forces → accumulate into velocities
//    2. Let dragged particle exert force without being pushed
//    3. Integrate positions (symplectic Euler: v first, then x)
//    4. Hard-sphere constraint: push apart any overlapping pairs
//       and exchange their approaching normal velocities
//
//  After all substeps:
//    5. Apply damping (currently disabled: damping = 1.0)
//    6. Antispin: clamp cluster angular velocity if enabled
// ============================================================
function step(dt) {
  const n = particles.length;
  const subDt = dt / SUBSTEPS;  // Per-substep timestep

  for (let sub = 0; sub < SUBSTEPS; sub++) {
    // 1. Compute pairwise forces
    for (let i = 0; i < n; i++) {
      if (i === dragging) continue;
      for (let j = i + 1; j < n; j++) {
        if (j === dragging) continue;
        const a = particles[i];
        const b = particles[j];
        if (a.ejected || b.ejected) continue;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const distSq = dx * dx + dy * dy;
        if (distSq > COULOMB_CUTOFF_SQ) continue;  // Too far for any meaningful force
        const dist = Math.sqrt(distSq);
        if (dist < 0.01) continue;  // Skip coincident particles
        const ss = currentTab === 'quantum'
          ? Math.min(a.strongScale ?? 1, b.strongScale ?? 1)
          : 1;
        const force = pairForce(dist, distSq, a.type, b.type, ss);
        const fx = force * (dx / dist);
        const fy = force * (dy / dist);
        a.vx -= fx * subDt;
        a.vy -= fy * subDt;
        b.vx += fx * subDt;
        b.vy += fy * subDt;
      }
    }


    // Quantum cohesion: gentle spring toward each particle's cluster CM
    if (currentTab === 'quantum') {
      for (let i = 0; i < n; i++) {
        if (i === dragging) continue;
        const p = particles[i];
        if (p.ejected || p.clusterCmx === undefined) continue;
        const dx = p.clusterCmx - p.x;
        const dy = p.clusterCmy - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 0.01) continue;
        const f = COHESION_K * dist;
        p.vx += (dx / dist) * f * subDt;
        p.vy += (dy / dist) * f * subDt;
      }
    }

    // 2. Dragged particle still exerts force on others (but is not itself pushed)
    if (dragging !== null) {
      const d = particles[dragging];
      for (let j = 0; j < n; j++) {
        if (j === dragging) continue;
        const b = particles[j];
        const dx = b.x - d.x;
        const dy = b.y - d.y;
        const distSq = dx * dx + dy * dy;
        const dist = Math.sqrt(distSq);
        if (dist < 0.01) continue;
        const force = pairForce(dist, distSq, d.type, b.type);
        const fx = force * (dx / dist);
        const fy = force * (dy / dist);
        b.vx += fx * subDt;
        b.vy += fy * subDt;
      }
    }

    // 3. Integrate positions (symplectic Euler: velocity already updated above)
    for (let i = 0; i < n; i++) {
      if (i === dragging) continue;
      const p = particles[i];
      p.x += p.vx * subDt;
      p.y += p.vy * subDt;
    }

    // 4. Hard-sphere constraint: resolve any remaining overlaps.
    //    Force softening caps—but doesn't eliminate—overlap at high speed.
    //    Position correction: push overlapping centers apart by full overlap.
    //    Velocity correction: only when particles are approaching (dvDotN < 0)
    //    — swap the normal velocity component (equal-mass elastic collision).
    //    If one particle is being dragged, only the free particle is corrected.
    const minSep = PARTICLE_RADIUS * 2;
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const a = particles[i];
        const b = particles[j];
        if (a.ejected || b.ejected) continue;
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        const dSq = dx * dx + dy * dy;
        if (dSq >= minSep * minSep) continue;
        let d = Math.sqrt(dSq);
        if (d < 0.001) { dx = 1; dy = 0; d = 0.001; }
        const nx = dx / d;
        const ny = dy / d;
        const overlap = minSep - d;
        const aFixed = (i === dragging);
        const bFixed = (j === dragging);

        // Position correction
        if (aFixed && !bFixed) {
          b.x += nx * overlap; b.y += ny * overlap;
        } else if (bFixed && !aFixed) {
          a.x -= nx * overlap; a.y -= ny * overlap;
        } else if (!aFixed && !bFixed) {
          a.x -= nx * overlap * 0.5; a.y -= ny * overlap * 0.5;
          b.x += nx * overlap * 0.5; b.y += ny * overlap * 0.5;
        }

        // Inelastic velocity correction: zero out approaching velocity
        // (the strong force handles the rebound; this is just a safety net)
        const dvx = b.vx - a.vx;
        const dvy = b.vy - a.vy;
        const dvDotN = dvx * nx + dvy * ny;
        if (dvDotN < 0) {  // approaching
          const half = dvDotN * 0.5;
          if (aFixed) {
            b.vx -= dvDotN * nx; b.vy -= dvDotN * ny;
          } else if (bFixed) {
            a.vx += dvDotN * nx; a.vy += dvDotN * ny;
          } else {
            a.vx += half * nx; a.vy += half * ny;
            b.vx -= half * nx; b.vy -= half * ny;
          }
        }
      }
    }
  }  // end substep loop

  // 5. Damping: multiply all velocities by damping factor once per frame.
  //    Currently disabled (damping = 1.0) so energy is conserved.
  if (damping < 1.0) {
    for (let i = 0; i < n; i++) {
      if (i === dragging) continue;
      particles[i].vx *= damping;
      particles[i].vy *= damping;
    }
  }

  // 6. Antispin: suppress runaway rotation in bound clusters.
  //    Without this, the strong force can pump angular momentum into a
  //    nucleus over time and it will spin up indefinitely.
  //    Algorithm:
  //      a) Build adjacency list: particles within strongCutoff are "bonded"
  //      b) Flood-fill to find connected clusters of 3+ particles
  //      c) For each cluster: compute CM, angular momentum L, moment I
  //         → omega = L / I  (angular velocity)
  //      d) Only subtract the excess beyond MAX_OMEGA (1 rev/sim-s),
  //         leaving a small allowed spin so clusters still feel natural.
  //    MAX_OMEGA scales with speed so the allowed spin is speed-invariant.
  if (antispin && n >= 3) {
    const cutoffSpin = strongCutoff();
    const cutoffSpinSq = cutoffSpin * cutoffSpin;

    // Build adjacency list
    const adj = new Array(n);
    for (let i = 0; i < n; i++) adj[i] = [];
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const dx = particles[j].x - particles[i].x;
        const dy = particles[j].y - particles[i].y;
        if (dx * dx + dy * dy < cutoffSpinSq) {
          adj[i].push(j);
          adj[j].push(i);
        }
      }
    }

    // Flood-fill to find connected clusters
    const visited = new Uint8Array(n);
    for (let seed = 0; seed < n; seed++) {
      if (visited[seed]) continue;
      if (adj[seed].length === 0) { visited[seed] = 1; continue; }
      const cluster = [seed];
      visited[seed] = 1;
      let head = 0;
      while (head < cluster.length) {
        const cur = cluster[head++];
        for (let k = 0; k < adj[cur].length; k++) {
          const nb = adj[cur][k];
          if (!visited[nb]) { visited[nb] = 1; cluster.push(nb); }
        }
      }

      if (cluster.length < 3) continue;

      // Center of mass position and velocity
      let cmx = 0, cmy = 0, cvx = 0, cvy = 0;
      for (let k = 0; k < cluster.length; k++) {
        const p = particles[cluster[k]];
        cmx += p.x; cmy += p.y; cvx += p.vx; cvy += p.vy;
      }
      cmx /= cluster.length; cmy /= cluster.length;
      cvx /= cluster.length; cvy /= cluster.length;

      // Angular momentum L and moment of inertia I about center of mass
      let L = 0, I = 0;
      for (let k = 0; k < cluster.length; k++) {
        const p = particles[cluster[k]];
        const rx = p.x - cmx, ry = p.y - cmy;
        const vxr = p.vx - cvx, vyr = p.vy - cvy;
        L += rx * vyr - ry * vxr;
        I += rx * rx + ry * ry;
      }
      if (I < 0.001) continue;

      // omega in rad/subDt. MAX_OMEGA = 1 rev per sim-second at 60fps,
      // scaled by speed so the visual spin rate is consistent across speeds.
      // removeOmega is only the excess — spins within the cap are untouched.
      const omega = L / I;
      const MAX_OMEGA = 2 * Math.PI * speed / (60 * SUBSTEPS);  // 1 rev/sim-s, scales with speed
      const removeOmega = Math.sign(omega) * Math.max(0, Math.abs(omega) - MAX_OMEGA);
      for (let k = 0; k < cluster.length; k++) {
        if (cluster[k] === dragging) continue;
        const p = particles[cluster[k]];
        const rx = p.x - cmx, ry = p.y - cmy;
        p.vx -= -removeOmega * ry;
        p.vy -=  removeOmega * rx;
      }
    }
  }
}

// ============================================================
//  COLORMAP
//  Pre-baked 256-entry RGBA lookup table mapping energy density
//  [0, 1] to a blue-white gradient (transparent at zero, opaque
//  near-white at max). Used by the Coulomb heatmap renderer.
// ============================================================
function buildColorstops(stops, out) {
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    let s0 = stops[0], s1 = stops[1];
    for (let s = 0; s < stops.length - 1; s++) {
      if (t >= stops[s].t && t <= stops[s + 1].t) { s0 = stops[s]; s1 = stops[s + 1]; break; }
    }
    const f = (t - s0.t) / (s1.t - s0.t);
    const idx = i * 4;
    out[idx]     = s0.r + (s1.r - s0.r) * f;
    out[idx + 1] = s0.g + (s1.g - s0.g) * f;
    out[idx + 2] = s0.b + (s1.b - s0.b) * f;
    out[idx + 3] = s0.a + (s1.a - s0.a) * f;
  }
}

const COLORMAP = new Uint8Array(256 * 4);
buildColorstops([
  { t: 0.0,  r: 0,   g: 0,   b: 0,   a: 0   },
  { t: 0.12, r: 10,  g: 35,  b: 170, a: 140 },
  { t: 0.4,  r: 25,  g: 85,  b: 235, a: 210 },
  { t: 0.7,  r: 70,  g: 165, b: 255, a: 245 },
  { t: 1.0,  r: 210, g: 238, b: 255, a: 255 },
], COLORMAP);

const STRONG_COLORMAP = new Uint8Array(256 * 4);
buildColorstops([
  { t: 0.0,  r: 0,   g: 0,   b: 0,   a: 0   },
  { t: 0.12, r: 160, g: 45,  b: 0,   a: 140 },
  { t: 0.4,  r: 240, g: 110, b: 10,  a: 210 },
  { t: 0.7,  r: 255, g: 185, b: 70,  a: 245 },
  { t: 1.0,  r: 255, g: 238, b: 210, a: 255 },
], STRONG_COLORMAP);

// ============================================================
//  COMBINED HEATMAP
//  Single pixel loop computes both electric (blue) and strong
//  (orange) fields. Results are composited into hmComposite at
//  full resolution. When running, the composite is reused every
//  other frame (heatmap every 2 frames — imperceptible at the
//  blurred quarter-resolution the maps are rendered at).
// ============================================================
function drawCombinedHeatmap() {
  const fullW = canvas.width, fullH = canvas.height;
  const scale = 0.25;
  const w = Math.ceil(fullW * scale), h = Math.ceil(fullH * scale);

  // Every other frame when running: blit cached composite and return
  hmFrameCounter++;
  if (running && (hmFrameCounter & 1) &&
      hmComposite.width === fullW && hmComposite.height === fullH) {
    ctx.drawImage(hmComposite, 0, 0);
    return;
  }

  // Build electric pairs (proton-proton only)
  const elecPairs = [];
  if (showElectricField) {
    const refEnergy = coulombStrength / (PARTICLE_RADIUS * 2);
    const logRef = Math.log(2);
    const protonList = particles.filter(p => p.type === 'proton');
    for (let i = 0; i < protonList.length; i++) {
      for (let j = i + 1; j < protonList.length; j++) {
        const a = protonList[i], b = protonList[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 0.01) continue;
        const energy = coulombStrength / dist;
        const sigma = Math.max(3.5, 28 / Math.sqrt(dist));
        const distFade = Math.exp(-dist / 350);
        const mag = Math.min(1, Math.log(1 + energy / refEnergy) / logRef) * distFade;
        const cullSq = 16 * (sigma * 2) * (sigma * 2);
        elecPairs.push({ ax: a.x, ay: a.y, ux: dx / dist, uy: dy / dist, dist, sigma, mag, cullSq });
      }
    }
  }
  elecPairs.sort((a, b) => b.mag - a.mag);

  // Build strong pairs (all nucleons within cutoff)
  const strongPairs = [];
  if (showStrongField) {
    const cutoff = strongCutoff();
    const eqDist = Math.max(cutoff * equilibriumRatio, PARTICLE_RADIUS * 2);
    const span = cutoff - eqDist;
    if (span > 0) {
      const maxBinding = strongForceStrength * span / 2;
      const n = particles.length;
      for (let i = 0; i < n; i++) {
        for (let j = i + 1; j < n; j++) {
          const a = particles[i], b = particles[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist === 0 || dist >= cutoff) continue;
          const dr = dist - eqDist;
          const energy = strongForceStrength / (2 * span) * (dr * dr - span * span);
          const mag = Math.min(1, Math.abs(energy) / maxBinding);
          const sigma = Math.max(0.375, 0.0875 * dist);
          const spread = 1.6;
          const cullSq = 16 * (sigma * spread * 3) * (sigma * spread * 3);
          strongPairs.push({ ax: a.x, ay: a.y, ux: dx / dist, uy: dy / dist, dist, sigma, mag, spread, cullSq });
        }
      }
    }
  }
  strongPairs.sort((a, b) => b.mag - a.mag);

  if (elecPairs.length === 0 && strongPairs.length === 0) return;

  ensureHmBuffers(w, h);
  if (elecPairs.length   > 0) hmDataElec.fill(0);
  if (strongPairs.length > 0) hmDataStrong.fill(0);

  const invScale = 1 / scale;
  const cxH = fullW / 2, cyH = fullH / 2;

  // Single pixel loop — computes both fields at once
  for (let py = 0; py < h; py++) {
    const worldY = (py * invScale - cyH) / zoom + cyH;
    for (let px = 0; px < w; px++) {
      const worldX = (px * invScale - cxH) / zoom + cxH;
      const di = (py * w + px) * 4;

      // Electric field
      if (elecPairs.length > 0) {
        let total = 0;
        for (let k = 0; k < elecPairs.length; k++) {
          const p = elecPairs[k];
          const rx = worldX - p.ax, ry = worldY - p.ay;
          const para = rx * p.ux + ry * p.uy;
          const e1 = para > 0 ? Math.min(1, para / 8) : 0;
          const e2 = para < p.dist ? Math.min(1, (p.dist - para) / 8) : 0;
          const endFade = e1 * e2;
          if (endFade <= 0) continue;
          const perpSq = Math.max(0, rx * rx + ry * ry - para * para);
          if (perpSq > p.cullSq) continue;
          const t = para / p.dist;
          const sigmaT = p.sigma * (1 + Math.sin(Math.PI * t));
          total += p.mag * Math.exp(-perpSq / (2 * sigmaT * sigmaT)) * endFade;
          if (total >= 1/3) break;
        }
        if (total > 0.002) {
          const ci = (Math.min(255, (total * 3.0 * 255) | 0));
          const ci4 = ci * 4;
          hmDataElec[di]     = COLORMAP[ci4];
          hmDataElec[di + 1] = COLORMAP[ci4 + 1];
          hmDataElec[di + 2] = COLORMAP[ci4 + 2];
          hmDataElec[di + 3] = COLORMAP[ci4 + 3];
        }
      }

      // Strong field
      if (strongPairs.length > 0) {
        let total = 0;
        for (let k = 0; k < strongPairs.length; k++) {
          const p = strongPairs[k];
          const rx = worldX - p.ax, ry = worldY - p.ay;
          const para = rx * p.ux + ry * p.uy;
          const margin = (p.spread - 1) / 2 * p.dist;
          const extDist = p.dist * p.spread;
          const paraExt = para + margin;
          const e1 = paraExt > 0 ? Math.min(1, paraExt / 8) : 0;
          const e2 = paraExt < extDist ? Math.min(1, (extDist - paraExt) / 8) : 0;
          const endFade = e1 * e2;
          if (endFade <= 0) continue;
          const perpSq = Math.max(0, rx * rx + ry * ry - para * para);
          if (perpSq > p.cullSq) continue;
          const t = paraExt / extDist;
          const sigmaT = p.sigma * p.spread * (1 + 2 * Math.sin(Math.PI * t));
          const val = p.mag * Math.exp(-perpSq / (2 * sigmaT * sigmaT)) * endFade;
          if (val > total) total = val;
          if (total >= 1/3) break;
        }
        if (total > 0.002) {
          const ci = (Math.min(255, (total * 3.0 * 255) | 0));
          const ci4 = ci * 4;
          hmDataStrong[di]     = STRONG_COLORMAP[ci4];
          hmDataStrong[di + 1] = STRONG_COLORMAP[ci4 + 1];
          hmDataStrong[di + 2] = STRONG_COLORMAP[ci4 + 2];
          hmDataStrong[di + 3] = STRONG_COLORMAP[ci4 + 3];
        }
      }
    }
  }

  // Composite both layers into hmComposite at full resolution
  if (hmComposite.width !== fullW || hmComposite.height !== fullH) {
    hmComposite.width = fullW; hmComposite.height = fullH;
  }
  hmcCtx.clearRect(0, 0, fullW, fullH);
  hmcCtx.imageSmoothingEnabled = true;
  hmcCtx.imageSmoothingQuality = 'high';
  if (elecPairs.length > 0) {
    hmCtx.putImageData(hmImgElec, 0, 0);
    hmcCtx.drawImage(hmCanvas, 0, 0, fullW, fullH);
  }
  if (strongPairs.length > 0) {
    hmCtx.putImageData(hmImgStrong, 0, 0);
    hmcCtx.drawImage(hmCanvas, 0, 0, fullW, fullH);
  }

  ctx.drawImage(hmComposite, 0, 0);
}


// ============================================================
//  FORCE ARROW RENDERING (Tab A / Proton mode)
//
//  drawArrow draws a single arrow (shaft + arrowhead) in world
//  space inside the active zoom transform.
//
//  drawProtonForceArrows renders arrows on the selected proton:
//    mode 1: one arrow per other proton showing the Coulomb push
//    mode 2: one arrow showing the vector sum of all Coulomb forces
// ============================================================
function drawArrow(fromX, fromY, nx, ny, len, color, w) {
  if (len < 1) return;
  w = w || PARTICLE_RADIUS * 0.5;
  const HEAD = w * 2.5;
  const px = -ny, py = nx;
  const tipX = fromX + nx * len,  tipY = fromY + ny * len;
  const baseX = tipX - nx * HEAD, baseY = tipY - ny * HEAD;
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = w * 2; ctx.globalAlpha = 0.88; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(fromX, fromY); ctx.lineTo(baseX, baseY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tipX, tipY);
  ctx.lineTo(baseX + px * w * 2.8, baseY + py * w * 2.8);
  ctx.lineTo(baseX - px * w * 2.8, baseY - py * w * 2.8);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1.0; ctx.lineCap = 'butt';
}

function drawProtonForceArrows() {
  if (arrowMode === 0 || selectedParticle === null) return;
  if (selectedParticle >= particles.length) return;
  const pi = particles[selectedParticle];
  if (pi.type !== 'proton') return;

  const MAX_LEN = 40;
  const refDist = PARTICLE_RADIUS * 2;
  const aw = PARTICLE_RADIUS * 0.15;

  if (arrowMode === 1) {
    // Per-source: one arrow on pi for each other proton's Coulomb push
    for (let j = 0; j < particles.length; j++) {
      if (j === selectedParticle || particles[j].type !== 'proton') continue;
      const pj = particles[j];
      const dx = pi.x - pj.x, dy = pi.y - pj.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist === 0) continue;
      const nx = dx / dist, ny = dy / dist;
      // Scale arrow length ~ 1/dist (closer = longer), capped at MAX_LEN
      const len = MAX_LEN * Math.min(1, (refDist / Math.max(dist, refDist)) * 2.4);
      drawArrow(pi.x + nx * PARTICLE_RADIUS, pi.y + ny * PARTICLE_RADIUS, nx, ny, len, '#fb923c', aw);
    }
  } else {
    // Net: vector sum of the same display arrows used in per-source mode
    let sumX = 0, sumY = 0;
    for (let j = 0; j < particles.length; j++) {
      if (j === selectedParticle || particles[j].type !== 'proton') continue;
      const pj = particles[j];
      const dx = pi.x - pj.x, dy = pi.y - pj.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist === 0) continue;
      const nx = dx / dist, ny = dy / dist;
      const len = MAX_LEN * Math.min(1, (refDist / Math.max(dist, refDist)) * 2.4);
      sumX += nx * len;
      sumY += ny * len;
    }
    const netLen = Math.sqrt(sumX * sumX + sumY * sumY);
    if (netLen === 0) return;
    drawArrow(pi.x + (sumX / netLen) * PARTICLE_RADIUS, pi.y + (sumY / netLen) * PARTICLE_RADIUS,
              sumX / netLen, sumY / netLen, netLen, '#facc15', PARTICLE_RADIUS * 0.22);
  }
}

// ============================================================
//  MAIN DRAW
//  Render order (back to front):
//    1. Coulomb field visualization (ribbon or cloud)
//    2. All particle bodies
//
//  Everything is drawn inside a centered zoom transform so the
//  zoom slider scales visuals without touching physics coordinates.
// ============================================================
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Heatmaps render in screen space before the zoom transform.
  // They account for zoom internally via coordinate mapping.
  if ((showElectricField || showStrongField) && particles.length >= 2) drawCombinedHeatmap();

  // Centered zoom: scale around canvas center so existing particles stay visible
  const _cx = canvas.width / 2, _cy = canvas.height / 2;
  ctx.save();
  ctx.translate(_cx, _cy);
  ctx.scale(zoom, zoom);
  ctx.translate(-_cx, -_cy);

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const isProton = p.type === 'proton';

    // Selection ring (shown in Tab A when arrows active)
    if (i === selectedParticle && currentTabIsProton && arrowMode > 0) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, PARTICLE_RADIUS + 5, 0, Math.PI * 2);
      ctx.strokeStyle = '#facc15';
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.7;
      ctx.stroke();
      ctx.globalAlpha = 1.0;
    }

    // Unstable neutron: pulsing red glow that intensifies as ejection nears
    if (p.unstable && (currentTab === 'quantum' || currentTab === 'nucleus')) {
      const now = performance.now();
      let timerProgress = 0;
      if (quantumTimerStartAt !== null && quantumEjectAt !== null) {
        timerProgress = Math.min(1, (now - quantumTimerStartAt) / (quantumEjectAt - quantumTimerStartAt));
      }
      const pulse  = 0.5 + 0.5 * Math.sin(now / 180);
      const glowR  = PARTICLE_RADIUS + 5 + pulse * 3 + timerProgress * 10;
      const alpha  = 0.35 + timerProgress * 0.55 + pulse * 0.1;
      const glow   = ctx.createRadialGradient(p.x, p.y, PARTICLE_RADIUS * 0.4, p.x, p.y, glowR);
      glow.addColorStop(0, `rgba(255,60,40,${Math.min(1, alpha).toFixed(2)})`);
      glow.addColorStop(1, 'rgba(255,0,0,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
      ctx.fill();
    }

    // Body: offset inner highlight (-3,-3) gives a 3D spherical look
    const bodyGrad = ctx.createRadialGradient(p.x - 3, p.y - 3, 1, p.x, p.y, PARTICLE_RADIUS);
    if (isProton) {
      bodyGrad.addColorStop(0, '#ff9999');
      bodyGrad.addColorStop(0.7, '#ff4444');
      bodyGrad.addColorStop(1, '#cc2222');
    } else {
      bodyGrad.addColorStop(0, '#ccccdd');
      bodyGrad.addColorStop(0.7, '#8888aa');
      bodyGrad.addColorStop(1, '#666688');
    }
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, PARTICLE_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    // Label
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(isProton ? '+' : 'n', p.x, p.y + 1);
  }

  // Ejection flashes — fixed position at ejection site
  if (currentTab === 'quantum' || currentTab === 'nucleus') {
    const now = performance.now();
    quantumFlashes = quantumFlashes.filter(f => {
      const age = now - f.startTime;
      if (age > 350) return false;
      const t = age / 350;
      const r = PARTICLE_RADIUS + t * PARTICLE_RADIUS * 3;
      ctx.beginPath();
      ctx.arc(f.x, f.y, r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,180,80,${(1 - t).toFixed(2)})`;
      ctx.lineWidth = 3 * (1 - t);
      ctx.stroke();
      return true;
    });
  }

  // Force arrows on selected particle (Tab A only)
  if (currentTabIsProton) drawProtonForceArrows();

  ctx.restore();

  // Remove ejected neutrons once off-screen. Non-ejected particles
  // (the nucleus, even if drifted off-screen) are always kept.
  if (currentTab === 'quantum') {
    const margin = PARTICLE_RADIUS * 4;
    particles = particles.filter(p =>
      !p.ejected ||
      (p.x > -margin && p.x < canvas.width  + margin &&
       p.y > -margin && p.y < canvas.height + margin)
    );
  }

  // Remove particles that have drifted far off-screen in proton/nucleus tabs.
  // They can't return (Coulomb keeps pushing them out) so there's no reason to
  // keep computing their interactions. Remap dragging index to stay valid.
  if (currentTab !== 'quantum') {
    const farMargin = Math.max(canvas.width, canvas.height) * 2;
    const kept = [];
    let newDragging = null;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      if (p.x > -farMargin && p.x < canvas.width  + farMargin &&
          p.y > -farMargin && p.y < canvas.height + farMargin) {
        if (i === dragging) newDragging = kept.length;
        kept.push(p);
      }
    }
    particles = kept;
    dragging  = newDragging;
  }
}

// ============================================================
//  ANIMATION LOOP
//  Called once per animation frame while running.
//  Order: physics → energy → visuals → schedule next frame.
// ============================================================
function loop() {
  if (!running) return;
  updateQuantumStability();
  step(speed);
  computeEnergy();
  updateStats();
  draw();
  animId = requestAnimationFrame(loop);
}

// Initial draw to populate the canvas before Go is pressed
draw();
</script>
