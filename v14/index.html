// ============================================================
//  PHASE TIMELINE
// ============================================================
const phaseTimeline   = document.getElementById('phaseTimeline');
const segApproach     = document.getElementById('phaseSeg-approach');
const segCollision    = document.getElementById('phaseSeg-collision');
const segEscape       = document.getElementById('phaseSeg-escape');

function updatePhaseTimeline() {
  const total = particleHistory.length;
  if (total === 0 || collisionStartFrame < 0) {
    phaseTimeline.style.display = 'none';
    return;
  }
  phaseTimeline.style.display = 'flex';

  // Full phase boundaries
  const approachEnd   = collisionStartFrame;                         // [0, approachEnd)
  const collisionEnd  = escapeStartFrame >= 0 ? escapeStartFrame : total; // [approachEnd, collisionEnd)
  const escapeEnd     = total;                                        // [collisionEnd, escapeEnd)

  // Zoom window
  const zStart = graphZoomStart;
  const zEnd   = (graphZoomEnd ?? (total - 1)) + 1; // exclusive

  // Visible frames for each phase within zoom window
  const clamp = (a, b) => Math.max(0, Math.min(b, zEnd) - Math.max(a, zStart));
  const visApproach   = clamp(0,          approachEnd);
  const visCollision  = clamp(approachEnd, collisionEnd);
  const visEscape     = clamp(collisionEnd, escapeEnd);
  const visTotal      = visApproach + visCollision + visEscape;

  const setSegment = (el, frames) => {
    if (frames <= 0) { el.style.display = 'none'; return; }
    el.style.display = 'flex';
    el.style.flex    = String(frames);
    el.style.fontSize = frames / visTotal < 0.12 ? '0px' : '10px';
  };

  setSegment(segApproach,  visApproach);
  setSegment(segCollision, visCollision);
  setSegment(segEscape,    visEscape);
}

// ============================================================
//  GRAPH ZOOM HELPERS
// ============================================================
function applyGraphZoom(start, end) {
  const n = particleHistory.length;
  graphZoomStart = Math.max(0, start);
  graphZoomEnd   = (end === null || end >= n - 1) ? null : Math.min(n - 1, end);
  const zEnd = graphZoomEnd ?? (n - 1);
  timeSlider.min = graphZoomStart;
  timeSlider.max = zEnd;
  // Clamp scrubFrame into visible window
  if (scrubFrame >= 0) {
    scrubFrame = Math.max(graphZoomStart, Math.min(zEnd, scrubFrame));
    timeSlider.value = scrubFrame;
  } else {
    timeSlider.value = zEnd;
  }
  updatePhaseTimeline();
  if (!running) draw();
}

function resetGraphZoom() {
  graphZoomStart = 0;
  graphZoomEnd   = null;
  const n = particleHistory.length;
  timeSlider.min = 0;
  timeSlider.max = Math.max(0, n - 1);
  timeSlider.value = scrubFrame >= 0 ? scrubFrame : Math.max(0, n - 1);
  updatePhaseTimeline();
  if (!running) draw();
}

// Drag-to-zoom events on energyGraph
energyGraph.addEventListener('mousedown', e => {
  if (!particleHistory.length) return;
  egDragStartPx = e.offsetX;
  egDragCurPx   = e.offsetX;
  e.preventDefault();
});
energyGraph.addEventListener('mousemove', e => {
  if (egDragStartPx === null) return;
  egDragCurPx = e.offsetX;
  if (!running) draw();
});
energyGraph.addEventListener('mouseup', e => {
  if (egDragStartPx === null) return;
  const x0 = Math.min(egDragStartPx, e.offsetX);
  const x1 = Math.max(egDragStartPx, e.offsetX);
  egDragStartPx = null;
  egDragCurPx   = null;
  const W = energyGraph.width;
  const n = particleHistory.length;
  if (n < 2 || x1 - x0 < 4) { if (!running) draw(); return; } // too small = ignore
  // Map pixel range to frame indices within current zoom
  const zStart = graphZoomStart;
  const zEnd   = graphZoomEnd ?? (n - 1);
  const zLen   = zEnd - zStart;
  const fStart = Math.round(zStart + (x0 / W) * zLen);
  const fEnd   = Math.round(zStart + (x1 / W) * zLen);
  if (fEnd - fStart < 2) { if (!running) draw(); return; }
  applyGraphZoom(fStart, fEnd);
});
energyGraph.addEventListener('mouseleave', e => {
  if (egDragStartPx !== null) {
    egDragStartPx = null; egDragCurPx = null;
    if (!running) draw();
  }
});

const pselIcons    = Array.from(document.querySelectorAll('.psel-icon'));
const pselTriggers = Array.from(document.querySelectorAll('.pwheel-trigger'));
const psliderIcons = Array.from(document.querySelectorAll('.pslider-icon'));

// Compute He-4 bounding extents once — used as the universal nucleon scale reference
// so all cluster icons have the same nucleon size regardless of how many particles they contain.
const _he4halo = PARTICLE_RADIUS * 1.35;
const _he4def  = CLUSTER_DEFS['he'];
const _he4cmx  = _he4def.reduce((s, p) => s + p.x, 0) / _he4def.length;
const _he4cmy  = _he4def.reduce((s, p) => s + p.y, 0) / _he4def.length;
let _he4maxX   = _he4halo, _he4maxY = _he4halo;
for (const p of _he4def) {
  _he4maxX = Math.max(_he4maxX, Math.abs(p.x - _he4cmx) + _he4halo);
  _he4maxY = Math.max(_he4maxY, Math.abs(p.y - _he4cmy) + _he4halo);
}

// Maps each cluster key to [mainText, superscriptText]
const CLUSTER_LABEL = { p: 'H', n: 'N', d: 'H-2', t: 'H-3', he: 'He-4' };

function drawClusterIcon(canvas) {
  const W   = canvas.width, H = canvas.height;
  const ic  = canvas.getContext('2d');
  const key = canvas.dataset.key;
  const def = CLUSTER_DEFS[key];
  if (!def) return;

  ic.clearRect(0, 0, W, H);

  // For slider icons (small, no room for label) use the full width for the image
  const isSlider = canvas.classList.contains('pslider-icon');
  const imgW = isSlider ? W : H;  // image occupies a square H×H on the left

  // Centre on visual mean position
  const cmx = def.reduce((s, p) => s + p.x, 0) / def.length;
  const cmy = def.reduce((s, p) => s + p.y, 0) / def.length;

  // Use He-4 as the scale reference so all nucleons are the same visual size
  const PAD   = 3;
  const scale = Math.min((imgW / 2 - PAD) / _he4maxX, (H / 2 - PAD) / _he4maxY);
  const R     = PARTICLE_RADIUS * scale;

  for (const p of def) {
    const jx = imgW / 2 + (p.x - cmx) * scale + (p._jx || 0) * scale;
    const jy = H / 2    + (p.y - cmy) * scale + (p._jy || 0) * scale;
    const isProton = p.type === 'proton';
    const mid  = isProton ? '#ff1a65' : '#70707f';
    const core = isProton ? '#ff80b0' : '#b0b0c4';

    const baseGrad = ic.createRadialGradient(jx, jy, 0, jx, jy, R * 1.1);
    baseGrad.addColorStop(0,    mid);
    baseGrad.addColorStop(0.82, mid);
    baseGrad.addColorStop(1,    'rgba(0,0,0,0)');
    ic.fillStyle = baseGrad;
    ic.beginPath(); ic.arc(jx, jy, R * 1.1, 0, Math.PI * 2); ic.fill();

    const innerGlow = ic.createRadialGradient(jx, jy, 0, jx, jy, R);
    innerGlow.addColorStop(0,   core);
    innerGlow.addColorStop(0.5, core);
    innerGlow.addColorStop(1,   'rgba(0,0,0,0)');
    ic.save();
    ic.shadowColor = core;
    ic.shadowBlur  = 5;
    ic.globalAlpha = 0.82;
    ic.fillStyle   = innerGlow;
    ic.beginPath(); ic.arc(jx, jy, R, 0, Math.PI * 2); ic.fill();
    ic.restore();
    ic.globalAlpha = 1;

    if (isProton) {
      ic.fillStyle    = 'rgba(255,255,255,0.88)';
      ic.font         = `bold ${Math.round(R * 1.1)}px "JetBrains Mono", monospace`;
      ic.textAlign    = 'center';
      ic.textBaseline = 'middle';
      ic.fillText('+', jx, jy + 0.5);
    }
  }

  // Label drawn in the right portion of the canvas
  if (!isSlider && CLUSTER_LABEL[key]) {
    const label = CLUSTER_LABEL[key];
    const fontSize = 17;
    ic.font = `bold ${fontSize}px "JetBrains Mono", monospace`;
    ic.fillStyle    = 'rgba(255,255,255,0.82)';
    ic.textAlign    = 'center';
    ic.textBaseline = 'middle';
    ic.fillText(label, imgW + (W - imgW) / 2, H / 2);
  }
}

function updatePselSelection() {
  // Highlight selected option in dropdowns
  pselIcons.forEach(c => c.classList.toggle('selected',

// Speed lines (grey horizontal lines whose length reflects slider value)
function drawSpeedLines() {
  ['speedLinesL', 'speedLinesR'].forEach(id => {
    const canvas = document.getElementById(id);
    if (!canvas) return;
    const c = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const slider = document.getElementById('v9SpeedSlider');
    const t = (parseFloat(slider.value) - parseFloat(slider.min))
            / (parseFloat(slider.max) - parseFloat(slider.min));
    c.clearRect(0, 0, w, h);
    const maxLen = w - 2;
    const scales = [0.65, 1.0, 0.80];
    const ys     = [h * 0.28, h * 0.5, h * 0.72];
    scales.forEach((scale, i) => {
      const len = (0.18 + 0.82 * t) * maxLen * scale;
      const x = w - len, y = Math.round(ys[i]);
      c.save();
      c.strokeStyle = 'rgba(180,180,210,0.25)';
      c.lineWidth = 4;
      c.beginPath(); c.moveTo(x, y); c.lineTo(w, y); c.stroke();
      c.strokeStyle = 'rgba(210,210,230,0.85)';
      c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(x, y); c.lineTo(w, y); c.stroke();
      c.restore();
    });
  });
}
drawSpeedLines();

(function animateIcons() {
  pselIcons.forEach(c => drawClusterIcon(c));
  requestAnimationFrame(animateIcons);
})();

// ============================================================
//  ANIMATION LOOP
// ============================================================
// v12-style damped random walk jitter — updates _jx/_jy on all live particles
// and on CLUSTER_DEFS entries (for icon canvases). Called every frame.
function updateJitter() {
  // Main canvas particles
  for (const p of particles) {
    if (p.type === 'gamma') continue;
    if (p._jx === undefined) { p._jx = 0; p._jy = 0; }
    p._jx += (Math.random() - 0.5) * 0.7;
    p._jy += (Math.random() - 0.5) * 0.7;
    p._jx *= 0.78;
    p._jy *= 0.78;
  }
  // Icon particles (CLUSTER_DEFS entries shared across all canvases)
  for (const def of Object.values(CLUSTER_DEFS)) {
    for (const p of def) {
      if (p._jx === undefined) { p._jx = 0; p._jy = 0; }
      p._jx += (Math.random() - 0.5) * 0.7;
      p._jy += (Math.random() - 0.5) * 0.7;
      p._jx *= 0.78;
      p._jy *= 0.78;
    }
  }
}

// Always-on jitter loop — redraws when sim is idle so particles never freeze.
// Skips redraw when scrubbing (scrubFrame >= 0) so the historical frame isn't overwritten.
(function idleJitter() {
  updateJitter();
  if (!running) {
    if (scrubFrame >= 0) {
      renderFrame(scrubFrame); // keep showing the scrubbed frame with fresh jitter
    } else {
      draw();
    }
  }
  requestAnimationFrame(idleJitter);
})();

function frameSpeed() { return FRAME_SPEED * (0.1 + (simSpeed - 1) * (1.4 / 9)); }

function loop() {
  if (!running) return;

  if (scrubFrame >= 0) {
    timeLabelEl.textContent = `${scrubFrame + 1} / ${particleHistory.length}`;
    renderFrame(scrubFrame);
    animId = requestAnimationFrame(loop);
    return;
  }

  // ── ESCAPE ANIMATION  (lerp positions + cluster velocities) ───
  if (collisionPhase === 'escapeAnim') {
    escapeAnimFrame++;
    const t    = escapeAnimFrame / ESCAPE_ANIM_FRAMES;
    const ease = t * t * (3 - 2 * t); // smoothstep
    const n    = particles.length;
    const lSz  = leftClusterSize;

    // Lerp positions toward snapped/teleported geometry
    for (let i = 0; i < n; i++) {
      const s   = escapeAnimStartPos[i];
      const tgt = escapeAnimTargetPos[i];
      particles[i].x = s.x + (tgt.x - s.x) * ease;
      particles[i].y = s.y + (tgt.y - s.y) * ease;
    }

    // Lerp velocities — per-particle mode (e.g. T+T 3-body) or cluster mode.
    if (escapeAnimStartVel.perParticle) {
      for (let i = 0; i < n; i++) {
        const sv = escapeAnimStartVel.perParticle[i];
        const tv = escapeAnimTargetVel.perParticle[i];
        particles[i].vx = sv.vx + (tv.vx - sv.vx) * ease;
        particles[i].vy = sv.vy + (tv.vy - sv.vy) * ease;
      }
    } else {
      const sl = escapeAnimStartVel.lv,  tl = escapeAnimTargetVel.lv;
      const sr = escapeAnimStartVel.rv,  tr = escapeAnimTargetVel.rv;
      const lerpLvx = sl.vx + (tl.vx - sl.vx) * ease;
      const lerpLvy = sl.vy + (tl.vy - sl.vy) * ease;
      const lerpRvx = sr.vx + (tr.vx - sr.vx) * ease;
      const lerpRvy = sr.vy + (tr.vy - sr.vy) * ease;
      for (let i = 0;   i < lSz; i++) { particles[i].vx = lerpLvx; particles[i].vy = lerpLvy; }
      for (let i = lSz; i < n;   i++) { particles[i].vx = lerpRvx; particles[i].vy = lerpRvy; }
    }

    updateCamera();
    if (escapeAnimFrame >= ESCAPE_ANIM_FRAMES) {
      // Snap to exact final state
      for (let i = 0; i < n; i++) {
        particles[i].x = escapeAnimTargetPos[i].x;
        particles[i].y = escapeAnimTargetPos[i].y;
      }
      if (escapeAnimTargetVel.perParticle) {
        for (let i = 0; i < n; i++) {
          particles[i].vx = escapeAnimTargetVel.perParticle[i].vx;
          particles[i].vy = escapeAnimTargetVel.perParticle[i].vy;
        }
      } else {
        for (let i = 0;   i < lSz; i++) { particles[i].vx = escapeAnimTargetVel.lv.vx; particles[i].vy = escapeAnimTargetVel.lv.vy; }
        for (let i = lSz; i < n;   i++) { particles[i].vx = escapeAnimTargetVel.rv.vx; particles[i].vy = escapeAnimTargetVel.rv.vy; }
      }
      collisionPhase = 'escape';
    }

  // ── ESCAPE  (coast for nuclear products; physics for Coulomb scatter) ───
  } else if (collisionPhase === 'escape') {
    if (coulombScatterEscape || chargedNuclearEscape) {
      // Run real physics: Coulomb scatter or charged nuclear products (e.g. D+D→T+p)
      step(frameSpeed());
      lockClusterVelocities();
    } else {
      for (const p of particles) {
        p.x += p.vx * frameSpeed();
        p.y += p.vy * frameSpeed();
      }
    }
    updateCamera();

    // Auto-stop when all particles are off-screen
    const zoomScale = 1.5;
    const cx = canvas.width / 2, cy = canvas.height / 2;
    const margin = PARTICLE_RADIUS * zoomScale * 2;
    const allGone = particles.every(p => {
      const sx = cx + (p.x - cameraSiteX) * zoomScale;
      const sy = cy + (p.y - cameraSiteY) * zoomScale;
      return sx < -margin || sx > canvas.width + margin ||
             sy < -margin || sy > canvas.height + margin;
    });
    if (allGone) {
      running = false;
      paused  = false;
      goBtn.textContent = '▶';
      goBtn.classList.remove('running');
      replayBtn.disabled = false;
      draw();
      return;
    }

  // ── COLLISION  (free physics for up to COLLISION_FRAMES) ──────
  } else if (collisionPhase === 'collision') {
    step(frameSpeed());
    collisionFrames++;
    updateCamera();

    // P+P and N+N are single particles: the meaningful collision event
    // is the bounce itself, which happens in a few frames. Don't wait
    // for COLLISION_FRAMES — fire escape as soon as they start separating.
    // (Only applies to Category 1 single-particle pairs.)
    const n2 = particles.length, lSz2 = leftClusterSize;
    let fireEscape = (collisionFrames >= COLLISION_FRAMES);
    if (!fireEscape && isCategory1() && lSz2 === 1 && n2 - lSz2 === 1) {
      const dx = particles[1].x - particles[0].x;
      const dy = particles[1].y - particles[0].y;
      const d  = Math.sqrt(dx * dx + dy * dy);
      if (d > 0.01) {
        const relV = (particles[1].vx - particles[0].vx) * (dx / d) +
                     (particles[1].vy - particles[0].vy) * (dy / d);
        if (relV >= 0) fireEscape = true;
      }
    }

    // ── Cat3 (P+N): scripted jiggle before photon fires ──────────
    const isPN = (leftChoice==='p'&&rightChoice==='n') || (leftChoice==='n'&&rightChoice==='p');
    if (isCategory3() && isPN && !photonCaptureFired) {
      pnJiggleFrame++;
      const cmx  = (particles[0].x + particles[1].x) / 2;
      const cmy  = (particles[0].y + particles[1].y) / 2;
      const cmvx2 = (particles[0].vx + particles[1].vx) / 2;
      const cmvy2 = (particles[0].vy + particles[1].vy) / 2;
      const pIdx = particles[0].type === 'proton' ? 0 : 1;
      const nIdx = 1 - pIdx;
      const minSep = PARTICLE_RADIUS * 2, maxSep = PARTICLE_RADIUS * 2.5;
      const midSep = (minSep + maxSep) / 2;
      const amp    = (maxSep - minSep) / 2;
      const halfSep = (midSep + amp * Math.sin(pnJiggleFrame * 1.8)) / 2;
      const ax = Math.SQRT1_2, ay = Math.SQRT1_2;
      particles[pIdx].x = cmx - ax * halfSep;  particles[pIdx].y = cmy - ay * halfSep;
      particles[nIdx].x = cmx + ax * halfSep;  particles[nIdx].y = cmy + ay * halfSep;
      particles[0].vx = cmvx2; particles[0].vy = cmvy2;
      particles[1].vx = cmvx2; particles[1].vy = cmvy2;
      if (pnJiggleFrame >= PN_JIGGLE_FRAMES) {
        firePhotonCapture();
        collisionPhase  = 'escape';
        escapeStartFrame = particleHistory.length;
        // Switch display KE to keOut (nucleus keeps ~initialKE; gamma carries the rest)
        const pnEscEntry = getComboEntry();
        const pnScale    = speedScale();
        collisionDisplayKE = pnEscEntry ? pnEscEntry.keOut * pnScale : initialKE;
        // EIE stays frozen — single charged product, no inter-cluster Coulomb drop
      }
    } else if (fireEscape) {
      escapeStartFrame = particleHistory.length;
      const escEntry = getComboEntry();
      const escScale = speedScale();
      if (isCategory1()) {
        fireCategory1Escape(); escapeAnimFrame = 0; collisionPhase = 'escapeAnim';
        collisionDisplayKE = escEntry ? escEntry.keOut * escScale : initialKE;
        // EIE stays frozen — N is neutral, no inter-cluster Coulomb
      } else if (isCategory2()) {
        fireCategory2Escape(); escapeAnimFrame = 0; collisionPhase = 'escapeAnim';
        if (collisionDisplayEIE === null) {
          // D+D→T+p: both products charged — let physics show Coulomb-driven KE rise
          collisionDisplayKE = null;
        } else {
          collisionDisplayKE = escEntry ? escEntry.keOut * escScale : collisionPeakKE * 0.88;
        }
      } else if (isCategory3()) {
        if (!photonCaptureFired) firePhotonCapture();
        collisionPhase = 'escape';
        collisionDisplayKE = escEntry ? escEntry.keOut * escScale : initialKE;
        // EIE stays frozen — single charged product
      }
    }

  // ── APPROACH  (rigid-cluster) ─────────────────────────────────
  } else {
    step(frameSpeed());
    lockClusterVelocities();
    const { lcx, lcy, rcx, rcy } = updateCamera();

    // Enter collision the instant any cross-cluster particle pair reaches
    // strong-force range — this is when the collision actually happens,
    // not after the clusters have already reversed direction.
    if (!isCoulombOnly() && crossClusterContact()) {
      collisionPhase      = 'collision';
      collisionFrames     = 0;
      collisionStartFrame = particleHistory.length;
      const isPN2 = (leftChoice==='p'&&rightChoice==='n') || (leftChoice==='n'&&rightChoice==='p');
      if (isPN2) { pnBound = true; pnJiggleFrame = 0; }
      const colE    = computeEnergy();
      const colEntry = getComboEntry();
      const scale    = speedScale();
      collisionDisplayKE  = colEntry ? colEntry.immediateKE * scale
                                     : Math.max(initialKE, colE.ke);
      collisionPeakKE     = collisionDisplayKE;
      collisionDisplayEIE = colE.eie;
    } else {
      // No nuclear contact yet — check for Coulomb scatter reversal
      const cdx = rcx - lcx, cdy = rcy - lcy;
      const cdist = Math.sqrt(cdx * cdx + cdy * cdy);
      if (cdist > 0.01) {
        const n = particles.length, lSize = leftClusterSize, rSize = n - lSize;
        let lvx = 0, lvy = 0, rvx = 0, rvy = 0;
        for (let i = 0;     i < lSize; i++) { lvx += particles[i].vx; lvy += particles[i].vy; }
        for (let i = lSize; i < n;     i++) { rvx += particles[i].vx; rvy += particles[i].vy; }
        lvx /= lSize;  lvy /= lSize;
        rvx /= rSize;  rvy /= rSize;
        const relV = (rvx - lvx) * (cdx / cdist) + (rvy - lvy) * (cdy / cdist);
        if (relV >= 0) {
          coulombScatterEscape = true;
          if (cdist > strongCutoff() * 2.5 && relV > approachSpeed * 0.5) {
            collisionPhase      = 'escape';
            collisionStartFrame = particleHistory.length;
            escapeStartFrame    = particleHistory.length;
          }
        }
      }
    }
  }

  // ── Advance photon every live frame ──────────────────────────
  if (photon) {
    photon.x += photon.vx;
    photon.y += photon.vy;
    photon.age++;
    if (photon.age > photon.maxAge) photon = null;
  }

  // ── Auto-stop for photon-capture reactions ────────────────────
  if (collisionPhase === 'escape' && photonCaptureFired && !photon) {
    photonEscapeFrames++;
    if (photonEscapeFrames > 90) {
      running = false;
      paused  = false;
      goBtn.textContent = '▶';
      goBtn.classList.remove('running');
      replayBtn.disabled = false;
      draw();
      return;
    }
  }

  // ── Record history ─────────────────────────────────────────
  particleHistory.push({
    p: particles.map(p => ({ ...p })),
    collisionPhase,
    collisionFrames,
    collisionDisplayKE,
    collisionDisplayEIE,
    gammaCarriedEnergy,
    photon: photon ? { ...photon } : null,
    camX: cameraSiteX, camY: cameraSiteY,
    edisp: getDisplayEnergy(),
  });
  if (particleHistory.length > MAX_HISTORY) particleHistory.shift();

  timeSlider.disabled = false;
  // Only update slider range if we're not zoomed in
  if (graphZoomEnd === null) {
    timeSlider.max   = particleHistory.length - 1;
    timeSlider.value = timeSlider.max;
  }
  timeLabelEl.textContent = `${particleHistory.length}`;
  updatePhaseTimeline();

  draw();
  animId = requestAnimationFrame(loop);
}

// ============================================================
//  INITIAL RENDER
// ============================================================
applyComboSieOffset();  // seed SIE offset box from table for initial combo
setupScenario();
draw();
</script>
