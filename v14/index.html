<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuclear Fusion — v14</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ── Variables ─────────────────────────────────────────────────────────── */
  :root {
    --accent1:      #ff2d78;
    --accent1-dim:  rgba(255,45,120,0.22);
    --accent1-glow: rgba(255,45,120,0.55);
    --accent2:      #1a6eff;
    --accent2-dim:  rgba(26,110,255,0.18);
    --accent2-glow: rgba(26,110,255,0.45);
    --ui-bg:        rgba(8,6,24,0.72);
    --ui-border:    rgba(255,255,255,0.07);
    --text-dim:     rgba(220,215,255,0.55);
    --text-bright:  rgba(240,235,255,0.92);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #05040f;
    color: var(--text-bright);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  button, input, select { font-family: 'JetBrains Mono', monospace; }

  /* ── Toolbar ───────────────────────────────────────────────────────────── */
  #toolbar {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 20px 12px;
    background: var(--ui-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--ui-border);
    box-shadow: 0 4px 24px rgba(0,0,0,0.55);
    z-index: 10;
    flex-shrink: 0;
  }

  #toolbar h1 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent1);
    text-shadow: 0 0 8px var(--accent1-glow), 0 0 20px var(--accent1-dim);
    margin-right: 4px;
    white-space: nowrap;
  }

  /* ── Buttons ───────────────────────────────────────────────────────────── */
  .btn {
    padding: 4px 14px;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
    color: rgba(255,255,255,0.18);
    box-shadow: none;
    text-shadow: none;
    white-space: nowrap;
    font-family: inherit;
  }
  .btn:hover { color: rgba(255,255,255,0.38); border-color: rgba(255,255,255,0.12); }

  /* ▶ idle + Clear — neon green */
  #goBtn, #clearBtn {
    border-color: #00d060;
    color: rgba(255,255,255,0.5);
    background: rgba(0,208,96,0.12);
    box-shadow:
      inset 0 0 6px rgba(0,208,96,0.18),
      0 0 2px #00d060, 0 0 8px #00d060,
      0 0 18px rgba(0,208,96,0.5), 0 0 40px rgba(0,208,96,0.2), 0 0 70px rgba(0,208,96,0.1);
    text-shadow:
      0 0 4px rgba(255,255,255,0.5), 0 0 10px #00d060,
      0 0 22px rgba(0,208,96,0.6), 0 0 44px rgba(0,208,96,0.2);
  }
  #goBtn:hover, #clearBtn:hover { background: rgba(0,208,96,0.28); }

  /* ⏸ running — red */
  #goBtn.running {
    border-color: #ff4040; color: rgba(255,255,255,0.5); background: rgba(255,40,40,0.15);
    box-shadow:
      inset 0 0 6px rgba(255,40,40,0.2),
      0 0 2px #ff4040, 0 0 8px #ff4040,
      0 0 18px rgba(255,40,40,0.5), 0 0 40px rgba(255,40,40,0.2);
    text-shadow: 0 0 4px rgba(255,255,255,0.5), 0 0 10px #ff4040, 0 0 22px rgba(255,80,80,0.6);
  }
  #goBtn.running:hover { background: rgba(255,40,40,0.3); }

  #goBtn, #replayBtn { font-size: 28px; letter-spacing: 0; padding: 2px 18px; }
  #clearBtn { font-size: 11px; padding: 4px 14px; width: 100%; }

  /* ↺ replay — red */
  #replayBtn {
    border-color: #ff4040;
    color: rgba(255,255,255,0.5);
    background: rgba(255,40,40,0.15);
    box-shadow:
      inset 0 0 6px rgba(255,40,40,0.2),
      0 0 2px #ff4040, 0 0 8px #ff4040,
      0 0 18px rgba(255,40,40,0.5), 0 0 40px rgba(255,40,40,0.2);
    text-shadow: 0 0 4px rgba(255,255,255,0.5), 0 0 10px #ff4040, 0 0 22px rgba(255,80,80,0.6);
  }
  #replayBtn:hover { background: rgba(255,40,40,0.3); }
  #replayBtn:disabled {
    border-color: rgba(255,255,255,0.06); color: rgba(255,255,255,0.12);
    background: transparent; box-shadow: none; text-shadow: none; cursor: not-allowed;
  }

  /* ── Tab-style title label (matches v11 tab styling) ─────────────────────── */
  .tab-btn {
    padding: 4px 14px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    color: rgba(255,255,255,0.18);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: default;
    white-space: nowrap;
    transition: all 0.2s;
    box-shadow: none;
    text-shadow: none;
    font-family: inherit;
  }
  .tab-btn.active {
    color: #e8e4ff;
    border-color: #7b6fff;
    background: rgba(123,111,255,0.12);
    box-shadow:
      inset 0 0 6px rgba(123,111,255,0.15),
      0 0 2px #7b6fff, 0 0 8px #7b6fff,
      0 0 18px rgba(123,111,255,0.5),
      0 0 40px rgba(123,111,255,0.2),
      0 0 70px rgba(123,111,255,0.1);
    text-shadow:
      0 0 4px #e8e4ff,
      0 0 10px #7b6fff,
      0 0 22px rgba(123,111,255,0.5),
      0 0 44px rgba(123,111,255,0.2);
  }

  /* ── Particle selector ─────────────────────────────────────────────────────── */
  .ctrl-box-pink {
    display: flex;
    flex-direction: column;
    align-self: stretch;
    gap: 7px;
    background: rgba(255,45,120,0.07);
    border: 1px solid rgba(255,45,120,0.22);
    border-radius: 12px;
    padding: 10px 18px;
    min-width: 260px;
  }
  .ctrl-box-blue {
    display: flex;
    flex-direction: column;
    align-self: stretch;
    gap: 10px;
    background: rgba(26,110,255,0.07);
    border: 1px solid rgba(26,110,255,0.22);
    border-radius: 12px;
    padding: 10px 16px;
  }
  .ctrl-box-blue input[type="range"] { width: 140px; }
  .ctrl-box-blue .toggle-label { font-size: 12px; gap: 6px; }
  .slider-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; flex-shrink: 0;
    user-select: none;
    filter:
      brightness(0) invert(1)
      blur(0.75px)
      opacity(0.7)
      drop-shadow(0 0 5px var(--accent2))
      drop-shadow(0 0 14px var(--accent2))
      drop-shadow(0 0 28px var(--accent2-glow))
      drop-shadow(0 0 50px var(--accent2-glow))
      drop-shadow(0 0 80px var(--accent2-glow));
  }
  .slider-icon { font-size: 22px; }

  .pwheel {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .pwheel-trigger {
    border: 1px solid rgba(255,45,120,0.40);
    background: rgba(255,45,120,0.10);
    box-shadow: 0 0 8px rgba(255,45,120,0.18);
  }
  .pwheel-drop {
    position: absolute;
    top: calc(100% + 5px);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 5px;
    background: rgba(8,6,24,0.97);
    border: 1px solid rgba(255,45,120,0.28);
    border-radius: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s, transform 0.15s;
    transform: translateX(-50%) translateY(-4px);
    z-index: 100;
  }
  .pwheel.open .pwheel-drop {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  .psel-icon {
    cursor: pointer;
    border-radius: 7px;
    border: 1px solid transparent;
    background: transparent;
    display: block;
    transition: border-color 0.1s, background 0.1s;
  }
  .psel-icon:hover { border-color: rgba(255,45,120,0.35); background: rgba(255,45,120,0.08); }
  .pslider-icon, .pslider-icon:hover { border-color: transparent !important; background: transparent !important; box-shadow: none !important; border-radius: 0; }
  .psel-icon.selected {
    border-color: rgba(255,45,120,0.65);
    background: rgba(255,45,120,0.15);
  }

  #fullTimelineBtn {
    padding: 4px 12px;
    border: 1px solid var(--accent2);
    border-radius: 8px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    background: var(--accent2-dim);
    color: rgba(255,255,255,0.5);
    font-family: inherit;
    box-shadow:
      inset 0 0 6px var(--accent2-dim),
      0 0 2px var(--accent2), 0 0 8px var(--accent2),
      0 0 18px var(--accent2-glow), 0 0 40px var(--accent2-dim);
    text-shadow: 0 0 4px rgba(255,255,255,0.5), 0 0 10px var(--accent2);
    transition: all 0.2s;
  }
  #fullTimelineBtn:hover { background: var(--accent2-glow); }

  /* ── Selects ───────────────────────────────────────────────────────────── */
  select {
    background: rgba(10,8,30,0.8);
    color: var(--text-bright);
    border: 1px solid rgba(26,110,255,0.35);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 0 6px var(--accent2-dim);
    outline: none;
  }
  select:focus { border-color: var(--accent2); box-shadow: 0 0 8px var(--accent2-glow); }

  /* ── Sliders ───────────────────────────────────────────────────────────── */
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    height: 4px;
    border-radius: 3px;
    background: rgba(255,255,255,0.10);
    box-shadow: 0 0 4px var(--accent2), 0 0 12px var(--accent2-glow), 0 0 28px var(--accent2-dim);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 24px;
    border-radius: 3px;
    background: var(--accent2);
    border: none;
    box-shadow: 0 0 3px var(--accent2), 0 0 10px var(--accent2-glow), 0 0 24px var(--accent2-dim);
    cursor: grab; transition: box-shadow 0.15s;
  }
  input[type="range"]::-webkit-slider-thumb:active { cursor: grabbing; }
  input[type="range"]::-moz-range-thumb {
    width: 10px; height: 24px; border-radius: 3px;
    background: var(--accent2); border: none;
    box-shadow: 0 0 3px var(--accent2), 0 0 10px var(--accent2-glow);
    cursor: grab;
  }
  input[type="range"]:disabled { opacity: 0.25; cursor: not-allowed; }

  /* ── Toggle / label ────────────────────────────────────────────────────── */
  .toggle-label {
    font-size: 10px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }
  .toggle-label input[type="checkbox"] { accent-color: var(--accent1); }

  .slider-group {
    display: flex; align-items: center; gap: 6px;
  }
  .slider-group label {
    font-size: 10px; color: var(--text-dim); white-space: nowrap; letter-spacing: 0.5px;
  }
  .slider-group label span {
    display: inline-block; min-width: 3em; text-align: right;
    color: var(--accent2); text-shadow: 0 0 5px var(--accent2-glow);
  }
  .slider-group input[type="range"] { width: 72px; }

  /* ── Canvas wrap ───────────────────────────────────────────────────────── */
  #canvasWrap {
    flex: 1;
    position: relative;
    min-height: 0;
    overflow: hidden;
    background: #05040f;
  }
  #canvas { display: block; cursor: default; }

  /* ── Scrub bar ─────────────────────────────────────────────────────────── */
  #scrubBar {
    background: rgba(6,4,20,0.95);
    border-top: 3px solid rgba(100,120,180,0.55);
    display: flex;
    flex-direction: row;
    flex-shrink: 0;
  }

  #scrubLeft {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    padding-bottom: 4px; gap: 0;
  }

  #energyGraph {
    display: block; width: 100%; height: 150px;
    border-bottom: 1px solid var(--ui-border);
    cursor: crosshair;
  }

  #phaseTimeline {
    display: flex; align-items: stretch;
    height: 18px; margin: 0;
    border-radius: 0; overflow: hidden; gap: 0;
  }
  #phaseTimeline .phase-seg {
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
    overflow: hidden; white-space: nowrap; min-width: 0; transition: flex 0.1s;
  }

  #timeSlider { display: block; width: 100%; margin: 0; padding: 0; box-sizing: border-box; }

  #scrubRight {
    width: 280px; flex-shrink: 0;
    border-left: 1px solid var(--ui-border);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    padding: 12px;
  }

  /* ── Portrait overlay ──────────────────────────────────────────────────── */
  #portrait-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 9999;
    background: #05040f; color: var(--text-bright);
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 2rem;
  }
  #portrait-overlay .rotate-icon { font-size: 64px; margin-bottom: 1.5rem; }
  #portrait-overlay h2 {
    font-size: 18px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    color: var(--accent1); text-shadow: 0 0 10px var(--accent1-glow);
    margin-bottom: 0.75rem;
  }
  #portrait-overlay p { font-size: 14px; color: var(--text-dim); max-width: 280px; }

  @media (max-width: 860px) and (orientation: portrait) {
    #portrait-overlay { display: flex; }
    body > *:not(#portrait-overlay) { display: none !important; }
  }
</style>
</head>
<body>

<div id="portrait-overlay">
  <div class="rotate-icon">&#x1F4F1;&#x21BB;</div>
  <h2>Rotate Your Device</h2>
  <p>Go horizontal to use this app</p>
</div>

<div id="toolbar">
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;">
    <button class="tab-btn active" id="fusionTabBtn" style="cursor:pointer" onclick="switchTab('fusion')">FUSION</button>
    <button class="tab-btn" id="tempTabBtn" style="cursor:pointer" onclick="switchTab('temp')">TEMPERATURE</button>
  </div>
  <div style="display:flex;align-items:stretch;gap:12px;">
  <div style="display:flex;flex-direction:column;justify-content:flex-end;align-self:stretch;gap:6px;padding-bottom:10px;margin-right:4px;">
    <button class="btn" id="goBtn">&#9654;</button>
    <button class="btn" id="replayBtn" disabled>&#8634;</button>
    <button class="btn" id="clearBtn">Clear</button>
  </div>

  <div id="fusionControls" style="display:none;align-items:stretch;gap:12px;">
  <div class="ctrl-box-pink">
    <div style="display:flex;gap:40px;justify-content:center;">
      <!-- Left particle wheel -->
      <div class="pwheel" id="leftWheel">
        <canvas class="pwheel-trigger psel-icon" data-side="left" data-key="d" width="130" height="77"></canvas>
        <div class="pwheel-drop">
          <canvas class="psel-icon" data-side="left" data-key="d"  width="130" height="77"></canvas>
          <canvas class="psel-icon" data-side="left" data-key="t"  width="130" height="77"></canvas>
          <canvas class="psel-icon" data-side="left" data-key="he" width="130" height="77"></canvas>
        </div>
      </div>
      <!-- Right particle wheel -->
      <div class="pwheel" id="rightWheel">
        <canvas class="pwheel-trigger psel-icon" data-side="right" data-key="t" width="130" height="77"></canvas>
        <div class="pwheel-drop">
          <canvas class="psel-icon" data-side="right" data-key="d"  width="130" height="77"></canvas>
          <canvas class="psel-icon" data-side="right" data-key="t"  width="130" height="77"></canvas>
          <canvas class="psel-icon" data-side="right" data-key="he" width="130" height="77"></canvas>
        </div>
      </div>
    </div>
    <!-- Speed slider: speedLines | leftParticle | slider | rightParticle | speedLines -->
    <div style="display:flex;align-items:center;gap:0;">
      <canvas id="speedLinesL" width="36" height="36" style="display:block;flex-shrink:0;image-rendering:pixelated;margin-right:-11px;"></canvas>
      <canvas class="psel-icon pslider-icon" data-side="left"  width="44" height="36" style="margin-right:5px;"></canvas>
      <div style="flex:1;min-width:80px;display:flex;flex-direction:column;align-items:stretch;gap:1px;">
        <input type="range" id="v9SpeedSlider" min="0.1" max="2.1" step="0.05" value="1.05" style="width:100%;">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-dim);padding:0 2px;margin-top:8px;">
          <span>Slower</span>
          <span id="speedKeV" style="font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--accent2);margin-top:5px;"></span>
          <span>Faster</span>
        </div>
      </div>
      <canvas class="psel-icon pslider-icon" data-side="right" width="44" height="36" style="margin-left:5px;"></canvas>
      <canvas id="speedLinesR" width="36" height="36" style="display:block;flex-shrink:0;image-rendering:pixelated;transform:scaleX(-1);margin-left:-11px;"></canvas>
    </div>
  </div>

  <div class="ctrl-box-blue">
    <div style="display:flex;align-items:center;gap:6px;width:100%;">
      <span class="slider-icon" title="Slow">🐢</span>
      <input type="range" id="simSpeedSlider" min="1" max="10" step="1" value="7" style="flex:1;">
      <span class="slider-icon" title="Fast">🐇</span>
    </div>
  </div>

<div style="padding:6px 10px 8px;border-top:1px solid rgba(255,255,255,0.08);">
  <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);margin-bottom:5px;">Development Values</div>
  <label style="font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:6px;">SIE offset: <input type="number" id="sieOffsetInput" value="0" step="1" style="width:56px;background:rgba(10,8,30,0.8);color:var(--accent2);border:1px solid rgba(26,110,255,0.35);border-radius:6px;padding:2px 4px;font-size:11px;font-family:inherit;outline:none;"></label>
  <label class="toggle-label" style="margin-top:4px;"><input type="checkbox" id="scaledEnergyToggle"> Scale</label>
</div>
  </div><!-- /fusionControls -->

  <!-- Temperature tab controls -->
  <div id="tempControls" style="display:flex;align-items:stretch;gap:12px;">
    <div class="ctrl-box-pink">
      <div style="font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px;">Temperature</div>
      <div style="display:flex;align-items:center;gap:6px;">
        <canvas id="tempProtonL" width="52" height="36" style="display:block;flex-shrink:0;image-rendering:pixelated;"></canvas>
        <input type="range" id="tempSlider" min="0" max="100" value="40" style="flex:1;min-width:80px;">
        <canvas id="tempProtonR" width="52" height="36" style="display:block;flex-shrink:0;image-rendering:pixelated;"></canvas>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-dim);padding:0 2px;">
        <span>Cool</span><span>Hot</span>
      </div>
    </div>
    <div class="ctrl-box-blue" style="align-items:flex-start;gap:8px;min-width:180px;">
      <div style="font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.1em;">Forces</div>
      <button id="showForceBtn" class="btn" style="font-size:13px;padding:14px;width:100%;background:#1a6eff;color:#fff;border-color:#1a6eff;box-shadow:0 0 12px rgba(26,110,255,0.7);">Show Total Force</button>
      <div style="display:flex;align-items:center;gap:4px;width:100%;margin-top:4px;">
        <span class="slider-icon" title="Slow">🐢</span>
        <input type="range" id="tempSpeedSlider" min="1" max="10" step="1" value="10" style="flex:1;">
        <span class="slider-icon" title="Fast">🐇</span>
      </div>
      <div style="display:none;">
        <input type="range" id="tempCoulombSlider" min="1" max="100" step="1" value="25">
        <span id="tempCoulombVal"></span>
      </div>
    </div>
  </div>

  </div><!-- close flex row -->
</div>


<div id="canvasWrap">
  <canvas id="canvas"></canvas>
</div>

<div id="scrubBar" style="display:none">
  <div id="scrubLeft">
    <div id="energyGraphLabels" style="display:flex;gap:24px;padding:4px 10px 3px;font-size:18px;font-weight:bold;font-family:'JetBrains Mono',monospace;">
      <span style="color:#ff3a6e;text-shadow:0 0 10px rgba(255,45,100,0.9);">Energy of Motion</span>
      <span style="color:#7b6fff;text-shadow:0 0 10px rgba(120,100,255,0.9);">Energy in Fields</span>
    </div>
    <canvas id="energyGraph" height="150"></canvas>
    <div id="phaseTimeline" style="display:flex;">
      <div class="phase-seg" id="phaseSeg-approach" style="background:rgba(255,255,255,0.05);color:var(--text-dim);flex:1;font-size:0px;">Before</div>
      <div class="phase-seg" id="phaseSeg-collision" style="background:rgba(255,45,120,0.18);color:var(--accent1);display:none;">During</div>
