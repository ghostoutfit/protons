<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D+T Fusion — v7</title>
<style>
  /* ========================================
     RESET & BASE STYLES
     ======================================== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a1a;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ========================================
     TOOLBAR — minimal: title + Go + Replay
     ======================================== */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: #12122a;
    border-bottom: 1px solid #2a2a4a;
    z-index: 10;
  }

  #toolbar h1 {
    font-size: 18px;
    font-weight: 600;
    color: #ff6b6b;
    margin-right: 8px;
    white-space: nowrap;
  }

  .btn {
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }

  #goBtn {
    background: #22c55e;
    color: #fff;
  }
  #goBtn:hover { background: #16a34a; }
  #goBtn.running {
    background: #ef4444;
  }
  #goBtn.running:hover { background: #dc2626; }

  #replayBtn {
    background: #0e7490;
    color: #fff;
  }
  #replayBtn:hover { background: #0891b2; }
  #replayBtn:disabled {
    background: #1e293b;
    color: #4b5563;
    cursor: not-allowed;
  }

  /* ========================================
     TOGGLE CONTROLS
     ======================================== */
  .toggle-label {
    font-size: 13px;
    color: #9ca3af;
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    white-space: nowrap;
  }

  .toggle-label input[type="checkbox"] {
    accent-color: #f59e0b;
  }

  /* ========================================
     CANVAS WRAPPER + OVERLAYS
     ======================================== */
  #canvasWrap {
    flex: 1;
    position: relative;
    min-height: 0;
    overflow: hidden;
  }

  #canvas {
    display: block;
    cursor: default;
  }

  #barYSliderWrap {
    position: absolute;
    right: 313px;   /* centered on the bar chart's left y-axis edge (320px from right) */
    top: 8px;
    bottom: 52px;
    width: 16px;
    display: flex;
    align-items: center;
  }

  #barYRangeSlider {
    writing-mode: vertical-lr;
    direction: rtl;   /* max at top, min at bottom */
    flex: 1;
    width: 12px;
    accent-color: #6366f1;
    cursor: pointer;
    opacity: 0.7;
  }
  #barYRangeSlider:hover { opacity: 1; }

  #barBottomControls {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 320px;
    height: 30px;
    background: rgba(10,10,26,0.9);
    border-top: 1px solid #2a2a4a;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }

  /* ========================================
     TIME SCRUBBER BAR
     ======================================== */
  #scrubBar {
    height: 56px;
    background: #0e0e22;
    border-top: 1px solid #2a2a4a;
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 14px;
    flex-shrink: 0;
  }
  #scrubBar .scrub-label {
    font-size: 12px;
    color: #6b7280;
    white-space: nowrap;
  }
  #scrubBar .scrub-time {
    font-size: 12px;
    color: #6b7280;
    white-space: nowrap;
    min-width: 7em;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  #timeSlider {
    flex: 1;
    height: 10px;
    accent-color: #6366f1;
    cursor: pointer;
  }
  #timeSlider:disabled {
    opacity: 0.25;
    cursor: not-allowed;
  }

  /* ========================================
     PORTRAIT ORIENTATION OVERLAY (mobile)
     ======================================== */
  #portrait-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #0a0a1a;
    color: #e0e0e0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }

  #portrait-overlay .rotate-icon { font-size: 64px; margin-bottom: 1.5rem; }
  #portrait-overlay h2 { font-size: 22px; font-weight: 600; color: #ff6b6b; margin-bottom: 0.75rem; }
  #portrait-overlay p { font-size: 16px; color: #9ca3af; max-width: 280px; }

  @media (max-width: 860px) and (orientation: portrait) {
    #portrait-overlay { display: flex; }
    body > *:not(#portrait-overlay) { display: none !important; }
  }
</style>
</head>
<body>

<!-- Portrait overlay (mobile) -->
<div id="portrait-overlay">
  <div class="rotate-icon">&#x1F4F1;&#x21BB;</div>
  <h2>Rotate Your Device</h2>
  <p>Go horizontal to use this app</p>
</div>

<!-- Toolbar: just title + Go + Replay -->
<div id="toolbar">
  <h1>Fusion</h1>
  <button class="btn" id="goBtn">Go</button>
  <button class="btn" id="replayBtn" disabled>Replay</button>
  <!-- Left / Right nucleus selectors -->
  <label class="toggle-label" style="gap:6px;">
    Left:
    <select id="leftChoice" style="background:#1a1a3a;color:#e0e0e0;border:1px solid #3a3a5a;border-radius:4px;padding:2px 8px;font-size:12px;cursor:pointer;">
      <option value="p" selected>Proton</option>
      <option value="n">Neutron</option>
      <option value="d">Deuterium (p+n)</option>
      <option value="t">Tritium (p+2n)</option>
      <option value="he">Helium-4 (2p+2n)</option>
    </select>
  </label>
  <label class="toggle-label" style="gap:6px;">
    Right:
    <select id="rightChoice" style="background:#1a1a3a;color:#e0e0e0;border:1px solid #3a3a5a;border-radius:4px;padding:2px 8px;font-size:12px;cursor:pointer;">
      <option value="p" selected>Proton</option>
      <option value="n">Neutron</option>
      <option value="d">Deuterium (p+n)</option>
      <option value="t">Tritium (p+2n)</option>
      <option value="he">Helium-4 (2p+2n)</option>
    </select>
  </label>
  <!-- Field heatmap toggle -->
  <label class="toggle-label" style="gap:6px;">
    <input type="checkbox" id="fieldToggle" checked style="accent-color:#7dd3fc;">
    <span style="color:#7dd3fc;font-size:12px;">Field</span>
  </label>
  <!-- Strong offset slider -->
  <label class="toggle-label" style="gap:6px;">
    <span style="color:#fb923c;font-size:12px;">SIE offset: <span id="sieOffsetVal">0</span></span>
    <input type="range" id="sieOffsetSlider" min="0" max="1000" step="1" value="0" style="width:80px;accent-color:#fb923c;">
  </label>
  <!-- Range + Speed sliders stacked -->
  <div style="display:flex;flex-direction:column;gap:4px;">
    <label class="toggle-label" style="gap:6px;">
      Strong range: <span id="v4RangeVal">2.0</span>x
      <input type="range" id="v4RangeSlider" min="1.0" max="3.0" step="0.05" value="2.0" style="width:72px;accent-color:#6366f1;">
    </label>
    <label class="toggle-label" style="gap:6px;">
      Speed: <span id="v4SpeedVal">2.00</span>
      <input type="range" id="v4SpeedSlider" min="0.1" max="2.0" step="0.05" value="2.0" style="width:72px;accent-color:#6366f1;">
    </label>
  </div>
</div>

<div id="canvasWrap">
  <canvas id="canvas"></canvas>

  <!-- Vertical Y-range slider along bar chart y-axis -->
  <div id="barYSliderWrap">
    <input type="range" id="barYRangeSlider" min="10" max="500" step="10" value="50">
  </div>

  <!-- Controls below the bars -->
  <div id="barBottomControls">
    <label style="display:flex;align-items:center;gap:5px;font-size:11px;color:#9ca3af;cursor:pointer;">
      <input type="checkbox" id="splitIEToggle" checked style="accent-color:#fb923c;">
      Split IE → <span style="color:#818cf8">EIE</span>&nbsp;+&nbsp;<span style="color:#fb923c">SIE</span>
    </label>
  </div>
</div>

<!-- Time scrubber — drag to move forward/backward through the interaction -->
<div id="scrubBar">
  <span class="scrub-label">Time</span>
  <input type="range" id="timeSlider" min="0" max="0" value="0" disabled>
  <span class="scrub-time" id="timeLabel">–</span>
</div>

<script>
// ============================================================
//  DOM REFERENCES
// ============================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const goBtn = document.getElementById('goBtn');
const replayBtn = document.getElementById('replayBtn');

const timeSlider = document.getElementById('timeSlider');
const timeLabelEl = document.getElementById('timeLabel');

// ============================================================
//  PHYSICS CONSTANTS (same model as dev/v3)
// ============================================================
const PARTICLE_RADIUS = 10;
const SUBSTEPS = 20;

// Fixed physics parameters
const coulombStrength = 150;
const strongForceStrength = 4;    // gentle pull — slow visible acceleration across the well
let strongForceRange = 2.0;        // cutoff = PARTICLE_RADIUS * 2 * strongForceRange (40px at 2x)
let approachSpeed = 2.0;           // px per internal dt unit — initial inward velocity of each particle
const equilibriumRatio = 0.35;    // equilibrium ≈ 35% of cutoff, clamped to touching distance
const damping = 1.00;              // velocity damping per frame — lets bound pair settle

// ============================================================
//  STATE
// ============================================================
let particles = [];       // Array of { x, y, vx, vy, type }
let running = false;
let animId = null;
const speed = 1.5;        // dt per frame

// ============================================================
//  HISTORY & SCRUBBER
// ============================================================
const MAX_HISTORY = 4000;
let particleHistory = [];  // Each entry: { p: [{x,y,vx,vy,type},...], t: now }
let scrubFrame = -1;       // -1 = live, >=0 = paused at a historical frame

let hasCollided = false;           // True once D and T clusters first make cross-cluster contact
let collisionFrame = -1;          // particleHistory index when collision first occurred
let collisionTime = -1;           // performance.now() when collision occurred
let fusionFired = false;          // True once fireFusion() has been called
let framesSinceCollision = 0;    // Counts up after hasCollided; KE check waits 80 frames
let fusionAnimating = false;      // True while playing the He-4 rearrangement animation
let fusionAnimFrame = 0;          // Current frame of the rearrangement animation
const FUSION_ANIM_FRAMES = 5;    // Frames to lerp into He-4 geometry
let fusionStartPos = null;        // Particle positions at start of rearrangement animation
let fusionTargets = null;         // Target positions/velocities for the rearrangement


// ============================================================
//  NUCLEUS SELECTOR — cluster definitions and state
// ============================================================
const CLUSTER_DEFS = {
  'p':  [{ type:'proton',  x:0,   y:0   }],
  'n':  [{ type:'neutron', x:0,   y:0   }],
  'd':  [{ type:'proton',  x:-9,  y:-5  }, { type:'neutron', x:9,   y:5   }],
  't':  [{ type:'proton',  x:-9,  y:-5  }, { type:'neutron', x:9,   y:5   }, { type:'neutron', x:9,   y:-15 }],
  'he': [{ type:'proton',  x:-13, y:-8  }, { type:'neutron', x:8,   y:-13 }, { type:'proton',  x:13,  y:8   }, { type:'neutron', x:-8,  y:13  }],
};

let leftChoice = 'p';
let rightChoice = 'p';
let leftClusterSize = 2;  // set in setupScenario; used for cross-cluster collision detection

// ============================================================
//  HEATMAP STATE
// ============================================================
let showField = true;              // Toggle both EIE and SIE heatmaps
let barYRange = 50;                // Y-axis max for bar chart
let splitIE = true;               // When true, show EIE and SIE as separate bars
let sieOffset = 0;                // Display offset added to SIE bar value

// ============================================================
//  COLLISION PHASE STATE  (all collision types)
//  approach → hit → escape   (combined removed per user request)
// ============================================================
let collisionPhase = 'approach'; // 'approach' | 'hit' | 'escape'
let hitFrames = 0;               // frames since collision detected
let ppInitialKE = 0;             // p+p only: total KE at sim start
let ppInitialSep = 310;          // p+p only: initial proton-proton separation (px)
let elasticInitialKE = 0;        // n+n / n+He / n+T: total CM-frame KE at sim start
const HIT_FRAMES = 15;           // frames to label "Collision"

// Combos that scatter elastically (same products in, same KE out, can scatter angle)
function isElasticScatter() {
  const l = leftChoice, r = rightChoice;
  return (l === 'n' && (r === 'd' || r === 'he' || r === 't')) ||
         (r === 'n' && (l === 'd' || l === 'he' || l === 't'));
}

// Offscreen canvas for heatmap rendering (half resolution)
const hmCanvas = document.createElement('canvas');
const hmCtx = hmCanvas.getContext('2d');

// ============================================================
//  INITIAL CONDITIONS
//  Two neutrons placed 300px apart horizontally, centered on
//  the canvas, with inward velocities aimed at each other.
//
//  Strong force cutoff = 30px, equilibrium ~20px.
//  Approach speed of 0.5 px/dt gives a visually pleasant pace:
//  fast enough that the approach doesn't crawl, slow enough
//  that during the 10% slowdown students can watch the energy
//  graph traces evolve as the particles enter the well.
//
//  With damping = 0.98 the particles shed KE in the well and
//  settle to the equilibrium distance over ~50-100 frames.
// ============================================================
function setupScenario() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const sep = 155; // horizontal distance from canvas center to each cluster center

  const leftDef  = CLUSTER_DEFS[leftChoice];
  const rightDef = CLUSTER_DEFS[rightChoice];
  leftClusterSize = leftDef.length;

  particles = [];
  for (const d of leftDef) {
    particles.push({ x: cx - sep + d.x, y: cy + d.y, vx:  approachSpeed, vy: 0, type: d.type });
  }
  for (const d of rightDef) {
    particles.push({ x: cx + sep + d.x, y: cy + d.y, vx: -approachSpeed, vy: 0, type: d.type });
  }

  // Capture initial KE and EIE for p+p energy conservation on escape
  if (leftChoice === 'p' && rightChoice === 'p') {
    ppInitialKE = approachSpeed * approachSpeed; // total KE (2 × ½mv²)
    ppInitialSep = sep * 2;                      // initial proton-proton separation
  }

  // Capture initial CM-frame KE for elastic scatter combos
  if (isElasticScatter()) {
    const lSize = CLUSTER_DEFS[leftChoice].length;
    const rSize = CLUSTER_DEFS[rightChoice].length;
    const cmvx = approachSpeed * (lSize - rSize) / (lSize + rSize);
    elasticInitialKE = lSize * 0.5 * (approachSpeed - cmvx) ** 2 +
                       rSize * 0.5 * (-approachSpeed - cmvx) ** 2;
  }
}

// Snapshot for replay
let snapshot = null;

function takeSnapshot() {
  snapshot = particles.map(p => ({ ...p }));
  replayBtn.disabled = false;
}

function restoreSnapshot() {
  if (!snapshot) return;
  particles = snapshot.map(p => ({ ...p }));
}

// ============================================================
//  FORCE MODEL (identical to dev/v3)
//  Coulomb: K/r² repulsion, proton-proton only
//  Strong: spring-like linear ramp with equilibrium point
// ============================================================
function strongCutoff() {
  return PARTICLE_RADIUS * 2 * strongForceRange;
}

function pairForce(dist, distSq, aType, bType) {
  let force = 0;

  // Coulomb: proton-proton only (irrelevant for neutron-neutron, but kept for completeness)
  if (aType === 'proton' && bType === 'proton') {
    const softDistSq = Math.max(distSq, PARTICLE_RADIUS * PARTICLE_RADIUS);
    force += coulombStrength / softDistSq;
  }

  // Strong nuclear force: linear ramp giving quadratic potential well
  // Below equilibrium → repulsive (positive), above → attractive (negative)
  const cutoff = strongCutoff();
  if (dist < cutoff) {
    const eqDist = Math.max(cutoff * equilibriumRatio, PARTICLE_RADIUS * 2);
    const span = cutoff - eqDist;
    const t = (dist - eqDist) / span;
    force -= t * strongForceStrength;
  }

  return force;
}

// ============================================================
//  PHYSICS STEP (forces + substep integration + hard-sphere)
//  Same substep loop as dev/v3 for energy conservation.
// ============================================================
function step(dt) {
  const n = particles.length;
  const subDt = dt / SUBSTEPS;

  // Skip all intra-cluster interactions for elastic-scatter combos in escape phase.
  const rigidEscape = collisionPhase === 'escape' && isElasticScatter();

  for (let sub = 0; sub < SUBSTEPS; sub++) {
    // Pairwise forces
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        if (rigidEscape && (i < leftClusterSize) === (j < leftClusterSize)) continue;
        const a = particles[i];
        const b = particles[j];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const distSq = dx * dx + dy * dy;
        const dist = Math.sqrt(distSq);
        if (dist < 0.01) continue;

        const force = pairForce(dist, distSq, a.type, b.type);
        const fx = force * (dx / dist);
        const fy = force * (dy / dist);
        a.vx -= fx * subDt;
        a.vy -= fy * subDt;
        b.vx += fx * subDt;
        b.vy += fy * subDt;
      }
    }

    // Integrate positions (symplectic Euler)
    for (let i = 0; i < n; i++) {
      particles[i].x += particles[i].vx * subDt;
      particles[i].y += particles[i].vy * subDt;
    }

    // Hard-sphere collision constraint
    const minSep = PARTICLE_RADIUS * 2;
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        if (rigidEscape && (i < leftClusterSize) === (j < leftClusterSize)) continue;
        const a = particles[i];
        const b = particles[j];
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        const dSq = dx * dx + dy * dy;
        if (dSq >= minSep * minSep) continue;
        let d = Math.sqrt(dSq);
        if (d < 0.001) { dx = 1; dy = 0; d = 0.001; }
        const nx = dx / d;
        const ny = dy / d;
        const overlap = minSep - d;

        // Push apart equally
        a.x -= nx * overlap * 0.5;
        a.y -= ny * overlap * 0.5;
        b.x += nx * overlap * 0.5;
        b.y += ny * overlap * 0.5;

        // Elastic hard-sphere bounce: fully exchange normal velocity (equal masses)
        const dvx = b.vx - a.vx;
        const dvy = b.vy - a.vy;
        const dvDotN = dvx * nx + dvy * ny;
        if (dvDotN < 0) {
          a.vx += dvDotN * nx;
          a.vy += dvDotN * ny;
          b.vx -= dvDotN * nx;
          b.vy -= dvDotN * ny;
        }
      }
    }
  }


  // Apply damping only after first collision — free approach is undamped
  if (hasCollided) {
    for (let i = 0; i < n; i++) {
      particles[i].vx *= damping;
      particles[i].vy *= damping;
    }
  }
}

// ============================================================
//  COLORMAPS
// ============================================================
function buildColorstops(stops, out) {
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    let s0 = stops[0], s1 = stops[1];
    for (let s = 0; s < stops.length - 1; s++) {
      if (t >= stops[s].t && t <= stops[s + 1].t) { s0 = stops[s]; s1 = stops[s + 1]; break; }
    }
    const f = (t - s0.t) / (s1.t - s0.t);
    const idx = i * 4;
    out[idx]     = s0.r + (s1.r - s0.r) * f;
    out[idx + 1] = s0.g + (s1.g - s0.g) * f;
    out[idx + 2] = s0.b + (s1.b - s0.b) * f;
    out[idx + 3] = s0.a + (s1.a - s0.a) * f;
  }
}

const COLORMAP = new Uint8Array(256 * 4);
buildColorstops([
  { t: 0.0,  r: 0,   g: 0,   b: 0,   a: 0   },
  { t: 0.12, r: 10,  g: 35,  b: 170, a: 140 },
  { t: 0.4,  r: 25,  g: 85,  b: 235, a: 210 },
  { t: 0.7,  r: 70,  g: 165, b: 255, a: 245 },
  { t: 1.0,  r: 210, g: 238, b: 255, a: 255 },
], COLORMAP);

const STRONG_COLORMAP = new Uint8Array(256 * 4);
buildColorstops([
  { t: 0.0,  r: 0,   g: 0,   b: 0,   a: 0   },
  { t: 0.12, r: 160, g: 45,  b: 0,   a: 140 },
  { t: 0.4,  r: 240, g: 110, b: 10,  a: 210 },
  { t: 0.7,  r: 255, g: 185, b: 70,  a: 245 },
  { t: 1.0,  r: 255, g: 238, b: 210, a: 255 },
], STRONG_COLORMAP);

// ============================================================
//  EIE HEATMAP — normalized ribbon approach
//  Per proton-pair glowing ribbon; brightness = log-scaled pair
//  potential energy. Gaussian falloff perpendicular; elliptical
//  sigma (3x wider at center). Drawn before zoom transform.
// ============================================================
function drawHeatmap() {
  const protonList = particles.filter(p => p.type === 'proton');
  if (protonList.length < 2) return;

  const refEnergy = coulombStrength / (PARTICLE_RADIUS * 2);
  const logRef = Math.log(2);
  const pairs = [];
  for (let i = 0; i < protonList.length; i++) {
    for (let j = i + 1; j < protonList.length; j++) {
      const a = protonList[i], b = protonList[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 0.01) continue;
      const energy = coulombStrength / dist;
      const sigma = Math.max(3.5, 28 / Math.sqrt(dist));
      const distFade = Math.exp(-dist / 350);
      const mag = Math.min(1, Math.log(1 + energy / refEnergy) / logRef) * distFade;
      pairs.push({ ax: a.x, ay: a.y, ux: dx / dist, uy: dy / dist, dist, sigma, mag });
    }
  }

  const fullW = canvas.width, fullH = canvas.height;
  const scale = 0.5;
  const w = Math.ceil(fullW * scale), h = Math.ceil(fullH * scale);
  const invScale = 1 / scale;
  const cxH = fullW / 2, cyH = fullH / 2;
  const zoomScale = 1.5;
  const midX = particles.reduce((s, p) => s + p.x, 0) / particles.length;
  const midY = particles.reduce((s, p) => s + p.y, 0) / particles.length;

  hmCanvas.width = w; hmCanvas.height = h;
  const imageData = hmCtx.createImageData(w, h);
  const data = imageData.data;

  for (let py = 0; py < h; py++) {
    const worldY = midY + (py * invScale - cyH) / zoomScale;
    for (let px = 0; px < w; px++) {
      const worldX = midX + (px * invScale - cxH) / zoomScale;

      let total = 0;
      for (const p of pairs) {
        const rx = worldX - p.ax, ry = worldY - p.ay;
        const para = rx * p.ux + ry * p.uy;
        const rampPx = 8;
        const e1 = Math.max(0, Math.min(1, para / rampPx));
        const e2 = Math.max(0, Math.min(1, (p.dist - para) / rampPx));
        const endFade = e1 * e2;
        if (endFade <= 0) continue;
        const t = para / p.dist;
        const sigmaT = p.sigma * (1 + 2 * Math.sin(Math.PI * t));
        const perpSq = Math.max(0, rx * rx + ry * ry - para * para);
        total += p.mag * Math.exp(-perpSq / (2 * sigmaT * sigmaT)) * endFade;
      }

      if (total > 0.002) {
        const magnitude = Math.min(1, total * 3.0);
        const ci = (magnitude * 255) | 0;
        const di = (py * w + px) * 4;
        const ci4 = ci * 4;
        data[di]     = COLORMAP[ci4];
        data[di + 1] = COLORMAP[ci4 + 1];
        data[di + 2] = COLORMAP[ci4 + 2];
        data[di + 3] = COLORMAP[ci4 + 3];
      }
    }
  }

  hmCtx.putImageData(imageData, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(hmCanvas, 0, 0, fullW, fullH);
}

// ============================================================
//  SIE HEATMAP — normalized ribbon approach
//  Per nucleon-pair ribbon; brightness = depth in strong well.
//  Elliptical sigma; spread=2 scales both length and width.
// ============================================================
function drawStrongHeatmap() {
  const n = particles.length;
  if (n < 2) return;

  const cutoff = strongCutoff();
  const eqDist = Math.max(cutoff * equilibriumRatio, PARTICLE_RADIUS * 2);
  const span = cutoff - eqDist;
  if (span <= 0) return;
  const maxBinding = strongForceStrength * span / 2;

  const pairs = [];
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const a = particles[i], b = particles[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist === 0 || dist >= cutoff) continue;
      const dr = dist - eqDist;
      const energy = strongForceStrength / (2 * span) * (dr * dr - span * span);
      const mag = Math.min(1, Math.abs(energy) / maxBinding);
      const sigma = Math.max(0.375, 0.0875 * dist);
      const spread = 2;
      pairs.push({ ax: a.x, ay: a.y, ux: dx / dist, uy: dy / dist, dist, sigma, mag, spread });
    }
  }
  if (pairs.length === 0) return;

  const fullW = canvas.width, fullH = canvas.height;
  const scale = 0.5;
  const w = Math.ceil(fullW * scale), h = Math.ceil(fullH * scale);
  const invScale = 1 / scale;
  const cxH = fullW / 2, cyH = fullH / 2;
  const zoomScale = 1.5;
  const midX = particles.reduce((s, p) => s + p.x, 0) / particles.length;
  const midY = particles.reduce((s, p) => s + p.y, 0) / particles.length;

  hmCanvas.width = w; hmCanvas.height = h;
  const imageData = hmCtx.createImageData(w, h);
  const data = imageData.data;

  for (let py = 0; py < h; py++) {
    const worldY = midY + (py * invScale - cyH) / zoomScale;
    for (let px = 0; px < w; px++) {
      const worldX = midX + (px * invScale - cxH) / zoomScale;

      let total = 0;
      for (const p of pairs) {
        const rx = worldX - p.ax, ry = worldY - p.ay;
        const para = rx * p.ux + ry * p.uy;
        const margin = (p.spread - 1) / 2 * p.dist;
        const extDist = p.dist * p.spread;
        const paraExt = para + margin;
        const rampPx = 8;
        const e1 = Math.max(0, Math.min(1, paraExt / rampPx));
        const e2 = Math.max(0, Math.min(1, (extDist - paraExt) / rampPx));
        const endFade = e1 * e2;
        if (endFade <= 0) continue;
        const t = paraExt / extDist;
        const sigmaT = p.sigma * p.spread * (1 + 2 * Math.sin(Math.PI * t));
        const perpSq = Math.max(0, rx * rx + ry * ry - para * para);
        total += p.mag * Math.exp(-perpSq / (2 * sigmaT * sigmaT)) * endFade;
      }

      if (total > 0.002) {
        const magnitude = Math.min(1, total * 3.0);
        const ci = (magnitude * 255) | 0;
        const di = (py * w + px) * 4;
        const ci4 = ci * 4;
        data[di]     = STRONG_COLORMAP[ci4];
        data[di + 1] = STRONG_COLORMAP[ci4 + 1];
        data[di + 2] = STRONG_COLORMAP[ci4 + 2];
        data[di + 3] = STRONG_COLORMAP[ci4 + 3];
      }
    }
  }

  hmCtx.putImageData(imageData, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(hmCanvas, 0, 0, fullW, fullH);
}

// ============================================================
//  ENERGY COMPUTATION — all particles
//  KE in CM frame, EIE (Coulomb p-p only), SIE (strong all pairs)
//  Total = KE + EIE + SIE (SIE not displayed but counted in total)
// ============================================================
function computeEnergy() {
  const n = particles.length;
  if (n === 0) return { ke: 0, eie: 0, sie: 0, total: 0 };

  // CM velocity (equal masses)
  let cmvx = 0, cmvy = 0;
  for (const p of particles) { cmvx += p.vx; cmvy += p.vy; }
  cmvx /= n; cmvy /= n;

  // KE in CM frame
  let ke = 0;
  for (const p of particles) {
    const rvx = p.vx - cmvx, rvy = p.vy - cmvy;
    ke += 0.5 * (rvx * rvx + rvy * rvy);
  }

  // Pairwise potential energies
  let eie = 0, sie = 0;
  const cutoff = strongCutoff();
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const a = particles[i], b = particles[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist === 0) continue;

      if (a.type === 'proton' && b.type === 'proton') {
        eie += coulombStrength / Math.max(dist, PARTICLE_RADIUS);
      }

      if (dist < cutoff) {
        const eqDist = Math.max(cutoff * equilibriumRatio, PARTICLE_RADIUS * 2);
        const span = cutoff - eqDist;
        const dr = dist - eqDist;
        sie += strongForceStrength / (2 * span) * (dr * dr - span * span);
      }
    }
  }

  return { ke, eie, sie, total: ke + eie };
}

// ============================================================
//  OVERLAY ENERGY GRAPH
//  Drawn in screen space (not affected by zoom transform).
//  Positioned in the bottom-right corner of the canvas.
//  Same visual style as v3: amber KE, blue PE, green total.
//  Always visible (alpha = 1.0).
// ============================================================
// ============================================================
//  BAR CHART — vertical bars, v5 style.
//  KE and EIE shown as bars. Total includes SIE in the number
//  but SIE does not get its own bar.
// ============================================================
function drawBarChart() {
  if (particles.length === 0) return;
  const e = computeEnergy();

  const W = 320;
  const H = canvas.height;
  const gx = canvas.width - W;
  const gy = 0;

  ctx.save();

  // Background
  ctx.fillStyle = 'rgba(10,10,26,0.92)';
  ctx.fillRect(gx, gy, W, H);
  ctx.strokeStyle = '#2a2a4a';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(gx, gy);
  ctx.lineTo(gx, gy + H);
  ctx.stroke();

  // p+p: during the hit window, show synthetic SIE ↔ KE transfer.
  // SIE pulses 0 → −ppInitialKE → 0 (sin curve); KE rises by same amount.
  let displayKE = e.ke;
  let displaySIE = e.sie + sieOffset;
  if (leftChoice === 'p' && rightChoice === 'p' && collisionPhase === 'hit') {
    const t = hitFrames / HIT_FRAMES;
    const ppSIEContrib = -ppInitialKE * Math.sin(Math.PI * t);
    displaySIE += ppSIEContrib;
    displayKE  -= ppSIEContrib;
  }

  const sie = displaySIE;
  const bars = splitIE
    ? [
        { label: 'KE',  value: Math.max(0, displayKE),       color: '#f87171' },
        { label: 'EIE', value: e.eie,                         color: '#818cf8' },
        { label: 'SIE', value: displaySIE,                    color: '#fb923c' },
        { label: 'Tot', value: displayKE + e.eie + displaySIE, color: '#22c55e' },
      ]
    : [
        { label: 'KE',  value: Math.max(0, displayKE),        color: '#f87171' },
        { label: 'IE',  value: e.eie + displaySIE,            color: '#818cf8' },
        { label: 'Tot', value: displayKE + e.eie + displaySIE, color: '#22c55e' },
      ];

  const pad = 12;
  const labelH = 14;   // bar name labels
  const controlH = 30; // reserved for #barBottomControls HTML overlay
  const barW = (W - pad * 2) / bars.length;
  const chartH = H - labelH - controlH - pad;
  const baseline = gy + H - labelH - controlH;
  const maxVal = barYRange;

  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';

  bars.forEach((bar, i) => {
    const barPx = Math.max(0, (bar.value / maxVal) * chartH);
    const x = gx + pad + i * barW + barW * 0.1;
    const bw = barW * 0.8;

    ctx.fillStyle = bar.color;
    ctx.globalAlpha = 0.85;
    if (bar.value >= 0) {
      ctx.fillRect(x, baseline - barPx, bw, barPx);
    } else {
      ctx.fillRect(x, baseline, bw, -barPx);
    }
    ctx.globalAlpha = 1.0;

    ctx.fillStyle = bar.color;
    const labelY = Math.max(gy + 12, baseline - barPx - 4);
    ctx.fillText(bar.value.toFixed(1), x + bw / 2, labelY);

    ctx.fillStyle = '#9ca3af';
    ctx.fillText(bar.label, x + bw / 2, baseline + 11);
  });

  // Zero line
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(gx, baseline);
  ctx.lineTo(gx + W, baseline);
  ctx.stroke();

  // Y-axis max value label at top of axis
  ctx.fillStyle = '#4b5563';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(barYRange, gx + 4, gy + 11);

  // Phase label — all collision types
  if (particles.length >= 2) {
    const phaseColors = { approach: '#6b7280', hit: '#fbbf24', escape: '#6ee7b7' };
    const phaseLabels = { approach: 'Approaching', hit: 'Collision', escape: 'Escaping' };
    ctx.fillStyle = phaseColors[collisionPhase] || '#9ca3af';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(phaseLabels[collisionPhase] || '', gx + W / 2, gy + 24);
  }

  ctx.restore();
}


// ============================================================
//  DRAWING — particles with zoom transform
//  Fixed 1.5x zoom centered on the centroid of all particles.
//  Everything is drawn in world coordinates; the transform
//  handles the viewport shift.
// ============================================================
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Compute centroid of all particles (zoom target)
  let midX = canvas.width / 2;
  let midY = canvas.height / 2;
  if (particles.length > 0) {
    midX = particles.reduce((s, p) => s + p.x, 0) / particles.length;
    midY = particles.reduce((s, p) => s + p.y, 0) / particles.length;
  }

  // Apply zoom transform: translate so midpoint is at canvas center, then scale
  const zoomScale = 1.5;
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  // --- Heatmaps drawn before zoom transform (they map pixels → world internally) ---
  if (showField && particles.length >= 2) {
    drawHeatmap();
    drawStrongHeatmap();
  }

  ctx.save();
  // Translate canvas center to origin, scale, then translate back
  // offset by the difference between canvas center and midpoint
  ctx.translate(cx, cy);
  ctx.scale(zoomScale, zoomScale);
  ctx.translate(-midX, -midY);

  // Helper: draw one particle body at (px, py) at given opacity
  function drawBody(px, py, isProton, alpha) {
    ctx.globalAlpha = alpha;
    const g = ctx.createRadialGradient(px - 3, py - 3, 1, px, py, PARTICLE_RADIUS);
    if (isProton) {
      g.addColorStop(0, '#ff9999');
      g.addColorStop(0.7, '#ff4444');
      g.addColorStop(1, '#cc2222');
    } else {
      g.addColorStop(0, '#ccccdd');
      g.addColorStop(0.7, '#8888aa');
      g.addColorStop(1, '#666688');
    }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(px, py, PARTICLE_RADIUS, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }

  // --- Draw particles in world space ---
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const isProton = p.type === 'proton';
    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, PARTICLE_RADIUS * 2.5);
    if (isProton) {
      gradient.addColorStop(0, 'rgba(255, 80, 80, 0.4)');
      gradient.addColorStop(1, 'rgba(255, 80, 80, 0)');
    } else {
      gradient.addColorStop(0, 'rgba(160, 160, 200, 0.3)');
      gradient.addColorStop(1, 'rgba(160, 160, 200, 0)');
    }
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(p.x, p.y, PARTICLE_RADIUS * 2.5, 0, Math.PI * 2);
    ctx.fill();
    drawBody(p.x, p.y, isProton, 1.0);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(isProton ? '+' : 'n', p.x, p.y + 1);
  }

  ctx.restore();

  // Bar chart — always drawn over the right edge of the canvas
  drawBarChart();
}

// ============================================================
//  RENDER A HISTORICAL FRAME (used by scrubber)
// ============================================================
function renderFrame(idx) {
  const frame = particleHistory[idx];
  if (!frame) return;
  const liveParticles = particles;
  const liveCollided = hasCollided;
  const liveCollisionPhase = collisionPhase;
  particles = frame.p;
  hasCollided = (collisionFrame >= 0 && idx >= collisionFrame);
  collisionPhase = frame.collisionPhase || 'approach';
  draw();
  particles = liveParticles;
  hasCollided = liveCollided;
  collisionPhase = liveCollisionPhase;
}

  const toolbarH = document.getElementById('toolbar').offsetHeight;
  const scrubH = document.getElementById('scrubBar').offsetHeight;
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight - toolbarH - scrubH;
  if (!running) draw();
}

goBtn.addEventListener('click', () => {
  if (running) {
    // Stop → show "New" for next click
    running = false;
    goBtn.textContent = 'New';
    goBtn.classList.remove('running');
    cancelAnimationFrame(animId);
  } else {
    // "Go" (first time) or "New" (after stopping) → fresh start

    hasRunOnce = true;
    running = true;
    goBtn.textContent = 'Stop';
    goBtn.classList.add('running');
    takeSnapshot();
    loop();

});

// ============================================================
//  FUSION PRODUCTS
//  D + T → He-4 (particles 0-3) + n (particle 4)
//
//  Triggered when the natural KE from strong-force binding
//  rises above KE_EJECT_THRESHOLD — so the bar chart shows
//  KE climbing first, then separation follows causally.
//
//  Velocities use the actual system KE at trigger time (no
//  artificial boost). He-4 is arranged with protons on opposite
//  sides; neutron is teleported outside the strong force cutoff.
// ============================================================
const KE_EJECT_THRESHOLD = 20; // KE level that triggers ejection
const KE_EJECT_FALLBACK_MS = 2000; // safety fallback if threshold not reached

// Compute the SIE for an arbitrary list of {x,y} positions using the
// same pairwise strong potential as the main physics loop.
function computeSIEForPositions(positions) {
  const cutoff = strongCutoff();
  const eqDist = Math.max(cutoff * equilibriumRatio, PARTICLE_RADIUS * 2);
  const span = cutoff - eqDist;
  if (span <= 0) return 0;
  let sie = 0;
  for (let i = 0; i < positions.length; i++) {
    for (let j = i + 1; j < positions.length; j++) {
      const dx = positions[i].x - positions[j].x;
      const dy = positions[i].y - positions[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < cutoff) {
        const dr = dist - eqDist;
        sie += strongForceStrength / (2 * span) * (dr * dr - span * span);
      }
    }
  }
  return sie;
}

// ============================================================
//  ELASTIC SCATTER ESCAPE — n+n, n+He, n+T
//  Picks a random scatter angle (±90° around backscatter, ensuring
//  separation), then computes both cluster velocities from CM-frame
//  momentum + energy conservation. Snaps clusters to def geometry
//  and teleports apart. For n+He the neutron stays at its collision
//  position; He is pushed away.
// ============================================================
function applyElasticEscape() {
  const n = particles.length;
  const lSize = leftClusterSize;
  const rSize = n - lSize;

  // Cluster centroids
  let lcx = 0, lcy = 0;
  for (let i = 0; i < lSize; i++) { lcx += particles[i].x; lcy += particles[i].y; }
  lcx /= lSize; lcy /= lSize;
  let rcx = 0, rcy = 0;
  for (let i = lSize; i < n; i++) { rcx += particles[i].x; rcy += particles[i].y; }
  rcx /= rSize; rcy /= rSize;

  // Separation axis (left→right)
  const sdx = rcx - lcx, sdy = rcy - lcy;
  const sdist = Math.sqrt(sdx * sdx + sdy * sdy);
  if (sdist < 0.01) return;
  const snx = sdx / sdist, sny = sdy / sdist;

  // System CM velocity (conserved throughout)
  let lvx = 0, lvy = 0;
  for (let i = 0; i < lSize; i++) { lvx += particles[i].vx; lvy += particles[i].vy; }
  lvx /= lSize; lvy /= lSize;
  let rvx = 0, rvy = 0;
  for (let i = lSize; i < n; i++) { rvx += particles[i].vx; rvy += particles[i].vy; }
  rvx /= rSize; rvy /= rSize;
  const cmvx = (lSize * lvx + rSize * rvx) / n;
  const cmvy = (lSize * lvy + rSize * rvy) / n;

  // Random scatter angle: left cluster scatters into the half-space away from
  // right cluster (backscatter ± 90°), guaranteeing the clusters separate.
  // CM-frame speed derived analytically from elasticInitialKE.
  // KE = ½·lSize·vl² + ½·rSize·(lSize/rSize·vl)² = ½·vl²·lSize·n/rSize
  const vl = Math.sqrt(2 * elasticInitialKE * rSize / (lSize * n));
  const backAngle = Math.atan2(-sny, -snx); // left cluster straight-back direction
  const theta = backAngle + (Math.random() - 0.5) * Math.PI; // ±90° of that
  const cosT = Math.cos(theta), sinT = Math.sin(theta);

  const newLvx = cmvx + vl * cosT;
  const newLvy = cmvy + vl * sinT;
  const newRvx = cmvx - (lSize / rSize) * vl * cosT;
  const newRvy = cmvy - (lSize / rSize) * vl * sinT;

  // Snap each cluster to def geometry centered on its current centroid
  const lDef = CLUSTER_DEFS[leftChoice];
  const rDef = CLUSTER_DEFS[rightChoice];
  let lDefCx = 0, lDefCy = 0;
  for (const d of lDef) { lDefCx += d.x; lDefCy += d.y; }
  lDefCx /= lSize; lDefCy /= lSize;
  let rDefCx = 0, rDefCy = 0;
  for (const d of rDef) { rDefCx += d.x; rDefCy += d.y; }
  rDefCx /= rSize; rDefCy /= rSize;

  for (let i = 0; i < lSize; i++) {
    particles[i].x = lcx + (lDef[i].x - lDefCx);
    particles[i].y = lcy + (lDef[i].y - lDefCy);
    particles[i].vx = newLvx; particles[i].vy = newLvy;
  }
  for (let i = 0; i < rSize; i++) {
    particles[lSize + i].x = rcx + (rDef[i].x - rDefCx);
    particles[lSize + i].y = rcy + (rDef[i].y - rDefCy);
    particles[lSize + i].vx = newRvx; particles[lSize + i].vy = newRvy;
  }

  // Cluster radii from def
  let lr = PARTICLE_RADIUS;
  for (const d of lDef) lr = Math.max(lr, Math.sqrt((d.x-lDefCx)**2+(d.y-lDefCy)**2)+PARTICLE_RADIUS);
  let rr = PARTICLE_RADIUS;
  for (const d of rDef) rr = Math.max(rr, Math.sqrt((d.x-rDefCx)**2+(d.y-rDefCy)**2)+PARTICLE_RADIUS);

  const minSafeSep = lr + rr + strongCutoff() * 1.1;
  const hasHe = leftChoice === 'he' || rightChoice === 'he';
  if (sdist < minSafeSep) {
    if (hasHe) {
      // Keep neutron at its exact collision position; push He away from it
      if (lSize === 1) {
        const rShiftX = lcx + snx * minSafeSep - rcx;
        const rShiftY = lcy + sny * minSafeSep - rcy;
        for (let i = lSize; i < n; i++) { particles[i].x += rShiftX; particles[i].y += rShiftY; }
      } else {
        const lShiftX = rcx - snx * minSafeSep - lcx;
        const lShiftY = rcy - sny * minSafeSep - lcy;
        for (let i = 0; i < lSize; i++) { particles[i].x += lShiftX; particles[i].y += lShiftY; }
      }
    } else {
      const smx = (lcx + rcx) / 2, smy = (lcy + rcy) / 2;
      const lShiftX = smx - snx * minSafeSep / 2 - lcx;
      const lShiftY = smy - sny * minSafeSep / 2 - lcy;
      const rShiftX = smx + snx * minSafeSep / 2 - rcx;
      const rShiftY = smy + sny * minSafeSep / 2 - rcy;
      for (let i = 0; i < lSize; i++) { particles[i].x += lShiftX; particles[i].y += lShiftY; }
      for (let i = lSize; i < n; i++) { particles[i].x += rShiftX; particles[i].y += rShiftY; }
    }
  }
}

function fireFusion() {
  fusionFired = true;

  const n = particles.length; // 5

  // Current system momentum and CM-frame KE (naturally accumulated from strong force)
  let sumVx = 0, sumVy = 0;
  for (const p of particles) { sumVx += p.vx; sumVy += p.vy; }
  const cmvx = sumVx / n, cmvy = sumVy / n;

  let keCM = 0;
  for (const p of particles) {
    const rvx = p.vx - cmvx, rvy = p.vy - cmvy;
    keCM += 0.5 * (rvx * rvx + rvy * rvy);
  }

  // SIE of the compact 5-body cluster right now
  const sieBefore = computeEnergy().sie;

  const he4cx = (particles[0].x + particles[1].x + particles[2].x + particles[3].x) / 4;
  const he4cy = (particles[0].y + particles[1].y + particles[2].y + particles[3].y) / 4;
  const r = PARTICLE_RADIUS * 1.05;
  const cutoff = strongCutoff();

  const theta = Math.random() * 2 * Math.PI;
  const nx = Math.cos(theta), ny = Math.sin(theta);

  // Assign He-4 positions so protons always end up on opposite sides.
  // Identify which of particles[0-3] are protons vs neutrons.
  const protonIdx = [], neutronIdx = [];
  for (let i = 0; i < 4; i++) {
    (particles[i].type === 'proton' ? protonIdx : neutronIdx).push(i);
  }
  // Diamond slots: 0=left, 1=top, 2=right, 3=bottom.
  // Protons → left/right (opposite), neutrons → top/bottom (opposite).
  const diamondSlots = [null, null, null, null]; // indexed by particle index
  diamondSlots[protonIdx[0]]  = { x: he4cx - r, y: he4cy     }; // left
  diamondSlots[protonIdx[1]]  = { x: he4cx + r, y: he4cy     }; // right
  diamondSlots[neutronIdx[0]] = { x: he4cx,     y: he4cy - r }; // top
  diamondSlots[neutronIdx[1]] = { x: he4cx,     y: he4cy + r }; // bottom
  const he4Pos = [diamondSlots[0], diamondSlots[1], diamondSlots[2], diamondSlots[3]];

  // SIE of the He-4 diamond; neutron is placed outside cutoff so contributes 0
  const sieAfter = computeSIEForPositions(he4Pos);

  // Energy-conserving KE budget: carry forward keCM, then apply the SIE change.
  // sieBefore is more negative than sieAfter (compact cluster is more deeply bound),
  // so (sieBefore − sieAfter) < 0 — the products get LESS KE than the cluster had,
  // which is correct: the deep collision binding doesn't all become product kinetic energy.
  // The net fusion yield (relative to separated D+T) is still positive and baked in.
  const keCMProduct = Math.max(keCM + sieBefore - sieAfter, 8);

  // He-4 (mass 4) + n (mass 1): momentum conservation gives v_n = 4·v_He4 in CM frame.
  // Total CM KE = 0.5·1·v_n² + 0.5·4·(v_n/4)² = 0.625·v_n²
  const v_n_cm   = Math.sqrt(keCMProduct / 0.625);
  const v_He4_cm = v_n_cm / 4;

  const v_He4_x = cmvx - nx * v_He4_cm;
  const v_He4_y = cmvy - ny * v_He4_cm;
  const v_n_x   = cmvx + nx * v_n_cm;
  const v_n_y   = cmvy + ny * v_n_cm;

  fusionStartPos = particles.map(p => ({ x: p.x, y: p.y }));

  fusionTargets = {
    he4: he4Pos.map(pos => ({ ...pos, vx: v_He4_x, vy: v_He4_y })),
    n: {
      x: he4cx + nx * (cutoff + PARTICLE_RADIUS * 2),
      y: he4cy + ny * (cutoff + PARTICLE_RADIUS * 2),
      vx: v_n_x, vy: v_n_y,
    },
  };

  fusionAnimating = true;
  fusionAnimFrame = 0;
}

// ============================================================
//  ANIMATION LOOP — history recording and scrubber support
// ============================================================
function loop() {
  if (!running) return;

  if (scrubFrame >= 0) {
    // --- Scrub mode: physics paused, display historical frame ---
    timeLabelEl.textContent = `${scrubFrame + 1} / ${particleHistory.length}`;
    renderFrame(scrubFrame);
  } else {
    // --- Live mode ---
    const now = performance.now();

    if (fusionAnimating) {
      // --- He-4 rearrangement animation: lerp positions over FUSION_ANIM_FRAMES ---
      fusionAnimFrame++;
      const t = fusionAnimFrame / FUSION_ANIM_FRAMES;
      const ease = t * t * (3 - 2 * t); // smoothstep

      for (let i = 0; i < 4; i++) {
        const s = fusionStartPos[i], tgt = fusionTargets.he4[i];
        particles[i].x  = s.x + (tgt.x - s.x) * ease;
        particles[i].y  = s.y + (tgt.y - s.y) * ease;
        particles[i].vx = tgt.vx;
        particles[i].vy = tgt.vy;
      }
      const sn = fusionStartPos[4], tn = fusionTargets.n;
      particles[4].x  = sn.x + (tn.x - sn.x) * ease;
      particles[4].y  = sn.y + (tn.y - sn.y) * ease;
      particles[4].vx = tn.vx;
      particles[4].vy = tn.vy;

      if (fusionAnimFrame >= FUSION_ANIM_FRAMES) {
        fusionAnimating = false;
        for (let i = 0; i < 4; i++) {
          const tgt = fusionTargets.he4[i];
          particles[i].x = tgt.x; particles[i].y = tgt.y;
          particles[i].vx = tgt.vx; particles[i].vy = tgt.vy;
        }
        particles[4].x = tn.x; particles[4].y = tn.y;
        particles[4].vx = tn.vx; particles[4].vy = tn.vy;
      }

    } else {
      // --- Normal physics ---
      step(speed);

      const isPP = leftChoice === 'p' && rightChoice === 'p';

      // ── Collision phase labeling: centroid closest-approach (all combos) ──
      // Fires when cluster centroids stop closing — works at any speed,
      // any cluster size, with or without Coulomb.
      if (collisionPhase === 'approach') {
        const rSize = particles.length - leftClusterSize;
        let lcx = 0, lcy = 0, lvx = 0, lvy = 0;
        for (let i = 0; i < leftClusterSize; i++) {
          lcx += particles[i].x; lcy += particles[i].y;
          lvx += particles[i].vx; lvy += particles[i].vy;
        }
        lcx /= leftClusterSize; lcy /= leftClusterSize;
        lvx /= leftClusterSize; lvy /= leftClusterSize;
        let rcx = 0, rcy = 0, rvx = 0, rvy = 0;
        for (let i = leftClusterSize; i < particles.length; i++) {
          rcx += particles[i].x; rcy += particles[i].y;
          rvx += particles[i].vx; rvy += particles[i].vy;
        }
        rcx /= rSize; rcy /= rSize; rvx /= rSize; rvy /= rSize;
        const cdx = rcx - lcx, cdy = rcy - lcy;
        const cdist = Math.sqrt(cdx * cdx + cdy * cdy);
        if (cdist > 0.01) {
          const relV = (rvx - lvx) * (cdx / cdist) + (rvy - lvy) * (cdy / cdist);
          if (relV >= 0) {
            collisionPhase = 'hit';
            hitFrames = 0;
          }
        }
      }

      // ── Physical contact: needed for D+T fusion counter ──────────────
      if (!hasCollided) {
        outer: for (let i = 0; i < leftClusterSize; i++) {
          for (let j = leftClusterSize; j < particles.length; j++) {
            const cdx = particles[j].x - particles[i].x;
            const cdy = particles[j].y - particles[i].y;
            if (cdx * cdx + cdy * cdy < (PARTICLE_RADIUS * 2 + 1) * (PARTICLE_RADIUS * 2 + 1)) {
              hasCollided = true;
              collisionFrame = particleHistory.length;
              collisionTime = now;
              break outer;
            }
          }
        }
      }

      // ── Hit phase: label "Collision" for HIT_FRAMES, then escape ─────
      if (collisionPhase === 'hit') {
        hitFrames++;
        const isDT = (leftChoice === 'd' && rightChoice === 't') || (leftChoice === 't' && rightChoice === 'd');
        // D+T: stay in 'hit' until fusion fires; others: timer-based
        const readyToEscape = isDT ? fusionFired : hitFrames >= HIT_FRAMES;
        if (readyToEscape) {
          collisionPhase = 'escape';
          if (isElasticScatter()) {
            applyElasticEscape();
          } else if (isPP) {
            // Teleport outside strong range, then set escape speed so that
            // KE_release + EIE_release = KE_initial + EIE_initial (energy conserved).
            const edx = particles[1].x - particles[0].x;
            const edy = particles[1].y - particles[0].y;
            const edist = Math.sqrt(edx * edx + edy * edy);
            const enx = edx / edist, eny = edy / edist;
            const safeSep = Math.max(edist, strongCutoff() * 1.1 + PARTICLE_RADIUS * 2);
            const emx = (particles[0].x + particles[1].x) / 2;
            const emy = (particles[0].y + particles[1].y) / 2;
            particles[0].x = emx - enx * safeSep / 2; particles[0].y = emy - eny * safeSep / 2;
            particles[1].x = emx + enx * safeSep / 2; particles[1].y = emy + eny * safeSep / 2;
            // v² = KE_initial + EIE_initial − EIE_at_safeSep
            const initialEIE = coulombStrength / ppInitialSep;
            const releaseEIE = coulombStrength / safeSep;
            const v2 = Math.max(0, ppInitialKE + initialEIE - releaseEIE);
            const escapeSpeed = Math.sqrt(v2);
            particles[0].vx = -enx * escapeSpeed; particles[0].vy = -eny * escapeSpeed;
            particles[1].vx =  enx * escapeSpeed; particles[1].vy =  eny * escapeSpeed;
          }
        }
      }


      // Fire D+T fusion when KE threshold reached (or fallback timeout)
      const isDT = (leftChoice === 'd' && rightChoice === 't') || (leftChoice === 't' && rightChoice === 'd');
      if (hasCollided && !fusionFired && isDT) {
        framesSinceCollision++;
        if (framesSinceCollision > 40) {
          const e = computeEnergy();
          if (e.ke >= KE_EJECT_THRESHOLD || now - collisionTime > KE_EJECT_FALLBACK_MS) {
            fireFusion();
          }
        }
      }

      // Auto-stop when all particles leave the viewport (D+T fusion products or p+p escape)
      if (collisionPhase === 'escape' && (fusionFired ? !fusionAnimating : true)) {
        const zoomScale = 1.5;
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const midX = particles.reduce((s, p) => s + p.x, 0) / particles.length;
        const midY = particles.reduce((s, p) => s + p.y, 0) / particles.length;
        const margin = PARTICLE_RADIUS * zoomScale;
        const allGone = particles.every(p => {
          const sx = cx + (p.x - midX) * zoomScale;
          const sy = cy + (p.y - midY) * zoomScale;
          return sx < -margin || sx > canvas.width + margin ||
                 sy < -margin || sy > canvas.height + margin;
        });
        if (allGone) {
          running = false;
          goBtn.textContent = 'New';
          goBtn.classList.remove('running');
          draw();
          return;
        }
      }
    }

    // Record history snapshot
    particleHistory.push({ p: particles.map(p => ({ ...p })), t: now, collisionPhase });
    if (particleHistory.length > MAX_HISTORY) particleHistory.shift();

    timeSlider.disabled = false;
    timeSlider.max = particleHistory.length - 1;
    timeSlider.value = timeSlider.max;
    timeLabelEl.textContent = `${particleHistory.length}`;

    draw();
  }

  animId = requestAnimationFrame(loop);
}

// ============================================================
//  INITIAL SETUP — place the two neutrons and draw
// ============================================================
setupScenario();
draw();
</script>
