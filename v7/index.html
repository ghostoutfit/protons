<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D+T Fusion — v7</title>
<style>
  /* ========================================
     RESET & BASE STYLES
     ======================================== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a1a;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ========================================
     TOOLBAR — minimal: title + Go + Replay
     ======================================== */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: #12122a;
    border-bottom: 1px solid #2a2a4a;
    z-index: 10;
  }

  #toolbar h1 {
    font-size: 18px;
    font-weight: 600;
    color: #ff6b6b;
    margin-right: 8px;
    white-space: nowrap;
  }

  .btn {
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }

  #goBtn {
    background: #22c55e;
    color: #fff;
  }
  #goBtn:hover { background: #16a34a; }
  #goBtn.running {
    background: #ef4444;
  }
  #goBtn.running:hover { background: #dc2626; }

  #replayBtn {
    background: #0e7490;
    color: #fff;
  }
  #replayBtn:hover { background: #0891b2; }
  #replayBtn:disabled {
    background: #1e293b;
    color: #4b5563;
    cursor: not-allowed;
  }

  /* ========================================
     STRONG FORCE VISUALIZATION TOGGLE
     Three-position radio pill: Hole / Pink glow / None
     ======================================== */
  .toggle-label {
    font-size: 13px;
    color: #9ca3af;
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    white-space: nowrap;
  }

  .toggle-label input[type="checkbox"] {
    accent-color: #f59e0b;
  }

  #strongModeGroup {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: 4px;
    transition: opacity 0.15s;
  }

  #strongModeGroup.hidden { display: none; }

  #strongModeGroup label {
    font-size: 11px;
    color: #6b7280;
    padding: 2px 8px;
    border: 1px solid #3a3a5a;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }

  #strongModeGroup input[type="radio"] { display: none; }

  #strongModeGroup input[type="radio"]:checked + label,
  #coulombVizGroup input[type="radio"]:checked + label {
    background: #2a2a4a;
    color: #e0e0e0;
    border-color: #6366f1;
  }

  #coulombVizGroup {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: 4px;
  }
  #coulombVizGroup label {
    font-size: 11px;
    color: #6b7280;
    padding: 2px 8px;
    border: 1px solid #3a3a5a;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  #coulombVizGroup input[type="radio"] { display: none; }

  /* ========================================
     CANVAS — fills remaining space
     ======================================== */
  #canvas {
    flex: 1;
    display: block;
    cursor: default;
  }

  /* ========================================
     TIME SCRUBBER BAR
     ======================================== */
  #scrubBar {
    height: 56px;
    background: #0e0e22;
    border-top: 1px solid #2a2a4a;
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 14px;
    flex-shrink: 0;
  }
  #scrubBar .scrub-label {
    font-size: 12px;
    color: #6b7280;
    white-space: nowrap;
  }
  #scrubBar .scrub-time {
    font-size: 12px;
    color: #6b7280;
    white-space: nowrap;
    min-width: 7em;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  #timeSlider {
    flex: 1;
    height: 10px;
    accent-color: #6366f1;
    cursor: pointer;
  }
  #timeSlider:disabled {
    opacity: 0.25;
    cursor: not-allowed;
  }

  /* ========================================
     PORTRAIT ORIENTATION OVERLAY (mobile)
     ======================================== */
  #portrait-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #0a0a1a;
    color: #e0e0e0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }

  #portrait-overlay .rotate-icon { font-size: 64px; margin-bottom: 1.5rem; }
  #portrait-overlay h2 { font-size: 22px; font-weight: 600; color: #ff6b6b; margin-bottom: 0.75rem; }
  #portrait-overlay p { font-size: 16px; color: #9ca3af; max-width: 280px; }

  @media (max-width: 860px) and (orientation: portrait) {
    #portrait-overlay { display: flex; }
    body > *:not(#portrait-overlay) { display: none !important; }
  }
</style>
</head>
<body>

<!-- Portrait overlay (mobile) -->
<div id="portrait-overlay">
  <div class="rotate-icon">&#x1F4F1;&#x21BB;</div>
  <h2>Rotate Your Device</h2>
  <p>Go horizontal to use this app</p>
</div>

<!-- Toolbar: just title + Go + Replay -->
<div id="toolbar">
  <h1>Fusion</h1>
  <button class="btn" id="goBtn">Go</button>
  <button class="btn" id="replayBtn" disabled>Replay</button>
  <!-- Left / Right nucleus selectors -->
  <label class="toggle-label" style="gap:6px;">
    Left:
    <select id="leftChoice" style="background:#1a1a3a;color:#e0e0e0;border:1px solid #3a3a5a;border-radius:4px;padding:2px 8px;font-size:12px;cursor:pointer;">
      <option value="p">Proton</option>
      <option value="n">Neutron</option>
      <option value="d" selected>Deuterium (p+n)</option>
      <option value="t">Tritium (p+2n)</option>
      <option value="he">Helium-4 (2p+2n)</option>
    </select>
  </label>
  <label class="toggle-label" style="gap:6px;">
    Right:
    <select id="rightChoice" style="background:#1a1a3a;color:#e0e0e0;border:1px solid #3a3a5a;border-radius:4px;padding:2px 8px;font-size:12px;cursor:pointer;">
      <option value="p">Proton</option>
      <option value="n">Neutron</option>
      <option value="d">Deuterium (p+n)</option>
      <option value="t" selected>Tritium (p+2n)</option>
      <option value="he">Helium-4 (2p+2n)</option>
    </select>
  </label>
  <!-- Coulomb viz mode + strong force render mode (stacked) -->
  <div style="display:flex;flex-direction:column;gap:5px;">
    <div style="display:flex;align-items:center;gap:6px;">
      <span style="font-size:12px;color:#9ca3af;white-space:nowrap">Energy Between Particles:</span>
      <span id="coulombVizGroup">
        <input type="radio" name="coulombViz" id="cvNone" value="none"><label for="cvNone">None</label>
        <input type="radio" name="coulombViz" id="cvHeatmap" value="heatmap"><label for="cvHeatmap">Heatmap</label>
        <input type="radio" name="coulombViz" id="cvRibbon" value="ribbon" checked><label for="cvRibbon">Ribbon</label>
        <input type="radio" name="coulombViz" id="cvCloud" value="cloud"><label for="cvCloud">Cloud</label>
      </span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;">
      <span id="strongModeGroup">
        Strong:
        <input type="radio" name="strongMode" id="strongNone" value="none" checked><label for="strongNone">None</label>
        <input type="radio" name="strongMode" id="strongHole" value="hole"><label for="strongHole">Hole</label>
        <input type="radio" name="strongMode" id="strongPink" value="pink"><label for="strongPink">Pink glow</label>
      </span>
    </div>
  </div>
  <!-- Range + Speed sliders stacked -->
  <div style="display:flex;flex-direction:column;gap:4px;">
    <label class="toggle-label" style="gap:6px;">
      Strong range: <span id="v4RangeVal">2.0</span>x
      <input type="range" id="v4RangeSlider" min="1.0" max="3.0" step="0.05" value="2.0" style="width:72px;accent-color:#6366f1;">
    </label>
    <label class="toggle-label" style="gap:6px;">
      Speed: <span id="v4SpeedVal">0.50</span>
      <input type="range" id="v4SpeedSlider" min="0.1" max="2.0" step="0.05" value="0.5" style="width:72px;accent-color:#6366f1;">
    </label>
  </div>
</div>

<canvas id="canvas"></canvas>

<!-- Time scrubber — drag to move forward/backward through the interaction -->
<div id="scrubBar">
  <span class="scrub-label">Time</span>
  <input type="range" id="timeSlider" min="0" max="0" value="0" disabled>
  <span class="scrub-time" id="timeLabel">–</span>
</div>

<script>
// ============================================================
//  DOM REFERENCES
// ============================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const goBtn = document.getElementById('goBtn');
const replayBtn = document.getElementById('replayBtn');
const strongModeGroup = document.getElementById('strongModeGroup');
const timeSlider = document.getElementById('timeSlider');
const timeLabelEl = document.getElementById('timeLabel');

// ============================================================
//  PHYSICS CONSTANTS (same model as dev/v3)
// ============================================================
const PARTICLE_RADIUS = 10;
const SUBSTEPS = 20;

// Fixed physics parameters
const coulombStrength = 150;
const strongForceStrength = 4;    // gentle pull — slow visible acceleration across the well
let strongForceRange = 2.0;        // cutoff = PARTICLE_RADIUS * 2 * strongForceRange (40px at 2x)
let approachSpeed = 0.5;           // px per internal dt unit — initial inward velocity of each particle
const equilibriumRatio = 0.35;    // equilibrium ≈ 35% of cutoff, clamped to touching distance
const damping = 1.00;              // velocity damping per frame — lets bound pair settle

// ============================================================
//  STATE
// ============================================================
let particles = [];       // Array of { x, y, vx, vy, type }
let running = false;
let animId = null;
const speed = 1.5;        // dt per frame

// ============================================================
//  HISTORY & SCRUBBER
// ============================================================
const MAX_HISTORY = 4000;
let particleHistory = [];  // Each entry: { p: [{x,y,vx,vy,type},...], t: now }
let scrubFrame = -1;       // -1 = live, >=0 = paused at a historical frame

let hasCollided = false;           // True once D and T clusters first make cross-cluster contact
let collisionFrame = -1;          // particleHistory index when collision first occurred
let collisionTime = -1;           // performance.now() when collision occurred
let fusionFired = false;          // True once fireFusion() has been called
let framesSinceCollision = 0;    // Counts up after hasCollided; KE check waits 80 frames
let fusionAnimating = false;      // True while playing the He-4 rearrangement animation
let fusionAnimFrame = 0;          // Current frame of the rearrangement animation
const FUSION_ANIM_FRAMES = 5;    // Frames to lerp into He-4 geometry
let fusionStartPos = null;        // Particle positions at start of rearrangement animation
let fusionTargets = null;         // Target positions/velocities for the rearrangement


// ============================================================
//  NUCLEUS SELECTOR — cluster definitions and state
// ============================================================
const CLUSTER_DEFS = {
  'p':  [{ type:'proton',  x:0,   y:0   }],
  'n':  [{ type:'neutron', x:0,   y:0   }],
  'd':  [{ type:'proton',  x:-10, y:0   }, { type:'neutron', x:10,  y:0   }],
  't':  [{ type:'proton',  x:-10, y:0   }, { type:'neutron', x:10,  y:0   }, { type:'neutron', x:0,   y:-17 }],
  'he': [{ type:'proton',  x:-11, y:0   }, { type:'neutron', x:0,   y:-11 }, { type:'proton',  x:11,  y:0   }, { type:'neutron', x:0,   y:11  }],
};

let leftChoice = 'd';
let rightChoice = 't';
let leftClusterSize = 2;  // set in setupScenario; used for cross-cluster collision detection

// ============================================================
//  HEATMAP STATE
// ============================================================
let coulombVizMode = 'ribbon';    // 'heatmap' | 'ribbon' | 'cloud' | 'none'
let strongMode = 'none';          // 'none' | 'hole' | 'pink'

// Offscreen canvas for heatmap rendering (half resolution)
const hmCanvas = document.createElement('canvas');
const hmCtx = hmCanvas.getContext('2d');

// ============================================================
//  INITIAL CONDITIONS
//  Two neutrons placed 300px apart horizontally, centered on
//  the canvas, with inward velocities aimed at each other.
//
//  Strong force cutoff = 30px, equilibrium ~20px.
//  Approach speed of 0.5 px/dt gives a visually pleasant pace:
//  fast enough that the approach doesn't crawl, slow enough
//  that during the 10% slowdown students can watch the energy
//  graph traces evolve as the particles enter the well.
//
//  With damping = 0.98 the particles shed KE in the well and
//  settle to the equilibrium distance over ~50-100 frames.
// ============================================================
function setupScenario() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const sep = 155; // horizontal distance from canvas center to each cluster center

  const leftDef  = CLUSTER_DEFS[leftChoice];
  const rightDef = CLUSTER_DEFS[rightChoice];
  leftClusterSize = leftDef.length;

  particles = [];
  for (const d of leftDef) {
    particles.push({ x: cx - sep + d.x, y: cy + d.y, vx:  approachSpeed, vy: 0, type: d.type });
  }
  for (const d of rightDef) {
    particles.push({ x: cx + sep + d.x, y: cy + d.y, vx: -approachSpeed, vy: 0, type: d.type });
  }
}

// Snapshot for replay
let snapshot = null;

function takeSnapshot() {
  snapshot = particles.map(p => ({ ...p }));
  replayBtn.disabled = false;
}

function restoreSnapshot() {
  if (!snapshot) return;
  particles = snapshot.map(p => ({ ...p }));
}

// ============================================================
//  FORCE MODEL (identical to dev/v3)
//  Coulomb: K/r² repulsion, proton-proton only
//  Strong: spring-like linear ramp with equilibrium point
// ============================================================
function strongCutoff() {
  return PARTICLE_RADIUS * 2 * strongForceRange;
}

function pairForce(dist, distSq, aType, bType) {
  let force = 0;

  // Coulomb: proton-proton only (irrelevant for neutron-neutron, but kept for completeness)
  if (aType === 'proton' && bType === 'proton') {
    const softDistSq = Math.max(distSq, PARTICLE_RADIUS * PARTICLE_RADIUS);
    force += coulombStrength / softDistSq;
  }

  // Strong nuclear force: linear ramp giving quadratic potential well
  // Below equilibrium → repulsive (positive), above → attractive (negative)
  const cutoff = strongCutoff();
  if (dist < cutoff) {
    const eqDist = Math.max(cutoff * equilibriumRatio, PARTICLE_RADIUS * 2);
    const span = cutoff - eqDist;
    const t = (dist - eqDist) / span;
    force -= t * strongForceStrength;
  }

  return force;
}

// ============================================================
//  PHYSICS STEP (forces + substep integration + hard-sphere)
//  Same substep loop as dev/v3 for energy conservation.
// ============================================================
function step(dt) {
  const n = particles.length;
  const subDt = dt / SUBSTEPS;

  for (let sub = 0; sub < SUBSTEPS; sub++) {
    // Pairwise forces
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const a = particles[i];
        const b = particles[j];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const distSq = dx * dx + dy * dy;
        const dist = Math.sqrt(distSq);
        if (dist < 0.01) continue;

        const force = pairForce(dist, distSq, a.type, b.type);
        const fx = force * (dx / dist);
        const fy = force * (dy / dist);
        a.vx -= fx * subDt;
        a.vy -= fy * subDt;
        b.vx += fx * subDt;
        b.vy += fy * subDt;
      }
    }

    // Integrate positions (symplectic Euler)
    for (let i = 0; i < n; i++) {
      particles[i].x += particles[i].vx * subDt;
      particles[i].y += particles[i].vy * subDt;
    }

    // Hard-sphere collision constraint
    const minSep = PARTICLE_RADIUS * 2;
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const a = particles[i];
        const b = particles[j];
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        const dSq = dx * dx + dy * dy;
        if (dSq >= minSep * minSep) continue;
        let d = Math.sqrt(dSq);
        if (d < 0.001) { dx = 1; dy = 0; d = 0.001; }
        const nx = dx / d;
        const ny = dy / d;
        const overlap = minSep - d;

        // Push apart equally
        a.x -= nx * overlap * 0.5;
        a.y -= ny * overlap * 0.5;
        b.x += nx * overlap * 0.5;
        b.y += ny * overlap * 0.5;

        // Zero out approaching normal velocity (inelastic safety net)
        const dvx = b.vx - a.vx;
        const dvy = b.vy - a.vy;
        const dvDotN = dvx * nx + dvy * ny;
        if (dvDotN < 0) {
          const half = dvDotN * 0.5;
          a.vx += half * nx;
          a.vy += half * ny;
          b.vx -= half * nx;
          b.vy -= half * ny;
        }
      }
    }
  }

  // Apply damping only after first collision — free approach is undamped
  if (hasCollided) {
    for (let i = 0; i < n; i++) {
      particles[i].vx *= damping;
      particles[i].vy *= damping;
    }
  }
}

// ============================================================
//  COLORMAPS
// ============================================================

// Coulomb energy: blue sequential (transparent → deep blue → near-white)
const COULOMB_COLORMAP = new Uint8Array(256 * 4);
(function() {
  const stops = [
    { t: 0.0,  r: 0,   g: 0,   b: 0,   a: 0 },
    { t: 0.2,  r: 5,   g: 20,  b: 140, a: 77 },
    { t: 0.5,  r: 20,  g: 70,  b: 220, a: 153 },
    { t: 0.8,  r: 60,  g: 160, b: 255, a: 217 },
    { t: 1.0,  r: 200, g: 235, b: 255, a: 255 },
  ];
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    let s0 = stops[0], s1 = stops[1];
    for (let s = 0; s < stops.length - 1; s++) {
      if (t >= stops[s].t && t <= stops[s + 1].t) { s0 = stops[s]; s1 = stops[s + 1]; break; }
    }
    const f = (t - s0.t) / (s1.t - s0.t);
    const idx = i * 4;
    COULOMB_COLORMAP[idx]     = s0.r + (s1.r - s0.r) * f;
    COULOMB_COLORMAP[idx + 1] = s0.g + (s1.g - s0.g) * f;
    COULOMB_COLORMAP[idx + 2] = s0.b + (s1.b - s0.b) * f;
    COULOMB_COLORMAP[idx + 3] = s0.a + (s1.a - s0.a) * f;
  }
})();

// Strong force "Pink glow" mode: transparent → pink → magenta → white
const PINK_COLORMAP = new Uint8Array(256 * 4);
(function() {
  const stops = [
    { t: 0.0,  r: 0,   g: 0,   b: 0,   a: 0 },
    { t: 0.25, r: 160, g: 30,  b: 90,  a: 80 },
    { t: 0.5,  r: 220, g: 50,  b: 140, a: 160 },
    { t: 0.75, r: 200, g: 60,  b: 200, a: 220 },
    { t: 1.0,  r: 255, g: 200, b: 255, a: 255 },
  ];
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    let s0 = stops[0], s1 = stops[1];
    for (let s = 0; s < stops.length - 1; s++) {
      if (t >= stops[s].t && t <= stops[s + 1].t) { s0 = stops[s]; s1 = stops[s + 1]; break; }
    }
    const f = (t - s0.t) / (s1.t - s0.t);
    const idx = i * 4;
    PINK_COLORMAP[idx]     = s0.r + (s1.r - s0.r) * f;
    PINK_COLORMAP[idx + 1] = s0.g + (s1.g - s0.g) * f;
    PINK_COLORMAP[idx + 2] = s0.b + (s1.b - s0.b) * f;
    PINK_COLORMAP[idx + 3] = s0.a + (s1.a - s0.a) * f;
  }
})();

// ============================================================
//  UNIFIED HEATMAP RENDERING
//  Computes Coulomb and strong force cross-terms per pixel,
//  renders based on strongMode. Drawn in world space so it
//  zooms correctly with the canvas transform.
//
//  The heatmap covers the visible viewport (accounting for zoom).
//  At high zoom, we render more pixels in world space for the
//  smaller visible region, keeping detail sharp.
// ============================================================
function drawHeatmap() {
  // Compute the world-space region currently visible on screen
  const zoomScale = 1.5;
  let midX = canvas.width / 2;
  let midY = canvas.height / 2;
  if (particles.length > 0) {
    midX = particles.reduce((s, p) => s + p.x, 0) / particles.length;
    midY = particles.reduce((s, p) => s + p.y, 0) / particles.length;
  }

  // Visible world region: canvas dimensions / zoomScale, centered on midpoint
  const visW = canvas.width / zoomScale;
  const visH = canvas.height / zoomScale;
  const worldLeft = midX - visW / 2;
  const worldTop = midY - visH / 2;

  // Heatmap resolution: half of canvas pixels for performance
  const scale = 0.5;
  const w = Math.ceil(canvas.width * scale);
  const h = Math.ceil(canvas.height * scale);

  hmCanvas.width = w;
  hmCanvas.height = h;

  const imageData = hmCtx.createImageData(w, h);
  const data = imageData.data;

  // Build particle lists
  const protonList = [];
  const allList = [];
  for (let i = 0; i < particles.length; i++) {
    allList.push(particles[i]);
    if (particles[i].type === 'proton') protonList.push(particles[i]);
  }
  const np = protonList.length;
  const na = allList.length;
  if (na < 2 && strongMode !== 'hole') return;

  const minR = PARTICLE_RADIUS;
  const minRSq = minR * minR;
  const exArr = new Float32Array(np);
  const eyArr = new Float32Array(np);
  const sxArr = new Float32Array(na);
  const syArr = new Float32Array(na);

  const cutoff = strongCutoff();
  const lambda = cutoff / 3;
  const needStrong = (strongMode === 'pink');  // cross-term only needed for pink mode

  // Log-scale normalization
  const cSens = 5000.0, cRef = 0.02;
  const cLogNorm = Math.log(1.0 + cSens * cRef);
  const cInvLog = 1.0 / cLogNorm;
  const sSens = 5000.0, sRef = 0.001;
  const sLogNorm = Math.log(1.0 + sSens * sRef);
  const sInvLog = 1.0 / sLogNorm;

  // Ambient glow for "hole" mode — bright enough to see the hole clearly
  const ambientR = 50, ambientG = 140, ambientB = 220, ambientA = 185;

  for (let py = 0; py < h; py++) {
    // Map heatmap pixel → world coordinate (accounting for zoom viewport)
    const worldY = worldTop + (py / h) * visH;
    for (let px = 0; px < w; px++) {
      const worldX = worldLeft + (px / w) * visW;
      const di = (py * w + px) * 4;

      // --- Coulomb cross-term (proton-proton only) ---
      let coulombCross = 0;
      if (coulombVizMode === 'heatmap' && np >= 2) {
        for (let i = 0; i < np; i++) {
          const dx = worldX - protonList[i].x;
          const dy = worldY - protonList[i].y;
          let rSq = dx * dx + dy * dy;
          if (rSq < minRSq) rSq = minRSq;
          const r = Math.sqrt(rSq);
          const fieldMag = coulombStrength / (rSq * r);
          exArr[i] = dx * fieldMag;
          eyArr[i] = dy * fieldMag;
        }
        for (let i = 0; i < np; i++) {
          for (let j = i + 1; j < np; j++) {
            coulombCross += 2 * (exArr[i] * exArr[j] + eyArr[i] * eyArr[j]);
          }
        }
      }

      // --- Strong force cross-term (all nucleon pairs) ---
      let strongCross = 0;
      if (needStrong && na >= 2) {
        for (let i = 0; i < na; i++) {
          const dx = worldX - allList[i].x;
          const dy = worldY - allList[i].y;
          let rSq = dx * dx + dy * dy;
          if (rSq < minRSq) rSq = minRSq;
          const r = Math.sqrt(rSq);
          const fieldMag = strongForceStrength * Math.exp(-r / lambda) / (rSq * r);
          sxArr[i] = dx * fieldMag;
          syArr[i] = dy * fieldMag;
        }
        for (let i = 0; i < na; i++) {
          for (let j = i + 1; j < na; j++) {
            strongCross += 2 * (sxArr[i] * sxArr[j] + syArr[i] * syArr[j]);
          }
        }
      }

      // --- Strong force hole field (for 'hole' mode only) ---
      // Darkness = product of each pair's field influence at this pixel.
      // Requires two particles — a single particle alone produces no darkness.
      let holeField = 0;
      if (strongMode === 'hole' && na >= 2) {
        const holeRadius = 40;
        // Precompute per-particle influence at this pixel
        const inf = new Float32Array(na);
        for (let i = 0; i < na; i++) {
          const dx = worldX - allList[i].x;
          const dy = worldY - allList[i].y;
          const r = Math.sqrt(dx * dx + dy * dy);
          if (r < holeRadius) {
            inf[i] = Math.pow(1.0 - r / holeRadius, 1.5);
          }
        }
        // Sum pair products — only nonzero where both particles' fields overlap
        for (let i = 0; i < na; i++) {
          for (let j = i + 1; j < na; j++) {
            holeField += inf[i] * inf[j] * 6;
          }
        }
      }

      // --- Compose pixel based on strongMode ---
      let r = 0, g = 0, b = 0, a = 0;

      // Coulomb: negative cross-term → blue glow
      if (coulombCross < 0) {
        const absVal = -coulombCross;
        let mag = Math.log(1.0 + cSens * absVal) * cInvLog;
        if (mag > 1.0) mag = 1.0;
        const ci = (mag * 255) | 0;
        const ci4 = ci * 4;
        r = COULOMB_COLORMAP[ci4];
        g = COULOMB_COLORMAP[ci4 + 1];
        b = COULOMB_COLORMAP[ci4 + 2];
        a = COULOMB_COLORMAP[ci4 + 3];
      }

      if (strongMode === 'hole') {
        const holeDepth = Math.min(1.0, holeField);
        const fgA = a / 255;
        const bgA = ambientA / 255;
        // Always composite over ambient — ambient is always present
        const outA = fgA + bgA * (1 - fgA);
        let outR = ambientR, outG = ambientG, outB = ambientB;
        if (outA > 0) {
          outR = (r * fgA + ambientR * bgA * (1 - fgA)) / outA;
          outG = (g * fgA + ambientG * bgA * (1 - fgA)) / outA;
          outB = (b * fgA + ambientB * bgA * (1 - fgA)) / outA;
        }
        const visibility = 1.0 - holeDepth;
        data[di]     = outR * visibility;
        data[di + 1] = outG * visibility;
        data[di + 2] = outB * visibility;
        data[di + 3] = Math.max(ambientA, outA * visibility * 255);
      } else if (strongMode === 'pink') {
        data[di] = r; data[di+1] = g; data[di+2] = b; data[di+3] = a;
        if (strongCross < 0) {
          const absVal = -strongCross;
          let mag = Math.log(1.0 + sSens * absVal) * sInvLog;
          if (mag > 1.0) mag = 1.0;
          const ci = (mag * 255) | 0;
          const ci4 = ci * 4;
          const pR = PINK_COLORMAP[ci4], pG = PINK_COLORMAP[ci4+1];
          const pB = PINK_COLORMAP[ci4+2], pA = PINK_COLORMAP[ci4+3];
          const fgA2 = pA / 255;
          const bgA2 = data[di+3] / 255;
          const outA2 = fgA2 + bgA2 * (1 - fgA2);
          if (outA2 > 0) {
            data[di]   = (pR * fgA2 + data[di]   * bgA2 * (1 - fgA2)) / outA2;
            data[di+1] = (pG * fgA2 + data[di+1] * bgA2 * (1 - fgA2)) / outA2;
            data[di+2] = (pB * fgA2 + data[di+2] * bgA2 * (1 - fgA2)) / outA2;
            data[di+3] = outA2 * 255;
          }
        }
      } else {
        data[di] = r; data[di+1] = g; data[di+2] = b; data[di+3] = a;
      }
    }
  }

  hmCtx.putImageData(imageData, 0, 0);

  // Draw the heatmap in world space — the canvas transform handles zoom.
  // Map the heatmap image onto the visible world region.
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(hmCanvas, worldLeft, worldTop, visW, visH);
}

// ============================================================
//  ENERGY COMPUTATION — all particles
//  KE in CM frame, EIE (Coulomb p-p only), SIE (strong all pairs)
//  Total = KE + EIE + SIE (SIE not displayed but counted in total)
// ============================================================
function computeEnergy() {
  const n = particles.length;
  if (n === 0) return { ke: 0, eie: 0, sie: 0, total: 0 };

  // CM velocity (equal masses)
  let cmvx = 0, cmvy = 0;
  for (const p of particles) { cmvx += p.vx; cmvy += p.vy; }
  cmvx /= n; cmvy /= n;

  // KE in CM frame
  let ke = 0;
  for (const p of particles) {
    const rvx = p.vx - cmvx, rvy = p.vy - cmvy;
    ke += 0.5 * (rvx * rvx + rvy * rvy);
  }

  // Pairwise potential energies
  let eie = 0, sie = 0;
  const cutoff = strongCutoff();
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const a = particles[i], b = particles[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist === 0) continue;

      if (a.type === 'proton' && b.type === 'proton') {
        eie += coulombStrength / Math.max(dist, PARTICLE_RADIUS);
      }

      if (dist < cutoff) {
        const eqDist = Math.max(cutoff * equilibriumRatio, PARTICLE_RADIUS * 2);
        const span = cutoff - eqDist;
        const dr = dist - eqDist;
        sie += strongForceStrength / (2 * span) * (dr * dr - span * span);
      }
    }
  }

  return { ke, eie, sie, total: ke + eie };
}

// ============================================================
//  OVERLAY ENERGY GRAPH
//  Drawn in screen space (not affected by zoom transform).
//  Positioned in the bottom-right corner of the canvas.
//  Same visual style as v3: amber KE, blue PE, green total.
//  Always visible (alpha = 1.0).
// ============================================================
// ============================================================
//  BAR CHART — vertical bars, v5 style.
//  KE and EIE shown as bars. Total includes SIE in the number
//  but SIE does not get its own bar.
// ============================================================
function drawBarChart() {
  if (particles.length === 0) return;
  const e = computeEnergy();

  const W = 160;
  const H = canvas.height;
  const gx = canvas.width - W;
  const gy = 0;

  ctx.save();

  // Background
  ctx.fillStyle = 'rgba(10,10,26,0.92)';
  ctx.fillRect(gx, gy, W, H);
  ctx.strokeStyle = '#2a2a4a';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(gx, gy);
  ctx.lineTo(gx, gy + H);
  ctx.stroke();

  const bars = [
    { label: 'KE',  value: Math.max(0, e.ke), color: '#f87171' },
    { label: 'EIE', value: e.eie,              color: '#818cf8' },
    { label: 'Tot', value: e.total,            color: '#22c55e' },
  ];

  const pad = 12;
  const labelH = 18;
  const barW = (W - pad * 2) / bars.length;
  const chartH = H - labelH - pad;
  const baseline = gy + H - labelH;
  const maxVal = 50;

  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';

  bars.forEach((bar, i) => {
    const barPx = Math.max(0, (bar.value / maxVal) * chartH);
    const x = gx + pad + i * barW + barW * 0.1;
    const bw = barW * 0.8;

    ctx.fillStyle = bar.color;
    ctx.globalAlpha = 0.85;
    if (bar.value >= 0) {
      ctx.fillRect(x, baseline - barPx, bw, barPx);
    } else {
      ctx.fillRect(x, baseline, bw, -barPx);
    }
    ctx.globalAlpha = 1.0;

    ctx.fillStyle = bar.color;
    const labelY = Math.max(gy + 12, baseline - barPx - 4);
    ctx.fillText(bar.value.toFixed(1), x + bw / 2, labelY);

    ctx.fillStyle = '#9ca3af';
    ctx.fillText(bar.label, x + bw / 2, baseline + labelH - 3);
  });

  // Zero line
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(gx, baseline);
  ctx.lineTo(gx + W, baseline);
  ctx.stroke();

  ctx.restore();
}

// ============================================================
//  COULOMB VIZ — Ribbon and Cloud modes
// ============================================================
function drawCoulombViz() {
  const protonList = particles.filter(p => p.type === 'proton');
  if (protonList.length < 2) return;
  const refEnergy = coulombStrength / (PARTICLE_RADIUS * 2);
  for (let i = 0; i < protonList.length; i++) {
    for (let j = i + 1; j < protonList.length; j++) {
      const a = protonList[i];
      const b = protonList[j];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist === 0) continue;
      const mag = Math.min(1, (coulombStrength / dist) / refEnergy);
      if (mag < 0.005) continue;
      if (coulombVizMode === 'ribbon') {
        const lineW = dist <= 30
          ? PARTICLE_RADIUS * 2
          : Math.max(0.5, PARTICLE_RADIUS * 2 - (dist - 30) * (15 / 270));
        ctx.lineWidth = lineW;
        ctx.strokeStyle = `rgba(120, 190, 255, ${Math.min(1, mag * 3.0)})`;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      } else {
        const mx = (a.x + b.x) / 2;
        const my = (a.y + b.y) / 2;
        const blobRadius = dist * 0.8 + 40;
        const coreEdge = Math.min(0.92, 20 / blobRadius);
        const coreAlpha = Math.min(1, mag * mag * mag * 20);
        const cloudAlpha = Math.min(0.45, mag * 1.8);
        const centerAlpha = Math.max(coreAlpha, cloudAlpha);
        const grad = ctx.createRadialGradient(mx, my, 0, mx, my, blobRadius);
        grad.addColorStop(0,        `rgba(220, 240, 255, ${centerAlpha})`);
        grad.addColorStop(coreEdge, `rgba(140, 200, 255, ${cloudAlpha})`);
        grad.addColorStop(0.55,     `rgba(70, 140, 240, ${cloudAlpha * 0.2})`);
        grad.addColorStop(0.75,     `rgba(30, 80, 200, 0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(mx, my, blobRadius, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}

// ============================================================
//  DRAWING — particles with zoom transform
//  Fixed 1.5x zoom centered on the centroid of all particles.
//  Everything is drawn in world coordinates; the transform
//  handles the viewport shift.
// ============================================================
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Compute centroid of all particles (zoom target)
  let midX = canvas.width / 2;
  let midY = canvas.height / 2;
  if (particles.length > 0) {
    midX = particles.reduce((s, p) => s + p.x, 0) / particles.length;
    midY = particles.reduce((s, p) => s + p.y, 0) / particles.length;
  }

  // Apply zoom transform: translate so midpoint is at canvas center, then scale
  const zoomScale = 1.5;
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  ctx.save();
  // Translate canvas center to origin, scale, then translate back
  // offset by the difference between canvas center and midpoint
  ctx.translate(cx, cy);
  ctx.scale(zoomScale, zoomScale);
  ctx.translate(-midX, -midY);

  // --- Energy Between Particles visualization (pre-collision only; post-collision layered below) ---
  const showRibbonCloud = coulombVizMode === 'ribbon' || coulombVizMode === 'cloud';
  if (showRibbonCloud) {
    if (particles.length >= 2 && !hasCollided) drawCoulombViz();
    // Hole cuts through ribbon/cloud using multiply blend — dark hole regions darken the ribbon
    if (strongMode === 'hole' && particles.length > 0) {
      ctx.globalCompositeOperation = 'multiply';
      drawHeatmap();
      ctx.globalCompositeOperation = 'source-over';
    }
  } else if ((coulombVizMode === 'heatmap' || strongMode !== 'none') && particles.length > 0) {
    drawHeatmap();
  }

  // Helper: draw one particle body at (px, py) at given opacity
  function drawBody(px, py, isProton, alpha) {
    ctx.globalAlpha = alpha;
    const g = ctx.createRadialGradient(px - 3, py - 3, 1, px, py, PARTICLE_RADIUS);
    if (isProton) {
      g.addColorStop(0, '#ff9999');
      g.addColorStop(0.7, '#ff4444');
      g.addColorStop(1, '#cc2222');
    } else {
      g.addColorStop(0, '#ccccdd');
      g.addColorStop(0.7, '#8888aa');
      g.addColorStop(1, '#666688');
    }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(px, py, PARTICLE_RADIUS, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }

  // --- Draw particles in world space ---
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const isProton = p.type === 'proton';
    // Normal rendering
    if (strongMode !== 'hole') {
      const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, PARTICLE_RADIUS * 2.5);
      if (isProton) {
        gradient.addColorStop(0, 'rgba(255, 80, 80, 0.4)');
        gradient.addColorStop(1, 'rgba(255, 80, 80, 0)');
      } else {
        gradient.addColorStop(0, 'rgba(160, 160, 200, 0.3)');
        gradient.addColorStop(1, 'rgba(160, 160, 200, 0)');
      }
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(p.x, p.y, PARTICLE_RADIUS * 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
    drawBody(p.x, p.y, isProton, 1.0);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(isProton ? '+' : 'n', p.x, p.y + 1);
  }

  ctx.restore();

  // Bar chart — always drawn over the right edge of the canvas
  drawBarChart();
}

// ============================================================
//  RENDER A HISTORICAL FRAME (used by scrubber)
// ============================================================
function renderFrame(idx) {
  const frame = particleHistory[idx];
  if (!frame) return;
  const liveParticles = particles;
  const liveCollided = hasCollided;
  particles = frame.p;
  hasCollided = (collisionFrame >= 0 && idx >= collisionFrame);
  draw();
  particles = liveParticles;
  hasCollided = liveCollided;
}

  const toolbarH = document.getElementById('toolbar').offsetHeight;
  const scrubH = document.getElementById('scrubBar').offsetHeight;
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight - toolbarH - scrubH;
  if (!running) draw();
}
window.addEventListener('resize', resize);
setTimeout(resize, 0);

goBtn.addEventListener('click', () => {
  if (running) {
    // Stop → show "New" for next click
    running = false;
    goBtn.textContent = 'New';
    goBtn.classList.remove('running');
    cancelAnimationFrame(animId);
  } else {
    // "Go" (first time) or "New" (after stopping) → fresh start
    if (hasRunOnce) resetAndSetup();
    else if (particles.length === 0) setupScenario();
    hasRunOnce = true;
    running = true;
    goBtn.textContent = 'Stop';
    goBtn.classList.add('running');
    takeSnapshot();
    loop();

});

  timeSlider.value = 0;

// ============================================================
//  FUSION PRODUCTS
//  D + T → He-4 (particles 0-3) + n (particle 4)
//
//  Triggered when the natural KE from strong-force binding
//  rises above KE_EJECT_THRESHOLD — so the bar chart shows
//  KE climbing first, then separation follows causally.
//
//  Velocities use the actual system KE at trigger time (no
//  artificial boost). He-4 is arranged with protons on opposite
//  sides; neutron is teleported outside the strong force cutoff.
// ============================================================
const KE_EJECT_THRESHOLD = 20; // KE level that triggers ejection
const KE_EJECT_FALLBACK_MS = 2000; // safety fallback if threshold not reached

function fireFusion() {
  fusionFired = true;

  const n = particles.length; // 5

  // Current system momentum and CM-frame KE (naturally accumulated from strong force)
  let sumVx = 0, sumVy = 0;
  for (const p of particles) { sumVx += p.vx; sumVy += p.vy; }
  const cmvx = sumVx / n, cmvy = sumVy / n;

  let keCM = 0;
  for (const p of particles) {
    const rvx = p.vx - cmvx, rvy = p.vy - cmvy;
    keCM += 0.5 * (rvx * rvx + rvy * rvy);
  }

  const keCMProduct = Math.max(keCM, 8);

  // He-4 (mass 4) + n (mass 1): 4*v_He4_cm = v_n_cm, KE = 0.625*v_n_cm²
  const v_n_cm   = Math.sqrt(keCMProduct / 0.625);
  const v_He4_cm = v_n_cm / 4;

  const theta = Math.random() * 2 * Math.PI;
  const nx = Math.cos(theta), ny = Math.sin(theta);

  const v_He4_x = cmvx - nx * v_He4_cm;
  const v_He4_y = cmvy - ny * v_He4_cm;
  const v_n_x   = cmvx + nx * v_n_cm;
  const v_n_y   = cmvy + ny * v_n_cm;

  const he4cx = (particles[0].x + particles[1].x + particles[2].x + particles[3].x) / 4;
  const he4cy = (particles[0].y + particles[1].y + particles[2].y + particles[3].y) / 4;
  const r = PARTICLE_RADIUS * 1.05;
  const cutoff = strongCutoff();

  // Store start positions for lerp animation
  fusionStartPos = particles.map(p => ({ x: p.x, y: p.y }));

  // Store target positions/velocities — He-4 square with protons opposite
  fusionTargets = {
    he4: [
      { x: he4cx - r, y: he4cy,     vx: v_He4_x, vy: v_He4_y }, // D proton — left
      { x: he4cx,     y: he4cy - r, vx: v_He4_x, vy: v_He4_y }, // D neutron — top
      { x: he4cx + r, y: he4cy,     vx: v_He4_x, vy: v_He4_y }, // T proton — right
      { x: he4cx,     y: he4cy + r, vx: v_He4_x, vy: v_He4_y }, // T neutron — bottom
    ],
    n: {
      x: he4cx + nx * (cutoff + PARTICLE_RADIUS * 2),
      y: he4cy + ny * (cutoff + PARTICLE_RADIUS * 2),
      vx: v_n_x, vy: v_n_y,
    },
  };

  fusionAnimating = true;
  fusionAnimFrame = 0;
}

// ============================================================
//  ANIMATION LOOP — history recording and scrubber support
// ============================================================
function loop() {
  if (!running) return;

  if (scrubFrame >= 0) {
    // --- Scrub mode: physics paused, display historical frame ---
    timeLabelEl.textContent = `${scrubFrame + 1} / ${particleHistory.length}`;
    renderFrame(scrubFrame);
  } else {
    // --- Live mode ---
    const now = performance.now();

    if (fusionAnimating) {
      // --- He-4 rearrangement animation: lerp positions over FUSION_ANIM_FRAMES ---
      fusionAnimFrame++;
      const t = fusionAnimFrame / FUSION_ANIM_FRAMES;
      const ease = t * t * (3 - 2 * t); // smoothstep

      for (let i = 0; i < 4; i++) {
        const s = fusionStartPos[i], tgt = fusionTargets.he4[i];
        particles[i].x  = s.x + (tgt.x - s.x) * ease;
        particles[i].y  = s.y + (tgt.y - s.y) * ease;
        particles[i].vx = tgt.vx;
        particles[i].vy = tgt.vy;
      }
      const sn = fusionStartPos[4], tn = fusionTargets.n;
      particles[4].x  = sn.x + (tn.x - sn.x) * ease;
      particles[4].y  = sn.y + (tn.y - sn.y) * ease;
      particles[4].vx = tn.vx;
      particles[4].vy = tn.vy;

      if (fusionAnimFrame >= FUSION_ANIM_FRAMES) {
        fusionAnimating = false;
        for (let i = 0; i < 4; i++) {
          const tgt = fusionTargets.he4[i];
          particles[i].x = tgt.x; particles[i].y = tgt.y;
          particles[i].vx = tgt.vx; particles[i].vy = tgt.vy;
        }
        particles[4].x = tn.x; particles[4].y = tn.y;
        particles[4].vx = tn.vx; particles[4].vy = tn.vy;
      }

    } else {
      // --- Normal physics ---
      step(speed);

      // Detect first CROSS-CLUSTER contact: left (0..leftClusterSize-1) vs right
      if (!hasCollided) {
        outer: for (let i = 0; i < leftClusterSize; i++) {
          for (let j = leftClusterSize; j < particles.length; j++) {
            const cdx = particles[j].x - particles[i].x;
            const cdy = particles[j].y - particles[i].y;
            if (cdx * cdx + cdy * cdy < (PARTICLE_RADIUS * 2 + 1) * (PARTICLE_RADIUS * 2 + 1)) {
              hasCollided = true;
              collisionFrame = particleHistory.length;
              collisionTime = now;
              break outer;
            }
          }
        }
      }

      // Fire when strong-force binding has raised KE above threshold (or fallback timeout)
      // Only for D+T / T+D → He-4 + n; other combos run free physics
      const isDT = (leftChoice === 'd' && rightChoice === 't') || (leftChoice === 't' && rightChoice === 'd');
      if (hasCollided && !fusionFired && isDT) {
        framesSinceCollision++;
        if (framesSinceCollision > 40) {
          const e = computeEnergy();
          if (e.ke >= KE_EJECT_THRESHOLD || now - collisionTime > KE_EJECT_FALLBACK_MS) {
            fireFusion();
          }
        }
      }

      // Auto-stop once animation done and all particles have left the viewport
      if (fusionFired && !fusionAnimating) {
        const zoomScale = 1.5;
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const midX = particles.reduce((s, p) => s + p.x, 0) / particles.length;
        const midY = particles.reduce((s, p) => s + p.y, 0) / particles.length;
        const margin = PARTICLE_RADIUS * zoomScale;
        const allGone = particles.every(p => {
          const sx = cx + (p.x - midX) * zoomScale;
          const sy = cy + (p.y - midY) * zoomScale;
          return sx < -margin || sx > canvas.width + margin ||
                 sy < -margin || sy > canvas.height + margin;
        });
        if (allGone) {
          running = false;
          goBtn.textContent = 'New';
          goBtn.classList.remove('running');
          draw();
          return;
        }
      }
    }

    // Record history snapshot
    particleHistory.push({ p: particles.map(p => ({ ...p })), t: now });
    if (particleHistory.length > MAX_HISTORY) particleHistory.shift();

    timeSlider.disabled = false;
    timeSlider.max = particleHistory.length - 1;
    timeSlider.value = timeSlider.max;
    timeLabelEl.textContent = `${particleHistory.length}`;

    draw();
  }

  animId = requestAnimationFrame(loop);
}

// ============================================================
//  INITIAL SETUP — place the two neutrons and draw
// ============================================================
setupScenario();
draw();
</script>
