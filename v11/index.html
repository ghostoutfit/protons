<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuclear Simulation v11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
<style>
  /* ========================================
     THEME VARIABLES  (default: Synthwave)
     ======================================== */
  :root {
    --accent1:      #ff2d78;
    --accent1-dim:  rgba(255,45,120,0.25);
    --accent1-glow: rgba(255,45,120,0.55);
    --accent2:      #1a6eff;
    --accent2-dim:  rgba(26,110,255,0.18);
    --accent2-glow: rgba(26,110,255,0.45);
    --ui-bg:        rgba(8, 6, 24, 0.38);
    --ui-border:    rgba(255,255,255,0.07);
    --text-dim:     rgba(220,215,255,0.55);
    --text-bright:  rgba(240,235,255,0.92);
    --speck-color:  rgba(180,130,255,0.35);
    --neutron-core: #b0b0c4;
    --neutron-mid:  #70707f;
    --neutron-edge: #383848;
  }

  /* ========================================
     RESET & BASE
     ======================================== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #05040f;
    color: var(--text-bright);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }
  button, input, select, textarea {
    font-family: 'JetBrains Mono', monospace;
  }

  /* ========================================
     FULL-VIEWPORT CANVAS
     ======================================== */
  #main {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  #canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: default;
  }

  /* ========================================
     TOOLBAR — floating glass overlay
     ======================================== */
  #toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 20px 10px;
    background: var(--ui-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .toolbar-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  #toolbar h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--accent1);
    margin-right: 6px;
    white-space: nowrap;
    text-shadow: 0 0 12px var(--accent1-glow);
  }

  /* ========================================
     SCRUB BAR — floating glass overlay at bottom
     ======================================== */
  #scrubBar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 10;
    height: 38px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    background: var(--ui-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-top: 1px solid var(--ui-border);
    box-shadow: 0 -1px 0 var(--accent1-dim), 0 -4px 20px rgba(0,0,0,0.5);
  }
  #scrubBar .scrub-label {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  #scrubBar .scrub-time {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  #timeSlider {
    flex: 1;
    height: 3px;
    accent-color: var(--accent1);
    cursor: pointer;
    opacity: 0.8;
  }
  #timeSlider:disabled { opacity: 0.18; cursor: not-allowed; }

  /* ========================================
     PARTICLE FRAMES — borderless glass
     ======================================== */
  .particle-frame {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--ui-border);
    border-radius: 10px;
    box-shadow: 0 0 10px var(--accent1-dim), inset 0 0 8px rgba(0,0,0,0.3);
    padding: 7px 14px 9px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .particle-frame-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    text-align: center;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ========================================
     PARTICLE ICONS — canvas-drawn to match the sim exactly
     ======================================== */
  .particle-icon-canvas {
    display: block;
    flex-shrink: 0;
  }

  .particle-frame-controls {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  /* ========================================
     BUTTONS — full neon sign treatment
     Inactive base: dead tube. Active variants: full tube + bloom.
     ======================================== */
  .btn {
    padding: 4px 14px;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
    color: rgba(255,255,255,0.18);
    box-shadow: none;
    text-shadow: none;
    white-space: nowrap;
  }
  .btn:hover {
    color: rgba(255,255,255,0.38);
    border-color: rgba(255,255,255,0.12);
  }

  /* accent1 neon (pink) — Go, particle add, center, btn-neon1 */
  .btn-neon1,
  #goBtn,
  .particle-add-btn,
  #centerBtn,
  #neutronDecBtn,
  #neutronIncBtn {
    border-color: var(--accent1);
    color: rgba(255,255,255,0.5);
    background: var(--accent1-dim);
    box-shadow:
      inset 0 0 6px var(--accent1-dim),
      0 0 2px var(--accent1),
      0 0 8px var(--accent1),
      0 0 18px var(--accent1-glow),
      0 0 40px var(--accent1-dim),
      0 0 70px var(--accent1-dim);
    text-shadow:
      0 0 4px rgba(255,255,255,0.5),
      0 0 10px var(--accent1),
      0 0 22px var(--accent1-glow),
      0 0 44px var(--accent1-dim);
  }
  .btn-neon1:hover,
  #goBtn:hover,
  .particle-add-btn:hover,
  #centerBtn:hover,
  #neutronDecBtn:hover,
  #neutronIncBtn:hover {
    background: var(--accent1-glow);
    color: rgba(255,255,255,0.5);
    box-shadow:
      inset 0 0 10px var(--accent1-glow),
      0 0 4px var(--accent1),
      0 0 14px var(--accent1),
      0 0 28px var(--accent1-glow),
      0 0 60px var(--accent1-dim),
      0 0 100px var(--accent1-dim);
  }

  /* accent2 neon (cyan/violet) — Replay, btn-neon2 */
  .btn-neon2,
  #replayBtn {
    border-color: var(--accent2);
    color: rgba(255,255,255,0.5);
    background: var(--accent2-dim);
    box-shadow:
      inset 0 0 6px var(--accent2-dim),
      0 0 2px var(--accent2),
      0 0 8px var(--accent2),
      0 0 18px var(--accent2-glow),
      0 0 40px var(--accent2-dim),
      0 0 70px var(--accent2-dim);
    text-shadow:
      0 0 4px rgba(255,255,255,0.5),
      0 0 10px var(--accent2),
      0 0 22px var(--accent2-glow),
      0 0 44px var(--accent2-dim);
  }
  .btn-neon2:hover,
  #replayBtn:hover {
    background: var(--accent2-glow);
    color: rgba(255,255,255,0.5);
    box-shadow:
      inset 0 0 10px var(--accent2-glow),
      0 0 4px var(--accent2),
      0 0 14px var(--accent2),
      0 0 28px var(--accent2-glow),
      0 0 60px var(--accent2-dim),
      0 0 100px var(--accent2-dim);
  }
  #replayBtn:disabled {
    background: transparent;
    border-color: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.18);
    box-shadow: none;
    text-shadow: none;
    cursor: not-allowed;
  }

  /* Go running state */
  #goBtn.running {
    border-color: #ff4040;
    color: rgba(255,255,255,0.5);
    background: rgba(255,40,40,0.15);
    box-shadow:
      inset 0 0 6px rgba(255,40,40,0.2),
      0 0 2px #ff4040,
      0 0 8px #ff4040,
      0 0 18px rgba(255,40,40,0.5),
      0 0 40px rgba(255,40,40,0.2);
    text-shadow: 0 0 4px rgba(255,255,255,0.5), 0 0 10px #ff4040, 0 0 22px rgba(255,80,80,0.6);
  }
  #goBtn.running:hover { background: rgba(255,40,40,0.3); }


  /* ========================================
     SLIDERS — neon tube aesthetic
     Track: dim line with a faint glow
     Thumb: thin bright pill with bloom shadow
     ======================================== */
  .neutron-slider-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .neutron-slider-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent2);
    text-shadow: 0 0 6px var(--accent2-glow);
    min-width: 2em;
    font-variant-numeric: tabular-nums;
  }

  /* Shared track style for all range inputs */
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    height: 5px;
    border-radius: 3px;
    background: rgba(255,255,255,0.10);
    box-shadow:
      0 0 4px var(--accent2),
      0 0 12px var(--accent2-glow),
      0 0 28px var(--accent2-dim);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 26px;
    border-radius: 3px;
    background: var(--accent2);
    border: none;
    box-shadow:
      0 0 3px var(--accent2),
      0 0 10px var(--accent2-glow),
      0 0 24px var(--accent2-dim),
      0 0 44px var(--accent2-dim);
    cursor: grab;
    transition: box-shadow 0.15s;
  }
  input[type="range"]::-webkit-slider-thumb:active {
    cursor: grabbing;
    box-shadow:
      0 0 4px var(--accent2),
      0 0 18px var(--accent2-glow),
      0 0 40px var(--accent2-dim),
      0 0 70px var(--accent2-dim);
  }
  input[type="range"]::-moz-range-thumb {
    width: 10px; height: 26px;
    border-radius: 3px;
    background: var(--accent2);
    border: none;
    box-shadow: 0 0 3px var(--accent2), 0 0 10px var(--accent2-glow), 0 0 24px var(--accent2-dim);
    cursor: grab;
  }

  #neutronSlider { width: 140px; }

  /* ========================================
     SLIDER GROUPS & TOGGLES
     ======================================== */
  .slider-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .slider-group label {
    font-size: 10px;
    color: var(--text-dim);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0px;
  }
  .slider-group label span {
    display: inline-block;
    min-width: 3em;
    text-align: right;
    color: var(--accent2);
    text-shadow: 0 0 5px var(--accent2-glow);
  }
  .slider-group input[type="range"] { width: 72px; }

  .toggle-label {
    font-size: 10px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .toggle-label input[type="checkbox"] { accent-color: var(--accent1); }

  /* ========================================
     SLIDER ICONS (turtle / rabbit / magnifier)
     ======================================== */
  .slider-icon {
    font-size: 23px;
    line-height: 1;
    user-select: none;
    filter:
      brightness(0) invert(1)
      blur(0.75px)
      opacity(0.7)
      drop-shadow(0 0 5px var(--accent2))
      drop-shadow(0 0 14px var(--accent2))
      drop-shadow(0 0 28px var(--accent2-glow))
      drop-shadow(0 0 50px var(--accent2-glow))
      drop-shadow(0 0 80px var(--accent2-glow));
  }

  /* ========================================
     FIELD TOGGLE LABELS — neon text treatment
     ======================================== */
  .field-label-electric {
    color: var(--accent2);
    text-shadow:
      0 0 4px var(--accent2),
      0 0 10px var(--accent2-glow),
      0 0 22px var(--accent2-dim);
  }
  .field-label-strong {
    color: #ffb946;
    text-shadow:
      0 0 4px #ffb946,
      0 0 10px rgba(255,185,70,0.5),
      0 0 22px rgba(255,185,70,0.2);
  }

  /* ========================================
     ARROW WHEEL — vertical drum picker
     Active item is always in normal flow (defines height).
     Above/below items are position:absolute overlays — they
     never push other toolbar elements. On hover they slide in.
     Cycle order: selected is always in the middle.
     ======================================== */
  .arrow-wheel {
    position: relative;
  }
  .awheel-item {
    display: block;
    padding: 2px 12px;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 5px;
    background: transparent;
    color: rgba(255,255,255,0.15);
    font-size: 10px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
    letter-spacing: 0.5px;
    transition: color 0.15s, border-color 0.15s, background 0.15s,
                box-shadow 0.15s, text-shadow 0.15s,
                opacity 0.18s ease, transform 0.22s ease;
  }
  /* Inactive items float above or below — never affect layout.
     top/bottom/padding are set by JS to handle stacking.
     Padding on slot-1 items bridges the gap to the active item. */
  .awheel-item[data-position] {
    position: absolute;
    left: 0; right: 0;
    opacity: 0;
    pointer-events: none;
    color: rgba(255,255,255,0.55);
    border-color: rgba(255,255,255,0.18);
    transform: translateY(var(--slide-dir, 0px));
  }
  /* Reveal on hover — slide into place */
  .arrow-wheel:hover .awheel-item[data-position] {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .awheel-item:hover:not(.active) {
    color: var(--accent2);
    border-color: var(--accent2);
    background: var(--accent2-dim);
    box-shadow:
      0 0 4px var(--accent2),
      0 0 12px var(--accent2-glow),
      0 0 26px var(--accent2-dim);
    text-shadow:
      0 0 6px var(--accent2),
      0 0 14px var(--accent2-glow);
  }
  .awheel-item.active {
    color: var(--accent2);
    border-color: var(--accent2);
    background: var(--accent2-dim);
    box-shadow:
      0 0 3px var(--accent2),
      0 0 9px var(--accent2-glow),
      0 0 20px var(--accent2-dim);
    text-shadow:
      0 0 5px var(--accent2),
      0 0 12px var(--accent2-glow);
  }

  /* ========================================
     TAB BAR
     ======================================== */
  #tabBar {
    display: flex;
    gap: 8px;
    padding-bottom: 2px;
  }
  .tab-btn {
    padding: 4px 14px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    color: rgba(255,255,255,0.18);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    box-shadow: none;
    text-shadow: none;
  }
  .tab-btn:hover {
    color: rgba(255,255,255,0.38);
    border-color: rgba(255,255,255,0.12);
  }
  .tab-btn.active {
    color: #fff;
    border-color: var(--accent1);
    background: var(--accent1-dim);
    /* neon sign: tight tube on the border, then atmospheric bloom layers */
    box-shadow:
      inset 0 0 6px var(--accent1-dim),
      0 0 2px var(--accent1),
      0 0 8px var(--accent1),
      0 0 18px var(--accent1-glow),
      0 0 40px var(--accent1-dim),
      0 0 70px var(--accent1-dim);
    text-shadow:
      0 0 4px #fff,
      0 0 10px var(--accent1),
      0 0 22px var(--accent1-glow),
      0 0 44px var(--accent1-dim);
  }

  /* ========================================
     THEME SWITCHER
     ======================================== */
  .theme-btn {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.12);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    flex-shrink: 0;
    box-shadow: none;
  }
  .theme-btn:hover { transform: scale(1.2); box-shadow: 0 0 8px rgba(255,255,255,0.3); }
  .theme-btn.active {
    border-color: rgba(255,255,255,0.55);
    box-shadow: 0 0 6px rgba(255,255,255,0.4), 0 0 14px rgba(255,255,255,0.15);
  }
  #themeA { background: linear-gradient(135deg, #ff2d78 50%, #1a6eff 50%); }  /* pink / blue   */
  #themeB { background: linear-gradient(135deg, #ff2d78 50%, #bd00ff 50%); }  /* pink / purple */
  #themeC { background: linear-gradient(135deg, #ff2d78 50%, #00f5e0 50%); }  /* pink / teal   */

  /* ========================================
     STATS & MISC
     ======================================== */
  #stats {
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
    letter-spacing: 0.3px;
  }

  /* ========================================
     INSTRUCTIONS OVERLAY
     ======================================== */
  #instructions {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ui-bg);
    backdrop-filter: blur(10px);
    border: 1px solid var(--ui-border);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 12px;
    color: var(--text-dim);
    pointer-events: none;
    text-align: center;
    transition: opacity 0.5s;
    white-space: nowrap;
  }

  .cluster-inputs { display: flex; align-items: center; gap: 6px; }
  .cluster-label {
    font-size: 12px; color: var(--text-dim);
    display: flex; align-items: center; gap: 3px; white-space: nowrap;
  }
  .cluster-label input[type="number"] {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--ui-border);
    border-radius: 4px;
    color: var(--text-bright);
    padding: 3px 5px;
    font-size: 12px;
    width: 46px;
  }
</style>
</head>
<body>

<!-- ========================================
     TOOLBAR HTML
     ======================================== -->
<div id="toolbar">
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <div id="tabBar">
      <button class="tab-btn active" id="tabA">Protons</button>
      <button class="tab-btn" id="tabB">Protons + Neutrons</button>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-left:auto;">
      <button class="theme-btn active" id="themeA" title="Synthwave"></button>
      <button class="theme-btn" id="themeB" title="Industrial"></button>
      <button class="theme-btn" id="themeC" title="Neon Blue"></button>
    </div>
  </div>
  <div class="toolbar-row" style="align-items:flex-start;gap:10px">
    <!-- PROTONS frame: always visible, always in this position -->
    <div class="particle-frame">
      <div class="particle-frame-title"><canvas id="protonIconCanvas" class="particle-icon-canvas" width="40" height="40"></canvas></div>
      <div class="particle-frame-controls">
        <div id="particleBtns" style="display:flex;gap:6px">
          <button class="btn particle-add-btn" data-count="1">1</button>
          <button class="btn particle-add-btn" data-count="2">2</button>
          <button class="btn particle-add-btn" data-count="6">6</button>
          <button class="btn particle-add-btn" data-count="20">20</button>
          <button class="btn particle-add-btn" data-count="36">36</button>
        </div>
      </div>
    </div>
    <!-- NEUTRONS frame: visible in Tab B, invisible-but-present in Tab A to hold position -->
    <div id="neutronFrame" class="particle-frame" style="visibility:hidden">
      <div class="particle-frame-title"><canvas id="neutronIconCanvas" class="particle-icon-canvas" width="40" height="40"></canvas></div>
      <div class="particle-frame-controls">
        <div class="neutron-slider-wrap">
          <button id="neutronDecBtn" style="width:28px;height:28px;padding:0;font-size:13px;line-height:1;flex-shrink:0;">&#9664;</button>
          <input type="range" id="neutronSlider" min="0" max="50" step="1" value="2">
          <button id="neutronIncBtn" style="width:28px;height:28px;padding:0;font-size:13px;line-height:1;flex-shrink:0;">&#9654;</button>
          <span class="neutron-slider-label"><span id="neutronSliderVal">2</span></span>
        </div>
      </div>
    </div>
    <!-- GO + REPLAY always visible, bottom-aligned with the button rows -->
    <div style="display:flex;flex-direction:column;justify-content:flex-end;align-self:stretch;gap:6px;padding-bottom:10px">
      <button class="btn" id="goBtn">Go</button>
      <button class="btn" id="replayBtn" disabled>Replay</button>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-left:8px;align-self:center">
      <span id="stats">Protons: 0</span>
      <button class="btn" id="centerBtn" style="display:none;font-size:11px;padding:2px 8px">Center</button>
    </div>
  </div>
  <div class="toolbar-row">
    <div class="slider-group">
      <span class="slider-icon" title="Slow">🐢</span>
      <input type="range" id="speedSlider" min="0" max="20" step="1" value="13">
      <span class="slider-icon" title="Fast">🐇</span>
    </div>
    <div class="slider-group">
      <span class="slider-icon" title="Zoom">🔍</span>
      <input type="range" id="zoomSlider" min="5" max="40" step="1" value="20">
    </div>
    <label class="toggle-label"><input type="checkbox" id="electricFieldToggle" checked> <span class="field-label-electric">Electric field</span></label>
    <label class="toggle-label"><input type="checkbox" id="strongFieldToggle" checked> <span class="field-label-strong">Strong field</span></label>
    <div id="arrowWheel" class="arrow-wheel">
      <button class="awheel-item active" data-mode="0">Force arrows off</button>
      <button class="awheel-item" data-mode="1" data-position="below">Show all forces</button>
      <button class="awheel-item" data-mode="2" data-position="above">Show total forces</button>
    </div>
  </div>
</div>


<!-- ========================================
     MAIN CONTENT: Canvas
     ======================================== -->
<div id="main">
  <canvas id="canvas"></canvas>

  <div id="instructions">Drag particles to reposition. Use "Add Cluster" to place particles.</div>
</div>

<div id="scrubBar">
  <span class="scrub-label">Time</span>
  <input type="range" id="timeSlider" min="0" max="0" value="0" disabled>
  <span class="scrub-time" id="timeLabel">–</span>
</div>

<script>
// ============================================================
//  DOM ELEMENT REFERENCES
// ============================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const goBtn = document.getElementById('goBtn');
const replayBtn = document.getElementById('replayBtn');
const speedSlider = document.getElementById('speedSlider');
const statsEl = document.getElementById('stats');
const instructionsEl = document.getElementById('instructions');
const timeSlider  = document.getElementById('timeSlider');
const timeLabelEl = document.getElementById('timeLabel');

// ============================================================
//  SIMULATION STATE
//  All mutable state lives here. Particles are plain objects:
//  { x, y, vx, vy, type: 'proton'|'neutron' }
// ============================================================
let particles = [];
let running = false;
let animId = null;
let speed = 1.5;  // Internal dt per frame (display speed = speed * 2)

// ---- Time scrubber ----
const MAX_HISTORY = 4000;
let particleHistory = [];
let scrubFrame = -1;

// ---- Visualization toggles ----
let showElectricField = true;   // Toggle for Coulomb heatmap
let showStrongField = true;     // Toggle for strong nuclear heatmap

const antispin = true;            // Always on; suppresses runaway cluster spin

// ---- Selection & force arrows ----
let selectedParticle = null;  // Index of the clicked particle
let arrowMode = 0;            // 0=off, 1=per-source arrows, 2=net force arrow
let currentTabIsProton = true; // true = Tab A (protons only)
let currentTab = 'proton';    // 'proton' | 'nucleus'

// ============================================================
//  QUANTUM: NUCLEAR STABILITY + NEUTRON DECAY CASCADE
// ============================================================
const STABILITY_TABLE = { 1:2, 2:2, 3:4, 4:6, 5:6, 6:8, 7:8, 8:10, 9:10, 10:12 };
function maxStableNeutrons(z) {
  if (z <= 0) return 0;
  return STABILITY_TABLE[z] !== undefined ? STABILITY_TABLE[z] : Math.floor(z * 1.5);
}

const QUANTUM_ESCAPE_SPEED = 4.0;  // px/frame for ejected neutron
const COHESION_K = 0.004;          // Spring constant toward cluster CM (Quantum tab only)
let quantumEjectAt      = null;    // performance.now() when next ejection fires
let quantumTimerStartAt = null;    // when current timer began
let quantumFlashes      = [];      // [{x,y,startTime}] brief ejection flashes

function ejectDelayRange(excessRatio) {
  if (excessRatio >= 4) return [ 20,  50];
  if (excessRatio >= 3) return [ 50, 100];
  if (excessRatio >= 2) return [100, 200];
  if (excessRatio >= 1) return [200, 400];
  return                       [400, 800];
}

function ejectCount(excessRatio) {
  if (excessRatio >= 4) return 4;
  if (excessRatio >= 3) return 3;
  if (excessRatio >= 2) return 2;
  return 1;
}

function updateQuantumStability() {
  if (currentTab !== 'nucleus') return;

  for (const p of particles) {
    if (!p.ejected) { p.unstable = false; p.strongScale = 1.0; }
  }

  // Evaluate each cluster independently; cache each cluster's CM on its particles
  // so step() can apply the cohesion spring without re-clustering every substep.
  const clusters = findAllClusters();
  for (const cluster of clusters) {
    let cmx = 0, cmy = 0;
    for (const p of cluster) { cmx += p.x; cmy += p.y; }
    cmx /= cluster.length; cmy /= cluster.length;
    for (const p of cluster) { p.clusterCmx = cmx; p.clusterCmy = cmy; }
  }

  let maxExcessRatio = 0;
  const unstableClusters = [];

  for (const cluster of clusters) {
    const Z       = cluster.filter(p => p.type === 'proton').length;
    const neutrons = cluster.filter(p => p.type === 'neutron');
    const excess  = neutrons.length - maxStableNeutrons(Z);
    if (excess <= 0) continue;

    const excessRatio = Z > 0 ? excess / Z : excess;
    if (excessRatio > maxExcessRatio) maxExcessRatio = excessRatio;

    let cx = 0, cy = 0;
    for (const p of cluster) { cx += p.x; cy += p.y; }
    cx /= cluster.length; cy /= cluster.length;

    const protons = cluster.filter(p => p.type === 'proton');
    const sorted = neutrons.map(p => {
      let nearestDist = Infinity;
      for (const pr of protons) {
        const d = Math.hypot(p.x - pr.x, p.y - pr.y);
        if (d < nearestDist) nearestDist = d;
      }
      if (!isFinite(nearestDist)) nearestDist = Math.hypot(p.x - cx, p.y - cy);
      return { p, d: nearestDist };
    }).sort((a, b) => b.d - a.d);

    for (let i = 0; i < excess; i++) {
      sorted[i].p.unstable    = true;
      sorted[i].p.strongScale = 0.2;
    }

    unstableClusters.push({ cluster, sorted, excess, excessRatio, cx, cy });
  }

  if (unstableClusters.length === 0) {
    quantumEjectAt = quantumTimerStartAt = null;
    return;
  }

  const now = performance.now();
  if (quantumEjectAt === null) {
    const [lo, hi] = ejectDelayRange(maxExcessRatio);
    quantumTimerStartAt = now;
    quantumEjectAt      = now + lo + Math.random() * (hi - lo);
  } else if (now >= quantumEjectAt) {
    // Eject from every unstable cluster simultaneously
    for (const { cluster, sorted, excessRatio, cx, cy } of unstableClusters) {
      const count   = Math.min(ejectCount(excessRatio), sorted.length);
      const targets = sorted.slice(0, count).map(s => s.p);
      let totalRecoilVx = 0, totalRecoilVy = 0;

      for (const target of targets) {
        const dx = target.x - cx, dy = target.y - cy;
        const d  = Math.sqrt(dx * dx + dy * dy);
        const nx = d > 0.01 ? dx / d : Math.random() * 2 - 1;
        const ny = d > 0.01 ? dy / d : Math.random() * 2 - 1;
        target.vx = nx * QUANTUM_ESCAPE_SPEED;
        target.vy = ny * QUANTUM_ESCAPE_SPEED;
        target.ejected = true; target.unstable = false; target.strongScale = 0;
        delete target.clusterCmx; delete target.clusterCmy;
        totalRecoilVx -= target.vx; totalRecoilVy -= target.vy;
        quantumFlashes.push({ x: target.x, y: target.y, startTime: now });
      }

      const remaining = cluster.filter(p => !p.ejected);
      if (remaining.length > 0) {
        const rvx = totalRecoilVx / remaining.length;
        const rvy = totalRecoilVy / remaining.length;
        for (const p of remaining) { p.vx += rvx; p.vy += rvy; }
      }
    }
    quantumEjectAt = quantumTimerStartAt = null;
  }
}

// ---- View ----
let zoom = 2.0;  // Canvas zoom centered on canvas midpoint

// ---- Sizing ----
const PARTICLE_RADIUS = 10;  // px — display radius and physics hard-sphere radius
const MIN_DIST = 20;         // Minimum distance for force calc = 2*PARTICLE_RADIUS (softening floor)

// ============================================================
//  PHYSICS PARAMETERS
//  These are fixed — changing them changes the whole character
//  of the simulation (equilibrium distance, fusion threshold, etc.)
// ============================================================
const coulombStrength = 139;      // K in F = K/r² (Coulomb repulsion, proton-proton only)
let strongForceStrength = 0.25;   // Constant attractive force magnitude within cutoff
let strongForceRange = 1.2;       // Cutoff = PARTICLE_RADIUS * 2 * strongForceRange
const COULOMB_CUTOFF_SQ = (PARTICLE_RADIUS * 40) ** 2;  // 400px — Coulomb force negligible beyond this
const equilibriumRatio = 0.6;     // Ratio r_eq / r_cutoff (informational, not used directly)
const damping = 1.00;             // Velocity multiplier per frame; 1.0 = no damping
const SUBSTEPS = 20;              // Physics substeps per animation frame for integration accuracy


// ============================================================
//  HEATMAP OFFSCREEN CANVAS (half resolution for performance)
// ============================================================
const hmCanvas = document.createElement('canvas');
const hmCtx = hmCanvas.getContext('2d');

// Composite canvas: holds the fully-blended heatmap at full resolution.
// Cached between frames so we can skip recomputation every other frame.
const hmComposite = document.createElement('canvas');
const hmcCtx = hmComposite.getContext('2d');

// Pre-allocated pixel buffers; resized when canvas dimensions change.
let hmW = 0, hmH = 0;
let hmDataElec = null, hmDataStrong = null;
let hmImgElec  = null, hmImgStrong  = null;
let hmFrameCounter = 0;

function ensureHmBuffers(w, h) {
  if (hmW === w && hmH === h) return;
  hmW = w; hmH = h;
  hmCanvas.width = w; hmCanvas.height = h;
  hmDataElec   = new Uint8ClampedArray(w * h * 4);
  hmDataStrong = new Uint8ClampedArray(w * h * 4);
  hmImgElec    = new ImageData(hmDataElec,   w, h);
  hmImgStrong  = new ImageData(hmDataStrong, w, h);
}

// ============================================================
//  DRAG STATE
// ============================================================
let dragging = null;       // Index of particle being dragged, or null
let dragOffsetX = 0;
let dragOffsetY = 0;

// ============================================================
//  LAYOUT / RESIZE
// ============================================================
function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  if (!running) draw();
}
window.addEventListener('resize', resize);
setTimeout(resize, 0);

// ============================================================
//  PARTICLE HELPERS: create, position, hit-test
// ============================================================
function createParticle(x, y, type) {
  return { x, y, vx: 0, vy: 0, type: type || 'proton' };
}

function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  // Invert the centered zoom transform applied in draw()
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  return { x: (sx - cx) / zoom + cx, y: (sy - cy) / zoom + cy };
}

function findParticleAt(x, y) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const dx = p.x - x;
    const dy = p.y - y;
    if (dx * dx + dy * dy <= (PARTICLE_RADIUS + 4) * (PARTICLE_RADIUS + 4)) {  // +4px hit margin
      return i;
    }
  }
  return -1;
}

// ============================================================
//  OVERLAP RESOLUTION
//  Iterative position-correction pass: push overlapping pairs
//  apart by half the overlap distance, up to 10 iterations.
//  Used after placing or adding particles, not during physics
//  (the physics step handles collisions with its own constraint).
// ============================================================
function separateOverlaps() {
  const minSep = PARTICLE_RADIUS * 2;
  for (let iter = 0; iter < 10; iter++) {
    let moved = false;
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const a = particles[i];
        const b = particles[j];
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < minSep && dist > 0) {
          const overlap = (minSep - dist) / 2;
          const nx = dx / dist;
          const ny = dy / dist;
          a.x -= nx * overlap;
          a.y -= ny * overlap;
          b.x += nx * overlap;
          b.y += ny * overlap;
          moved = true;
        } else if (dist === 0) {
          b.x += (Math.random() - 0.5) * minSep;
          b.y += (Math.random() - 0.5) * minSep;
          moved = true;
        }
      }
    }
    if (!moved) break;
  }
}

// ============================================================
//  CANVAS MOUSE EVENTS
//  mousedown  — start dragging an existing particle (or deselect)
//  mousemove  — drag particle / initiate bucket drag once threshold met
//  mouseup    — drop particle; delete if released over trash can
//  click      — place a new particle of the selected type on empty space
//  didDrag flag prevents click from firing after a drag release
// ============================================================
let didDrag = false;
canvas.addEventListener('mousedown', (e) => {
  const pos = getCanvasPos(e);
  const idx = findParticleAt(pos.x, pos.y);
  didDrag = false;
  if (idx >= 0) {
    dragging = idx;
    dragOffsetX = particles[idx].x - pos.x;
    dragOffsetY = particles[idx].y - pos.y;
    particles[idx].vx = 0;
    particles[idx].vy = 0;
    canvas.style.cursor = 'grabbing';
    selectedParticle = idx;
    if (!running) draw();
  } else {
    selectedParticle = null;
    if (!running) draw();
  }
});

window.addEventListener('mousemove', (e) => {
  if (dragging === null) {
    const pos = getCanvasPos(e);
    const idx = findParticleAt(pos.x, pos.y);
    canvas.style.cursor = idx >= 0 ? 'grab' : 'default';
    return;
  }
  const pos = getCanvasPos(e);
  const p = particles[dragging];
  didDrag = true;
  p.x = pos.x + dragOffsetX;
  p.y = pos.y + dragOffsetY;
  p.vx = 0;
  p.vy = 0;
  if (!running) { computeEnergy(); draw(); }
});

window.addEventListener('mouseup', (e) => {
  if (dragging !== null) {
    separateOverlaps();
    if (!running) { computeEnergy(); draw(); }
  }
  dragging = null;
  canvas.style.cursor = 'default';
});

// ============================================================
//  PACKED CLUSTER BUILDER
//  Returns an array of { x, y, type } in a hex close-packed
//  arrangement centered on (0, 0).  Particles are placed at
//  touching distance (2 * PARTICLE_RADIUS) from their neighbors.
//
//  Proton assignment — farthest-point greedy:
//    1. Seed the first proton at the outermost position.
//    2. Each subsequent proton goes to the open slot whose
//       minimum distance to any already-placed proton is largest.
//  This maximises the spread of positive charge across the cluster.
// ============================================================
function buildPackedCluster(numProtons, numNeutrons, spacing = PARTICLE_RADIUS * 2) {
  if (numProtons + numNeutrons === 0) return [];

  const D    = spacing;               // 1 diameter — fine grid spacing
  const rowH = D * Math.sqrt(3) / 2;
  const jitter = () => (Math.random() - 0.5) * D * 0.3;

  // Generate a large fine hex grid (enough for all particles plus room for proton spacing)
  const span = Math.ceil(Math.sqrt(numProtons * 4 + numNeutrons)) + 4;
  const grid = [];
  for (let row = -span; row <= span; row++) {
    const xOff = (Math.abs(row) % 2 === 1) ? D / 2 : 0;
    for (let col = -span; col <= span; col++) {
      const x = col * D + xOff + jitter();
      const y = row * rowH + jitter();
      grid.push({ x, y, dist2: x * x + y * y });
    }
  }
  grid.sort((a, b) => a.dist2 - b.dist2);

  // Step 1: pick proton slots — innermost positions at least 1.5 diameters apart.
  const protonMinDist2 = (D * 1.0) * (D * 1.0);
  const protonSlots = [];
  const usedIdx = new Set();
  for (let i = 0; i < grid.length && protonSlots.length < numProtons; i++) {
    let tooClose = false;
    for (const pp of protonSlots) {
      const dx = grid[i].x - pp.x, dy = grid[i].y - pp.y;
      if (dx * dx + dy * dy < protonMinDist2) { tooClose = true; break; }
    }
    if (!tooClose) { protonSlots.push(grid[i]); usedIdx.add(i); }
  }

  // Step 2: pick neutron slots — innermost positions not already used by protons.
  const neutronSlots = [];
  for (let i = 0; i < grid.length && neutronSlots.length < numNeutrons; i++) {
    if (!usedIdx.has(i)) neutronSlots.push(grid[i]);
  }

  return [
    ...protonSlots.map(p => ({ x: p.x, y: p.y, type: 'proton'  })),
    ...neutronSlots.map(p => ({ x: p.x, y: p.y, type: 'neutron' })),
  ];
}

// ============================================================
//  RANDOM PROTON PLACER (Tab A)
//  Poisson-disk rejection sampling: each proton is placed at a
//  random position in a disk, retrying until it is farther than
//  minDist from every already-placed proton.  minDist is set well
//  above the strong-force cutoff so no interactions start.
// ============================================================
function buildRandomProtons(n) {
  if (n === 0) return [];
  const minDist = strongCutoff() * 1.8;          // clear margin above strong range
  const radius  = minDist * Math.sqrt(n) * 0.85; // disk sized for n non-overlapping protons
  const placed  = [];

  for (let i = 0; i < n; i++) {
    let best = null, bestMinD = -1;
    const attempts = 300;
    for (let a = 0; a < attempts; a++) {
      // Uniform random point inside disk
      const angle = Math.random() * 2 * Math.PI;
      const r     = Math.sqrt(Math.random()) * radius;
      const x = r * Math.cos(angle), y = r * Math.sin(angle);

      let minD = Infinity;
      for (const p of placed) {
        const dx = p.x - x, dy = p.y - y;
        const d  = Math.sqrt(dx * dx + dy * dy);
        if (d < minD) minD = d;
      }
      if (placed.length === 0 || minD >= minDist) { best = { x, y }; break; }
      if (minD > bestMinD) { bestMinD = minD; best = { x, y }; }
    }
    placed.push(best);
  }
  return placed.map(p => ({ x: p.x, y: p.y, type: 'proton' }));
}

// ============================================================
//  CLUSTER PLACEMENT
//  placeProtons(n)     — Tab A: random layout, no strong force
//  placeNucleus(p, n)  — Tab B: tight hex pack, called by
//                        Add buttons and neutron slider
// ============================================================
function resetSim() {
  running = false;
  cancelAnimationFrame(animId);
  goBtn.textContent = 'Go';
  goBtn.classList.remove('running');
  particles = [];
  snapshot = null;
  replayBtn.disabled = true;
  particleHistory = [];
  scrubFrame = -1;
  timeSlider.value = 0;
  timeSlider.max = 0;
  timeSlider.disabled = true;
  timeLabelEl.textContent = '–';
}

function placeCluster(numProtons, numNeutrons, spacing) {
  resetSim();

  const nzRatio = numProtons > 0 ? numNeutrons / numProtons : 1.0;
  strongForceStrength = Math.min(1.0, Math.max(0.01, 2 * nzRatio - 1));

  const cx = canvas.width / 2, cy = canvas.height / 2;
  const cluster = buildPackedCluster(numProtons, numNeutrons, spacing);
  for (const p of cluster) particles.push(createParticle(cx + p.x, cy + p.y, p.type));
  updateStats();
  computeEnergy();
  draw();
  hideInstructions();
}

function placeProtons(n) {
  resetSim();
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const pts = buildRandomProtons(n);
  for (const p of pts) particles.push(createParticle(cx + p.x, cy + p.y, 'proton'));
  updateStats();
  computeEnergy();
  draw();
  hideInstructions();
}

let lastNucleusProtonCount = 2;  // tracks last Add N button pressed in Tab B

function placeNucleus(numProtons, numNeutrons) {
  lastNucleusProtonCount = numProtons;
  placeCluster(numProtons, numNeutrons, PARTICLE_RADIUS * 2);
}


// ============================================================
//  SNAPSHOT STATE (captured when user presses Go)
// ============================================================
let snapshot = null;  // Deep copy of particles at simulation start

function takeSnapshot() {
  snapshot = particles.map(p => ({ x: p.x, y: p.y, vx: p.vx, vy: p.vy, type: p.type }));
  replayBtn.disabled = false;
}

function restoreSnapshot() {
  if (!snapshot) return;
  particles = snapshot.map(p => ({ x: p.x, y: p.y, vx: p.vx, vy: p.vy, type: p.type }));
}

// ============================================================
//  GO / STOP BUTTON
// ============================================================
goBtn.addEventListener('click', () => {
  running = !running;
  goBtn.textContent = running ? 'Stop' : 'Go';
  goBtn.classList.toggle('running', running);
  if (running) {
    takeSnapshot();  // Snapshot state at simulation start
    loop();
  } else {
    cancelAnimationFrame(animId);
  }
});

// ============================================================
//  REPLAY BUTTON
// ============================================================
replayBtn.addEventListener('click', () => {
  if (!snapshot) return;
  // Stop current simulation if running
  running = false;
  cancelAnimationFrame(animId);
  goBtn.textContent = 'Go';
  goBtn.classList.remove('running');
  // Restore particle state
  restoreSnapshot();
  updateStats();
  computeEnergy();
  draw();
  // Auto-start the simulation
  running = true;
  goBtn.textContent = 'Stop';
  goBtn.classList.add('running');
  loop();
});


// ============================================================
//  SPEED SLIDER (non-linear stops for fine control at low speeds)
// ============================================================
const SPEED_STOPS = [
  0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5,
  1.0, 1.5, 2.0, 2.5, 3.0,
  4, 5, 6, 7, 8, 9, 10
];
function applySpeedSlider() {
  const idx = parseInt(speedSlider.value);
  speed = SPEED_STOPS[idx] / 2;  // Internal dt is half the display value for stability
}
speedSlider.addEventListener('input', applySpeedSlider);

// ============================================================
//  VIZ TOGGLES & SLIDERS
// ============================================================

// Zoom: scale the canvas transform centered on the midpoint.
// Physics coordinates are unchanged — only the view scales.
document.getElementById('zoomSlider').addEventListener('input', function() {
  zoom = parseInt(this.value) / 10;
  if (!running) draw();
});

// Electric field: toggles Coulomb heatmap visualization.
document.getElementById('electricFieldToggle').addEventListener('change', function() {
  showElectricField = this.checked;
  if (!running) draw();
});

// Strong field: toggles strong nuclear heatmap visualization.
document.getElementById('strongFieldToggle').addEventListener('change', function() {
  showStrongField = this.checked;
  if (!running) draw();
});


// ============================================================
//  TAB SWITCHING
// ============================================================
const neutronFrame = document.getElementById('neutronFrame');

function applyTab(tab) {
  const isProtonOnly = tab === true;
  const isNucleus    = !isProtonOnly;
  currentTabIsProton = isProtonOnly;
  currentTab = isProtonOnly ? 'proton' : 'nucleus';
  neutronFrame.style.visibility = isNucleus ? 'visible' : 'hidden';
  document.getElementById('arrowWheel').style.display   = isProtonOnly ? '' : 'none';
  document.getElementById('tabA').classList.toggle('active', isProtonOnly);
  document.getElementById('tabB').classList.toggle('active', isNucleus);
  document.getElementById('centerBtn').style.display = isNucleus ? '' : 'none';
  // Reset strong force to tab default
  if (isProtonOnly) {
    strongForceStrength = 0.25;
  }
  // Clear simulation state on tab switch
  running = false;
  cancelAnimationFrame(animId);
  goBtn.textContent = 'Go';
  goBtn.classList.remove('running');
  particles = [];
  snapshot = null;
  selectedParticle = null;
  replayBtn.disabled = true;
  quantumEjectAt = quantumTimerStartAt = null;
  quantumFlashes = [];
  updateStats();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

document.getElementById('tabA').addEventListener('click', () => applyTab(true));
document.getElementById('tabB').addEventListener('click', () => {
  applyTab(false);
  neutronSlider.value = 2;
  neutronSliderVal.textContent = '2';
  placeNucleus(2, 2);
});

function findAllClusters() {
  const active = particles.filter(p => !p.ejected);
  if (active.length === 0) return [];
  const threshold = strongCutoff() * 1.5;
  const visited = new Array(active.length).fill(false);
  const clusters = [];
  for (let i = 0; i < active.length; i++) {
    if (visited[i]) continue;
    const cluster = [];
    const queue = [i];
    visited[i] = true;
    while (queue.length) {
      const idx = queue.shift();
      cluster.push(active[idx]);
      for (let j = 0; j < active.length; j++) {
        if (visited[j]) continue;
        const dx = active[idx].x - active[j].x;
        const dy = active[idx].y - active[j].y;
        if (dx * dx + dy * dy <= threshold * threshold) {
          visited[j] = true;
          queue.push(j);
        }
      }
    }
    clusters.push(cluster);
  }
  return clusters;
}

function findBiggestCluster() {
  return findAllClusters().reduce((best, c) => c.length > best.length ? c : best, []);
}

document.getElementById('centerBtn').addEventListener('click', () => {
  const cluster = findBiggestCluster();
  if (cluster.length === 0) return;

  // Position: translate so cluster centroid is at canvas centre
  let cx = 0, cy = 0;
  for (const p of cluster) { cx += p.x; cy += p.y; }
  cx /= cluster.length; cy /= cluster.length;
  const dx = canvas.width / 2 - cx;
  const dy = canvas.height / 2 - cy;
  for (const p of particles) { p.x += dx; p.y += dy; }
  for (const f of quantumFlashes) { f.x += dx; f.y += dy; }

  // Velocity: subtract cluster CM velocity from all particles
  let cvx = 0, cvy = 0;
  for (const p of cluster) { cvx += p.vx; cvy += p.vy; }
  cvx /= cluster.length; cvy /= cluster.length;
  for (const p of particles) { p.vx -= cvx; p.vy -= cvy; }

  if (!running) draw();
});

// Arrow mode wheel — fixed order, selected stays in flow, others float above/below
function setArrowWheelActive(targetBtn) {
  const items = [...document.querySelectorAll('.awheel-item[data-mode]')];
  const activeIdx = items.indexOf(targetBtn);
  const SLOT = 27; // item height (~22px) + inter-item gap (5px)

  items.forEach(item => {
    item.classList.remove('active');
    delete item.dataset.position;
    item.style.top = item.style.bottom = item.style.paddingTop = item.style.paddingBottom = '';
    item.style.removeProperty('--slide-dir');
  });

  targetBtn.classList.add('active');

  items.forEach((item, i) => {
    if (i === activeIdx) return;
    if (i < activeIdx) {
      // above active — items stack upward in original order
      const slot = activeIdx - i;                           // 1 = closest
      item.dataset.position = 'above';
      item.style.bottom = `calc(100% + ${(slot - 1) * SLOT}px)`;
      if (slot === 1) item.style.paddingBottom = '5px';
      item.style.setProperty('--slide-dir', '5px');
    } else {
      // below active — items stack downward in original order
      const slot = i - activeIdx;                           // 1 = closest
      item.dataset.position = 'below';
      item.style.top = `calc(100% + ${(slot - 1) * SLOT}px)`;
      if (slot === 1) item.style.paddingTop = '5px';
      item.style.setProperty('--slide-dir', '-5px');
    }
  });
}

document.querySelectorAll('.awheel-item[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    arrowMode = parseInt(btn.dataset.mode);
    setArrowWheelActive(btn);

  });
});
