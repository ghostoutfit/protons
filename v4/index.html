<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fusion Zoom — v4</title>
<style>
  /* ========================================
     RESET & BASE STYLES
     ======================================== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a1a;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ========================================
     TOOLBAR — minimal: title + Go + Replay
     ======================================== */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: #12122a;
    border-bottom: 1px solid #2a2a4a;
    z-index: 10;
  }

  #toolbar h1 {
    font-size: 18px;
    font-weight: 600;
    color: #ff6b6b;
    margin-right: 8px;
    white-space: nowrap;
  }

  .btn {
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }

  #goBtn {
    background: #22c55e;
    color: #fff;
  }
  #goBtn:hover { background: #16a34a; }
  #goBtn.running {
    background: #ef4444;
  }
  #goBtn.running:hover { background: #dc2626; }

  #replayBtn {
    background: #0e7490;
    color: #fff;
  }
  #replayBtn:hover { background: #0891b2; }
  #replayBtn:disabled {
    background: #1e293b;
    color: #4b5563;
    cursor: not-allowed;
  }

  #zoomOutBtn {
    background: #7c3aed;
    color: #fff;
    display: none;
  }
  #zoomOutBtn:hover { background: #6d28d9; }

  /* ========================================
     STRONG FORCE VISUALIZATION TOGGLE
     Three-position radio pill: Hole / Pink glow / None
     ======================================== */
  .toggle-label {
    font-size: 13px;
    color: #9ca3af;
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    white-space: nowrap;
  }

  .toggle-label input[type="checkbox"] {
    accent-color: #f59e0b;
  }

  #strongModeGroup {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: 4px;
    transition: opacity 0.15s;
  }

  #strongModeGroup.hidden { display: none; }

  #strongModeGroup label {
    font-size: 11px;
    color: #6b7280;
    padding: 2px 8px;
    border: 1px solid #3a3a5a;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }

  #strongModeGroup input[type="radio"] { display: none; }

  #strongModeGroup input[type="radio"]:checked + label {
    background: #2a2a4a;
    color: #e0e0e0;
    border-color: #6366f1;
  }

  /* ========================================
     CANVAS — fills remaining space
     ======================================== */
  #canvas {
    flex: 1;
    display: block;
    cursor: default;
  }

  /* ========================================
     TIME SCRUBBER BAR
     ======================================== */
  #scrubBar {
    height: 56px;
    background: #0e0e22;
    border-top: 1px solid #2a2a4a;
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 14px;
    flex-shrink: 0;
  }
  #scrubBar .scrub-label {
    font-size: 12px;
    color: #6b7280;
    white-space: nowrap;
  }
  #scrubBar .scrub-time {
    font-size: 12px;
    color: #6b7280;
    white-space: nowrap;
    min-width: 7em;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  #timeSlider {
    flex: 1;
    height: 10px;
    accent-color: #6366f1;
    cursor: pointer;
  }
  #timeSlider:disabled {
    opacity: 0.25;
    cursor: not-allowed;
  }

  /* ========================================
     PORTRAIT ORIENTATION OVERLAY (mobile)
     ======================================== */
  #portrait-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #0a0a1a;
    color: #e0e0e0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }

  #portrait-overlay .rotate-icon { font-size: 64px; margin-bottom: 1.5rem; }
  #portrait-overlay h2 { font-size: 22px; font-weight: 600; color: #ff6b6b; margin-bottom: 0.75rem; }
  #portrait-overlay p { font-size: 16px; color: #9ca3af; max-width: 280px; }

  @media (max-width: 860px) and (orientation: portrait) {
    #portrait-overlay { display: flex; }
    body > *:not(#portrait-overlay) { display: none !important; }
  }
</style>
</head>
<body>

<!-- Portrait overlay (mobile) -->
<div id="portrait-overlay">
  <div class="rotate-icon">&#x1F4F1;&#x21BB;</div>
  <h2>Rotate Your Device</h2>
  <p>Go horizontal to use this app</p>
</div>

<!-- Toolbar: just title + Go + Replay -->
<div id="toolbar">
  <h1>Fusion Zoom</h1>
  <button class="btn" id="goBtn">Go</button>
  <button class="btn" id="replayBtn" disabled>Replay</button>
  <button class="btn" id="zoomOutBtn">Zoom Out</button>
  <!-- Energy map toggle + strong force render mode -->
  <label class="toggle-label"><input type="checkbox" id="heatmapToggle" checked> Electric interaction energy</label>
  <span id="strongModeGroup">
    Strong:
    <input type="radio" name="strongMode" id="strongNone" value="none"><label for="strongNone">None</label>
    <input type="radio" name="strongMode" id="strongHole" value="hole" checked><label for="strongHole">Hole</label>
    <input type="radio" name="strongMode" id="strongPink" value="pink"><label for="strongPink">Pink glow</label>
  </span>
</div>

<!-- Full-bleed simulation canvas -->
<canvas id="canvas"></canvas>

<!-- Time scrubber — drag to move forward/backward through the interaction -->
<div id="scrubBar">
  <span class="scrub-label">Time</span>
  <input type="range" id="timeSlider" min="0" max="0" value="0" disabled>
  <span class="scrub-time" id="timeLabel">–</span>
</div>

<script>
// ============================================================
//  DOM REFERENCES
// ============================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const goBtn = document.getElementById('goBtn');
const replayBtn = document.getElementById('replayBtn');
const zoomOutBtn = document.getElementById('zoomOutBtn');
const heatmapToggle = document.getElementById('heatmapToggle');
const strongModeGroup = document.getElementById('strongModeGroup');
const timeSlider = document.getElementById('timeSlider');
const timeLabelEl = document.getElementById('timeLabel');

// ============================================================
//  PHYSICS CONSTANTS (same model as dev/v3)
// ============================================================
const PARTICLE_RADIUS = 10;
const SUBSTEPS = 20;

// Fixed physics parameters (no sliders in v4)
const coulombStrength = 30;
const strongForceStrength = 3;    // very gentle pull — slow visible acceleration across the 60px well
const strongForceRange = 3.0;      // cutoff = PARTICLE_RADIUS * 2 * 3.0 = 60px
const equilibriumRatio = 0.35;    // equilibrium at ~21px ≈ touching distance with 60px cutoff
const damping = 1.00;              // velocity damping per frame — lets bound pair settle

// ============================================================
//  STATE
// ============================================================
let particles = [];       // Array of { x, y, vx, vy, type }
let running = false;
let animId = null;
const speed = 1.5;        // dt per frame — fast approach; zoom slows to ×ZOOM_SPEED_RATIO

// ============================================================
//  HISTORY & SCRUBBER
// ============================================================
const MAX_HISTORY = 4000;
let particleHistory = [];  // Each entry: { p: [{x,y,vx,vy,type},...], zt: zoomT }
let scrubFrame = -1;       // -1 = live, >=0 = paused at a historical frame

// ============================================================
//  ZOOM STATE
//  zoomT smoothly transitions from 0 (normal view) to 1 (fully
//  zoomed). The transition takes ZOOM_DURATION_MS. When zoomed,
//  the simulation runs at 10% speed and the viewport magnifies
//  to center on the pair midpoint.
// ============================================================
let zoomT = 0;                    // Current interpolation: 0 = normal, 1 = zoomed
let zoomDirection = 0;            // +1 = zooming in, -1 = zooming out, 0 = idle
let zoomStartTime = 0;            // performance.now() when transition started
let zoomStartT = 0;               // zoomT value when transition started
let hasTriggeredZoom = false;      // True once the pair first enters strong range
let hasCollided = false;           // True once particles first physically touch — gates quantum blur and freezes energy graph
let smoothedKE = 0;               // Exponential moving average of internal KE — used for spread so it doesn't oscillate wildly
let collisionKE = 0;              // KE at moment of first contact — used for jitter spread
let peakKE = 0;                   // Peak KE from pre-buffer — used for graph display
let frozenIE = 0;                 // IE at collision moment — frozen for post-collision graph display
let collisionFrame = -1;          // particleHistory index when collision first occurred — used to gate jitter in scrubber
let collisionTime = -1;           // performance.now() when collision occurred — graph stops 100ms after
let graphCursor = -1;             // energy sample index to highlight in the graph (-1 = live/none)
const ZOOM_DURATION_MS = 600;     // Fast zoom transition
const ZOOM_MAGNIFICATION = 6;     // How much to magnify at full zoom
const ZOOM_SPEED_RATIO = 0.5;     // Half speed when zoomed in

// ============================================================
//  ENERGY GRAPH STATE
//  Accumulates energy samples from the moment zoom triggers.
//  Tracks mutual KE (relative to center of mass), mutual PE
//  (Coulomb + strong combined), and their total.
// ============================================================
let zoomEnergyHistory = [];       // Array of { ke, pe, total } — flushed at collision
let graphPreBuffer = [];          // Rolling buffer of { t, e } — last 200ms before collision
const GRAPH_MAX_SAMPLES = 1200;   // Max samples to keep

// ============================================================
//  HEATMAP STATE
// ============================================================
let showCoulomb = true;           // Toggle for electric interaction energy overlay
let strongMode = 'hole';          // 'none' | 'hole' | 'pink'

// Offscreen canvas for heatmap rendering (half resolution)
const hmCanvas = document.createElement('canvas');
const hmCtx = hmCanvas.getContext('2d');

// ============================================================
//  INITIAL CONDITIONS
//  Two neutrons placed 300px apart horizontally, centered on
//  the canvas, with inward velocities aimed at each other.
//
//  Strong force cutoff = 30px, equilibrium ~20px.
//  Approach speed of 0.5 px/dt gives a visually pleasant pace:
//  fast enough that the approach doesn't crawl, slow enough
//  that during the 10% slowdown students can watch the energy
//  graph traces evolve as the particles enter the well.
//
//  With damping = 0.98 the particles shed KE in the well and
//  settle to the equilibrium distance over ~50-100 frames.
// ============================================================
function setupScenario() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const separation = 300;    // Starting distance (>> 30px cutoff)
  const approachSpeed = 0.5; // px per internal dt unit

  particles = [
    { x: cx - separation / 2, y: cy, vx:  approachSpeed, vy: 0, type: 'neutron' },
    { x: cx + separation / 2, y: cy, vx: -approachSpeed, vy: 0, type: 'neutron' },
  ];
}

// Snapshot for replay
let snapshot = null;

function takeSnapshot() {
  snapshot = particles.map(p => ({ ...p }));
  replayBtn.disabled = false;
}

function restoreSnapshot() {
  if (!snapshot) return;
  particles = snapshot.map(p => ({ ...p }));
}

// ============================================================
//  FORCE MODEL (identical to dev/v3)
//  Coulomb: K/r² repulsion, proton-proton only
//  Strong: spring-like linear ramp with equilibrium point
// ============================================================
function strongCutoff() {
  return PARTICLE_RADIUS * 2 * strongForceRange;
}

function pairForce(dist, distSq, aType, bType) {
  let force = 0;

  // Coulomb: proton-proton only (irrelevant for neutron-neutron, but kept for completeness)
  if (aType === 'proton' && bType === 'proton') {
    const softDistSq = Math.max(distSq, PARTICLE_RADIUS * PARTICLE_RADIUS);
    force += coulombStrength / softDistSq;
  }

  // Strong nuclear force: linear ramp giving quadratic potential well
  // Below equilibrium → repulsive (positive), above → attractive (negative)
  const cutoff = strongCutoff();
  if (dist < cutoff) {
    const eqDist = Math.max(cutoff * equilibriumRatio, PARTICLE_RADIUS * 2);
    const span = cutoff - eqDist;
    const t = (dist - eqDist) / span;
    force -= t * strongForceStrength;
  }

  return force;
}

// ============================================================
//  PHYSICS STEP (forces + substep integration + hard-sphere)
//  Same substep loop as dev/v3 for energy conservation.
// ============================================================
function step(dt) {
  const n = particles.length;
  const subDt = dt / SUBSTEPS;

  for (let sub = 0; sub < SUBSTEPS; sub++) {
    // Pairwise forces
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const a = particles[i];
        const b = particles[j];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const distSq = dx * dx + dy * dy;
        const dist = Math.sqrt(distSq);
        if (dist < 0.01) continue;

        const force = pairForce(dist, distSq, a.type, b.type);
        const fx = force * (dx / dist);
        const fy = force * (dy / dist);
        a.vx -= fx * subDt;
        a.vy -= fy * subDt;
        b.vx += fx * subDt;
        b.vy += fy * subDt;
      }
    }

    // Integrate positions (symplectic Euler)
    for (let i = 0; i < n; i++) {
      particles[i].x += particles[i].vx * subDt;
      particles[i].y += particles[i].vy * subDt;
    }

    // Hard-sphere collision constraint
    const minSep = PARTICLE_RADIUS * 2;
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const a = particles[i];
        const b = particles[j];
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        const dSq = dx * dx + dy * dy;
        if (dSq >= minSep * minSep) continue;
        let d = Math.sqrt(dSq);
        if (d < 0.001) { dx = 1; dy = 0; d = 0.001; }
        const nx = dx / d;
        const ny = dy / d;
        const overlap = minSep - d;

        // Push apart equally
        a.x -= nx * overlap * 0.5;
        a.y -= ny * overlap * 0.5;
        b.x += nx * overlap * 0.5;
        b.y += ny * overlap * 0.5;

        // Zero out approaching normal velocity (inelastic safety net)
        const dvx = b.vx - a.vx;
        const dvy = b.vy - a.vy;
        const dvDotN = dvx * nx + dvy * ny;
        if (dvDotN < 0) {
          const half = dvDotN * 0.5;
          a.vx += half * nx;
          a.vy += half * ny;
          b.vx -= half * nx;
          b.vy -= half * ny;
        }
      }
    }
  }

  // Apply damping only after first collision — free approach is undamped
  if (hasCollided) {
    for (let i = 0; i < n; i++) {
      particles[i].vx *= damping;
      particles[i].vy *= damping;
    }
  }
}

// ============================================================
//  COLORMAPS
// ============================================================

// Coulomb energy: blue sequential (transparent → deep blue → near-white)
const COULOMB_COLORMAP = new Uint8Array(256 * 4);
(function() {
  const stops = [
    { t: 0.0,  r: 0,   g: 0,   b: 0,   a: 0 },
    { t: 0.2,  r: 5,   g: 20,  b: 140, a: 77 },
    { t: 0.5,  r: 20,  g: 70,  b: 220, a: 153 },
    { t: 0.8,  r: 60,  g: 160, b: 255, a: 217 },
    { t: 1.0,  r: 200, g: 235, b: 255, a: 255 },
  ];
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    let s0 = stops[0], s1 = stops[1];
    for (let s = 0; s < stops.length - 1; s++) {
      if (t >= stops[s].t && t <= stops[s + 1].t) { s0 = stops[s]; s1 = stops[s + 1]; break; }
    }
    const f = (t - s0.t) / (s1.t - s0.t);
    const idx = i * 4;
    COULOMB_COLORMAP[idx]     = s0.r + (s1.r - s0.r) * f;
    COULOMB_COLORMAP[idx + 1] = s0.g + (s1.g - s0.g) * f;
    COULOMB_COLORMAP[idx + 2] = s0.b + (s1.b - s0.b) * f;
    COULOMB_COLORMAP[idx + 3] = s0.a + (s1.a - s0.a) * f;
  }
})();

// Strong force "Pink glow" mode: transparent → pink → magenta → white
const PINK_COLORMAP = new Uint8Array(256 * 4);
(function() {
  const stops = [
    { t: 0.0,  r: 0,   g: 0,   b: 0,   a: 0 },
    { t: 0.25, r: 160, g: 30,  b: 90,  a: 80 },
    { t: 0.5,  r: 220, g: 50,  b: 140, a: 160 },
    { t: 0.75, r: 200, g: 60,  b: 200, a: 220 },
    { t: 1.0,  r: 255, g: 200, b: 255, a: 255 },
  ];
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    let s0 = stops[0], s1 = stops[1];
    for (let s = 0; s < stops.length - 1; s++) {
      if (t >= stops[s].t && t <= stops[s + 1].t) { s0 = stops[s]; s1 = stops[s + 1]; break; }
    }
    const f = (t - s0.t) / (s1.t - s0.t);
    const idx = i * 4;
    PINK_COLORMAP[idx]     = s0.r + (s1.r - s0.r) * f;
    PINK_COLORMAP[idx + 1] = s0.g + (s1.g - s0.g) * f;
    PINK_COLORMAP[idx + 2] = s0.b + (s1.b - s0.b) * f;
    PINK_COLORMAP[idx + 3] = s0.a + (s1.a - s0.a) * f;
  }
})();

// ============================================================
//  UNIFIED HEATMAP RENDERING
//  Computes Coulomb and strong force cross-terms per pixel,
//  renders based on strongMode. Drawn in world space so it
//  zooms correctly with the canvas transform.
//
//  The heatmap covers the visible viewport (accounting for zoom).
//  At high zoom, we render more pixels in world space for the
//  smaller visible region, keeping detail sharp.
// ============================================================
function drawHeatmap() {
  // Compute the world-space region currently visible on screen
  const zoomScale = 1 + (ZOOM_MAGNIFICATION - 1) * zoomT;
  let midX = canvas.width / 2;
  let midY = canvas.height / 2;
  if (particles.length === 2) {
    midX = (particles[0].x + particles[1].x) / 2;
    midY = (particles[0].y + particles[1].y) / 2;
  }

  // Visible world region: canvas dimensions / zoomScale, centered on midpoint
  const visW = canvas.width / zoomScale;
  const visH = canvas.height / zoomScale;
  const worldLeft = midX - visW / 2;
  const worldTop = midY - visH / 2;

  // Heatmap resolution: half of canvas pixels for performance
  const scale = 0.5;
  const w = Math.ceil(canvas.width * scale);
  const h = Math.ceil(canvas.height * scale);

  hmCanvas.width = w;
  hmCanvas.height = h;

  const imageData = hmCtx.createImageData(w, h);
  const data = imageData.data;

  // Build particle lists
  const protonList = [];
  const allList = [];
  for (let i = 0; i < particles.length; i++) {
    allList.push(particles[i]);
    if (particles[i].type === 'proton') protonList.push(particles[i]);
  }
  const np = protonList.length;
  const na = allList.length;
  if (na < 2) return;

  const minR = PARTICLE_RADIUS;
  const minRSq = minR * minR;
  const exArr = new Float32Array(np);
  const eyArr = new Float32Array(np);
  const sxArr = new Float32Array(na);
  const syArr = new Float32Array(na);

  const cutoff = strongCutoff();
  const lambda = cutoff / 3;
  const needStrong = (strongMode === 'pink');  // cross-term only needed for pink mode

  // Log-scale normalization
  const cSens = 5000.0, cRef = 0.02;
  const cLogNorm = Math.log(1.0 + cSens * cRef);
  const cInvLog = 1.0 / cLogNorm;
  const sSens = 5000.0, sRef = 0.001;
  const sLogNorm = Math.log(1.0 + sSens * sRef);
  const sInvLog = 1.0 / sLogNorm;

  // Ambient glow for "hole" mode — bright enough to see the hole clearly
  const ambientR = 50, ambientG = 140, ambientB = 220, ambientA = 185;

  for (let py = 0; py < h; py++) {
    // Map heatmap pixel → world coordinate (accounting for zoom viewport)
    const worldY = worldTop + (py / h) * visH;
    for (let px = 0; px < w; px++) {
      const worldX = worldLeft + (px / w) * visW;
      const di = (py * w + px) * 4;

      // --- Coulomb cross-term (proton-proton only) ---
      let coulombCross = 0;
      if (showCoulomb && np >= 2) {
        for (let i = 0; i < np; i++) {
          const dx = worldX - protonList[i].x;
          const dy = worldY - protonList[i].y;
          let rSq = dx * dx + dy * dy;
          if (rSq < minRSq) rSq = minRSq;
          const r = Math.sqrt(rSq);
          const fieldMag = coulombStrength / (rSq * r);
          exArr[i] = dx * fieldMag;
          eyArr[i] = dy * fieldMag;
        }
        for (let i = 0; i < np; i++) {
          for (let j = i + 1; j < np; j++) {
            coulombCross += 2 * (exArr[i] * exArr[j] + eyArr[i] * eyArr[j]);
          }
        }
      }

      // --- Strong force cross-term (all nucleon pairs) ---
      let strongCross = 0;
      if (needStrong && na >= 2) {
        for (let i = 0; i < na; i++) {
          const dx = worldX - allList[i].x;
          const dy = worldY - allList[i].y;
          let rSq = dx * dx + dy * dy;
          if (rSq < minRSq) rSq = minRSq;
          const r = Math.sqrt(rSq);
          const fieldMag = strongForceStrength * Math.exp(-r / lambda) / (rSq * r);
          sxArr[i] = dx * fieldMag;
          syArr[i] = dy * fieldMag;
        }
        for (let i = 0; i < na; i++) {
          for (let j = i + 1; j < na; j++) {
            strongCross += 2 * (sxArr[i] * sxArr[j] + syArr[i] * syArr[j]);
          }
        }
      }

      // --- Strong force hole field (for 'hole' mode only) ---
      let holeField = 0;
      if (strongMode === 'hole' && na >= 1) {
        const holeRadius = 40;  // dark zone extends 40px from each particle center
        for (let i = 0; i < na; i++) {
          const dx = worldX - allList[i].x;
          const dy = worldY - allList[i].y;
          const rSq = dx * dx + dy * dy;
          const r = Math.sqrt(rSq < minRSq ? minRSq : rSq);
          if (r < holeRadius) {
            const t = r / holeRadius;
            holeField += Math.pow(1.0 - t, 3) * 8;  // cubic, scaled so surface = full black; drops sharply near edge
          }
        }
      }

      // --- Compose pixel based on strongMode ---
      let r = 0, g = 0, b = 0, a = 0;

      // Coulomb: negative cross-term → blue glow
      if (coulombCross < 0) {
        const absVal = -coulombCross;
        let mag = Math.log(1.0 + cSens * absVal) * cInvLog;
        if (mag > 1.0) mag = 1.0;
        const ci = (mag * 255) | 0;
        const ci4 = ci * 4;
        r = COULOMB_COLORMAP[ci4];
        g = COULOMB_COLORMAP[ci4 + 1];
        b = COULOMB_COLORMAP[ci4 + 2];
        a = COULOMB_COLORMAP[ci4 + 3];
      }

      if (strongMode === 'hole') {
        const holeDepth = Math.min(1.0, holeField);
        const fgA = a / 255;
        const bgA = ambientA / 255;
        const outA = fgA + bgA * (1 - fgA);
        let outR = 0, outG = 0, outB = 0;
        if (outA > 0) {
          outR = (r * fgA + ambientR * bgA * (1 - fgA)) / outA;
          outG = (g * fgA + ambientG * bgA * (1 - fgA)) / outA;
          outB = (b * fgA + ambientB * bgA * (1 - fgA)) / outA;
        }
        const visibility = 1.0 - holeDepth;
        data[di]     = outR * visibility;
        data[di + 1] = outG * visibility;
        data[di + 2] = outB * visibility;
        data[di + 3] = outA * visibility * 255;
      } else if (strongMode === 'pink') {
        data[di] = r; data[di+1] = g; data[di+2] = b; data[di+3] = a;
        if (strongCross < 0) {
          const absVal = -strongCross;
          let mag = Math.log(1.0 + sSens * absVal) * sInvLog;
          if (mag > 1.0) mag = 1.0;
          const ci = (mag * 255) | 0;
          const ci4 = ci * 4;
          const pR = PINK_COLORMAP[ci4], pG = PINK_COLORMAP[ci4+1];
          const pB = PINK_COLORMAP[ci4+2], pA = PINK_COLORMAP[ci4+3];
          const fgA2 = pA / 255;
          const bgA2 = data[di+3] / 255;
          const outA2 = fgA2 + bgA2 * (1 - fgA2);
          if (outA2 > 0) {
            data[di]   = (pR * fgA2 + data[di]   * bgA2 * (1 - fgA2)) / outA2;
            data[di+1] = (pG * fgA2 + data[di+1] * bgA2 * (1 - fgA2)) / outA2;
            data[di+2] = (pB * fgA2 + data[di+2] * bgA2 * (1 - fgA2)) / outA2;
            data[di+3] = outA2 * 255;
          }
        }
      } else {
        data[di] = r; data[di+1] = g; data[di+2] = b; data[di+3] = a;
      }
    }
  }

  hmCtx.putImageData(imageData, 0, 0);

  // Draw the heatmap in world space — the canvas transform handles zoom.
  // Map the heatmap image onto the visible world region.
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(hmCanvas, worldLeft, worldTop, visW, visH);
}

// ============================================================
//  PAIR ENERGY COMPUTATION
//  Computes the mutual energy of the two-particle system:
//  - KE relative to center of mass (removes bulk translation)
//  - PE from both Coulomb and strong force
//  - Total = KE + PE
// ============================================================
function computePairEnergy() {
  if (particles.length < 2) return null;
  const a = particles[0];
  const b = particles[1];

  // Center-of-mass velocity (equal masses)
  const cmvx = (a.vx + b.vx) / 2;
  const cmvy = (a.vy + b.vy) / 2;

  // Relative velocities (subtract CM motion)
  const arvx = a.vx - cmvx;
  const arvy = a.vy - cmvy;
  const brvx = b.vx - cmvx;
  const brvy = b.vy - cmvy;

  // Mutual KE: kinetic energy in the CM frame
  const ke = 0.5 * (arvx * arvx + arvy * arvy + brvx * brvx + brvy * brvy);

  // Pair separation
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const dist = Math.sqrt(dx * dx + dy * dy);

  let pe = 0;
  if (dist > 0) {
    // Coulomb potential (proton-proton only, but included for completeness)
    if (a.type === 'proton' && b.type === 'proton') {
      const softDist = Math.max(dist, PARTICLE_RADIUS);
      pe += coulombStrength / softDist;
    }

    // Strong force potential: V = S/(2*span) * [(r-eq)² - span²]
    const cutoff = strongCutoff();
    if (dist < cutoff) {
      const eqDist = Math.max(cutoff * equilibriumRatio, PARTICLE_RADIUS * 2);
      const span = cutoff - eqDist;
      const dr = dist - eqDist;
      pe += strongForceStrength / (2 * span) * (dr * dr - span * span);
    }
  }

  return { ke, pe, total: ke + pe };
}

// ============================================================
//  OVERLAY ENERGY GRAPH
//  Drawn in screen space (not affected by zoom transform).
//  Positioned in the bottom-right corner of the canvas.
//  Same visual style as v3: amber KE, blue PE, green total.
//  Fades in/out with zoomT.
// ============================================================
const GRAPH_W = 392;
const GRAPH_H = 280;
const GRAPH_PAD = 16;

function drawOverlayGraph() {
  if (zoomEnergyHistory.length < 2) return;

  const alpha = zoomT;  // Fade with zoom level
  if (alpha < 0.01) return;

  // Position: bottom-right corner with padding
  const gx = canvas.width - GRAPH_W - GRAPH_PAD;
  const gy = canvas.height - GRAPH_H - GRAPH_PAD;

  ctx.save();
  ctx.globalAlpha = alpha;

  // Background panel
  ctx.fillStyle = 'rgba(10, 10, 26, 0.85)';
  ctx.strokeStyle = 'rgba(42, 42, 74, 0.8)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(gx, gy, GRAPH_W, GRAPH_H, 6);
  ctx.fill();
  ctx.stroke();

  // HACK: +59.7 offset on IE and Total — dumb display fudge, replace with proper calibration later
  const IE_HACK_OFFSET = 59.7;

  // Compute Y-axis scale from visible data (auto-fit)
  const len = zoomEnergyHistory.length;
  const visStart = 0;  // Show all samples
  const maxVal = 100;  // Fixed scale 0–100

  const visCount = len - visStart;
  const xStep = (GRAPH_W - 8) / Math.max(visCount - 1, 1);
  const plotL = gx + 4;
  const plotT = gy + 4;
  const plotH = GRAPH_H - 8;

  // Zero line
  const zeroY = plotT + plotH - (-0 / maxVal) * (plotH - 4) - 2;
  // Actually compute properly: val=0 → y position
  const baseY = plotT + plotH - (0 / maxVal) * (plotH - 4) - 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(plotL, baseY);
  ctx.lineTo(plotL + GRAPH_W - 8, baseY);
  ctx.stroke();

  // Draw a trace line. For pe and total, add collisionKE after impact so total stays flat.
  function drawTrace(key, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < visCount; i++) {
      const e = zoomEnergyHistory[visStart + i];
      const postCollision = collisionTime >= 0 && e.t >= collisionTime;
      const hackOffset = (key === 'pe' || key === 'total') ? IE_HACK_OFFSET : 0;
      let val;
      if (postCollision) {
        if (key === 'ke')    val = peakKE;
        else if (key === 'pe')    val = frozenIE;
        else /* total */     val = frozenIE + peakKE;
      } else {
        val = e[key];
      }
      const x = plotL + i * xStep;
      const y = plotT + plotH - ((val + hackOffset) / maxVal) * (plotH - 4) - 2;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  drawTrace('pe', '#3b82f6');    // Blue: IE (interaction energy)
  drawTrace('ke', '#f59e0b');    // Amber: kinetic energy
  drawTrace('total', '#22c55e'); // Green: total

  // Cursor: vertical line at current scrub position
  if (graphCursor >= 0) {
    const ci = graphCursor - visStart;
    if (ci >= 0 && ci < visCount) {
      const cx = plotL + ci * xStep;
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(cx, plotT);
      ctx.lineTo(cx, plotT + plotH);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // Resolve displayed sample: cursor position or latest
  const displayIdx = (graphCursor >= 0 && graphCursor < len) ? graphCursor : len - 1;
  const displayE = zoomEnergyHistory[displayIdx];
  const displayPost = collisionTime >= 0 && displayE.t >= collisionTime;
  const displayKE  = displayPost ? peakKE : displayE.ke;
  const displayIE  = (displayPost ? frozenIE : displayE.pe) + IE_HACK_OFFSET;
  const displayTot = (displayPost ? frozenIE + peakKE : displayE.total) + IE_HACK_OFFSET;

  // Legend with live values
  ctx.font = '13px sans-serif';
  ctx.textAlign = 'left';
  const legendX = gx + 10;
  const legendY = gy + 18;
  const labels = [
    { text: 'KE (particle speed)', color: '#f59e0b', val: displayKE },
    { text: 'IE (field)*',         color: '#3b82f6', val: displayIE },
    { text: 'Total*',              color: '#22c55e', val: displayTot },
  ];
  for (let i = 0; i < labels.length; i++) {
    ctx.fillStyle = labels[i].color;
    ctx.fillRect(legendX, legendY + i * 18 - 7, 10, 10);
    ctx.fillStyle = '#9ca3af';
    ctx.fillText(labels[i].text, legendX + 15, legendY + i * 18);
    ctx.fillStyle = labels[i].color;
    ctx.textAlign = 'right';
    ctx.fillText(labels[i].val.toFixed(1), gx + GRAPH_W - 10, legendY + i * 18);
    ctx.textAlign = 'left';
  }

  ctx.restore();
}

// ============================================================
//  ZOOM HELPERS
// ============================================================

// Smooth ease-in-out curve (cubic hermite)
function easeInOut(t) {
  return t * t * (3 - 2 * t);
}

// Start a zoom transition in the given direction (+1 = in, -1 = out)
function startZoomTransition(direction) {
  zoomDirection = direction;
  zoomStartTime = performance.now();
  zoomStartT = zoomT;
  if (direction > 0) {
    zoomOutBtn.style.display = 'inline-block';
  }
}

// Update zoomT based on elapsed time since transition started.
// Returns true if the transition is still in progress.
function updateZoom() {
  if (zoomDirection === 0) return false;

  const elapsed = performance.now() - zoomStartTime;
  const progress = Math.min(elapsed / ZOOM_DURATION_MS, 1);
  const eased = easeInOut(progress);

  if (zoomDirection > 0) {
    // Zooming in: zoomStartT → 1
    zoomT = zoomStartT + (1 - zoomStartT) * eased;
  } else {
    // Zooming out: zoomStartT → 0
    zoomT = zoomStartT * (1 - eased);
  }

  // Transition complete
  if (progress >= 1) {
    zoomT = zoomDirection > 0 ? 1 : 0;
    if (zoomDirection < 0) {
      zoomOutBtn.style.display = 'none';
    }
    zoomDirection = 0;
  }

  return true;
}

// ============================================================
//  DRAWING — particles with zoom transform
//  When zoomT > 0, the canvas is transformed to center on the
//  midpoint between the two particles and magnify. Everything
//  is drawn in world coordinates; the transform handles the
//  viewport shift.
// ============================================================
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Compute pair midpoint (zoom target)
  let midX = canvas.width / 2;
  let midY = canvas.height / 2;
  if (particles.length === 2) {
    midX = (particles[0].x + particles[1].x) / 2;
    midY = (particles[0].y + particles[1].y) / 2;
  }

  // Apply zoom transform: translate so midpoint is at canvas center, then scale
  const zoomScale = 1 + (ZOOM_MAGNIFICATION - 1) * zoomT;
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  ctx.save();
  // Translate canvas center to origin, scale, then translate back
  // offset by the difference between canvas center and midpoint
  ctx.translate(cx, cy);
  ctx.scale(zoomScale, zoomScale);
  ctx.translate(-midX, -midY);

  // --- Heatmap (drawn in world space, zooms with the transform) ---
  if ((showCoulomb || strongMode !== 'none') && particles.length > 0) {
    drawHeatmap();
  }

  // --- Quantum blur state: only active once particles have physically touched ---
  const bound = hasCollided;
  let quantumSpread = 0;
  if (bound) {
    const MIN_SPREAD = 6;
    const MAX_SPREAD = 22;
    const breathe = 1 + 0.18 * Math.sin(performance.now() * 0.0045);
    quantumSpread = (MIN_SPREAD + Math.min(collisionKE, 10) * 1.2) * breathe;
    if (quantumSpread > MAX_SPREAD) quantumSpread = MAX_SPREAD;
  }

  // Helper: draw one particle body at (px, py) at given opacity
  function drawBody(px, py, isProton, alpha) {
    ctx.globalAlpha = alpha;
    const g = ctx.createRadialGradient(px - 3, py - 3, 1, px, py, PARTICLE_RADIUS);
    if (isProton) {
      g.addColorStop(0, '#ff9999');
      g.addColorStop(0.7, '#ff4444');
      g.addColorStop(1, '#cc2222');
    } else {
      g.addColorStop(0, '#ccccdd');
      g.addColorStop(0.7, '#8888aa');
      g.addColorStop(1, '#666688');
    }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(px, py, PARTICLE_RADIUS, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }

  // --- Draw particles in world space ---
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const isProton = p.type === 'proton';

    if (bound) {
      // Quantum blur: ghost copies spread by Gaussian, radius breathing with KE
      const NUM_GHOSTS = 10;
      for (let g = 0; g < NUM_GHOSTS; g++) {
        // Uniform disk — no Gaussian tails sending ghosts off-screen
        const r = quantumSpread * Math.sqrt(Math.random());
        const theta = Math.random() * Math.PI * 2;
        drawBody(p.x + r * Math.cos(theta), p.y + r * Math.sin(theta), isProton, 0.10 + Math.random() * 0.08);
      }
      // Brighter core to anchor the eye
      drawBody(p.x, p.y, isProton, 0.55);

    } else {
      // Normal rendering
      if (strongMode !== 'hole') {
        const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, PARTICLE_RADIUS * 2.5);
        if (isProton) {
          gradient.addColorStop(0, 'rgba(255, 80, 80, 0.4)');
          gradient.addColorStop(1, 'rgba(255, 80, 80, 0)');
        } else {
          gradient.addColorStop(0, 'rgba(160, 160, 200, 0.3)');
          gradient.addColorStop(1, 'rgba(160, 160, 200, 0)');
        }
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(p.x, p.y, PARTICLE_RADIUS * 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
      drawBody(p.x, p.y, isProton, 1.0);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(isProton ? '+' : 'n', p.x, p.y + 1);
    }
  }

  ctx.restore();

  // Debug readout (drawn in screen space, unaffected by zoom)
  if (particles.length === 2) {
    const dx = particles[1].x - particles[0].x;
    const dy = particles[1].y - particles[0].y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const cutoff = strongCutoff();
    const inRange = dist < cutoff;
    ctx.fillStyle = inRange ? '#22c55e' : '#6b7280';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(
      `dist: ${dist.toFixed(1)}px  cutoff: ${cutoff.toFixed(0)}px  zoom: ${(zoomT * 100).toFixed(0)}%  ${inRange ? 'STRONG FORCE ACTIVE' : ''}`,
      canvas.width / 2, 30
    );
  }

  // Overlay energy graph (drawn in screen space, fades with zoom)
  drawOverlayGraph();
}

// ============================================================
//  RENDER A HISTORICAL FRAME (used by scrubber)
// ============================================================
function renderFrame(idx) {
  const frame = particleHistory[idx];
  if (!frame) return;
  // Temporarily inject historical state so draw() renders correctly
  const liveParticles = particles;
  const liveZoomT = zoomT;
  const liveCollided = hasCollided;
  const liveGraphCursor = graphCursor;
  particles = frame.p;
  zoomT = frame.zt;
  // Jitter only if this frame is at or after the collision moment
  hasCollided = (collisionFrame >= 0 && idx >= collisionFrame);
  // Find the energy sample whose timestamp is closest to this frame's timestamp
  if (frame.t !== undefined && zoomEnergyHistory.length > 0) {
    let lo = 0, hi = zoomEnergyHistory.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (zoomEnergyHistory[mid].t < frame.t) lo = mid + 1;
      else hi = mid;
    }
    graphCursor = lo;
  } else {
    graphCursor = -1;
  }
  draw();
  particles = liveParticles;
  zoomT = liveZoomT;
  hasCollided = liveCollided;
  graphCursor = liveGraphCursor;
}

// ============================================================
//  LAYOUT / RESIZE
// ============================================================
function resize() {
  const toolbarH = document.getElementById('toolbar').offsetHeight;
  const scrubH = document.getElementById('scrubBar').offsetHeight;
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight - toolbarH - scrubH;
  if (!running) draw();
}
window.addEventListener('resize', resize);
setTimeout(resize, 0);

// ============================================================
//  GO / STOP
// ============================================================
goBtn.addEventListener('click', () => {
  running = !running;
  goBtn.textContent = running ? 'Stop' : 'Go';
  goBtn.classList.toggle('running', running);
  if (running) {
    if (particles.length === 0) setupScenario();
    takeSnapshot();
    loop();
  } else {
    cancelAnimationFrame(animId);
  }
});

// ============================================================
//  REPLAY — restore snapshot, reset zoom, and auto-start
// ============================================================
replayBtn.addEventListener('click', () => {
  if (!snapshot) return;
  running = false;
  cancelAnimationFrame(animId);
  goBtn.textContent = 'Go';
  goBtn.classList.remove('running');
  // Reset zoom, energy, and history state
  zoomT = 0;
  zoomDirection = 0;
  hasTriggeredZoom = false;
  hasCollided = false;
  smoothedKE = 0;
  collisionKE = 0;
  peakKE = 0;
  frozenIE = 0;
  collisionFrame = -1;
  collisionTime = -1;
  zoomEnergyHistory = [];
  graphPreBuffer = [];
  zoomOutBtn.style.display = 'none';
  particleHistory = [];
  scrubFrame = -1;
  timeSlider.value = 0;
  timeSlider.max = 0;
  timeSlider.disabled = true;
  timeLabelEl.textContent = '–';
  // Restore and go
  restoreSnapshot();
  draw();
  running = true;
  goBtn.textContent = 'Stop';
  goBtn.classList.add('running');
  loop();
});

// ============================================================
//  ZOOM OUT BUTTON — smoothly reverse the zoom
// ============================================================
zoomOutBtn.addEventListener('click', () => {
  if (zoomT > 0) {
    startZoomTransition(-1);  // Zoom out
  }
});

// ============================================================
//  TIME SCRUBBER
// ============================================================
timeSlider.addEventListener('input', () => {
  const val = parseInt(timeSlider.value);
  if (val >= particleHistory.length - 1) {
    // Dragged back to live end — resume
    scrubFrame = -1;
    timeLabelEl.textContent = `${particleHistory.length}`;
  } else {
    scrubFrame = val;
    timeLabelEl.textContent = `${val + 1} / ${particleHistory.length}`;
    if (!running) renderFrame(val);
  }
});

// ============================================================
//  HEATMAP TOGGLE + STRONG FORCE MODE
// ============================================================
heatmapToggle.addEventListener('change', () => {
  showCoulomb = heatmapToggle.checked;
  if (!running) draw();
});

document.querySelectorAll('input[name="strongMode"]').forEach(radio => {
  radio.addEventListener('change', () => {
    strongMode = radio.value;
    if (!running) draw();
  });
});

// ============================================================
//  ANIMATION LOOP — with zoom detection, speed modulation,
//  history recording, and scrubber support
// ============================================================
function loop() {
  if (!running) return;

  if (scrubFrame >= 0) {
    // --- Scrub mode: physics paused, display historical frame ---
    timeLabelEl.textContent = `${scrubFrame + 1} / ${particleHistory.length}`;
    renderFrame(scrubFrame);
  } else {
    // --- Live mode: advance physics ---

    // Detect first entry into strong force range
    if (!hasTriggeredZoom && particles.length === 2) {
      const dx = particles[1].x - particles[0].x;
      const dy = particles[1].y - particles[0].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 80) {   // start zoom just outside strong force range (cutoff = 60px)
        hasTriggeredZoom = true;
        zoomEnergyHistory = [];
        startZoomTransition(1);
      }
    }

    // Update zoom transition
    updateZoom();

    // Pause physics while zoom transition is in progress
    if (zoomDirection === 0) {
      const speedMul = 1 - zoomT * (1 - ZOOM_SPEED_RATIO);
      step(speed * speedMul);
    }

    // Detect first physical contact — latches hasCollided permanently
    if (!hasCollided && particles.length === 2) {
      const cdx = particles[1].x - particles[0].x;
      const cdy = particles[1].y - particles[0].y;
      if (Math.sqrt(cdx * cdx + cdy * cdy) < PARTICLE_RADIUS * 2 + 1) {
        hasCollided = true;
        collisionFrame = particleHistory.length;  // next frame pushed will be index collisionFrame
        collisionTime = performance.now();
        // Flush pre-buffer (last 200ms) into the graph, preserving timestamps
        zoomEnergyHistory = graphPreBuffer.map(s => ({ ...s.e, t: s.t }));
        // Peak KE for graph (approach peak, before repulsive core slows them)
        peakKE = graphPreBuffer.reduce((mx, s) => Math.max(mx, s.e.ke), 0);
        // Freeze IE at the last pre-buffer sample (IE at moment of contact)
        frozenIE = graphPreBuffer.length > 0 ? graphPreBuffer[graphPreBuffer.length - 1].e.pe : 0;
        graphPreBuffer = [];
        // Instantaneous KE for jitter spread (same as before)
        const ce = computePairEnergy();
        collisionKE = ce ? ce.ke : 0;
      }
    }

    // Graph recording: 100ms pre-collision buffer + 100ms post-collision window.
    const now = performance.now();
    if (!hasCollided) {
      const e = computePairEnergy();
      if (e) {
        graphPreBuffer.push({ t: now, e });
        // Trim entries older than 100ms
        const cutoffT = now - 100;
        let i = 0;
        while (i < graphPreBuffer.length && graphPreBuffer[i].t < cutoffT) i++;
        if (i > 0) graphPreBuffer.splice(0, i);
      }
    } else if (collisionTime >= 0) {
      if (now - collisionTime < 120) {
        // Post-collision window: record live samples
        const e = computePairEnergy();
        if (e) {
          zoomEnergyHistory.push({ ...e, t: now });
          if (zoomEnergyHistory.length > GRAPH_MAX_SAMPLES) zoomEnergyHistory.shift();
        }
      }
    }

    // Record history snapshot — include current energy index so scrubber can drive graph cursor
    particleHistory.push({ p: particles.map(p => ({ ...p })), zt: zoomT, t: now });
    if (particleHistory.length > MAX_HISTORY) particleHistory.shift();

    // Update slider to live (rightmost) position
    timeSlider.disabled = false;
    timeSlider.max = particleHistory.length - 1;
    timeSlider.value = timeSlider.max;
    timeLabelEl.textContent = `${particleHistory.length}`;

    // Keep graph cursor at live end (most recent sample)
    graphCursor = zoomEnergyHistory.length - 1;

    draw();
  }

  animId = requestAnimationFrame(loop);
}

// ============================================================
//  INITIAL SETUP — place the two neutrons and draw
// ============================================================
setupScenario();
draw();
</script>
</body>
</html>
