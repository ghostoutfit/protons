let currentTheme = THEMES.A;
let currentThemeKey = 'A';   // serialised into sim state JSON

// ============================================================
//  PARTICLE ICON RENDERER — live animated, matches the sim exactly
//  Uses PARTICLE_RADIUS * default zoom (2) for same apparent size.
// ============================================================
const iconJitter = {
  proton:  { x: 0, y: 0 },
  neutron: { x: 0, y: 0 },
};

function drawParticleIcon(canvas, type) {
  const c = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const R  = PARTICLE_RADIUS * 1.8; // 10% smaller than default zoom
  const cx = w / 2, cy = h / 2;
  const t  = currentTheme;
  const isProton = type === 'proton';
  const jit = iconJitter[type];
  const px = cx + jit.x, py = cy + jit.y;

  c.clearRect(0, 0, w, h);

  // Flat base circle — solid mid color, soft edge fade (matches main draw)
  const baseR    = R * 1.1;
  const baseGrad = c.createRadialGradient(px, py, 0, px, py, baseR);
  const mid = isProton ? t.protonMid : t.neutronMid;
  baseGrad.addColorStop(0,    mid);
  baseGrad.addColorStop(0.82, mid);
  baseGrad.addColorStop(1,    'rgba(0,0,0,0)');
  c.fillStyle = baseGrad;
  c.beginPath(); c.arc(px, py, baseR, 0, Math.PI * 2); c.fill();

  // Inner glow — bright centered bloom
  const innerGlow = c.createRadialGradient(px, py, 0, px, py, R);
  const core = isProton ? t.protonCore : t.neutronCore;
  innerGlow.addColorStop(0,   core);
  innerGlow.addColorStop(0.5, core);
  innerGlow.addColorStop(1,   'rgba(0,0,0,0)');
  c.globalAlpha = 0.82;
  c.fillStyle = innerGlow;
  c.beginPath(); c.arc(px, py, R, 0, Math.PI * 2); c.fill();
  c.globalAlpha = 1;

  // + drawn geometrically — mathematically centered, no font metric issues
  if (isProton) {
    const arm   = R * 0.36;
    const thick = R * 0.225;
    c.fillStyle = 'rgba(255,255,255,0.88)';
    c.fillRect(px - arm,    py - thick / 2, arm * 2, thick); // horizontal
    c.fillRect(px - thick / 2, py - arm,    thick, arm * 2); // vertical
  }
}

// Icon animation loop — runs independently; picks up theme changes automatically
function iconAnimLoop() {
  for (const key of ['proton', 'neutron']) {
    const j = iconJitter[key];
    j.x += (Math.random() - 0.5) * 0.7;
    j.y += (Math.random() - 0.5) * 0.7;
    j.x *= 0.78;
    j.y *= 0.78;
  }
  const pCv = document.getElementById('protonIconCanvas');
  const nCv = document.getElementById('neutronIconCanvas');
  if (pCv) drawParticleIcon(pCv, 'proton');
  if (nCv) drawParticleIcon(nCv, 'neutron');
  requestAnimationFrame(iconAnimLoop);
}

function applyTheme(key) {
  const t = THEMES[key];
  currentTheme = t;
  currentThemeKey = key;
  const r = document.documentElement.style;
  r.setProperty('--accent1',      t.accent1);
  r.setProperty('--accent1-dim',  t.accent1dim);
  r.setProperty('--accent1-glow', t.accent1glow);
  r.setProperty('--accent2',      t.accent2);
  r.setProperty('--accent2-dim',  t.accent2dim);
  r.setProperty('--accent2-glow', t.accent2glow);
  r.setProperty('--ui-bg',        t.uibg);
  r.setProperty('--ui-border',    t.uiborder);
  r.setProperty('--text-dim',     t.textdim);
  r.setProperty('--text-bright',  t.textbright);
  r.setProperty('--speck-color',   t.speck);
  r.setProperty('--neutron-core',  t.neutronCore);
  r.setProperty('--neutron-mid',   t.neutronMid);
  r.setProperty('--neutron-edge',  t.neutronEdge);
  document.body.style.background = t.bg;
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('theme'+key).classList.add('active');
  if (!running) draw();
}
document.getElementById('themeA').addEventListener('click', () => applyTheme('A'));
document.getElementById('themeB').addEventListener('click', () => applyTheme('B'));
document.getElementById('themeC').addEventListener('click', () => applyTheme('C'));
// Per-particle jitter offsets — must be declared before applyTheme('A') calls draw()
let jitter = [];

// Initialise CSS vars from Theme A (matches :root defaults, keeps everything in sync)
applyTheme('A');

// ============================================================
//  BACKGROUND SPECKS  (drifting ambient particles)
// ============================================================
const NUM_SPECKS = 16;
const specks = Array.from({ length: NUM_SPECKS }, () => {
  const speed = 15 + Math.random() * 15;
  const angle = Math.random() * Math.PI * 2;
  return {
    x:  Math.random() * window.innerWidth,
    y:  Math.random() * window.innerHeight,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    len: 18 + Math.random() * 55,   // longer trail
    w:   0.5 + Math.random() * 0.9,
    a:   0.18 + Math.random() * 0.38,
  };
});

function updateSpecks() {
  const W = canvas.width, H = canvas.height;
  for (const s of specks) {
    s.x += s.vx; s.y += s.vy;
    if (s.x < -60) s.x = W + 60;
    else if (s.x > W + 60) s.x = -60;
    if (s.y < -60) s.y = H + 60;
    else if (s.y > H + 60) s.y = -60;
  }
}

function drawSpecks() {
  const speckColor = currentTheme.speck;
  for (const s of specks) {
    const base = speckColor.replace(/[\d.]+\)$/, `${s.a.toFixed(2)})`);
    // Draw as motion-blur line: tail behind, bright head
    const tx = s.x - s.vx / Math.hypot(s.vx, s.vy) * s.len;
    const ty = s.y - s.vy / Math.hypot(s.vx, s.vy) * s.len;
    const grad = ctx.createLinearGradient(tx, ty, s.x, s.y);
    grad.addColorStop(0, speckColor.replace(/[\d.]+\)$/, '0)'));
    grad.addColorStop(1, base);
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(s.x, s.y);
    ctx.strokeStyle = grad;
    ctx.lineWidth = s.w;
    ctx.stroke();
  }
}

// Per-particle jitter offsets (applied only when stopped)
// (declaration moved above applyTheme call to avoid TDZ crash)
function ensureJitter() {
  while (jitter.length < particles.length) jitter.push({ x: 0, y: 0 });
}
function updateJitter() {
  ensureJitter();
  for (let i = 0; i < particles.length; i++) {
    jitter[i].x += (Math.random() - 0.5) * 0.7;
    jitter[i].y += (Math.random() - 0.5) * 0.7;
    jitter[i].x *= 0.78;
    jitter[i].y *= 0.78;
  }
}

// ============================================================
// ============================================================
//  PARTICLE GRAIN TEXTURE
//  Small offscreen canvas refreshed every frame; drawn with
//  'overlay' blend clipped to each particle circle.
// ============================================================
const GRAIN_SIZE = 64;
const grainBuf = document.createElement('canvas');
grainBuf.width = grainBuf.height = GRAIN_SIZE;
const grainBufCtx = grainBuf.getContext('2d');

function refreshParticleGrain() {
  const img = grainBufCtx.createImageData(GRAIN_SIZE, GRAIN_SIZE);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = (Math.random() * 255) | 0;
    d[i] = d[i+1] = d[i+2] = v;
    d[i+3] = (Math.random() * 210) | 0;  // dense — up to 82% opaque
  }
  grainBufCtx.putImageData(img, 0, 0);
}

function drawParticleGrain(cx, cy) {
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = 0.45;
  const s = GRAIN_SIZE;
  ctx.drawImage(grainBuf, cx - s / 2, cy - s / 2, s, s);
  ctx.restore();
}

// ============================================================
//  CRT NOISE + SCANLINE OVERLAY
// ============================================================
let noiseCanvas = null, noiseCtx = null, noiseFrame = 0;

function initNoise() {
  noiseCanvas = document.createElement('canvas');
  noiseCanvas.width  = 256;
  noiseCanvas.height = 256;
  noiseCtx = noiseCanvas.getContext('2d');
}
initNoise();

// Two noise canvases — alternate each frame for denser churn
let noiseCanvas2 = document.createElement('canvas');
noiseCanvas2.width = noiseCanvas2.height = 256;
const noiseCtx2 = noiseCanvas2.getContext('2d');

function updateNoise() {
  // Fill whichever buffer is "next" — both get updated every 2 frames each
  const target = noiseFrame % 2 === 0 ? noiseCtx : noiseCtx2;
  const id = target.createImageData(256, 256);
  const d  = id.data;
  for (let i = 0; i < d.length; i += 4) {
    // denser: ~65% of pixels get a value, brighter range
    if (Math.random() > 0.35) {
      const v = Math.floor(Math.random() * 200 + 30);
      d[i] = d[i+1] = d[i+2] = v;
      d[i+3] = Math.floor(Math.random() * 80 + 15);
    }
  }
  target.putImageData(id, 0, 0);
}

function drawCRT() {
  const W = canvas.width, H = canvas.height;
  const now = performance.now();

  // Flicker: slow swell + occasional sharp dropout
  const slowFlicker  = 0.80 + 0.20 * (0.5 + 0.5 * Math.sin(now * 0.0009 + Math.sin(now * 0.00021) * 4));
  const twitch       = Math.random() > 0.978 ? 0.2 + Math.random() * 0.5 : 1.0;
  const flickerMult  = slowFlicker * twitch;

  ctx.save();

  // Layer 1: base noise tile (screen blend — brightens without washing out)
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.13 * flickerMult;
  const src = noiseFrame % 2 === 0 ? noiseCanvas : noiseCanvas2;
  for (let x = 0; x < W; x += 256) {
    for (let y = 0; y < H; y += 256) ctx.drawImage(src, x, y);
  }

  // Layer 2: second noise pass at slight offset for texture depth
  ctx.globalAlpha = 0.07 * flickerMult;
  const src2 = noiseFrame % 2 === 0 ? noiseCanvas2 : noiseCanvas;
  for (let x = 0; x < W; x += 256) {
    for (let y = 0; y < H; y += 256) ctx.drawImage(src2, x + 32, y + 32);
  }

  // Layer 3: scanlines
  ctx.globalAlpha = 0.055 * flickerMult;
  ctx.fillStyle = '#000';
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);

  ctx.restore();
}

// ============================================================
//  AMBIENT LOOP  (always-on: specks + jitter, even when stopped)
// ============================================================
let ambientId = null;
function ambientLoop() {
  noiseFrame++;
  refreshParticleGrain();
  updateJitter(); // always update, applied in draw() regardless of running state
  if (!running) {
    // When showing a historical frame, re-render it so jitter stays live.
    // When no history is loaded, just draw the current particle state.
    if (scrubFrame >= 0) {
      renderFrame(scrubFrame);
    } else {
      draw();
    }
  }
  ambientId = requestAnimationFrame(ambientLoop);
}
ambientLoop();
iconAnimLoop();

// Initial draw to populate the canvas before Go is pressed
draw();

let npRosterCache = null;

// ── DOM refs ─────────────────────────────────────────────────
const notepadPanel    = document.getElementById('notepadPanel');
const notepadBtn      = document.getElementById('notepadBtn');
const addNoteBtn      = document.getElementById('addNoteBtn');
const npAuthSection   = document.getElementById('npAuthSection');

const npCloseBtn2     = document.getElementById('npCloseBtn2');

const npFeedList      = document.getElementById('npFeedList');
const identityModal   = document.getElementById('identityModal');
const identClassCode  = document.getElementById('identClassCode');
const identRosterWrap = document.getElementById('identRosterWrap');
const identRosterSel  = document.getElementById('identRosterSel');
const identError      = document.getElementById('identError');
const identLookupBtn  = document.getElementById('identLookupBtn2');
const identStartBtn   = document.getElementById('identStartBtn');

// ── Init: returning student bypasses modal ────────────────────
window.addEventListener('load', () => {
  updatePanelGeometry();
  if (npStudentId && npStudentName) {
    npActivateStudent();
  } else {
    identityModal.classList.remove('hidden');
  }
});

function npActivateStudent() {
  npUserDisplay.textContent = npStudentName;
  npAuthSection.style.display = 'none';
  npContent.style.display = '';
}

// ── Panel open / close ────────────────────────────────────────
function openNotepadPanel() {
  notepadPanel.classList.add('open');
  document.body.classList.add('notepad-open');
  notepadBtn.classList.add('np-open');
  updatePanelGeometry();
}
function closeNotepadPanel() {
  notepadPanel.classList.remove('open');
  document.body.classList.remove('notepad-open');
  notepadBtn.classList.remove('np-open');
  SideSim.stop();
}

notepadBtn.addEventListener('click', () => {
  if (notepadPanel.classList.contains('open')) {
    closeNotepadPanel();
  } else {
    if (!npStudentId) { identityModal.classList.remove('hidden'); return; }
    openNotepadPanel();
    npShowMyTab();
    npLoadMyNotes();
  }
});
npCloseBtn1.addEventListener('click', closeNotepadPanel);
npCloseBtn2.addEventListener('click', closeNotepadPanel);

// ── Tab switching ─────────────────────────────────────────────
document.querySelectorAll('.nptab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nptab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.nptab;
    document.getElementById('npMyTab').style.display  = tab === 'my'   ? '' : 'none';
    document.getElementById('npFeedTab').style.display = tab === 'feed' ? '' : 'none';
    if (tab === 'my')   npLoadMyNotes();
    if (tab === 'feed') npLoadClassFeed();
  });
});

function npShowMyTab() {
  document.querySelectorAll('.nptab').forEach(b =>
    b.classList.toggle('active', b.dataset.nptab === 'my'));
  document.getElementById('npMyTab').style.display  = '';
  document.getElementById('npFeedTab').style.display = 'none';
}

// ── Identity modal ────────────────────────────────────────────
let npRoster = [];

identClassCode.addEventListener('keydown', e => { if (e.key === 'Enter') identLookupBtn.click(); });

async function doIdentLookup() {
  const code = identClassCode.value.trim();
  if (!code) { identError.textContent = 'Enter a class code.'; return; }
  identError.textContent = '';
  identLookupBtn.disabled = true;
  identLookupBtn.textContent = 'Looking up…';
  try {
    const cfg = await SHEETS.parseConfig();
    npRosterCache = cfg.roster;
    if (cfg.classCode !== code) throw new Error(`Code not found. Got "${cfg.classCode}"`);
    npRoster = cfg.roster;
    identRosterSel.innerHTML = '<option value="" disabled selected>— pick your name —</option>';
    cfg.roster.forEach(({ id, name }) => {
      const opt = document.createElement('option');
      opt.value = id; opt.textContent = name;
      identRosterSel.appendChild(opt);
    });
    identRosterWrap.style.display = '';
    identStartBtn.style.display   = '';
    identLookupBtn.textContent = cfg.className ? `✓ ${cfg.className}` : '✓ Class found';
  } catch(e) {
    identError.textContent = e.message;
  }
  identLookupBtn.disabled = false;
}
identLookupBtn.addEventListener('click', doIdentLookup);

identStartBtn.addEventListener('click', () => {
  if (!identRosterSel.value) { identError.textContent = 'Pick your name first.'; return; }
  const chosen = npRoster.find(r => r.id === identRosterSel.value);
  npStudentId   = chosen.id;
  npStudentName = chosen.name;
  localStorage.setItem('proton_student_id',   npStudentId);
  localStorage.setItem('proton_student_name', npStudentName);
  identityModal.classList.add('hidden');
  npActivateStudent();
  openNotepadPanel();
  npShowMyTab();
  npLoadMyNotes();
});

identityModal.addEventListener('click', e => {
  if (e.target === identityModal && npStudentId) identityModal.classList.add('hidden');
});

// ── Capture ───────────────────────────────────────────────────
addNoteBtn.addEventListener('click', () => {
  if (!npStudentId) { identityModal.classList.remove('hidden'); return; }
  openCaptureModal();
});

function captureCanvasAtWidth(src, maxW) {
  const scale = Math.min(1, maxW / src.width);
  const w = Math.round(src.width  * scale);
  const h = Math.round(src.height * scale);
  const tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  tmp.getContext('2d').drawImage(src, 0, 0, w, h);
  return tmp.toDataURL('image/jpeg', 0.88);
}

function openCaptureModal() {
  const screenshot = captureCanvasAtWidth(canvas, 800);
  const simState = JSON.stringify(captureSimState());
  npPendingCapture = { id: SHEETS.generateId(), simState, screenshot };
  capturePreviewImg.src = screenshot;
  captureAnnotation.value = '';
  captureError.textContent = '';
  captureSaveBtn.disabled = false;
  captureShareBtn.disabled = false;
  captureSaveBtn.textContent  = 'Save';
  captureShareBtn.textContent = 'Save & Share';
  captureModal.classList.remove('hidden');
  captureAnnotation.focus();
}

captureModal.addEventListener('click', e => { if (e.target === captureModal) closeCaptureModal(); });
captureCancelBtn.addEventListener('click', closeCaptureModal);
function closeCaptureModal() {
  captureModal.classList.add('hidden');
  npPendingCapture = null;
}

async function doSave(isPublic) {
  if (!npPendingCapture) return;
  captureSaveBtn.disabled  = true;
  captureShareBtn.disabled = true;
  captureSaveBtn.textContent = 'Saving…';
  captureError.textContent = '';

  const note = {
    id:          npPendingCapture.id,
    student_id:  npStudentId,
    timestamp:   new Date().toISOString(),
    sim_version: 'v12',
    sim_state:   npPendingCapture.simState,
    text:        captureAnnotation.value.trim(),
    is_public:   isPublic,
  };
  npLocalScreenshots.set(note.id, npPendingCapture.screenshot);

  try {
    await SHEETS.appendNote(note);
  } catch(e) {
    if (!e.message.includes('Failed to fetch')) {
      captureError.textContent = 'Save failed: ' + e.message;
      captureSaveBtn.disabled  = false;
      captureShareBtn.disabled = false;
      captureSaveBtn.textContent = 'Save';
      return;
    }
  }
  closeCaptureModal();
  openNotepadPanel();
  npShowMyTab();
  // Optimistic display
  npObsList.innerHTML = '';
  npObsList.appendChild(buildNoteCard(note, true));
  const hint = document.createElement('div');
  hint.className = 'obs-empty';
  hint.style.fontSize = '10px';
  hint.textContent = 'Saved! Loading your notes…';
  npObsList.appendChild(hint);
  setTimeout(() => npLoadMyNotes(note.id), 1800);
}

captureSaveBtn.addEventListener('click',  () => doSave(false));
captureShareBtn.addEventListener('click', () => doSave(true));

// ── Note loading ──────────────────────────────────────────────
async function npLoadMyNotes(confirmId) {
  if (!confirmId) npObsList.innerHTML = '<div class="obs-empty">Loading…</div>';
  try {
    const notes = await SHEETS.readStudentNotes(npStudentId);
    if (notes.length === 0) {
      npObsList.innerHTML = '<div class="obs-empty">No observations yet.<br>Press <strong>+ Notepad</strong> to capture your first one.</div>';
      return;
    }
    npObsList.innerHTML = '';
    if (confirmId) {
      const confirmed = notes.some(n => n.id === confirmId);
      const banner = document.createElement('div');
      banner.className = 'obs-empty';
      banner.style.cssText = `font-size:10px;padding:6px 8px;color:${confirmed ? '#4ade80' : '#f87171'}`;
      banner.textContent = confirmed ? '✓ Saved!' : '⚠ Note may not have saved — try again.';
      npObsList.appendChild(banner);
    }
    for (const note of notes) npObsList.appendChild(buildNoteCard(note, true));
  } catch(e) {
    npObsList.innerHTML = `<div class="obs-empty">Couldn't load: ${e.message}</div>`;
  }
}

async function npLoadClassFeed() {
  npFeedList.innerHTML = '<div class="obs-empty">Loading…</div>';
  try {
    const notes = await SHEETS.readPublicNotes();
    if (notes.length === 0) {
      npFeedList.innerHTML = '<div class="obs-empty">No shared observations yet.</div>';
      return;
    }
    npFeedList.innerHTML = '';
    for (const note of notes) npFeedList.appendChild(buildNoteCard(note, false));
  } catch(e) {
    npFeedList.innerHTML = `<div class="obs-empty">Couldn't load feed: ${e.message}</div>`;
  }
}

// ── Card builder ──────────────────────────────────────────────
function npGetStudentName(sid) {
  if (npRosterCache) { const r = npRosterCache.find(r => r.id === sid); if (r) return r.name; }
  return sid;
}

function buildNoteCard(note, isOwn) {
  const card = document.createElement('div');
  card.className = 'obs-card';

  // Inline sim canvas
  const wrap = document.createElement('div');
  wrap.className = 'obs-thumb-wrap';

  let parsedState = null;
  try { if (note.sim_state) parsedState = JSON.parse(note.sim_state); } catch(e) {}

  if (parsedState) {
    const srcW = parsedState.canvasWidth  || 1280;
    const srcH = parsedState.canvasHeight || 800;
    const simCv = document.createElement('canvas');
    simCv.className = 'obs-sim-canvas';
    simCv.style.aspectRatio = `${srcW} / ${srcH}`;
    wrap.appendChild(simCv);

    // Per-card zoom state
    let cardZoom = parsedState.zoom || 1;

    requestAnimationFrame(() => SideSim.drawFirstFrame(simCv, parsedState));

    // Controls strip: replay | play/pause | time slider | zoom slider
    const controls = document.createElement('div');
    controls.className = 'obs-controls';

    const replayBtn = document.createElement('button');
    replayBtn.className = 'obs-ctrl-btn';
    replayBtn.title = 'Replay from start';
    replayBtn.textContent = '↺';

    const playBtn = document.createElement('button');
    playBtn.className = 'obs-ctrl-btn';
    playBtn.title = 'Play / Pause';
    playBtn.innerHTML = '&#9654;';

    const timeSlider = document.createElement('input');
    timeSlider.type = 'range';
    timeSlider.className = 'obs-time-slider';
    timeSlider.min = '0';
    timeSlider.max = '0';
    timeSlider.value = '0';
    timeSlider.disabled = true;

    const zoomSlider = document.createElement('input');
    zoomSlider.type = 'range';
    zoomSlider.className = 'obs-zoom-slider';
    zoomSlider.min = '0.5';
    zoomSlider.max = '6';
    zoomSlider.step = '0.25';
    zoomSlider.value = cardZoom;

    zoomSlider.addEventListener('input', () => {
      cardZoom = parseFloat(zoomSlider.value);
      SideSim.drawStaticAt(simCv, parsedState, cardZoom);
    });

    timeSlider.addEventListener('mousedown', () => {
      if (SideSim.isCurrentCanvas(simCv)) SideSim.startScrub();
    });
    timeSlider.addEventListener('input', () => {
      if (SideSim.isCurrentCanvas(simCv)) SideSim.scrubTo(parseInt(timeSlider.value));
    });
    timeSlider.addEventListener('mouseup', () => {
      if (SideSim.isCurrentCanvas(simCv)) SideSim.endScrub(parseInt(timeSlider.value));
    });

    playBtn.addEventListener('click', () => {
      if (SideSim.isCurrentCanvas(simCv)) {
        SideSim.toggle();
      } else {
        SideSim.loadAndPlay(note.sim_state, simCv, playBtn, timeSlider);
        SideSim.setZoom(cardZoom);
      }
    });

    replayBtn.addEventListener('click', () => {
      SideSim.loadAndPlay(note.sim_state, simCv, playBtn, timeSlider);
      SideSim.setZoom(cardZoom);
    });

    const zoomGroup = document.createElement('div');
    zoomGroup.className = 'obs-zoom-group';
    const zoomIcon = document.createElement('span');
    zoomIcon.className = 'obs-zoom-group-icon';
    zoomIcon.textContent = '🔍';
    zoomGroup.appendChild(zoomSlider);
    zoomGroup.appendChild(zoomIcon);

    controls.appendChild(replayBtn);
    controls.appendChild(playBtn);
    controls.appendChild(timeSlider);
    controls.appendChild(zoomGroup);
    wrap.appendChild(controls);
  } else {
    const ph = document.createElement('div');
    ph.style.cssText = 'height:90px;display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(255,255,255,0.15)';
    ph.textContent = isOwn ? '' : npGetStudentName(note.student_id);
    wrap.appendChild(ph);
  }
  card.appendChild(wrap);

  // Meta row
  const meta = document.createElement('div');
  meta.className = 'obs-meta';
  if (!isOwn) {
    const nm = document.createElement('span');
    nm.className = 'obs-student';
    nm.textContent = npGetStudentName(note.student_id);
    meta.appendChild(nm);
  }
  const ts = document.createElement('span');
  ts.textContent = new Date(note.timestamp).toLocaleString();
  meta.appendChild(ts);
  if (isOwn && note.is_public) {
    const badge = document.createElement('span');
    badge.style.cssText = 'color:var(--accent2);font-size:10px';
    badge.textContent = '✓ Shared';
    meta.appendChild(badge);
  }
  card.appendChild(meta);

  if (note.text) {
    const ro = document.createElement('div');
    ro.className = 'obs-annotation-ro';
    ro.textContent = note.text;
    card.appendChild(ro);
  }

  if (isOwn && !note.is_public) {
    const actions = document.createElement('div');
    actions.className = 'obs-actions';
    const shareBtn = document.createElement('button');
    shareBtn.className = 'obs-btn obs-btn-share';
    shareBtn.textContent = 'Share to class feed';
    shareBtn.addEventListener('click', async () => {
      shareBtn.disabled = true;
      shareBtn.textContent = 'Sharing…';
      try {
        await SHEETS.updateNote(note.id, { is_public: true });
        note.is_public = true;
        card.replaceWith(buildNoteCard(note, true));
      } catch(e) {
        shareBtn.disabled = false;
        shareBtn.textContent = 'Share to class feed';
      }
    });
    actions.appendChild(shareBtn);
    card.appendChild(actions);
  }

  return card;
}

// ============================================================
//  captureSimState / applySimState
//  Single source of truth for serialising v12 state into JSON.
//  Add new parameters here when extending the sim.
// ============================================================
function captureSimState() {
  const r2 = v => Math.round(v * 100) / 100;
  return {
    simVersion:         'v12',
    // ── Canvas dimensions (for SideSim scaling) ──────────────
    canvasWidth:        canvas.width,
    canvasHeight:       canvas.height,
    // ── Tab / mode ───────────────────────────────────────────
    currentTab,                   // 'proton' | 'nucleus'
    // ── Theme ────────────────────────────────────────────────
    themeKey:           currentThemeKey,   // 'A' | 'B' | 'C'
    // ── View ─────────────────────────────────────────────────
    zoom,                         // 0.5–4.0
    // ── Physics ──────────────────────────────────────────────
    strongForceStrength,
    strongForceRange,
    speed,                        // internal dt (display = speed*2)
    // ── Visualisation ────────────────────────────────────────
    showElectricField,
    showStrongField,
    arrowMode,                    // 0=off, 1=all, 2=total
    // ── Particles ────────────────────────────────────────────
    particles: particles.map(p => ({
      x:    r2(p.x),
      y:    r2(p.y),
      vx:   r2(p.vx),
      vy:   r2(p.vy),
      type: p.type,
    })),
  };
}

// Restore full v12 sim state onto the main canvas and UI controls.
// Called when the user clicks "Load" (or "play" loads into main sim).
function applySimState(state) {
  // Tab (skipReset=true so particles aren't wiped before we restore them)
  if (state.currentTab !== undefined) applyTab(state.currentTab, true);
  // Theme
  if (state.themeKey !== undefined) applyTheme(state.themeKey);
  // View
  if (state.zoom !== undefined) {
    zoom = state.zoom;
    document.getElementById('zoomSlider').value = Math.round(zoom * 10);
  }
  // Physics
  if (state.strongForceStrength !== undefined) strongForceStrength = state.strongForceStrength;
  if (state.strongForceRange    !== undefined) strongForceRange    = state.strongForceRange;
  if (state.speed !== undefined) {
    speed = state.speed;
    const idx = SPEED_STOPS.reduce((best, s, i) =>
      Math.abs(s - speed * 2) < Math.abs(SPEED_STOPS[best] - speed * 2) ? i : best, 0);
    speedSlider.value = idx;
  }
  // Visualisation toggles
  if (state.showElectricField !== undefined) {
    showElectricField = state.showElectricField;
    document.getElementById('electricFieldToggle').checked = showElectricField;
  }
  if (state.showStrongField !== undefined) {
    showStrongField = state.showStrongField;
    document.getElementById('strongFieldToggle').checked = showStrongField;
  }
  if (state.arrowMode !== undefined) {
    arrowMode = state.arrowMode;
    const targetWheel = [...document.querySelectorAll('.awheel-item[data-mode]')]
      .find(b => parseInt(b.dataset.mode) === arrowMode);
    if (targetWheel) setArrowWheelActive(targetWheel);
  }
  // Particles
  particles = (state.particles || []).map(p => ({
    x: p.x, y: p.y, vx: p.vx || 0, vy: p.vy || 0, type: p.type || 'proton',
  }));
  jitter = [];
  selectedParticle = null;
  updateStats();
  computeEnergy();
  draw();
}

// ============================================================
//  SideSim — inline playback in notepad cards
//
//  One shared instance.  Each card has its own <canvas>;
//  only one plays at a time.  Adapts v12 physics:
//    • coulombStrength = 139
//    • constant strong force within cutoff (no equilibrium spring)
//    • no damping, no antispin (simplified for card playback)
// ============================================================
const SideSim = (() => {
  let cv = null, cx = null;
  let parts = [], sfStr = 0.25, sfRng = 1.2, spd = 1.5;
  let running = false, animId = null, activePlayBtn = null;
  let frameHistory = [], scrubbing = false, activeTimeSlider = null;
  const MAX_FRAMES = 600;
  let sideQuantumEjectAt = null, sideQuantumTimerStartAt = null, sideQuantumFlashes = [];

  // Saved viz state from captured note — used when calling main draw()
  let savedShowElectric = true, savedShowStrong = true;
  let savedTab = 'nucleus', savedZoom = 1, savedThemeKey = 'A';
  const sideHmComposite = document.createElement('canvas');

  function runPhysics() {
    const _particles = particles, _tab = currentTab, _drag = dragging;
    const _sfStr = strongForceStrength, _sfRng = strongForceRange;
    const _qEject = quantumEjectAt, _qStart = quantumTimerStartAt, _qFlash = quantumFlashes;
    particles = parts; currentTab = savedTab; dragging = null;
    strongForceStrength = sfStr; strongForceRange = sfRng;
    quantumEjectAt = sideQuantumEjectAt;
    quantumTimerStartAt = sideQuantumTimerStartAt;
    quantumFlashes = sideQuantumFlashes;
    updateQuantumStability();
    step(spd);
    sideQuantumEjectAt = quantumEjectAt;
    sideQuantumTimerStartAt = quantumTimerStartAt;
    sideQuantumFlashes = quantumFlashes;
    particles = _particles; currentTab = _tab; dragging = _drag;
    strongForceStrength = _sfStr; strongForceRange = _sfRng;
    quantumEjectAt = _qEject; quantumTimerStartAt = _qStart; quantumFlashes = _qFlash;
  }

  function draw() {
    if (!cv || !cx) return;

    const t = THEMES[savedThemeKey] || THEMES.A;

    // Temporarily redirect all main sim draw globals to this card canvas,
    // then call the actual main draw() so SideSim gets identical rendering
    // (field heatmaps, particle style, etc.) to the version that captured the note.
    const _canvas = canvas, _ctx = ctx, _hmComposite = hmComposite, _hmcCtx = hmcCtx;
    const _particles = particles, _zoom = zoom;
    const _tab = currentTab, _tabIsProton = currentTabIsProton;
    const _showE = showElectricField, _showS = showStrongField;
    const _theme = currentTheme, _themeKey = currentThemeKey;
    const _arrow = arrowMode, _drag = dragging, _sel = selectedParticle;
    const _jitter = jitter;
    const _sfStr = strongForceStrength, _sfRng = strongForceRange;
    const _qEject = quantumEjectAt, _qStart = quantumTimerStartAt, _qFlash = quantumFlashes;

    canvas = cv; ctx = cx;
    hmComposite = sideHmComposite; hmcCtx = sideHmComposite.getContext('2d');
    particles = parts;
    zoom = savedZoom;  // draw() applies zoom transform; particles are in physics space
    currentTab = savedTab; currentTabIsProton = (savedTab === 'proton');
    showElectricField = savedShowElectric;
    showStrongField = savedShowStrong;
    currentTheme = t; currentThemeKey = savedThemeKey;
    arrowMode = 0;  // no force arrows in cards
    dragging = null; selectedParticle = null;
    jitter = [];
    strongForceStrength = sfStr; strongForceRange = sfRng;
    quantumEjectAt = sideQuantumEjectAt;
    quantumTimerStartAt = sideQuantumTimerStartAt;
    quantumFlashes = sideQuantumFlashes;

    window.draw();

    // draw() may filter quantumFlashes — read back the updated array
    sideQuantumFlashes = quantumFlashes;

    // draw() clears to transparent — paint theme bg behind rendered content
    cx.globalCompositeOperation = 'destination-over';
    cx.fillStyle = t.bg;
    cx.fillRect(0, 0, cv.width, cv.height);
    cx.globalCompositeOperation = 'source-over';

    canvas = _canvas; ctx = _ctx; hmComposite = _hmComposite; hmcCtx = _hmcCtx;
    particles = _particles; zoom = _zoom;
    currentTab = _tab; currentTabIsProton = _tabIsProton;
    showElectricField = _showE; showStrongField = _showS;
    currentTheme = _theme; currentThemeKey = _themeKey;
    arrowMode = _arrow; dragging = _drag; selectedParticle = _sel;
    jitter = _jitter;
    strongForceStrength = _sfStr; strongForceRange = _sfRng;
    quantumEjectAt = _qEject; quantumTimerStartAt = _qStart; quantumFlashes = _qFlash;
  }

  function loop() {
    if (!running) return;
    runPhysics();
    if (frameHistory.length < MAX_FRAMES) {
      frameHistory.push(parts.map(p => ({ x: p.x, y: p.y, vx: p.vx, vy: p.vy, type: p.type })));
      if (activeTimeSlider) {
        activeTimeSlider.max = frameHistory.length - 1;
        activeTimeSlider.value = frameHistory.length - 1;
      }
    }
    draw();
    animId = requestAnimationFrame(loop);
  }

  function fitBuffer(targetCv) {
    const w = targetCv.offsetWidth, h = targetCv.offsetHeight;
    if (w > 0 && h > 0 && (targetCv.width !== w || targetCv.height !== h)) {
      targetCv.width = w; targetCv.height = h;
    }
  }

  function applyState(state, targetCv) {
    sfStr = state.strongForceStrength ?? 0.25;
    sfRng = state.strongForceRange    ?? 1.2;
    spd   = state.speed               ?? 1.5;

    // Viz settings — passed through to the main draw() call
    savedThemeKey     = state.themeKey          || 'A';
    savedShowElectric = state.showElectricField  ?? true;
    savedShowStrong   = state.showStrongField    ?? true;
    savedTab          = state.currentTab         || 'nucleus';

    // Keep particles in physics space — force constants (K, R, sfRng) stay correct.
    // Offset so the original canvas center maps to the card-canvas center.
    // Use the captured zoom directly for rendering so particles appear at normal size.
    const srcW = state.canvasWidth  || targetCv.width;
    const srcH = state.canvasHeight || targetCv.height;
    savedZoom = state.zoom || 1;  // captured zoom — gives proper visual particle size

    const offX = targetCv.width  / 2 - srcW / 2;
    const offY = targetCv.height / 2 - srcH / 2;

    parts = (state.particles || []).map(p => ({
      x:  p.x + offX,
      y:  p.y + offY,
      vx: p.vx || 0,
      vy: p.vy || 0,
      type: p.type || 'proton',
    }));

    // Invalidate heatmap cache so the new state renders fresh
    sideHmComposite.width = 0; sideHmComposite.height = 0;
    // Reset quantum ejection state for the new simulation
    sideQuantumEjectAt = null; sideQuantumTimerStartAt = null; sideQuantumFlashes = [];
  }

  // Render one still frame to any canvas without disrupting active playback
  function drawFirstFrame(targetCv, state) {
    if (running && cv === targetCv) return;
    fitBuffer(targetCv);
    if (!targetCv.width || !targetCv.height) return;
    const savedCv = cv, savedCx = cx;
    cv = targetCv; cx = targetCv.getContext('2d');
    applyState(state, targetCv);
    draw();
    cv = savedCv; cx = savedCx;
  }

  function stop() {
    running = false;
    cancelAnimationFrame(animId);
    if (activePlayBtn) activePlayBtn.innerHTML = '&#9654;';
    if (cv) draw();
  }

  function loadAndPlay(simStateJson, targetCv, playBtn, timeSliderEl) {
    if (activePlayBtn && activePlayBtn !== playBtn) activePlayBtn.innerHTML = '&#9654;';
    if (activeTimeSlider && activeTimeSlider !== timeSliderEl) activeTimeSlider.disabled = true;
    running = false; cancelAnimationFrame(animId);
    let state;
    try { state = JSON.parse(simStateJson); } catch(e) { return; }
    cv = targetCv; cx = targetCv.getContext('2d'); activePlayBtn = playBtn;
    activeTimeSlider = timeSliderEl || null;
    frameHistory = []; scrubbing = false;
    if (activeTimeSlider) { activeTimeSlider.max = 0; activeTimeSlider.value = 0; activeTimeSlider.disabled = false; }
    fitBuffer(cv); applyState(state, cv);
    if (activePlayBtn) activePlayBtn.innerHTML = '&#9646;&#9646;';
    running = true; loop();
  }

  function startScrub() {
    scrubbing = true;
    if (running) { running = false; cancelAnimationFrame(animId); }
  }

  function scrubTo(idx) {
    if (!frameHistory.length || !cv) return;
    const snap = frameHistory[Math.min(idx, frameHistory.length - 1)];
    if (!snap) return;
    parts = snap.map(p => ({ x: p.x, y: p.y, vx: p.vx, vy: p.vy, type: p.type }));
    draw();
  }

  function endScrub(idx) {
    const snap = frameHistory[Math.min(idx, frameHistory.length - 1)];
    if (snap) {
      parts = snap.map(p => ({ x: p.x, y: p.y, vx: p.vx, vy: p.vy, type: p.type }));
      // Truncate history after this point so new playback stays consistent
      frameHistory = frameHistory.slice(0, idx + 1);
      if (activeTimeSlider) activeTimeSlider.max = frameHistory.length - 1;
    }
    scrubbing = false;
  }

  function toggle() {
    if (!cv) return;
    if (running) { stop(); }
    else { running = true; if (activePlayBtn) activePlayBtn.innerHTML = '&#9646;&#9646;'; loop(); }
  }

  function isCurrentCanvas(targetCv) { return cv === targetCv; }

  // Update zoom for the active canvas; if stopped, redraws immediately.
  function setZoom(value) {
    savedZoom = value;
    if (!running && cv) draw();
  }

  // Re-render a static frame with an explicit zoom override (for the zoom slider
  // on cards that aren't currently playing).
  function drawStaticAt(targetCv, state, zoomVal) {
    if (running && cv === targetCv) { savedZoom = zoomVal; return; }
    fitBuffer(targetCv);
    if (!targetCv.width || !targetCv.height) return;
    const _cv = cv, _cx = cx;
    cv = targetCv; cx = targetCv.getContext('2d');
    applyState(state, targetCv);
    savedZoom = zoomVal;
    draw();
    cv = _cv; cx = _cx;
  }

  return { drawFirstFrame, loadAndPlay, toggle, isCurrentCanvas, stop, setZoom, drawStaticAt, startScrub, scrubTo, endScrub };
})();
</script>
