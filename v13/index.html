}
let showParticles = true;
let currentScrubFrac = 0;
let maxRevealedFrac  = 0;   // high-water mark — graph line never erases back
let egZoomStart = 0, egZoomEnd = 1;
let egDragStartPx = null, egDragCurPx = null;
let animParent = null, animProd1 = null, animProd2 = null;
let animMap = [];
let prod1R = 0, prod2R = 0;  // daughter radii, fixed at product size

// Phase boundaries (t = 0..1)
const PH1_END = 0.30;
const PH2_END = 0.375;

const ANIM_T_START = 0.27;
const ANIM_T_END   = 0.47;
const ANIM_RANGE   = ANIM_T_END - ANIM_T_START;
const FISS_STOP_T  = PH2_END + 0.40 * (ANIM_T_END - PH2_END);  // playback endpoint
const NORMAL_DURATION       = 5000;  // ms — main nucleus phase 3 separation
const CHAIN_NORMAL_DURATION = 5000;  // ms — chain-site daughters
let SHAKE_DURATION  = 1000;  // ms — randomised on each hit (500–1500)

// Wobble mode, picked randomly each time a nucleus is hit:
//   'dip1'   50% — 1 KE dip  : nucleus elongates once then fissions
//   'dip2'   20% — 2 KE dips : one full wobble back to circular, then elongates and fissions
//   'dip3'   15% — 3 KE dips : two full wobbles, then elongates and fissions
//   'stable' 15% — 3 KE dips : three full wobbles, nucleus returns to circular (no fission)
let wobbleMode = 'dip1';

function pickWobbleMode() {
  const r = Math.random();
  if (currentTab === 'fission') {
    if (r < 0.80) return 'dip1';
    if (r < 0.90) return 'dip2';
    return 'dip3';
  }
  // chain tab
  if (r < 0.50) return 'dip1';
  if (r < 0.70) return 'dip2';
  if (r < 0.85) return 'dip3';
  return 'stable';
}

// General wobble signal — ph2 ∈ [0,1], returns normWobble ∈ [0,1].
// Continuously differentiable everywhere (zero derivative at all segment joins).
//
//   dip1:   [0,1]       half-cosine 0→1 (pure elongation, 1 minimum at end)
//   dip2:   [0,½]       full cycle 0→1→0  +  [½,1] half-cosine 0→1
//   dip3:   [0,⅓][⅓,⅔] two full cycles  +  [⅔,1]  half-cosine 0→1
//   stable: [0,⅓][⅓,⅔][⅔,1] three full cycles (ends at 0 → no fission)
function wobbleSignal(ph2, mode) {
  if (mode === 'dip1') {
    return (1 - Math.cos(Math.PI * ph2)) / 2;
  }
  const nFull = mode === 'dip2' ? 1 : 2;   // full cycles before elongation (stable uses all 3 as full)
  const nSegs = mode === 'stable' ? 3 : nFull + 1;
  const T = 1 / nSegs;
  if (mode !== 'stable' && ph2 > nFull * T) {
    // Final half-cosine elongation
    const p = (ph2 - nFull * T) / T;
    return (1 - Math.cos(Math.PI * p)) / 2;
  }
  // Full cosine cycle
  const i = Math.min(nSegs - 1, Math.floor(ph2 / T));
  const p = (ph2 - i * T) / T;
  return (1 - Math.cos(2 * Math.PI * p)) / 2;
}

function initNuclei() {
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;

  animParent = generateNucleus(78, 172, cx, cy, currentSeed);
  animProd1  = generateNucleus(47, 103, cx, cy, currentSeed * 1001 + 7);
  animProd2  = generateNucleus(31,  69, cx, cy, currentSeed * 1003 + 13);

  // Daughter radii are fixed — no shrinking as they fly
  prod1R = animProd1.sphereR * 0.7;
  prod2R = animProd2.sphereR * 0.7;

  const byX = (type) => animParent.particles
    .map((p, i) => ({ i, x: p.x }))
    .filter(({i}) => animParent.particles[i].type === type)
    .sort((a, b) => a.x - b.x);

  const toIdx = (prod, type) => prod.particles
    .map((p, i) => ({ i, x: p.x }))
    .filter(({i}) => prod.particles[i].type === type)
    .sort((a, b) => a.x - b.x)
    .map(({i}) => i);

  const parentP = byX('proton');
  const parentN = byX('neutron');
  const p1P = toIdx(animProd1, 'proton');
  const p1N = toIdx(animProd1, 'neutron');
  const p2P = toIdx(animProd2, 'proton');
  const p2N = toIdx(animProd2, 'neutron');

  animMap = [];
  for (let k = 0; k < 47; k++)  animMap.push({ fromIdx: parentP[k].i,      prod: 1, toIdx: p1P[k] });
  for (let k = 0; k < 31; k++)  animMap.push({ fromIdx: parentP[47+k].i,   prod: 2, toIdx: p2P[k] });
  for (let k = 0; k < 103; k++) animMap.push({ fromIdx: parentN[k].i,      prod: 1, toIdx: p1N[k] });
  for (let k = 0; k < 69; k++)  animMap.push({ fromIdx: parentN[103+k].i,  prod: 2, toIdx: p2N[k] });

}

// ─── Frame content renderer — called inside renderAtFrac's zoom transform ─────
function drawAnimContent(t) {
  const showElec = document.getElementById('showElectric').checked;
  const parentMask = [{ cx: animParent.cx, cy: animParent.cy, r: animParent.sphereR + PARTICLE_RADIUS * 3.5 }];

  // Phase 1: still
  if (t <= PH1_END) {
    if (showElec) drawElectricHeatmap(animParent.particles, 0.5, 1.0, parentMask);
    if (!showParticles) drawCloudOutline(animParent.cx, animParent.cy, animParent.sphereR);
    if (showParticles) drawParticles(animParent.particles, 0.5);   // 2x jitter in static scene
    return;
  }

  // Phase 2: excited state
  if (t <= PH2_END) {
    const ph2Frac = (t - PH1_END) / (PH2_END - PH1_END);
    if (showElec) drawElectricHeatmap(animParent.particles, 0.5, 1.0, parentMask);

    // Wobble: mode-driven signal (dip1/dip2/dip3/stable), all smooth, no kinks.
    // deformAmp reaches full by ph2=0.10 so the first wobble is at full visual amplitude.
    const deformAmp  = 0.15 * Math.min(1, ph2Frac / 0.10);
    const normWobble = wobbleSignal(ph2Frac, wobbleMode);    // 0=circular, 1=max oblong
    const wobble     = deformAmp * normWobble;
    const scaleAlong = 1 + wobble;
    const scalePerp  = 1 / (1 + wobble * 0.7);
    const jitterS    = 0.85 * (1 - normWobble * 0.88);

    const outAmp = PARTICLE_RADIUS * 0.035 * Math.min(1, ph2Frac / 0.12);
    const jx = outAmp * Math.sin(t * 180);
    const jy = outAmp * Math.cos(t * 150);

    const glowIntensity = Math.min(1, ph2Frac / 0.3);

    const ncx = animParent.cx, ncy = animParent.cy;
    const cosA = Math.cos(staticFissAngle), sinA = Math.sin(staticFissAngle);

    if (!showParticles) {
      // Outline: ctx.scale to deform the scalloped circle into an ellipse
      ctx.save();
      ctx.translate(jx, jy);
      ctx.translate(ncx, ncy);
      ctx.rotate(staticFissAngle);
      ctx.scale(scaleAlong, scalePerp);
      ctx.rotate(-staticFissAngle);
      ctx.translate(-ncx, -ncy);
      drawCloudOutline(ncx, ncy, animParent.sphereR);
      ctx.restore();
    } else {
      // Particles: actually move each one along the deformation axis + modulated jitter
      const deformed = animParent.particles.map(p => {
        const rx = p.x - ncx, ry = p.y - ncy;
        const along = rx * cosA + ry * sinA;
        const perp  = -rx * sinA + ry * cosA;
        return { ...p,
          x: ncx + along * scaleAlong * cosA - perp * scalePerp * sinA + jx,
          y: ncy + along * scaleAlong * sinA + perp * scalePerp * cosA + jy,
        };
      });
      drawParticles(deformed, jitterS);
    }
    return;
  }

  // Phase 3: separation (skipped for stable mode — nucleus returned to circular)
  if (wobbleMode === 'stable') {
    if (!showParticles) drawCloudOutline(animParent.cx, animParent.cy, animParent.sphereR);
    if (showParticles)  drawParticles(animParent.particles, 0.5);
    return;
  }
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;
  const sepT      = (t - PH2_END) / (1.0 - PH2_END);
  const shootT    = Math.min(1, sepT / 0.075);
  const shootEase = Math.min(1, 3 * shootT * shootT * shootT);  // s = 3t³
  const rearT     = Math.min(1, sepT / 0.05);
  const rearEase  = rearT * rearT * (3 - 2 * rearT);

  const cosA = Math.cos(staticFissAngle), sinA = Math.sin(staticFissAngle);
  // Scale shoot distance so daughters exit the visible area at any zoom level
  const exitDiag = Math.sqrt(W * W + H * H);
  const base1 = Math.max(cx + prod1R + PARTICLE_RADIUS + 30 + W * 0.2,
                         exitDiag / (2 * viewZoom) + prod1R + PARTICLE_RADIUS + 30);
  const base2 = Math.max(cx + prod2R + PARTICLE_RADIUS + 30 + W * 0.2,
                         exitDiag / (2 * viewZoom) + prod2R + PARTICLE_RADIUS + 30);
  const sh1dx = -cosA * base1, sh1dy = -sinA * base1;
  const sh2dx =  cosA * base2, sh2dy =  sinA * base2;

  const grp1cx = cx + sh1dx * shootEase;
  const grp1cy = cy + sh1dy * shootEase;
  const grp2cx = cx + sh2dx * shootEase;
  const grp2cy = cy + sh2dy * shootEase;

  const radiusT    = Math.min(1, sepT / 0.0075);
  const radiusEase = radiusT * radiusT * (3 - 2 * radiusT);
  const r1 = animParent.sphereR + (prod1R - animParent.sphereR) * radiusEase;
  const r2 = animParent.sphereR + (prod2R - animParent.sphereR) * radiusEase;

  const pos1 = [], pos2 = [];
  for (const m of animMap) {
    const from = animParent.particles[m.fromIdx];
    const to   = m.prod === 1 ? animProd1.particles[m.toIdx] : animProd2.particles[m.toIdx];
    const sdx  = m.prod === 1 ? sh1dx : sh2dx;
    const sdy  = m.prod === 1 ? sh1dy : sh2dy;
    let x = from.x + (to.x - from.x) * rearEase + sdx * shootEase;
    let y = from.y + (to.y - from.y) * rearEase + sdy * shootEase;
    const residualAmp = PARTICLE_RADIUS * 0.275 * Math.max(0, 1 - sepT / 0.15);
    if (residualAmp > 0) {
      const i = m.fromIdx;
      x += residualAmp * (Math.sin(t*157+i*1.73)*0.45 + Math.sin(t*241+i*3.07)*0.35 + Math.sin(t*389+i*5.31)*0.20);
      y += residualAmp * (Math.sin(t*179+i*2.39)*0.45 + Math.sin(t*263+i*4.13)*0.35 + Math.sin(t*421+i*6.71)*0.20);
    }
    const toZ = (m.prod === 1 ? animProd1 : animProd2).particles[m.toIdx].z;
    const z   = from.z + (toZ - from.z) * rearEase;
    (m.prod === 1 ? pos1 : pos2).push({ x, y, z, type: from.type, i: m.fromIdx });
  }

  if (showElec) {
    // Per-daughter field — translate trick keeps viz visible even when off-screen
    const sh1x = cx - grp1cx, sh1y = cy - grp1cy;
    const pos1c = pos1.map(p => ({ ...p, x: p.x + sh1x, y: p.y + sh1y }));
    const mask1 = [{ cx, cy, r: r1 + PARTICLE_RADIUS * 3.5, bleed: PARTICLE_RADIUS * 2.5 }];
    heatmapDirty = true;
    ctx.save(); ctx.translate(-sh1x, -sh1y);
    drawElectricHeatmap(pos1c, 0.5, 1.0, mask1);
    ctx.restore();

    const sh2x = cx - grp2cx, sh2y = cy - grp2cy;
    const pos2c = pos2.map(p => ({ ...p, x: p.x + sh2x, y: p.y + sh2y }));
    const mask2 = [{ cx, cy, r: r2 + PARTICLE_RADIUS * 3.5, bleed: PARTICLE_RADIUS * 2.5 }];
    heatmapDirty = true;
    ctx.save(); ctx.translate(-sh2x, -sh2y);
    drawElectricHeatmap(pos2c, 0.5, 1.0, mask2);
    ctx.restore();

    // Cross-daughter interaction — combined field in the gap between daughters.
    // Uses expanded bounds so off-screen particles still contribute to visible pixels.
    // 'screen' compositing adds this layer without erasing the per-daughter fields above.
    heatmapDirty = true;
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    drawElectricHeatmap([...pos1, ...pos2], 0.5, 1.0, [{
      type: 'capsule',
      cx1: grp1cx, cy1: grp1cy, r1: r1 + PARTICLE_RADIUS * 2,
      cx2: grp2cx, cy2: grp2cy, r2: r2 + PARTICLE_RADIUS * 2,
      bleed: PARTICLE_RADIUS * 5
    }], canvas.width);
    ctx.restore();
  }

  // On chain tab, mainDaughters objects take over drawing after the split
  if (!(currentTab === 'chain' && mainDaughters)) {
    if (!showParticles) drawFissionOutline(grp1cx, grp1cy, r1, grp2cx, grp2cy, r2);
    if (showParticles) drawParticles([...pos1, ...pos2]);
  }

  const PHASE3_MAX_SEPT = (ANIM_T_END - PH2_END) / (1.0 - PH2_END);
  const neutronFrac = sepT / PHASE3_MAX_SEPT;
  const screenDiag  = Math.max(canvas.width, canvas.height);
  for (const n of fissionNeutrons) {
    if (n.absorbed) continue;
    const dist = neutronFrac * n.speed * screenDiag;
    const nx = cx + Math.cos(n.angle) * dist;
    const ny = cy + Math.sin(n.angle) * dist;
    const margin = PARTICLE_RADIUS * 2;
    const halfVW = canvas.width  / (2 * viewZoom);
    const halfVH = canvas.height / (2 * viewZoom);
    if (nx > cx - halfVW - margin && nx < cx + halfVW + margin &&
        ny > cy - halfVH - margin && ny < cy + halfVH + margin) {
      drawNeutron(nx, ny);
    }
  }
}

// ─── Canonical renderer — single source of truth for any scrub position ───────
function renderAtFrac(frac) {
  ctx.fillStyle = '#05040f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!animParent) { if (currentTab === 'chain') drawChainBarChart(); drawEnergyGraph(); return; }

  ctx.save();
  const _W = canvas.width, _H = canvas.height;
  const fvShift = (currentTab === 'fission' && arrowMode > 0)
    ? -(forceVizPanelEl.offsetWidth + 20) / 2
    : 0;
  ctx.translate(_W / 2 + fvShift, _H / 2);
  ctx.scale(viewZoom, viewZoom);
  ctx.translate(-_W / 2, -_H / 2);

  const showElec = document.getElementById('showElectric').checked;
  const parentMask = [{ cx: animParent.cx, cy: animParent.cy, r: animParent.sphereR + PARTICLE_RADIUS * 3.5 }];

  if (frac < NEUTRON_FRAC) {
    // Neutron flying zone
    if (showElec) drawElectricHeatmap(animParent.particles, 0.5, 1.0, parentMask);
    if (!showParticles) drawCloudOutline(animParent.cx, animParent.cy, animParent.sphereR);
    if (neutronState !== 'idle') {
      const nf = frac / NEUTRON_FRAC;
      const nx = (-PARTICLE_RADIUS - 5) + nf * (neutronImpactX() - (-PARTICLE_RADIUS - 5));
      drawNeutron(nx, animParent.cy);
    }
    if (showParticles) drawParticles(animParent.particles, 0.85);
  } else {
    // Fission zone
    const ff = (frac - NEUTRON_FRAC) / (1 - NEUTRON_FRAC);
    const t = PH1_END + ff * (FISS_STOP_T - PH1_END);
    drawAnimContent(t);
  }

  drawChainOverlay();
  ctx.restore();
  if (currentTab === 'chain') drawChainBarChart();
  drawEnergyGraph();
  captureFrame();
}

// ─── Prompt fission neutrons ──────────────────────────────────────────────────
let fissionNeutrons = [];  // [{angle, speed}] — generated fresh each Go press

function genFissionNeutrons() {
  const count = Math.random() < 0.5 ? 2 : 3;
  fissionNeutrons = [];
  for (let i = 0; i < count; i++) {
    fissionNeutrons.push({
      angle: Math.random() * Math.PI * 2,
      speed: 2.5 + Math.random() * 1.5,   // 2.5–4.0× normalized, off-screen in first ~25–40%
      absorbed: false,
    });
  }
}

// ─── Neutron state machine ────────────────────────────────────────────────────
let neutronState    = 'idle';
let neutronX        = 0;
let neutronY        = 0;
let neutronLast     = 0;
let neutronRAF      = null;
let staticFissStart = 0;
let staticFissT     = 0;
let staticFissAngle = 0;
let staticNeutronIX = 0;
let staticNeutronIY = 0;

const NEUTRON_FRAC = 0.2;
const ENRICH_ZOOM_SHOW = 0.6;  // show Enrich button at this zoom or below

// ─── Enrich / chain-reaction system ──────────────────────────────────────────
let enrichSites   = [];    // [{cx,cy,state,fissStart,fissT,angle,shakeDur,neutronsEmitted}]
let chainNeutrons = [];    // [{x,y,vx,vy}]
let chainRAF      = null;
let lastChainTime = null;
let mainNeutronsEmitted    = false;
let mainEnergyTransferred  = false;
let mainDaughters          = null;   // [{x,y,vx,vy,r,bounced}] — main fission products (chain tab)
let totalFuelAdded  = 0;  // cumulative units of fuel ever added
let energyInFields  = 0;  // fuel energy not yet released
let energyInMotion  = 0;  // energy released by completed fissions

const CHAIN_BAR_PANEL_W = 240;  // width of the energy bar chart panel (right side)
const CHAIN_ENERGY_MAX  = 100;  // fixed chart scale: 25% above 40-nucleus baseline, fits 60 total
let fixedContainerBounds = null; // set once at default zoom; stays fixed even when user zooms

// Compute container bounds from current viewZoom (call once, then cache in fixedContainerBounds)
function computeContainerBounds() {
  const W = canvas.width, H = canvas.height;
  const toolbarH = document.getElementById('toolbar').offsetHeight;
  const edge = 20;  // screen-px margin
  // Convert screen pixel edges to world coords: worldX = W/2 + (screenX - W/2) / viewZoom
  const left  = W/2 + (edge                              - W/2) / viewZoom;
  const right = W/2 + (W - CHAIN_BAR_PANEL_W - edge      - W/2) / viewZoom;
  const top   = H/2 + (toolbarH + edge                   - H/2) / viewZoom;
  const bot   = H/2 + (H - edge                          - H/2) / viewZoom;
  return { x: left, y: top, w: right - left, h: bot - top };
}

function chainContainerBounds() {
  return fixedContainerBounds || computeContainerBounds();
}

function emitChainNeutrons(cx, cy) {
  const count = 2 + (Math.random() < 0.5 ? 1 : 0);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.25 + Math.random() * 0.25;  // world px/ms
    chainNeutrons.push({ x: cx, y: cy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed });
  }
  ensureChainLoop();
}

function triggerEnrichSite(site) {
  site.state          = 'fission';
  site.fissStart      = performance.now();
  site.angle          = Math.random() * Math.PI * 2;
  site.wobbleMode      = pickWobbleMode();
  site.shakeDur        = (5 + Math.random() * 10) * 100;
  site.fissT           = PH1_END;
  site.neutronsEmitted = false;
}

function updateChain(now) {
  const sphereR  = animParent ? animParent.sphereR : 40;
  const captureR = sphereR + PARTICLE_RADIUS * 2;
  const playbackSpeed = parseFloat(document.getElementById('playbackSpeed').value);
  const dt = lastChainTime ? now - lastChainTime : 0;
  lastChainTime = now;

  const b = chainContainerBounds();

  // Update neutron positions + bounce off container walls + check collisions
  for (let i = chainNeutrons.length - 1; i >= 0; i--) {
    const n = chainNeutrons[i];

    n.x += n.vx * dt;
    n.y += n.vy * dt;

    // Bounce off container walls
    if (n.x - PARTICLE_RADIUS < b.x)         { n.x = b.x + PARTICLE_RADIUS;         n.vx =  Math.abs(n.vx); n.bounced = true; }
    if (n.x + PARTICLE_RADIUS > b.x + b.w)   { n.x = b.x + b.w - PARTICLE_RADIUS;   n.vx = -Math.abs(n.vx); n.bounced = true; }
    if (n.y - PARTICLE_RADIUS < b.y)         { n.y = b.y + PARTICLE_RADIUS;         n.vy =  Math.abs(n.vy); n.bounced = true; }
    if (n.y + PARTICLE_RADIUS > b.y + b.h)   { n.y = b.y + b.h - PARTICLE_RADIUS;   n.vy = -Math.abs(n.vy); n.bounced = true; }

    // Check collision with idle enriched sites
    let absorbed = false;
    for (const site of enrichSites) {
      if (site.state !== 'idle') continue;
      if (Math.hypot(n.x - site.cx, n.y - site.cy) < captureR) {
        triggerEnrichSite(site);
        chainNeutrons.splice(i, 1);
        absorbed = true;
        break;
      }
    }
    if (absorbed) continue;
  }

  // Advance enriched site fission animations
  for (const site of enrichSites) {
    if (site.state !== 'fission') continue;
    const elapsed = (now - site.fissStart) * playbackSpeed;
    if (elapsed < site.shakeDur) {
      site.fissT = PH1_END + (elapsed / site.shakeDur) * (PH2_END - PH1_END);
    } else {
      site.fissT = PH2_END + Math.min(1, (elapsed - site.shakeDur) / CHAIN_NORMAL_DURATION)
                           * (ANIM_T_END - PH2_END);
    }
    if (site.wobbleMode === 'stable') {
      // No fission — wobble completes, nucleus stabilises, no chain neutrons emitted
      if (site.fissT >= ANIM_T_END) site.state = 'done';
    } else {
      if (!site.neutronsEmitted && site.fissT >= PH2_END) {
        site.neutronsEmitted = true;
        emitChainNeutrons(site.cx, site.cy);
        // Transfer energy: Fields → Motion
        energyInFields  = Math.max(0, energyInFields  - 1);
        energyInMotion += 1;
        // Spawn bouncing daughter fragments
        const spd = 0.28 + Math.random() * 0.14;
        const a = site.angle;
        site.daughters = [
          { x: site.cx, y: site.cy, vx:  Math.cos(a) * spd, vy:  Math.sin(a) * spd, r: sphereR * 0.7, viewAngle: Math.random() * Math.PI * 2 },
          { x: site.cx, y: site.cy, vx: -Math.cos(a) * spd, vy: -Math.sin(a) * spd, r: sphereR * 0.6, viewAngle: Math.random() * Math.PI * 2 },
        ];
      }
      if (site.fissT >= ANIM_T_END) site.state = 'done';
    }
  }

  // Advance daughter fragment positions + bounce off container walls
  for (const site of enrichSites) {
    if (!site.daughters) continue;
    for (const d of site.daughters) {
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      if (d.x - d.r < b.x)       { d.x = b.x + d.r;       d.vx =  Math.abs(d.vx); d.bounced = true; }
      if (d.x + d.r > b.x + b.w) { d.x = b.x + b.w - d.r; d.vx = -Math.abs(d.vx); d.bounced = true; }
      if (d.y - d.r < b.y)       { d.y = b.y + d.r;        d.vy =  Math.abs(d.vy); d.bounced = true; }
      if (d.y + d.r > b.y + b.h) { d.y = b.y + b.h - d.r;  d.vy = -Math.abs(d.vy); d.bounced = true; }
    }
  }

  // Advance main fission daughter positions + bounce off container walls
  if (mainDaughters) {
    for (const d of mainDaughters) {
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      if (d.x - d.r < b.x)       { d.x = b.x + d.r;       d.vx =  Math.abs(d.vx); d.bounced = true; }
      if (d.x + d.r > b.x + b.w) { d.x = b.x + b.w - d.r; d.vx = -Math.abs(d.vx); d.bounced = true; }
      if (d.y - d.r < b.y)       { d.y = b.y + d.r;        d.vy =  Math.abs(d.vy); d.bounced = true; }
      if (d.y + d.r > b.y + b.h) { d.y = b.y + b.h - d.r;  d.vy = -Math.abs(d.vy); d.bounced = true; }
    }
  }
}

function drawChainOverlay() {
  const sphereR = animParent ? animParent.sphereR : 40;

  // Draw containment vessel (chain tab only)
  if (currentTab === 'chain') {
    const b = chainContainerBounds();
    const lw = 3 / viewZoom;
    ctx.save();
    ctx.lineWidth   = lw;
    ctx.strokeStyle = 'rgba(255, 190, 60, 0.55)';
    ctx.shadowBlur  = 18 / viewZoom;
    ctx.shadowColor = 'rgba(255, 180, 50, 0.7)';
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.restore();
  }

  // Helper: draw wobbling fission animation for a site in fission state pre-split
  function drawFissionWobble(site) {
    const t = site.fissT, cx = site.cx, cy = site.cy;
    const ph2 = (t - PH1_END) / (PH2_END - PH1_END);
    const deformAmp  = 0.15 * Math.min(1, ph2 / 0.10);
    const wobble     = deformAmp * wobbleSignal(ph2, site.wobbleMode || 'dip1');
    const scaleAlong = 1 + wobble;
    const scalePerp  = 1 / (1 + wobble * 0.7);
    if (showParticles) {
      const offsets = getChainParticleOffsets();
      const cosV = Math.cos(site.viewAngle || 0), sinV = Math.sin(site.viewAngle || 0);
      const cosA = Math.cos(site.angle), sinA = Math.sin(site.angle);
      const pts = offsets.map(p => {
        // Apply viewAngle rotation first, then fission-axis deformation
        const rx = (p.ox * cosV - p.oy * sinV) * sphereR;
        const ry = (p.ox * sinV + p.oy * cosV) * sphereR;
        const along = rx * cosA + ry * sinA;
        const perp  = -rx * sinA + ry * cosA;
        return {
          x: cx + along * scaleAlong * cosA - perp * scalePerp * sinA,
          y: cy + along * scaleAlong * sinA + perp * scalePerp * cosA,
          z: p.oz * sphereR,
          type: p.type,
        };
      });
      drawParticles(pts, 0);
    } else {
      ctx.save();
      ctx.translate(cx, cy); ctx.rotate(site.angle);
      ctx.scale(scaleAlong, scalePerp); ctx.rotate(-site.angle); ctx.translate(-cx, -cy);
      drawCloudOutline(cx, cy, sphereR);
      ctx.restore();
    }
    // Excited glow ring
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(site.angle);
    ctx.scale(scaleAlong, scalePerp); ctx.rotate(-site.angle); ctx.translate(-cx, -cy);
    ctx.beginPath(); ctx.arc(cx, cy, sphereR * (1 + ph2 * 0.08), 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,45,120,${0.3 + ph2 * 0.5})`;
    ctx.lineWidth = 3 + ph2 * 5; ctx.shadowBlur = 18 * ph2; ctx.shadowColor = '#ff2d78';
    ctx.stroke();
    ctx.restore();
  }

  // Helper: draw one nucleus (fuel or daughter) — outline or particles
  function drawChainNucleus(cx, cy, r, rot = 0) {
    if (showParticles) drawChainSiteParticles(cx, cy, r, rot);
    else drawCloudOutline(cx, cy, r);
  }
  // Helper: draw split daughters — outline uses union shape; particles draw separately
  function drawChainDaughters(d0, d1) {
    if (showParticles) {
      drawChainSiteParticles(d0.x, d0.y, d0.r, d0.viewAngle || 0);
      drawChainSiteParticles(d1.x, d1.y, d1.r, d1.viewAngle || 0);
    } else {
      drawFissionOutline(d0.x, d0.y, d0.r, d1.x, d1.y, d1.r);
    }
  }

  // ── BACKGROUND LAYER: stable (failed) sites, bounced daughters, bounced neutrons ──
  ctx.save();
  ctx.globalAlpha = 0.3;
  for (const site of enrichSites) {
    // Stable failed fission: stays visible but in background
    if (site.state === 'done' && site.wobbleMode === 'stable') {
      drawChainNucleus(site.cx, site.cy, sphereR, site.viewAngle);
    }
    // Daughters of fissioned sites: in background once any has bounced (or site is done)
    if (site.daughters) {
      const inBg = site.state === 'done' || site.daughters.some(d => d.bounced);
      if (inBg) {
        drawChainDaughters(site.daughters[0], site.daughters[1]);
      }
    }
  }
  // Main fission daughters: in background once any has bounced
  if (mainDaughters && mainDaughters.some(d => d.bounced)) {
    drawChainDaughters(mainDaughters[0], mainDaughters[1]);
  }
  for (const n of chainNeutrons) { if (n.bounced) drawNeutron(n.x, n.y); }
  ctx.restore();

  // ── FOREGROUND LAYER: idle fuel, actively fissioning sites, fresh neutrons ──
  for (const site of enrichSites) {
    if (site.state === 'idle') {
      drawChainNucleus(site.cx, site.cy, sphereR, site.viewAngle);
    } else if (site.state === 'fission') {
      const t = site.fissT;
      if (t <= PH2_END) {
        drawFissionWobble(site);
      } else if (site.wobbleMode === 'stable') {
        // Still in fission state but settling — stays in foreground until done
        drawChainNucleus(site.cx, site.cy, sphereR, site.viewAngle);
      } else if (site.daughters && !site.daughters.some(d => d.bounced)) {
        // Daughters just launched, haven't bounced yet — draw in foreground
        drawChainDaughters(site.daughters[0], site.daughters[1]);
      }
    }
  }
  // Main fission daughters: in foreground until first bounce
  if (mainDaughters && !mainDaughters.some(d => d.bounced)) {
    drawChainDaughters(mainDaughters[0], mainDaughters[1]);
  }
  for (const n of chainNeutrons) { if (!n.bounced) drawNeutron(n.x, n.y); }
}

function ensureChainLoop() {
  if (chainRAF || (neutronState === 'flying' || neutronState === 'fission')) return;
  lastChainTime = null;  // reset so first tick dt = 0
  function chainTick(now) {
    updateChain(now);
    drawStaticFrame();
    const stillActive = chainNeutrons.length > 0 ||
                        enrichSites.some(s => s.state === 'fission' || s.daughters) ||
                        mainDaughters !== null;
    chainRAF = stillActive ? requestAnimationFrame(chainTick) : null;
    if (!chainRAF) markPrerenderDone();
  }
  chainRAF = requestAnimationFrame(chainTick);
}

function neutronImpactX() {
  return animParent.cx - animParent.sphereR - PARTICLE_RADIUS;
}

// ─── Force visualization panel (fission tab) ──────────────────────────────────
const forceVizPanelEl = document.getElementById('forceVizPanel');
const forceVizCv      = document.getElementById('forceVizCanvas');
const FV_ELEC_COLOR   = 'rgba(70,165,255,0.88)';
const FV_STRONG_COLOR = 'rgba(255,185,70,0.88)';

// Arrow drawing matching v11's quadratic-curve + glow style
function fvArrowOnCtx(c, fromX, fromY, nx, ny, len, color, lw, headLen) {
  if (len < 1) return;
  const HEAD = headLen !== undefined ? headLen : Math.max(5, len * 0.234);
  const midX = fromX + nx * len * 0.5, midY = fromY + ny * len * 0.5;
  const tipX = fromX + nx * len,       tipY = fromY + ny * len;
  const perpX = -ny, perpY = nx;
  const baseX = tipX - nx * HEAD, baseY = tipY - ny * HEAD;
  c.strokeStyle = color; c.fillStyle = color;
  c.save();
  c.shadowColor = color; c.shadowBlur = 8;
  c.lineWidth = lw; c.globalAlpha = 1.0; c.lineCap = 'round';
  c.beginPath(); c.moveTo(fromX, fromY);
  c.quadraticCurveTo(midX, midY, baseX, baseY);
  c.stroke();
  const hw = lw * 1.44;
  c.beginPath();
  c.moveTo(tipX, tipY);
  c.lineTo(baseX + perpX * hw, baseY + perpY * hw);
  c.lineTo(baseX - perpX * hw, baseY - perpY * hw);
  c.closePath(); c.fill();
  c.restore();
}

// Draw a single proton or neutron in the force panel (v11 gradient style)
function fvDrawParticle(c, px, py, r, type) {
  const isP = type === 'proton';
  const baseGrad = c.createRadialGradient(px, py, 0, px, py, r * 1.1);
  if (isP) {
    baseGrad.addColorStop(0, '#ff1a65'); baseGrad.addColorStop(0.82, '#ff1a65'); baseGrad.addColorStop(1, 'rgba(0,0,0,0)');
  } else {
    baseGrad.addColorStop(0, '#70707f'); baseGrad.addColorStop(0.82, '#70707f'); baseGrad.addColorStop(1, 'rgba(0,0,0,0)');
  }
  c.beginPath(); c.arc(px, py, r * 1.1, 0, Math.PI * 2);
  c.fillStyle = baseGrad; c.fill();
  const coreGrad = c.createRadialGradient(px, py, 0, px, py, r);
  const core = isP ? '#ff80b0' : '#b0b0c4';
  coreGrad.addColorStop(0, core); coreGrad.addColorStop(0.5, core); coreGrad.addColorStop(1, 'rgba(0,0,0,0)');
  c.globalAlpha = 0.82;
  c.beginPath(); c.arc(px, py, r, 0, Math.PI * 2);
  c.fillStyle = coreGrad; c.fill();
  c.globalAlpha = 1;
  if (isP) {
    c.fillStyle = 'rgba(255,255,255,0.88)';
    c.font = `bold ${Math.max(8, r * 1.1)}px "JetBrains Mono", monospace`;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('+', px, py + 1);
  }
}

// Draw a group of particles scaled from world space into a panel region
// worldParticles: [{x,y,type}] in world coords, worldCx/Cy = world centroid
// panelCx/Cy = destination centre in panel, panelR = destination radius
function fvDrawParticleGroup(c, worldParticles, worldCx, worldCy, worldSphereR, panelCx, panelCy, panelR) {
  const scale = panelR / worldSphereR;
  const PR = Math.max(2, PARTICLE_RADIUS * scale * 0.85);
  // Sort back-to-front by z so front particles overdraw rear ones
  const sorted = [...worldParticles].sort((a, b) => (a.z || 0) - (b.z || 0));
  for (const p of sorted) {
    const px = panelCx + (p.x - worldCx) * scale;
    const py = panelCy + (p.y - worldCy) * scale;
    fvDrawParticle(c, px, py, PR, p.type);
  }
}

// Draw the real scallop cloud outline onto any context, with optional deformation transform.
// scaleAlong/scalePerp applied along fissAngle axis. Pass c=fvc to draw in force panel.
function fvCloudOutline(c, panelCx, panelCy, panelR, worldSphereR, scaleAlong, scalePerp, fissAngle) {
  const pscale = panelR / worldSphereR;
  c.save();
  c.translate(panelCx, panelCy);
  c.rotate(fissAngle);
  c.scale(scaleAlong * pscale, scalePerp * pscale);
  c.rotate(-fissAngle);
  c.translate(-panelCx, -panelCy);
  drawCloudOutline(panelCx, panelCy, worldSphereR, c);
  c.restore();
}

const devTimecodeEl = document.getElementById('devTimecodePanel');
const devTimecodeRows = document.getElementById('devTimecodeRows');

function updateTimecodes() {
  // Convert a t-value (in animation-space) to slider integer 0-1000
  function sliderFromT(t) {
    const ff = (t - PH1_END) / (FISS_STOP_T - PH1_END);
    return Math.round((NEUTRON_FRAC + ff * (1 - NEUTRON_FRAC)) * 1000);
  }
  function sliderFromPh2(ph2) {
    return sliderFromT(PH1_END + ph2 * (PH2_END - PH1_END));
  }

  const entries = [];
  entries.push(['Neutron hits',  sliderFromT(PH1_END)]);

  if (wobbleMode === 'dip1') {
    entries.push(['Max oblong',   sliderFromPh2(1)]);
  } else if (wobbleMode === 'dip2') {
    entries.push(['1st peak',     sliderFromPh2(0.25)]);
    entries.push(['Max oblong',   sliderFromPh2(1)]);
  } else if (wobbleMode === 'dip3') {
    entries.push(['1st peak',     sliderFromPh2(1/6)]);
    entries.push(['2nd peak',     sliderFromPh2(1/2)]);
    entries.push(['Max oblong',   sliderFromPh2(1)]);
  }

  entries.push(['Split',         sliderFromT(PH2_END)]);
  entries.push(['Anim end',      sliderFromT(FISS_STOP_T)]);

  const mode = wobbleMode === 'dip1' ? 'dip1 (1 dip)' : wobbleMode === 'dip2' ? 'dip2 (2 dips)' : 'dip3 (3 dips)';
  devTimecodeRows.innerHTML = `<div class="tc-row" style="color:rgba(70,165,255,0.45);margin-bottom:4px">${mode}</div>` +
    entries.map(([label, val]) =>
      `<div class="tc-row"><span>${label}</span><span class="tc-val">${val}</span></div>`
    ).join('');
}

function drawForceViz() {
  if (currentTab !== 'fission' || arrowMode === 0) return;

  const fvc = forceVizCv.getContext('2d');
  const W = forceVizCv.width, H = forceVizCv.height;
  fvc.clearRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2;
  const panelR = animParent ? animParent.sphereR * 0.8 : 40;

  const frac = currentScrubFrac;
  // Pre-impact (neutron still flying or not yet fired) the panel always shows
  // a horizontal pair of arrows — the chosen axis isn't revealed until the
  // neutron lands. After impact, the actual `staticFissAngle` drives the viz.
  const fissAngle = (frac < NEUTRON_FRAC) ? 0 : staticFissAngle;
  const cosF = Math.cos(fissAngle), sinF = Math.sin(fissAngle);

  // Fixed arrowhead size (based on max arrow length) — only stem shortens
  const fixedHead = panelR * 1.17 * 0.234;

  // Arrow wrapper: start at (fromX,fromY), direction (nx,ny), length len
  // hl = head length override; undefined = proportional to len (whole arrow scales)
  function arrow(fromX, fromY, nx, ny, len, color, hl = fixedHead) {
    fvArrowOnCtx(fvc, fromX, fromY, nx, ny, len, color, 9, hl);
  }

  // Perpendicular to fission axis (used to offset parallel arrows)
  const perpX = -sinF, perpY = cosF;
  const sep = 12;  // px separation between paired arrows

  // Draw arrow centered at (hcx, hcy), pointing in (dx, dy), offset perp by perpOff
  function centeredArrow(hcx, hcy, dx, dy, len, color, perpOff, hl = fixedHead) {
    const fx = hcx - dx * len / 2 + perpX * perpOff;
    const fy = hcy - dy * len / 2 + perpY * perpOff;
    arrow(fx, fy, dx, dy, len, color, hl);
  }

  // Draw nucleus outline or particles for a given deformation
  function drawNucleus(panelCx, panelCy, pR, sAlong, sPerp, particles) {
    if (showParticles && particles) {
      fvDrawParticleGroup(fvc, particles.pts, particles.wcx, particles.wcy, particles.wsR, panelCx, panelCy, pR);
    } else if (animParent) {
      fvCloudOutline(fvc, panelCx, panelCy, pR, animParent.sphereR, sAlong, sPerp, fissAngle);
    }
  }

  // ── Balanced stable nucleus (before + during neutron approach) ───────────
  // Always show balanced forces; they change once wobble starts
  const maxBalanced = panelR * 1.08;
  const stableParticles = animParent ? { pts: animParent.particles, wcx: animParent.cx, wcy: animParent.cy, wsR: animParent.sphereR } : null;

  if (frac < NEUTRON_FRAC) {
    drawNucleus(cx, cy, panelR, 1, 1, stableParticles);
    // Balanced: electric outward = strong inward, equal length — centered on each half, parallel
    const halfOff = panelR * 1.0;
    const rhcx = cx + cosF * halfOff, rhcy = cy + sinF * halfOff;
    const lhcx = cx - cosF * halfOff, lhcy = cy - sinF * halfOff;
    centeredArrow(rhcx, rhcy,  cosF,  sinF, maxBalanced, FV_ELEC_COLOR,    sep);
    centeredArrow(rhcx, rhcy, -cosF, -sinF, maxBalanced, FV_STRONG_COLOR, -sep);
    centeredArrow(lhcx, lhcy, -cosF, -sinF, maxBalanced, FV_ELEC_COLOR,    sep);
    centeredArrow(lhcx, lhcy,  cosF,  sinF, maxBalanced, FV_STRONG_COLOR, -sep);
    return;
  }

  // ── Fission zone ─────────────────────────────────────────────────────────
  const ff = (frac - NEUTRON_FRAC) / (1 - NEUTRON_FRAC);
  const t  = PH1_END + ff * (FISS_STOP_T - PH1_END);

  if (t <= PH2_END) {
    // Phase 2: wobble — strong shrinks, electric stays
    const ph2 = (t - PH1_END) / (PH2_END - PH1_END);
    const w   = wobbleSignal(ph2, wobbleMode);
    const deformAmp  = 0.15 * Math.min(1, ph2 / 0.10);
    const wobble     = deformAmp * w;
    const scaleAlong = 1 + wobble;
    const scalePerp  = 1 / (1 + wobble * 0.7);
    const deformFrac = deformAmp * w / 0.15;  // 0=spherical → 1=max elongation

    let ph2Particles = null;
    if (showParticles && animParent) {
      const ncx = animParent.cx, ncy = animParent.cy;
      const cosA = Math.cos(fissAngle), sinA = Math.sin(fissAngle);
      const deformed = animParent.particles.map(p => {
        const rx = p.x - ncx, ry = p.y - ncy;
        const along = rx * cosA + ry * sinA;
        const perp  = -rx * sinA + ry * cosA;
        return { ...p,
          x: ncx + along * scaleAlong * cosA - perp * scalePerp * sinA,
          y: ncy + along * scaleAlong * sinA + perp * scalePerp * cosA,
        };
      });
      ph2Particles = { pts: deformed, wcx: ncx, wcy: ncy, wsR: animParent.sphereR };
    }
    drawNucleus(cx, cy, panelR, scaleAlong, scalePerp, ph2Particles);

    const maxE = panelR * 1.17;
    const maxS = panelR * 1.08;
    const electricLen = maxE;
    // Strong weakens as nucleus elongates: full when round, 50% of electric at max oblong
    const strongLen = maxS + deformFrac * (0.5 * maxE - maxS);

    // Centered on each deformed half, parallel arrows
    const halfOff2 = panelR * scaleAlong * 1.0;
    const rhcx = cx + cosF * halfOff2, rhcy = cy + sinF * halfOff2;
    const lhcx = cx - cosF * halfOff2, lhcy = cy - sinF * halfOff2;
    centeredArrow(rhcx, rhcy,  cosF,  sinF, electricLen, FV_ELEC_COLOR,    sep);
    centeredArrow(lhcx, lhcy, -cosF, -sinF, electricLen, FV_ELEC_COLOR,    sep);
    centeredArrow(rhcx, rhcy, -cosF, -sinF, strongLen,   FV_STRONG_COLOR, -sep);
    centeredArrow(lhcx, lhcy,  cosF,  sinF, strongLen,   FV_STRONG_COLOR, -sep);

  } else {
    // Phase 3: camera follows f2; f1 shoots off using main-canvas shoot timing (4× speed)
    const sepT      = (t - PH2_END) / (1.0 - PH2_END);
    const shootT    = Math.min(1, sepT / 0.075);
    const shootEase = Math.min(1, 3 * shootT * shootT * shootT);

    const fragR2 = panelR * 0.58;
    const fragR1 = panelR * 0.65;
    const maxE   = panelR * 1.17;

    // f2 stays centered; f1 shoots off at 4× the previous speed
    const f2x = cx, f2y = cy;
    const f1sep = (panelR + fragR1) * (0.05 + shootEase * 16);
    const f1x = cx - cosF * f1sep, f1y = cy - sinF * f1sep;

    // Draw using union outline (peanut while overlapping, separate when apart)
    if (showParticles && animProd1 && animProd2) {
      fvDrawParticleGroup(fvc, animProd1.particles, animProd1.cx, animProd1.cy, animProd1.sphereR, f1x, f1y, fragR1);
      fvDrawParticleGroup(fvc, animProd2.particles, animProd2.cx, animProd2.cy, animProd2.sphereR, f2x, f2y, fragR2);
    } else {
      drawFissionOutline(f1x, f1y, fragR1, f2x, f2y, fragR2, fvc);
    }

    // Electric arrows fade quickly: 20% of max by frame 900 (sepT ≈ 0.0384)
    const sepT900 = (PH1_END + 0.875 * (FISS_STOP_T - PH1_END) - PH2_END) / (1.0 - PH2_END);
    const electricLen = maxE * Math.pow(0.20, sepT / sepT900);

    // From frame 830 onward, whole arrow (including head) shrinks; before that, fixed head
    const sepT830 = (PH1_END + 0.7875 * (FISS_STOP_T - PH1_END) - PH2_END) / (1.0 - PH2_END);
    const hl = sepT < sepT830 ? fixedHead : undefined;

    // f2: base anchored at surface, tip retracts as arrow shortens
    arrow(f2x + cosF * fragR2, f2y + sinF * fragR2, cosF, sinF, electricLen, FV_ELEC_COLOR, hl);
    // f1: base anchored at surface, pointing outward (away from f2), only while visible
    if (f1x > -fragR1 - electricLen && f1x < W + fragR1 + electricLen) {
      arrow(f1x - cosF * fragR1, f1y - sinF * fragR1, -cosF, -sinF, electricLen, FV_ELEC_COLOR, hl);
    }
  }
}

function syncForceVizVisibility() {
  const show = currentTab === 'fission' && arrowMode > 0;
  forceVizPanelEl.style.display = show ? 'block' : 'none';
  devTimecodeEl.style.display   = show ? 'block' : 'none';
}

function drawStaticFrame() {
  syncForceVizVisibility();   // set display before renderAtFrac reads offsetWidth
  syncForceVizVisibility();
  renderAtFrac(currentScrubFrac);
  drawForceViz();
}

function scrubVal(frac) { return Math.round(frac * 1000); }
function scrubPct(frac) { return Math.round(frac * 1000); }


function neutronTick(now) {
  if (neutronState !== 'flying') return;
  const dt    = neutronLast ? now - neutronLast : 16;
  neutronLast = now;
  const speed = parseFloat(document.getElementById('neutronSpeed').value);
  neutronX   += speed * 0.25 * dt;

  const nf = Math.max(0, Math.min(1, (neutronX - (-PARTICLE_RADIUS - 5)) /
                                     (neutronImpactX() - (-PARTICLE_RADIUS - 5))));
  currentScrubFrac = nf * NEUTRON_FRAC;
  document.getElementById('scrubSlider').value = scrubVal(currentScrubFrac);
  document.getElementById('scrubPct').textContent = scrubPct(currentScrubFrac);

  if (neutronX + PARTICLE_RADIUS >= animParent.cx - animParent.sphereR) {
    staticNeutronIX  = animParent.cx - animParent.sphereR * 0.85;
    staticNeutronIY  = animParent.cy;
    // Pick the fission axis here — at impact — so the force viz panel doesn't
    // reveal the chosen direction during the neutron's flight.
    staticFissAngle  = (Math.random() - 0.5) * Math.PI;
    neutronState     = 'fission';
    staticFissStart  = now;
    wobbleMode     = isFirstFission ? 'dip1' : pickWobbleMode();
    isFirstFission = false;
    updateTimecodes();
    SHAKE_DURATION = (5 + Math.random() * 10) * 100;   // 500–1500 ms (1 unit = 100 ms)
    resetExcitedSpots();
    staticFissT      = PH1_END;
    currentScrubFrac = NEUTRON_FRAC;
    document.getElementById('scrubSlider').value = scrubVal(NEUTRON_FRAC);
    document.getElementById('scrubPct').textContent = scrubPct(NEUTRON_FRAC);
    neutronRAF = requestAnimationFrame(fissionTick);
    return;
  }

  if (currentTab !== 'chain') updateParticleJitter(animParent.particles.length, 1, true);
  syncForceVizVisibility();
  renderAtFrac(currentScrubFrac);
  drawForceViz();
  neutronRAF = requestAnimationFrame(neutronTick);
}

function fissionTick(now) {
  if (neutronState !== 'fission') return;
  if (currentTab !== 'chain') updateParticleJitter(animParent.particles.length);
  const playbackSpeed = parseFloat(document.getElementById('playbackSpeed').value);
  const elapsed = (now - staticFissStart) * playbackSpeed;
  if (elapsed < SHAKE_DURATION) {
    staticFissT = PH1_END + (elapsed / SHAKE_DURATION) * (PH2_END - PH1_END);
  } else {
    staticFissT = Math.min(FISS_STOP_T, PH2_END + ((elapsed - SHAKE_DURATION) / NORMAL_DURATION) * (ANIM_T_END - PH2_END));
  }
  // Transfer energy for main fission split (chain tab only)
  if (staticFissT > PH2_END && !mainEnergyTransferred && currentTab === 'chain') {
    mainEnergyTransferred = true;
    if (wobbleMode !== 'stable') {
      energyInFields = Math.max(0, energyInFields - 1);
      energyInMotion += 1;
      // Spawn bouncing daughter fragments for the main fission nucleus
      const spd = 0.28 + Math.random() * 0.14;
      const a = staticFissAngle;
      mainDaughters = [
        { x: animParent.cx, y: animParent.cy, vx: -Math.cos(a) * spd, vy: -Math.sin(a) * spd, r: prod1R, viewAngle: Math.random() * Math.PI * 2 },
        { x: animParent.cx, y: animParent.cy, vx:  Math.cos(a) * spd, vy:  Math.sin(a) * spd, r: prod2R, viewAngle: Math.random() * Math.PI * 2 },
      ];
      // Convert unabsorbed fission neutrons to physics-based chain neutrons so they bounce off walls
      for (const n of fissionNeutrons) {
        if (n.absorbed) continue;
        const nspd = 0.25 + Math.random() * 0.25;
        chainNeutrons.push({ x: animParent.cx, y: animParent.cy, vx: Math.cos(n.angle) * nspd, vy: Math.sin(n.angle) * nspd });
        n.absorbed = true;  // suppress scripted drawing
      }
    }
  }
  // Check fission neutron collisions with enriched sites every frame after split
  if (staticFissT > PH2_END) {
    const sepT2 = (staticFissT - PH2_END) / (1.0 - PH2_END);
    const PMAX  = (ANIM_T_END - PH2_END) / (1.0 - PH2_END);
    const nFrac = Math.min(1, sepT2 / PMAX);
    const ncx   = canvas.width / 2, ncy = canvas.height / 2;
    const nDiag = Math.max(canvas.width, canvas.height);
    const sphR  = animParent.sphereR;
    const capR  = sphR + PARTICLE_RADIUS * 2;
    for (const n of fissionNeutrons) {
      if (n.absorbed) continue;
      const dist = nFrac * n.speed * nDiag;
      const nx = ncx + Math.cos(n.angle) * dist;
      const ny = ncy + Math.sin(n.angle) * dist;
      for (const site of enrichSites) {
        if (site.state !== 'idle') continue;
        if (Math.hypot(nx - site.cx, ny - site.cy) < capR) {
          n.absorbed = true;
          triggerEnrichSite(site);
          break;
        }
      }
    }
  }
  updateChain(now);
  const ff = (staticFissT - PH1_END) / (FISS_STOP_T - PH1_END);
  currentScrubFrac = NEUTRON_FRAC + Math.min(1, ff) * (1 - NEUTRON_FRAC);
  document.getElementById('scrubSlider').value = scrubVal(currentScrubFrac);
  document.getElementById('scrubPct').textContent = scrubPct(currentScrubFrac);
  syncForceVizVisibility();
  renderAtFrac(currentScrubFrac);
  drawForceViz();
  if (staticFissT < FISS_STOP_T) {
    neutronRAF = requestAnimationFrame(fissionTick);
  } else {
    neutronState = 'done';
    document.getElementById('goBtn').textContent = '▶ GO';
    document.getElementById('goBtn').classList.remove('running');
    document.getElementById('replayBtn').disabled = false;
    document.getElementById('scrubReplayBtn').disabled = false;
    ensureChainLoop();
    // If no chain reaction sites are active, mark pre-render done now
    if (!chainRAF) markPrerenderDone();
  }
}

// ─── Speed lines (neutron speed indicator) ────────────────────────────────────
function drawSpeedLines() {
  const canvas = document.getElementById('speedLinesCanvas');
  if (!canvas) return;
  const c = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const slider = document.getElementById('neutronSpeed');
  const min = parseFloat(slider.min), max = parseFloat(slider.max);
  const t   = (parseFloat(slider.value) - min) / (max - min);  // 0..1

  c.clearRect(0, 0, w, h);

  // 3 right-aligned horizontal lines; lengths scale with slider
  const maxLen  = w - 2;
  const scales  = [0.65, 1.0, 0.80];
  const ys      = [h * 0.25, h * 0.5, h * 0.75];

  scales.forEach((scale, i) => {
    const tFloor = 0.18 + 0.82 * t;  // minimum ~18% even at slider min
    const len = tFloor * maxLen * scale;
    const x = w - len;
    const y = Math.round(ys[i]);

    // outer glow
    c.save();
    c.strokeStyle = 'rgba(180,180,210,0.25)';
    c.lineWidth = 4;
    c.beginPath(); c.moveTo(x, y); c.lineTo(w, y); c.stroke();

    // core
    c.strokeStyle = 'rgba(210,210,230,0.85)';
    c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(x, y); c.lineTo(w, y); c.stroke();
    c.restore();
  });
}

// ─── Neutron icon ─────────────────────────────────────────────────────────────
const neutronIconJitter = { x: 0, y: 0 };

function drawNeutronIconToCanvas(canvas) {
  if (!canvas) return;
  const c = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const R  = Math.min(w, h) * 0.32;
  const cx = w / 2 + neutronIconJitter.x;
  const cy = h / 2 + neutronIconJitter.y;

  c.clearRect(0, 0, w, h);

  // Base fill
  const baseGrad = c.createRadialGradient(cx, cy, 0, cx, cy, R * 1.1);
  baseGrad.addColorStop(0,    '#70707f');
  baseGrad.addColorStop(0.82, '#70707f');
  baseGrad.addColorStop(1,    'rgba(0,0,0,0)');
  c.fillStyle = baseGrad;
  c.beginPath(); c.arc(cx, cy, R * 1.1, 0, Math.PI * 2); c.fill();

  // Inner glow
  const innerGlow = c.createRadialGradient(cx, cy, 0, cx, cy, R);
  innerGlow.addColorStop(0,   '#b0b0c4');
  innerGlow.addColorStop(0.5, '#b0b0c4');
  innerGlow.addColorStop(1,   'rgba(0,0,0,0)');
  c.globalAlpha = 0.82;
  c.fillStyle = innerGlow;
  c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2); c.fill();
  c.globalAlpha = 1;
}

function drawNeutronIcon() {
  drawNeutronIconToCanvas(document.getElementById('neutronIconCanvas'));
}

function neutronIconLoop() {
  neutronIconJitter.x += (Math.random() - 0.5) * 0.7;
  neutronIconJitter.y += (Math.random() - 0.5) * 0.7;
  neutronIconJitter.x *= 0.78;
  neutronIconJitter.y *= 0.78;
  drawNeutronIcon();
  requestAnimationFrame(neutronIconLoop);
}
neutronIconLoop();

// ─── Nucleus button icon (New button) ─────────────────────────────────────────
// ~62 particles (25% of main 250-nucleon nucleus), sphere-packed, fixed seed.
// Same gradient+shadowBlur style as drawParticles().
const nucleusIconParticles = (() => {
  const ICON_R = 4;   // particle radius in icon px
  const nP = 20, nN = 42, nTotal = nP + nN;
  const packFrac = 0.62;
  const vol    = nTotal * (4/3 * Math.PI * ICON_R ** 3) / packFrac;
  const sphR   = Math.cbrt(vol * 3 / (4 * Math.PI)) * 1.05;
  const minD2  = (ICON_R * 2.05) ** 2;

  let s = 0x9e3779b9;
  const rand = () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };

  const pts = [];
  let tries = 0;
  while (pts.length < nTotal && tries < nTotal * 300) {
    tries++;
    const r3 = rand(), th = Math.acos(2 * rand() - 1), ph = rand() * 2 * Math.PI;
    const r  = sphR * Math.cbrt(r3);
    const ox = r * Math.sin(th) * Math.cos(ph);
    const oy = r * Math.sin(th) * Math.sin(ph);
    const oz = r * Math.cos(th);
    let ok = true;
    for (const q of pts) {
      if ((ox-q.ox)**2 + (oy-q.oy)**2 + (oz-q.oz)**2 < minD2) { ok = false; break; }
    }
    if (ok) pts.push({ ox, oy, oz, type: pts.length < nP ? 'proton' : 'neutron', jx: 0, jy: 0 });
  }
  return pts.sort((a, b) => a.oz - b.oz);  // back-to-front
})();

function drawNucleusIcon(canvas) {
  if (!canvas) return;
  const c = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const cx = w / 2 - 6, cy = h / 2;
  const R = 4;

  c.clearRect(0, 0, w, h);

  for (const p of nucleusIconParticles) {
    const px = cx + p.ox + p.jx;
    const py = cy + p.oy + p.jy;
    const isProton = p.type === 'proton';
    const mid  = isProton ? '#ff1a65' : '#70707f';
    const core = isProton ? '#ff80b0' : '#b0b0c4';

    const baseGrad = c.createRadialGradient(px, py, 0, px, py, R * 1.1);
    baseGrad.addColorStop(0,    mid);
    baseGrad.addColorStop(0.82, mid);
    baseGrad.addColorStop(1,    'rgba(0,0,0,0)');
    c.fillStyle = baseGrad;
    c.beginPath(); c.arc(px, py, R * 1.1, 0, Math.PI * 2); c.fill();

    const innerGlow = c.createRadialGradient(px, py, 0, px, py, R);
    innerGlow.addColorStop(0,   core);
    innerGlow.addColorStop(0.5, core);
    innerGlow.addColorStop(1,   'rgba(0,0,0,0)');
    c.save();
    c.shadowColor = core;
    c.shadowBlur  = 4;
    c.globalAlpha = 0.82;
    c.fillStyle = innerGlow;
    c.beginPath(); c.arc(px, py, R, 0, Math.PI * 2); c.fill();
    c.restore();
    c.globalAlpha = 1;
  }
}

function drawOutlineIcon() {
  const ic = document.getElementById('outlineModeIcon');
  if (!ic) return;
  const c = ic.getContext('2d');
  const w = ic.width, h = ic.height;
  const cx = w / 2, cy = h / 2;
  const sR = Math.min(w, h) * 0.36;
  const R  = 2.5;
  const N  = Math.max(5, Math.round(2 * Math.PI * sR / (R * 1.5)));
  const centers = Array.from({ length: N }, (_, k) => {
    const a = k * 2 * Math.PI / N;
    return { x: cx + sR * Math.cos(a), y: cy + sR * Math.sin(a) };
  });
  // outerIntersection equivalent for the icon ctx
  function iconOuterIntersect(c1, c2) {
    const dx = c2.x - c1.x, dy = c2.y - c1.y;
    const d  = Math.sqrt(dx * dx + dy * dy);
    const h2 = Math.sqrt(Math.max(0, R * R - (d / 2) ** 2));
    const mx = (c1.x + c2.x) / 2, my = (c1.y + c2.y) / 2;
    const px = -dy / d * h2, py = dx / d * h2;
    const p1 = { x: mx + px, y: my + py }, p2 = { x: mx - px, y: my - py };
    const d1 = (p1.x - cx)**2 + (p1.y - cy)**2;
    const d2 = (p2.x - cx)**2 + (p2.y - cy)**2;
    return d1 > d2 ? p1 : p2;
  }
  const arcs = centers.map((pt, k) => {
    const prev = centers[(k - 1 + N) % N], next = centers[(k + 1) % N];
    const sp = iconOuterIntersect(pt, prev);
    const ep = iconOuterIntersect(pt, next);
    return { cx: pt.x, cy: pt.y, startAngle: Math.atan2(sp.y - pt.y, sp.x - pt.x), endAngle: Math.atan2(ep.y - pt.y, ep.x - pt.x) };
  });
  c.clearRect(0, 0, w, h);
  c.save();
  c.shadowColor = 'rgba(80,160,255,0.9)'; c.shadowBlur = 4;
  c.strokeStyle = 'rgba(160,215,255,1)'; c.lineWidth = 1;
  c.beginPath();
  c.moveTo(arcs[0].cx + R * Math.cos(arcs[0].startAngle), arcs[0].cy + R * Math.sin(arcs[0].startAngle));
  for (const arc of arcs) c.arc(arc.cx, arc.cy, R, arc.startAngle, arc.endAngle, false);
  c.closePath(); c.stroke(); c.restore();
}

// ─── Controls ─────────────────────────────────────────────────────────────────
// ─── Pre-render + smooth playback ─────────────────────────────────────────────
let isFirstFission   = true;  // first run always uses dip1 mode
let prerenderFrames  = [];   // ImageBitmap[]
let prerenderFracs   = [];   // currentScrubFrac at each frame
let prerenderTimes   = [];   // performance.now() at capture
let prerenderActive  = false;
let prerenderPending = 0;
let prerenderAllDone = false;
let prerenderSlot    = 0;
let playbackRAF      = null;
let playbackStartT   = 0;
let playbackStartRealT     = 0;
let pausedInPrerender      = false;   // paused during prerender playback
let pausedPlaybackElapsed  = 0;       // raw ms elapsed when paused
let chainPaused            = false;   // chain reaction was running when paused

function captureFrame() {
  if (!prerenderActive) return;
  const slot = prerenderSlot++;
  prerenderFrames.push(null);
  prerenderFracs.push(currentScrubFrac);
  prerenderTimes.push(performance.now());
  prerenderPending++;
  createImageBitmap(canvas).then(bmp => {
    prerenderFrames[slot] = bmp;
    prerenderPending--;
    if (prerenderAllDone && prerenderPending === 0) startPlayback();
  });
}

function markPrerenderDone() {
  if (!prerenderActive || prerenderAllDone) return;
  prerenderAllDone = true;
  if (prerenderPending === 0) startPlayback();
}

function startPlayback() {
  prerenderActive = false;
}

function playbackLoop(now) {
  const n = prerenderFrames.length;
  if (!n) return;

  const speed   = parseFloat(document.getElementById('playbackSpeed').value);
  const elapsed = (now - playbackStartRealT) * speed;
  const animEnd = prerenderTimes[n - 1] - prerenderTimes[0];

  // Binary search for the frame whose capture time <= elapsed
  let lo = 0, hi = n - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (prerenderTimes[mid] - prerenderTimes[0] <= elapsed) lo = mid; else hi = mid - 1;
  }
  const idx = lo;

  if (prerenderFracs[idx] !== undefined) {
    currentScrubFrac = prerenderFracs[idx];
    renderAtFrac(currentScrubFrac);
    drawForceViz();
    document.getElementById('scrubSlider').value = scrubVal(currentScrubFrac);
    document.getElementById('scrubPct').textContent = scrubPct(currentScrubFrac);
  }

  if (elapsed < animEnd) {
    playbackRAF = requestAnimationFrame(playbackLoop);
  } else {
    // Hold last frame, mark done
    playbackRAF = null;
    document.getElementById('goBtn').textContent = '▶ GO';
    document.getElementById('goBtn').classList.remove('running');
    document.getElementById('replayBtn').disabled = false;
    document.getElementById('scrubReplayBtn').disabled = false;
  }
}

function resetPrerender() {
  if (playbackRAF) { cancelAnimationFrame(playbackRAF); playbackRAF = null; }
  prerenderFrames = []; prerenderFracs = []; prerenderTimes = [];
  prerenderActive = false; prerenderAllDone = false;
  prerenderPending = 0; prerenderSlot = 0;
  pausedInPrerender = false;
}

document.getElementById('goBtn').addEventListener('click', () => {
  const btn = document.getElementById('goBtn');

  // ── PAUSE: freeze everything in place ────────────────────────────────────
  if (btn.textContent === '⏸') {
    if (neutronRAF) { cancelAnimationFrame(neutronRAF); neutronRAF = null; }
    if (chainRAF)   { cancelAnimationFrame(chainRAF);   chainRAF   = null; chainPaused = true; }
    if (playbackRAF) {
      pausedPlaybackElapsed = performance.now() - playbackStartRealT;
      pausedInPrerender = true;
      cancelAnimationFrame(playbackRAF);
      playbackRAF = null;
    } else {
      pausedInPrerender = false;
    }
    btn.textContent = '▶ GO';
    btn.classList.remove('running');
    return;
  }

  // ── GO: resume from exact pause point, or start fresh ────────────────────

  // Resume prerender playback
  if (pausedInPrerender) {
    pausedInPrerender  = false;
    playbackStartRealT = performance.now() - pausedPlaybackElapsed;
    btn.textContent = '⏸';
    btn.classList.add('running');
    playbackRAF = requestAnimationFrame(playbackLoop);
    return;
  }

  // Resume chain reaction (chain tab only)
  if (chainPaused) {
    chainPaused = false;
    lastChainTime = null;   // prevents dt spike from pause duration
    btn.textContent = '⏸';
    btn.classList.add('running');
    ensureChainLoop();
    return;
  }

  // Resume main fission animation (paused mid-flight)
  if (neutronState === 'flying' || neutronState === 'fission') {
    const frac = currentScrubFrac;
    const now  = performance.now();
    if (frac < NEUTRON_FRAC) {
      const nf = frac / NEUTRON_FRAC;
      neutronX    = (-PARTICLE_RADIUS - 5) + nf * (neutronImpactX() - (-PARTICLE_RADIUS - 5));
      neutronY    = animParent.cy;
      neutronLast = 0;
    } else {
      const ff = (frac - NEUTRON_FRAC) / (1 - NEUTRON_FRAC);
      staticFissT = PH1_END + ff * (ANIM_T_END - PH1_END);
      let elapsedAtPos;
      if (staticFissT <= PH2_END) {
        elapsedAtPos = (staticFissT - PH1_END) / (PH2_END - PH1_END) * SHAKE_DURATION;
      } else {
        elapsedAtPos = SHAKE_DURATION + (staticFissT - PH2_END) / (ANIM_T_END - PH2_END) * NORMAL_DURATION;
      }
      const pbSpeed = parseFloat(document.getElementById('playbackSpeed').value);
      staticFissStart = now - elapsedAtPos / pbSpeed;
    }
    btn.textContent = '⏸';
    btn.classList.add('running');
    neutronRAF = requestAnimationFrame(frac < NEUTRON_FRAC ? neutronTick : fissionTick);
    return;
  }

  // Fresh start — choose fission axis before wobble so elongation and split
  // always go in the same direction.
  resetPrerender();
  prerenderActive  = true;
  prerenderAllDone = false;
  prerenderPending = 0;
  prerenderSlot    = 0;
  prerenderFrames  = [];
  prerenderFracs   = [];
  prerenderTimes   = [];

  mainNeutronsEmitted = false; mainEnergyTransferred = false; mainDaughters = null;
  chainNeutrons       = []; lastChainTime = null;
  for (const s of enrichSites) s.state = 'idle';
  heatmapDirty    = true;
  // Reset the fission axis so the force viz panel shows a neutral horizontal
  // pair of arrows during the neutron's flight — the actual axis is chosen
  // when the neutron impacts the nucleus (in neutronTick).
  staticFissAngle = 0;
  genFissionNeutrons();
  neutronState = 'flying';
  neutronX     = -PARTICLE_RADIUS - 5;
  neutronY     = animParent.cy;
  neutronLast  = 0;
  egCtx.clearRect(0, 0, egCanvas.width, egCanvas.height);
  maxRevealedFrac = 0;
  if (currentTab !== 'chain') document.getElementById('scrubBar').classList.add('visible');
  document.getElementById('scrubSlider').value = 0;
  document.getElementById('scrubPct').textContent = '0';
  document.getElementById('replayBtn').disabled = false;
  document.getElementById('scrubReplayBtn').disabled = false;
  btn.textContent = '⏸';
  btn.classList.add('running');
  neutronRAF = requestAnimationFrame(neutronTick);
});

  // Try to place 5 nuclei; skip any candidate that lands too close to existing sites
  for (let n = 0; n < 5; n++) {
    let cx, cy, attempts = 0;
    do {
      cx = b.x + sitePad + Math.random() * (b.w - sitePad * 2);
      cy = b.y + sitePad + Math.random() * (b.h - sitePad * 2);
      attempts++;
    } while (attempts < 60 && (
      Math.hypot(cx - animParent.cx, cy - animParent.cy) < minDist ||
      enrichSites.some(s => Math.hypot(cx - s.cx, cy - s.cy) < minDist)
    ));
    if (attempts < 60) {
      enrichSites.push({ cx, cy, state: 'idle', fissStart: 0, fissT: PH1_END,
                         angle: 0, shakeDur: 600, neutronsEmitted: false,
                         viewAngle: Math.random() * Math.PI * 2 });
      totalFuelAdded++;
      energyInFields++;

  drawStaticFrame();
});

// ─── Nucleus rotation ────────────────────────────────────────────────────────
// Click + drag the parent nucleus while idle to rotate it. Horizontal drag
// rotates around the vertical axis (left/right swing); vertical drag rotates
// around the horizontal axis (top/bottom tilt). Trackball convention — the
// surface follows the cursor. As particles' z flips sign, drawParticles'
// z-sort swaps them between the front and back of the rendered nucleus.
let nucleusDrag = null;  // { lastX, lastY } during an active drag

function pickNucleus(clientX, clientY) {
  if (!animParent) return false;
  const rect = canvas.getBoundingClientRect();
  const sx = clientX - rect.left, sy = clientY - rect.top;
  const W = canvas.width, H = canvas.height;
  // Inverse of renderAtFrac's canvas transform (translate, scale, translate).
  const fvShift = (currentTab === 'fission' && arrowMode > 0)
    ? -(forceVizPanelEl.offsetWidth + 20) / 2
    : 0;
  const wx = (sx - W/2 - fvShift) / viewZoom + W/2;
  const wy = (sy - H/2) / viewZoom + H/2;
  const dx = wx - animParent.cx, dy = wy - animParent.cy;
  return dx*dx + dy*dy <= animParent.sphereR * animParent.sphereR;
}

function rotateNucleusY(deltaTheta) {
  if (!animParent) return;
  const cx = animParent.cx;
  const c = Math.cos(deltaTheta), s = Math.sin(deltaTheta);
  for (const p of animParent.particles) {
    const lx = p.x - cx;
    const lz = p.z;
    p.x = cx + lx * c + lz * s;
    p.z = -lx * s + lz * c;
  }
  // Cached offsets used by the chain tab now reflect the old orientation.
  chainParticleOffsets = null;
}

function rotateNucleusX(deltaTheta) {
  if (!animParent) return;
  const cy = animParent.cy;
  const c = Math.cos(deltaTheta), s = Math.sin(deltaTheta);
  for (const p of animParent.particles) {
    const ly = p.y - cy;
    const lz = p.z;
    p.y = cy + ly * c + lz * s;
    p.z = -ly * s + lz * c;
  }
  chainParticleOffsets = null;
}

function canRotateNucleus() {
  return currentTab === 'fission' && neutronState === 'idle' && !!animParent;
}

canvas.addEventListener('mousedown', (e) => {
  if (!canRotateNucleus()) return;
  if (!pickNucleus(e.clientX, e.clientY)) return;
  nucleusDrag = { lastX: e.clientX, lastY: e.clientY };
  canvas.style.cursor = 'grabbing';
  e.preventDefault();
});

canvas.addEventListener('mousemove', (e) => {
  if (nucleusDrag) return;  // window listener handles the drag itself
  canvas.style.cursor = (canRotateNucleus() && pickNucleus(e.clientX, e.clientY))
    ? 'grab'
    : '';
});

window.addEventListener('mousemove', (e) => {
  if (!nucleusDrag) return;
  const dx = e.clientX - nucleusDrag.lastX;
  const dy = e.clientY - nucleusDrag.lastY;
  nucleusDrag.lastX = e.clientX;
  nucleusDrag.lastY = e.clientY;
  const radPerPx = (Math.PI * 2) / 600;  // ~600 px per full turn, both axes
  if (dx) rotateNucleusY(dx * radPerPx);
  if (dy) rotateNucleusX(dy * radPerPx);
  drawStaticFrame();
});

window.addEventListener('mouseup', () => {
  if (!nucleusDrag) return;
  nucleusDrag = null;
  canvas.style.cursor = '';
});

// ─── Energy model ─────────────────────────────────────────────────────────────
// NO sharp changes anywhere — every transition is cosine-smooth.
//   BEFORE                    : KE flat 0.62, EIE flat 0.38
//   Neutron hit               : +0.006 KE step (very tiny, intentional)
//   DURING  (wobbleSignal)    : KE oscillates keHigh↔keLow per mode
//   AFTER fission             : symmetric S-curve KE 0.15 → 0.72
//   AFTER stable (no fission) : smooth return KE → 0.62
function computeEnergy(frac) {
  if (frac < NEUTRON_FRAC) return { ke: 0.62, eie: 0.38 };

  const ff = (frac - NEUTRON_FRAC) / (1 - NEUTRON_FRAC);
  const t  = PH1_END + ff * (ANIM_T_END - PH1_END);

  if (t <= PH2_END) {
    const ph2        = (t - PH1_END) / (PH2_END - PH1_END);
    const normWobble = wobbleSignal(ph2, wobbleMode);
    // keHigh: circular baseline drifts down gently (0.626 → 0.566)
    // keLow:  oblong floor (0.626 → 0.15).  Polynomial f = 2ph2−ph2² has f(0)=0, f(1)=1,
    //         f'(1)=0 — so the descent flattens to zero slope right at the minimum,
    //         rounding the bottom of the dip.
    const keHigh = 0.626 - 0.06 * ph2;
    const keLow  = wobbleMode === 'stable'
                   ? 0.626 - 0.35 * Math.sqrt(ph2)                   // stable: shallower dip
                   : 0.626 - 0.476 * (2 * ph2 - ph2 * ph2);          // fission: → 0.15, zero slope at ph2=1
    const t01 = (1 - Math.cos(normWobble * Math.PI)) / 2;
    const ke  = keHigh - (keHigh - keLow) * t01;
    return { ke, eie: 1 - ke };
  }

  const ph3 = (t - PH2_END) / (ANIM_T_END - PH2_END);
  if (wobbleMode === 'stable') {
    // No fission — nucleus relaxes back toward pre-neutron KE (S-curve)
    const s  = (1 - Math.cos(ph3 * Math.PI)) / 2;
    const ke = 0.566 + 0.054 * s;   // 0.566 → 0.62 smoothly
    return { ke, eie: 1 - ke };
  }
  // Fission: Coulomb energy converts to KE.  exp(−k·ph3²) starts with zero slope
  // (rounds the bottom of the dip), peaks rate around ph3≈0.18 (≈9 time units),
  // then decelerates.  k=15 → ~74 % done by ph3=0.30 (≈15 time units), ~95 % by ph3=0.45.
  const s  = 1 - Math.exp(-ph3 * ph3 * 15);
  const ke = 0.15 + 0.57 * s;       // 0.15 → 0.72
  return { ke, eie: Math.max(0.05, 1 - ke) };
}

// ─── Chain Reaction energy bar chart ─────────────────────────────────────────
function drawChainBarChart() {
  const PW = CHAIN_BAR_PANEL_W;
  const PH = canvas.height;
  const gx = canvas.width - PW;
  const gy = 0;

  ctx.save();

  // Panel background
  ctx.fillStyle = 'rgba(4,3,20,0.88)';
  ctx.fillRect(gx, gy, PW, PH);

  // Left border glow
  ctx.save();
  ctx.shadowColor = 'rgba(0,200,255,0.4)'; ctx.shadowBlur = 12;
  ctx.strokeStyle = 'rgba(0,180,255,0.25)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx, gy + PH); ctx.stroke();
  ctx.restore();

  const bars = [
    { label: 'Energy in Motion', value: energyInMotion, color: '#ff2060', glow: 'rgba(255,20,80,0.9)'   },
    { label: 'Energy in Fields', value: energyInFields, color: '#7b6fff', glow: 'rgba(120,100,255,0.9)' },
  ];

  const labelH  = 62;
  const titleH  = 20;
  const chartH  = PH - labelH - titleH;
  const baseline = gy + PH - labelH;
  const padL = 10, padR = 10;
  const chartX  = gx + padL;
  const chartW  = PW - padL - padR;

  // Baseline
  ctx.save();
  ctx.shadowColor = 'rgba(0,200,255,0.5)'; ctx.shadowBlur = 4;
  ctx.strokeStyle = 'rgba(0,200,255,0.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(gx, baseline); ctx.lineTo(gx + PW, baseline); ctx.stroke();
  ctx.restore();

  const barW = chartW / bars.length;
  ctx.textAlign = 'center';
  ctx.font = 'bold 13px "Share Tech Mono", monospace';

  bars.forEach((bar, i) => {
    const frac  = bar.value / CHAIN_ENERGY_MAX;
    const barPx = frac * chartH;
    const x     = chartX + i * barW + barW * 0.1;
    const bw    = barW * 0.8;
    const barTop = baseline - barPx;

    if (barPx > 1) {
      const r = Math.min(6, bw / 2, barPx / 2);

      ctx.save();
      ctx.fillStyle = bar.color; ctx.globalAlpha = 0.22;
      ctx.beginPath(); ctx.roundRect(x, barTop, bw, barPx, [r, r, 2, 2]); ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.shadowColor = bar.glow; ctx.shadowBlur = 22;
      ctx.strokeStyle = bar.color; ctx.lineWidth = 3; ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.roundRect(x, barTop, bw, barPx, [r, r, 2, 2]); ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.shadowColor = bar.glow; ctx.shadowBlur = 6;
      ctx.strokeStyle = bar.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.roundRect(x, barTop, bw, barPx, [r, r, 2, 2]); ctx.stroke();
      ctx.restore();
    }

    // Label below baseline
    ctx.save();
    ctx.shadowColor = bar.glow; ctx.shadowBlur = 6;
    ctx.fillStyle = bar.color;
    const words = bar.label.split(' ');
    ctx.fillText(words.slice(0, 2).join(' '), x + bw / 2, baseline + 18);
    ctx.fillText(words[2] || '',              x + bw / 2, baseline + 36);
    ctx.restore();
  });

  ctx.restore();
}

function drawEnergyGraph() {
  const W = egCanvas.width, H = egCanvas.height;
  const PAD = 8;
  const gH  = H - PAD * 2;
  const zs = egZoomStart, ze = egZoomEnd, zLen = ze - zs;

  egCtx.clearRect(0, 0, W, H);

  // Faint horizontal grid at 25 / 50 / 75%
  egCtx.strokeStyle = 'rgba(255,255,255,0.06)';
  egCtx.lineWidth = 1;
  for (let i = 1; i <= 3; i++) {
    const y = PAD + gH * (1 - i / 4);
    egCtx.beginPath(); egCtx.moveTo(0, y); egCtx.lineTo(W, y); egCtx.stroke();
  }

  // Dashed phase-boundary markers mapped into zoom window
  const ph2EndFrac = NEUTRON_FRAC +
    ((PH2_END - PH1_END) / (ANIM_T_END - PH1_END)) * (1 - NEUTRON_FRAC);
  egCtx.setLineDash([2, 4]);
  egCtx.strokeStyle = 'rgba(255,200,50,0.25)';
  egCtx.lineWidth = 1;
  for (const fx of [NEUTRON_FRAC, ph2EndFrac]) {
    if (fx < zs || fx > ze) continue;
    const x = ((fx - zs) / zLen) * W;
    egCtx.beginPath(); egCtx.moveTo(x, PAD); egCtx.lineTo(x, H - PAD); egCtx.stroke();
  }
  egCtx.setLineDash([]);

  // Advance high-water mark then compute reveal and cursor pixels
  maxRevealedFrac = Math.max(maxRevealedFrac, currentScrubFrac);
  const revealFrac = Math.max(zs, Math.min(ze, maxRevealedFrac));
  const revealPx   = Math.round((revealFrac - zs) / zLen * (W - 1));
  const curFrac = Math.max(zs, Math.min(ze, currentScrubFrac));
  const curPx   = Math.round((curFrac - zs) / zLen * (W - 1));

  // Bottom axis — always visible
  egCtx.save();
  egCtx.shadowBlur  = 6;
  egCtx.shadowColor = 'rgba(0,200,255,0.5)';
  egCtx.strokeStyle = 'rgba(0,200,255,0.35)';
  egCtx.lineWidth   = 1;
  egCtx.beginPath(); egCtx.moveTo(0, H - PAD); egCtx.lineTo(W, H - PAD); egCtx.stroke();
  egCtx.restore();

  // Neon line: full graph always shown, cursor marks current position
  function plotLine(color, glowColor, getVal) {
    const ys = new Float32Array(W);
    for (let px = 0; px < W; px++) {
      const frac = zs + (px / (W - 1)) * zLen;
      ys[px] = PAD + gH * (1 - getVal(computeEnergy(frac)));
    }
    function strokeSeg(fromPx, toPx, lw, blur, alpha) {
      if (fromPx > toPx) return;
      egCtx.save();
      egCtx.globalAlpha = alpha;
      egCtx.shadowBlur  = blur;
      egCtx.shadowColor = glowColor;
      egCtx.strokeStyle = color;
      egCtx.lineWidth   = lw;
      egCtx.beginPath();
      for (let px = fromPx; px <= toPx; px++) {
        if (px === fromPx) egCtx.moveTo(px, ys[px]); else egCtx.lineTo(px, ys[px]);
      }
      egCtx.stroke();
      egCtx.restore();
    }
    // Draw up to the high-water mark — traces live, stays drawn after scrub
    strokeSeg(0, revealPx, 8,  28, 0.25);
    strokeSeg(0, revealPx, 3,  10, 0.55);
    strokeSeg(0, revealPx, 1.5, 0, 1.00);
  }

  plotLine('#7b6fff', 'rgba(120,100,255,0.9)', e => e.eie);  // Energy in Fields — neon indigo
  plotLine('#ff3a6e', 'rgba(255,45,100,0.9)',  e => e.ke);   // Energy in Motion — neon pink-red

  // Legend — top of graph, side by side
  const legend = [
    { text: 'Energy in Fields', color: '#7b6fff', glow: 'rgba(120,100,255,0.9)' },
    { text: 'Energy in Motion', color: '#ff3a6e', glow: 'rgba(255,45,100,0.9)'  },
  ];
  egCtx.font = 'bold 14px "Share Tech Mono", monospace';
  const LLINE = 14, LGAP = 4;
  const ty = PAD + 11;   // just below top edge
  let lx = 10;
  legend.forEach(lbl => {
    egCtx.save();
    egCtx.shadowBlur  = 10;
    egCtx.shadowColor = lbl.glow;
    egCtx.strokeStyle = lbl.color;
    egCtx.lineWidth   = 2;
    egCtx.beginPath(); egCtx.moveTo(lx, ty - 4); egCtx.lineTo(lx + LLINE, ty - 4); egCtx.stroke();
    egCtx.fillStyle  = lbl.color;
    egCtx.shadowBlur = 7;
    egCtx.fillText(lbl.text, lx + LLINE + LGAP, ty);
    egCtx.restore();
    lx += LLINE + LGAP + egCtx.measureText(lbl.text).width + 20;
  });

  // Drag-to-zoom selection overlay
  if (egDragStartPx !== null && egDragCurPx !== null) {
    const x0 = Math.min(egDragStartPx, egDragCurPx);
    const x1 = Math.max(egDragStartPx, egDragCurPx);
    egCtx.fillStyle   = 'rgba(120,100,255,0.12)';
    egCtx.fillRect(x0, 0, x1 - x0, H);
    egCtx.strokeStyle = 'rgba(120,100,255,0.6)';
    egCtx.lineWidth   = 1;
    egCtx.strokeRect(x0, 0, x1 - x0, H);
  }

  // Cursor — neon white with glow
  const cx = curPx;
  egCtx.save();
  egCtx.shadowBlur  = 8;
  egCtx.shadowColor = 'rgba(255,255,255,0.7)';
  egCtx.strokeStyle = 'rgba(255,255,255,0.85)';
  egCtx.lineWidth   = 1;
  egCtx.beginPath(); egCtx.moveTo(cx, 0); egCtx.lineTo(cx, H); egCtx.stroke();
  egCtx.restore();
}

// ─── Energy graph drag-to-zoom ────────────────────────────────────────────────
egCanvas.addEventListener('mousedown', e => {
  egDragStartPx = e.offsetX;
  egDragCurPx   = e.offsetX;
  e.preventDefault();
});
egCanvas.addEventListener('mousemove', e => {
  if (egDragStartPx === null) return;
  egDragCurPx = e.offsetX;
  drawEnergyGraph();
});
egCanvas.addEventListener('mouseup', e => {
  if (egDragStartPx === null) return;
  const x0 = Math.min(egDragStartPx, e.offsetX);
  const x1 = Math.max(egDragStartPx, e.offsetX);
  egDragStartPx = null; egDragCurPx = null;
  const W = egCanvas.width;
  if (x1 - x0 < 4) { drawEnergyGraph(); return; }  // too small — ignore
  const prevStart = egZoomStart, zLen = egZoomEnd - egZoomStart;
  egZoomStart = prevStart + (x0 / W) * zLen;
  egZoomEnd   = prevStart + (x1 / W) * zLen;
  drawEnergyGraph();
});
egCanvas.addEventListener('mouseleave', e => {
  if (egDragStartPx !== null) { egDragStartPx = null; egDragCurPx = null; drawEnergyGraph(); }
});
egCanvas.addEventListener('dblclick', () => {
  egZoomStart = 0; egZoomEnd = 1;
  drawEnergyGraph();
});

// ─── Tab switching ────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn[data-tab]').forEach(btn => {

    accent2:'#1a6eff', accent2dim:'rgba(26,110,255,0.18)',  accent2glow:'rgba(26,110,255,0.45)',
    uibg:'rgba(8,6,24,0.38)', uiborder:'rgba(255,255,255,0.07)',
    textdim:'rgba(220,215,255,0.55)', textbright:'rgba(240,235,255,0.92)',
    bg:'#05040f',
  },
  B: {
    accent1:'#ff2d78', accent1dim:'rgba(255,45,120,0.22)', accent1glow:'rgba(255,45,120,0.5)',
    accent2:'#bd00ff', accent2dim:'rgba(189,0,255,0.18)',  accent2glow:'rgba(189,0,255,0.42)',
    uibg:'rgba(8,4,22,0.42)', uiborder:'rgba(189,0,255,0.14)',
    textdim:'rgba(230,200,255,0.52)', textbright:'rgba(248,232,255,0.92)',
    bg:'#05030f',
  },
  C: {
    accent1:'#ff2d78', accent1dim:'rgba(255,45,120,0.22)', accent1glow:'rgba(255,45,120,0.5)',
    accent2:'#00f5e0', accent2dim:'rgba(0,245,224,0.15)',  accent2glow:'rgba(0,245,224,0.4)',
    uibg:'rgba(6,4,20,0.40)', uiborder:'rgba(255,45,120,0.12)',
    textdim:'rgba(220,210,255,0.52)', textbright:'rgba(245,235,255,0.92)',
    bg:'#04030e',
  },
};

function applyTheme(key) {
  const t = THEMES[key];
  const r = document.documentElement.style;
  r.setProperty('--accent1',      t.accent1);
  r.setProperty('--accent1-dim',  t.accent1dim);
  r.setProperty('--accent1-glow', t.accent1glow);
  r.setProperty('--accent2',      t.accent2);
  r.setProperty('--accent2-dim',  t.accent2dim);
  r.setProperty('--accent2-glow', t.accent2glow);
  r.setProperty('--ui-bg',        t.uibg);
  r.setProperty('--ui-border',    t.uiborder);
  r.setProperty('--text-dim',     t.textdim);
  r.setProperty('--text-bright',  t.textbright);
  document.body.style.background = t.bg;
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('theme'+key).classList.add('active');
}
document.getElementById('themeA').addEventListener('click', () => applyTheme('A'));
document.getElementById('themeB').addEventListener('click', () => applyTheme('B'));
document.getElementById('themeC').addEventListener('click', () => applyTheme('C'));
applyTheme('A');

setParticleWheelActive(document.querySelector('.awheel-item[data-pmode="particles"]'));
drawSpeedLines();

initNuclei();
