<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuclear Fission — v13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ── Variables ─────────────────────────────────────────────────────────── */
  :root {
    --accent1:      #ff2d78;
    --accent1-dim:  rgba(255,45,120,0.22);
    --accent1-glow: rgba(255,45,120,0.55);
    --accent2:      #1a6eff;
    --accent2-dim:  rgba(26,110,255,0.18);
    --accent2-glow: rgba(26,110,255,0.45);
    --ui-bg:        rgba(8,6,24,0.42);
    --ui-border:    rgba(255,255,255,0.07);
    --text-dim:     rgba(220,215,255,0.55);
    --text-bright:  rgba(240,235,255,0.92);
  }

  /* ── Reset & base ──────────────────────────────────────────────────────── */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #05040f;
    color: var(--text-bright);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }
  button, input, select {
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── Full-viewport canvas ──────────────────────────────────────────────── */
  #canvas {
    position: fixed;
    top: 0; left: 0;
    display: block;
    z-index: 0;
  }

  /* ── Toolbar — floating glass overlay ─────────────────────────────────── */
  #toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 20px 12px;
    background: var(--ui-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 4px 24px rgba(0,0,0,0.55);
  }

  .toolbar-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  /* ── Tab bar ───────────────────────────────────────────────────────────── */
  #tabBar {
    display: flex;
    gap: 8px;
  }
  .tab-btn {
    padding: 4px 16px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    color: rgba(255,255,255,0.18);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: none;
    text-shadow: none;
    font-family: inherit;
  }
  /* Navigation tabs (links to other sims) inherit tab-btn appearance */
  a.tab-btn { text-decoration: none; }

  .tab-btn:hover {
    color: rgba(255,255,255,0.38);
    border-color: rgba(255,255,255,0.12);
  }
  .tab-btn.active {
    color: #e8e4ff;
    border-color: #7b6fff;
    background: rgba(123,111,255,0.12);
    box-shadow:
      inset 0 0 6px rgba(123,111,255,0.15),
      0 0 2px #7b6fff,
      0 0 8px #7b6fff,
      0 0 18px rgba(123,111,255,0.45),
      0 0 40px rgba(123,111,255,0.15),
      0 0 70px rgba(123,111,255,0.08);
    text-shadow:
      0 0 4px #e8e4ff,
      0 0 10px #7b6fff,
      0 0 22px rgba(123,111,255,0.6),
      0 0 44px rgba(123,111,255,0.25);
  }

  /* ── Buttons ───────────────────────────────────────────────────────────── */
  .btn {
    padding: 4px 14px;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
    color: rgba(255,255,255,0.18);
    box-shadow: none;
    text-shadow: none;
    white-space: nowrap;
    font-family: inherit;
  }
  .btn:hover {
    color: rgba(255,255,255,0.38);
    border-color: rgba(255,255,255,0.12);
  }

  /* Go idle (▶) — neon green */
  #goBtn {
    border-color: #00d060;
    color: rgba(255,255,255,0.5);
    background: rgba(0,208,96,0.12);
    box-shadow:
      inset 0 0 6px rgba(0,208,96,0.18),
      0 0 2px #00d060,
      0 0 8px #00d060,
      0 0 18px rgba(0,208,96,0.5),
      0 0 40px rgba(0,208,96,0.2),
      0 0 70px rgba(0,208,96,0.1);
    text-shadow:
      0 0 4px rgba(255,255,255,0.5),
      0 0 10px #00d060,
      0 0 22px rgba(0,208,96,0.6),
      0 0 44px rgba(0,208,96,0.2);
  }
  #goBtn:hover { background: rgba(0,208,96,0.28); }
  /* Go running (⏸) — red */
  #goBtn.running {
    border-color: #ff4040;
    color: rgba(255,255,255,0.5);
    background: rgba(255,40,40,0.15);
    box-shadow:
      inset 0 0 6px rgba(255,40,40,0.2),
      0 0 2px #ff4040,
      0 0 8px #ff4040,
      0 0 18px rgba(255,40,40,0.5),
      0 0 40px rgba(255,40,40,0.2);
    text-shadow: 0 0 4px rgba(255,255,255,0.5), 0 0 10px #ff4040, 0 0 22px rgba(255,80,80,0.6);
  }
  #goBtn.running:hover { background: rgba(255,40,40,0.3); }

  /* Clear — neon green */
  #clearBtn {
    border-color: #00d060;
    color: rgba(255,255,255,0.5);
    background: rgba(0,208,96,0.12);
    box-shadow:
      inset 0 0 6px rgba(0,208,96,0.18),
      0 0 2px #00d060,
      0 0 8px #00d060,
      0 0 18px rgba(0,208,96,0.5),
      0 0 40px rgba(0,208,96,0.2);
    text-shadow:
      0 0 4px rgba(255,255,255,0.5),
      0 0 10px #00d060,
      0 0 22px rgba(0,208,96,0.6);
  }
  #clearBtn:hover { background: rgba(0,208,96,0.28); }

  /* Go / Replay / New — squished symbol buttons */
  #goBtn, #replayBtn, #newBtn { padding: 8px 28px; font-size: 22px; letter-spacing: 2px; }
  #goBtn, #replayBtn { font-size: 28px; letter-spacing: 0; padding: 2px 18px; }

  /* Replay — same red as Stop */
  #replayBtn {
    border-color: #ff4040;
    color: rgba(255,255,255,0.5);
    background: rgba(255,40,40,0.15);
    box-shadow:
      inset 0 0 6px rgba(255,40,40,0.2),
      0 0 2px #ff4040,
      0 0 8px #ff4040,
      0 0 18px rgba(255,40,40,0.5),
      0 0 40px rgba(255,40,40,0.2);
    text-shadow: 0 0 4px rgba(255,255,255,0.5), 0 0 10px #ff4040, 0 0 22px rgba(255,80,80,0.6);
  }
  #replayBtn:hover { background: rgba(255,40,40,0.3); }

  /* Mini replay in scrub bar — same red, default small size */
  #scrubReplayBtn {
    font-size: 16px;
    border-color: #ff4040;
    color: rgba(255,255,255,0.5);
    background: rgba(255,40,40,0.15);
    box-shadow:
      inset 0 0 4px rgba(255,40,40,0.2),
      0 0 2px #ff4040,
      0 0 6px #ff4040,
      0 0 14px rgba(255,40,40,0.4);
    text-shadow: 0 0 4px rgba(255,255,255,0.5), 0 0 8px #ff4040;
  }
  #scrubReplayBtn:hover { background: rgba(255,40,40,0.3); }
  #scrubReplayBtn:disabled {
    background: transparent;
    border-color: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.18);
    box-shadow: none;
    text-shadow: none;
    cursor: not-allowed;
  }

  #replayBtn:disabled {
    background: transparent;
    border-color: rgba(255,255,255,0.07);
    color: rgba(255,255,255,0.18);
    box-shadow: none;
    text-shadow: none;
    cursor: not-allowed;
  }

  /* ========================================
     PARTICLE WHEEL — vertical drum picker (mirrors arrow-wheel in v11)
     Active item is always in normal flow (defines height).
     Above/below items are position:absolute overlays.
     ======================================== */
  .arrow-wheel {
    position: relative;
  }
  .awheel-item {
    display: block;
    padding: 2px 12px;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 5px;
    background: transparent;
    color: rgba(255,255,255,0.15);
    font-size: 10px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
    letter-spacing: 0.5px;
    transition: color 0.15s, border-color 0.15s, background 0.15s,
                box-shadow 0.15s, text-shadow 0.15s,
                opacity 0.18s ease, transform 0.22s ease;
  }
  .awheel-item[data-position] {
    position: absolute;
    left: 0; right: 0;
    opacity: 0;
    pointer-events: none;
    color: rgba(255,255,255,0.55);
    border-color: rgba(255,255,255,0.18);
    transform: translateY(var(--slide-dir, 0px));
  }
  .arrow-wheel.open .awheel-item[data-position] {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .awheel-item:hover:not(.active) {
    color: var(--accent2);
    border-color: var(--accent2);
    background: var(--accent2-dim);
    box-shadow:
      0 0 4px var(--accent2),
      0 0 12px var(--accent2-glow),
      0 0 26px var(--accent2-dim);
    text-shadow:
      0 0 6px var(--accent2),
      0 0 14px var(--accent2-glow);
  }
  .awheel-item.active {
    color: var(--accent2);
    border-color: var(--accent2);
    background: var(--accent2-dim);
    box-shadow:
      0 0 3px var(--accent2),
      0 0 9px var(--accent2-glow),
      0 0 20px var(--accent2-dim);
    text-shadow:
      0 0 5px var(--accent2),
      0 0 12px var(--accent2-glow);
  }

  /* New — neon pink, matches Go */
  #newBtn {
    border-color: var(--accent1);
    color: rgba(255,255,255,0.5);
    background: var(--accent1-dim);
    box-shadow:
      inset 0 0 6px var(--accent1-dim),
      0 0 2px var(--accent1),
      0 0 8px var(--accent1),
      0 0 18px var(--accent1-glow),
      0 0 40px var(--accent1-dim),
      0 0 70px var(--accent1-dim);
    text-shadow:
      0 0 4px rgba(255,255,255,0.5),
      0 0 10px var(--accent1),
      0 0 22px var(--accent1-glow),
      0 0 44px var(--accent1-dim);
  }
  #newBtn:hover {
    background: var(--accent1-glow);
    box-shadow:
      inset 0 0 10px var(--accent1-glow),
      0 0 4px var(--accent1),
      0 0 14px var(--accent1),
      0 0 28px var(--accent1-glow),
      0 0 60px var(--accent1-dim),
      0 0 100px var(--accent1-dim);
  }

  /* Enrich — neon green */
  #enrichBtn {
    border-color: #00ffaa;
    color: rgba(255,255,255,0.5);
    background: rgba(0,255,170,0.07);
    box-shadow:
      inset 0 0 6px rgba(0,255,170,0.12),
      0 0 2px #00ffaa,
      0 0 8px #00ffaa,
      0 0 18px rgba(0,255,170,0.5),
      0 0 40px rgba(0,255,170,0.2),
      0 0 70px rgba(0,255,170,0.1);
    text-shadow:
      0 0 4px rgba(255,255,255,0.5),
      0 0 10px #00ffaa,
      0 0 22px rgba(0,255,170,0.7),
      0 0 44px rgba(0,255,170,0.3);
  }
  #enrichBtn:hover {
    background: rgba(0,255,170,0.18);
    box-shadow:
      inset 0 0 10px rgba(0,255,170,0.25),
      0 0 4px #00ffaa,
      0 0 14px #00ffaa,
      0 0 28px rgba(0,255,170,0.6),
      0 0 60px rgba(0,255,170,0.25),
      0 0 100px rgba(0,255,170,0.12);
  }

  /* ── Sliders ───────────────────────────────────────────────────────────── */
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 3px;
    background: rgba(255,255,255,0.10);
    box-shadow:
      0 0 4px var(--accent2),
      0 0 12px var(--accent2-glow),
      0 0 28px var(--accent2-dim);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 24px;
    border-radius: 3px;
    background: var(--accent2);
    border: none;
    box-shadow:
      0 0 3px var(--accent2),
      0 0 10px var(--accent2-glow),
      0 0 24px var(--accent2-dim),
      0 0 44px var(--accent2-dim);
    cursor: grab;
    transition: box-shadow 0.15s;
  }
  input[type="range"]::-webkit-slider-thumb:active {
    cursor: grabbing;
    box-shadow:
      0 0 4px var(--accent2),
      0 0 18px var(--accent2-glow),
      0 0 40px var(--accent2-dim),
      0 0 70px var(--accent2-dim);
  }
  input[type="range"]::-moz-range-thumb {
    width: 10px; height: 24px;
    border-radius: 3px;
    background: var(--accent2);
    border: none;
    box-shadow: 0 0 3px var(--accent2), 0 0 10px var(--accent2-glow);
    cursor: grab;
  }

  .slider-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ── Control boxes ─────────────────────────────────────────────────────── */
  .ctrl-box-pink {
    display: flex;
    align-items: center;
    align-self: stretch;
    gap: 14px;
    background: rgba(255,45,120,0.07);
    border: 1px solid rgba(255,45,120,0.22);
    border-radius: 12px;
    padding: 12px 18px;
  }
  .ctrl-box-pink input[type="range"] { width: 120px; }

  .ctrl-box-blue {
    display: flex;
    align-items: center;
    align-self: stretch;
    gap: 18px;
    background: rgba(26,110,255,0.07);
    border: 1px solid rgba(26,110,255,0.22);
    border-radius: 12px;
    padding: 12px 18px;
  }
  .ctrl-box-blue input[type="range"] { width: 160px; }
  .ctrl-box-blue .slider-icon { font-size: 32px; }
  .ctrl-box-blue .toggle-label { font-size: 16px; gap: 7px; }
  .ctrl-box-blue .awheel-item { font-size: 16px; padding: 6px 18px; }
  .slider-group label {
    font-size: 10px;
    color: var(--text-dim);
    white-space: nowrap;
    letter-spacing: 0.5px;
  }
  .slider-group label span {
    display: inline-block;
    min-width: 3em;
    text-align: right;
    color: var(--accent2);
    text-shadow: 0 0 5px var(--accent2-glow);
  }
  .slider-group input[type="range"] { width: 80px; }

  .slider-icon {
    font-size: 18px;
    line-height: 1;
    user-select: none;
    filter:
      brightness(0) invert(1)
      blur(0.5px)
      opacity(0.65)
      drop-shadow(0 0 4px var(--accent2))
      drop-shadow(0 0 12px var(--accent2))
      drop-shadow(0 0 24px var(--accent2-glow));
  }

  /* ── Toggle labels ─────────────────────────────────────────────────────── */
  .toggle-label {
    font-size: 10px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }
  .toggle-label input[type="checkbox"] { accent-color: var(--accent1); }

  .field-label-electric {
    color: var(--accent2);
    text-shadow:
      0 0 4px var(--accent2),
      0 0 10px var(--accent2-glow),
      0 0 22px var(--accent2-dim);
  }

  /* ── Scrub bar — floating glass at bottom ──────────────────────────────── */
  #scrubBar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 10;
    display: none;
    flex-direction: column;
    background: var(--ui-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-top: 1px solid var(--ui-border);
    box-shadow: 0 -1px 0 var(--accent1-dim), 0 -4px 20px rgba(0,0,0,0.5);
  }
  #scrubBar.visible { display: flex; }
  #energyGraph {
    display: none;
    width: 100%;
    height: 110px;
    border-bottom: 1px solid var(--ui-border);
    cursor: crosshair;
  }
  #scrubRow {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 40px;
    padding: 0 20px;
  }
  #scrubBar .scrub-label {
    font-size: 10px;
    color: var(--text-dim);
    white-space: nowrap;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  #scrubSlider { flex: 1; }
  #scrubPct {
    font-size: 10px;
    color: var(--text-dim);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    min-width: 3.5em;
    text-align: right;
  }

</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="toolbar">
  <div class="toolbar-row">
    <div id="tabBar">
      <a href="../v11/index.html" class="tab-btn">Protons</a>
      <a href="../v11/index.html#nucleus" class="tab-btn">Protons + Neutrons</a>
      <button class="tab-btn active" data-tab="fission">Fission</button>
      <button class="tab-btn" data-tab="chain">Chain Reaction</button>
    </div>
  </div>
  <div class="toolbar-row">
    <!-- Far left: GO + REPLAY + CLEAR column -->
    <div style="display:flex;flex-direction:column;justify-content:flex-end;align-self:stretch;gap:6px;padding-bottom:10px">
      <button id="goBtn" class="btn">&#9654;</button>
      <button id="replayBtn" class="btn" disabled>&#8634;</button>
      <button id="clearBtn" class="btn">Clear</button>
    </div>

    <!-- Pink box: New button + neutron speed -->
    <div class="ctrl-box-pink">
      <button id="newBtn" class="btn" style="display:flex;align-items:center;justify-content:center;gap:8px;">
        <canvas id="newBtnNucleus" width="68" height="42" style="display:block;flex-shrink:0;image-rendering:pixelated"></canvas>New
      </button>
      <div class="slider-group">
        <div style="display:flex;align-items:center;gap:1px">
          <canvas id="speedLinesCanvas" width="50" height="46" style="display:block;flex-shrink:0;image-rendering:pixelated"></canvas>
          <canvas id="neutronIconCanvas" width="46" height="46" style="display:block;flex-shrink:0;image-rendering:pixelated"></canvas>
        </div>
        <input type="range" id="neutronSpeed" min="0.2" max="8.0" step="0.1" value="4.0">
      </div>
    </div>

    <!-- Blue box: stacked sliders + electric field + particles -->
    <div class="ctrl-box-blue">
      <div style="display:flex;flex-direction:column;gap:14px;justify-content:space-evenly;align-self:stretch">
        <div class="slider-group">
          <span class="slider-icon">🐢</span>
          <input type="range" id="playbackSpeed" min="0.1" max="4.0" step="0.1" value="1.0">
          <span class="slider-icon">🐇</span>
        </div>
        <div class="slider-group">
          <span class="slider-icon" style="visibility:hidden">🐢</span>
          <input type="range" id="zoomSlider" min="-1" max="1" step="0.02" value="0">
          <span class="slider-icon">🔍</span>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;justify-content:space-evenly;align-self:stretch">
        <label class="toggle-label">
          <input type="checkbox" id="showElectric">
          <span class="field-label-electric">Electric field</span>
        </label>
        <div id="particleWheel" class="arrow-wheel">
          <button class="awheel-item active" data-pmode="particles">Particles</button>
          <button class="awheel-item" data-pmode="outline" data-position="below">Outline</button>
        </div>
      </div>
    </div>

    <button id="enrichBtn" class="btn" style="display:none">Enrich</button>
  </div>
</div>

<div id="scrubBar">
  <canvas id="energyGraph" width="100" height="110"></canvas>
  <div id="scrubRow">
    <button id="scrubReplayBtn" class="btn" disabled>&#8634;</button>
    <span class="slider-icon" style="font-size:16px">⏱</span>
    <input type="range" id="scrubSlider" min="0" max="1000" value="0">
    <span id="scrubPct">0%</span>
    <label class="toggle-label" style="margin-left:10px;white-space:nowrap"><input type="checkbox" id="energyGraphToggle"> Energy Graph</label>
  </div>
</div>

<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const PARTICLE_RADIUS = 10;
const coulombStrength = 150;

// ─── Canvas ───────────────────────────────────────────────────────────────────
const canvas   = document.getElementById('canvas');
const ctx      = canvas.getContext('2d');
const egCanvas = document.getElementById('energyGraph');
const egCtx    = egCanvas.getContext('2d');

// ─── Heatmap buffers ──────────────────────────────────────────────────────────
const hmCanvas    = document.createElement('canvas');
const hmCtx       = hmCanvas.getContext('2d');
const hmComposite = document.createElement('canvas');
const hmcCtx      = hmComposite.getContext('2d');

let hmW = 0, hmH = 0;
let hmDataElec = null;
let hmImgElec  = null;
let heatmapDirty    = true;
let hmFrameCounter  = 0;

function resize() {
  canvas.width   = window.innerWidth;
  canvas.height  = window.innerHeight;
  egCanvas.width  = window.innerWidth;
  egCanvas.height = 110;
  heatmapDirty   = true;
}
resize();
window.addEventListener('resize', () => {
  resize();
  if (neutronRAF) { cancelAnimationFrame(neutronRAF); neutronRAF = null; }
  if (chainRAF)   { cancelAnimationFrame(chainRAF);   chainRAF = null; }
  neutronState        = 'idle';
  chainNeutrons       = [];
  enrichSites         = [];
  mainNeutronsEmitted = false;
  document.getElementById('goBtn').textContent = '▶';
  document.getElementById('goBtn').classList.remove('running');
  document.getElementById('scrubBar').classList.remove('visible');
  initNuclei();
  heatmapDirty = true;
  drawStaticFrame();
});

function ensureHmBuffers(w, h) {
  if (hmW === w && hmH === h) return;
  hmW = w; hmH = h;
  hmCanvas.width    = w; hmCanvas.height = h;
  hmDataElec = new Uint8ClampedArray(w * h * 4);
  hmImgElec  = new ImageData(hmDataElec, w, h);
}

// ─── Colormaps ────────────────────────────────────────────────────────────────
function buildColorstops(stops, out) {
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    let s0 = stops[0], s1 = stops[1];
    for (let s = 0; s < stops.length - 1; s++) {
      if (t >= stops[s].t && t <= stops[s+1].t) { s0 = stops[s]; s1 = stops[s+1]; break; }
    }
    const f   = (s1.t === s0.t) ? 0 : (t - s0.t) / (s1.t - s0.t);
    const idx = i * 4;
    out[idx]   = s0.r + (s1.r - s0.r) * f;
    out[idx+1] = s0.g + (s1.g - s0.g) * f;
    out[idx+2] = s0.b + (s1.b - s0.b) * f;
    out[idx+3] = s0.a + (s1.a - s0.a) * f;
  }
}

const COLORMAP = new Uint8Array(256 * 4);
buildColorstops([
  { t: 0.0,  r: 0,   g: 0,   b: 0,   a: 0   },
  { t: 0.12, r: 10,  g: 35,  b: 170, a: 140 },
  { t: 0.4,  r: 25,  g: 85,  b: 235, a: 210 },
  { t: 0.7,  r: 70,  g: 165, b: 255, a: 245 },
  { t: 1.0,  r: 210, g: 238, b: 255, a: 255 },
], COLORMAP);

// ─── Particle generation — 3D sphere packing ──────────────────────────────────
function generateNucleus(nProtons, nNeutrons, cx, cy, seed) {
  // Seeded LCG so the same seed always produces the same layout
  let s = (seed >>> 0) || 1;
  const rand = () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };

  const nTotal = nProtons + nNeutrons;

  const packFrac = 0.62;
  const vol      = nTotal * (4/3 * Math.PI * PARTICLE_RADIUS ** 3) / packFrac;
  const sphereR  = Math.cbrt(vol * 3 / (4 * Math.PI)) * 1.05;

  const minDist   = PARTICLE_RADIUS * 2.08;
  const minDistSq = minDist * minDist;

  const pts = [];
  for (let i = 0; i < nTotal; i++) {
    let placed = false;
    for (let attempt = 0; attempt < 8000; attempt++) {
      const r   = sphereR * Math.cbrt(rand());
      const th  = Math.acos(2 * rand() - 1);
      const phi = 2 * Math.PI * rand();
      const lx  = r * Math.sin(th) * Math.cos(phi);
      const ly  = r * Math.sin(th) * Math.sin(phi);
      const lz  = r * Math.cos(th);
      let ok = true;
      for (const p of pts) {
        const dx = p.lx-lx, dy = p.ly-ly, dz = p.lz-lz;
        if (dx*dx + dy*dy + dz*dz < minDistSq) { ok = false; break; }
      }
      if (ok) { pts.push({ lx, ly, lz }); placed = true; break; }
    }
    if (!placed) {
      // Force-place at a random spot rather than stacking at center
      const r   = sphereR * 0.6 * rand();
      const th  = Math.acos(2 * rand() - 1);
      const phi = 2 * Math.PI * rand();
      pts.push({ lx: r*Math.sin(th)*Math.cos(phi), ly: r*Math.sin(th)*Math.sin(phi), lz: r*Math.cos(th) });
    }
  }

  const adjThresh2 = (PARTICLE_RADIUS * 2.9) ** 2;
  const adj = Array.from({ length: nTotal }, () => []);
  for (let i = 0; i < nTotal; i++) {
    for (let j = i+1; j < nTotal; j++) {
      const dx = pts[i].lx-pts[j].lx, dy = pts[i].ly-pts[j].ly, dz = pts[i].lz-pts[j].lz;
      if (dx*dx + dy*dy + dz*dz < adjThresh2) { adj[i].push(j); adj[j].push(i); }
    }
  }

  const types         = new Array(nTotal).fill('neutron');
  const protonNbCount = new Array(nTotal).fill(0);
  const order         = Array.from({ length: nTotal }, (_, i) => i).sort(() => rand() - 0.5);
  let placed = 0;
  for (let priority = 0; priority <= 6 && placed < nProtons; priority++) {
    for (const i of order) {
      if (placed >= nProtons) break;
      if (types[i] === 'proton' || protonNbCount[i] !== priority) continue;
      types[i] = 'proton';
      placed++;
      for (const nb of adj[i]) protonNbCount[nb]++;
    }
  }

  const particles = pts.map((p, i) => ({
    x: cx + p.lx, y: cy + p.ly, z: p.lz, type: types[i], i,
  }));

  return { particles, sphereR, cx, cy };
}

// ─── Electric field heatmap ───────────────────────────────────────────────────
// masks: [{cx, cy, r}] — soft radial clipping; alpha fades to 0 at r + PARTICLE_RADIUS*2
function drawElectricHeatmap(particleList, sampleFrac = 0.5, sigmaScale = 1.0, masks = null, boundsExpand = 50) {
  const fullW = canvas.width, fullH = canvas.height;

  if (!heatmapDirty &&
      hmComposite.width === fullW && hmComposite.height === fullH) {
    ctx.drawImage(hmComposite, 0, 0);
    return;
  }

  const scale    = 0.25;
  const w        = Math.ceil(fullW * scale);
  const h        = Math.ceil(fullH * scale);
  const invScale = 1 / scale;

  let protons = particleList.filter(p =>
    p.type === 'proton' &&
    p.x > -boundsExpand && p.x < fullW + boundsExpand &&
    p.y > -boundsExpand && p.y < fullH + boundsExpand
  );
  if (sampleFrac < 1.0) {
    protons = protons.filter((_, i) => i % Math.round(1 / sampleFrac) === 0);
  }

  const refEnergy = coulombStrength / (PARTICLE_RADIUS * 2);
  const logRef    = Math.log(2);
  const elecPairs = [];
  for (let i = 0; i < protons.length; i++) {
    for (let j = i+1; j < protons.length; j++) {
      const a = protons[i], b = protons[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 0.01) continue;
      const energy   = coulombStrength / dist;
      const sigma    = Math.max(3.5, 28 / Math.sqrt(dist)) * sigmaScale;
      const distFade = Math.exp(-dist / 350);
      const mag      = Math.min(1, Math.log(1 + energy / refEnergy) / logRef) * distFade;
      const cullSq   = 16 * (sigma*2) * (sigma*2);
      elecPairs.push({ ax: a.x, ay: a.y, ux: dx/dist, uy: dy/dist, dist, sigma, mag, cullSq });
    }
  }
  elecPairs.sort((a, b) => b.mag - a.mag);
  if (elecPairs.length === 0) return;

  ensureHmBuffers(w, h);
  hmDataElec.fill(0);

  for (let py = 0; py < h; py++) {
    const worldY = py * invScale;
    for (let px = 0; px < w; px++) {
      const worldX = px * invScale;
      let total = 0;
      for (let k = 0; k < elecPairs.length; k++) {
        const p    = elecPairs[k];
        const rx   = worldX - p.ax, ry = worldY - p.ay;
        const para = rx*p.ux + ry*p.uy;
        const e1   = para > 0 ? Math.min(1, para/8) : 0;
        const e2   = para < p.dist ? Math.min(1, (p.dist-para)/8) : 0;
        const ef   = e1 * e2;
        if (ef <= 0) continue;
        const perpSq = Math.max(0, rx*rx + ry*ry - para*para);
        if (perpSq > p.cullSq) continue;
        const t      = para / p.dist;
        const sigmaT = p.sigma * (1 + Math.sin(Math.PI * t));
        total += p.mag * Math.exp(-perpSq / (2*sigmaT*sigmaT)) * ef;
        if (total >= 1/3) break;
      }
      if (total > 0.002) {
        // Soft radial mask — clamp heatmap to nucleus boundary.
        // Supports two mask types:
        //   circle  { cx, cy, r, bleed }
        //   capsule { type:'capsule', cx1,cy1,r1, cx2,cy2,r2, bleed }
        //     — tapered hull between two spheres; fills the gap with no dark seam.
        let maskAlpha = 1;
        if (masks) {
          maskAlpha = 0;
          const defaultBleed = PARTICLE_RADIUS * 2;
          for (const m of masks) {
            if (maskAlpha >= 1) break;
            const bleed = m.bleed !== undefined ? m.bleed : defaultBleed;
            if (m.type === 'capsule') {
              // Project pixel onto the segment cx1→cx2, interpolate radius
              const sdx = m.cx2 - m.cx1, sdy = m.cy2 - m.cy1;
              const lenSq = sdx*sdx + sdy*sdy;
              const st = lenSq > 0
                ? Math.max(0, Math.min(1, ((worldX-m.cx1)*sdx + (worldY-m.cy1)*sdy) / lenSq))
                : 0;
              const projX = m.cx1 + st*sdx, projY = m.cy1 + st*sdy;
              const perpDist = Math.sqrt((worldX-projX)**2 + (worldY-projY)**2);
              const capsR = m.r1 + (m.r2 - m.r1) * st;
              if (perpDist <= capsR) { maskAlpha = 1; break; }
              const mt = (perpDist - capsR) / bleed;
              maskAlpha = Math.max(maskAlpha, mt < 1 ? 1 - mt : 0);
            } else {
              const mdx = worldX - m.cx, mdy = worldY - m.cy;
              const mdist = Math.sqrt(mdx*mdx + mdy*mdy);
              if (mdist <= m.r) { maskAlpha = 1; break; }
              const mt = (mdist - m.r) / bleed;
              maskAlpha = Math.max(maskAlpha, mt < 1 ? 1 - mt : 0);
            }
          }
        }
        if (maskAlpha > 0) {
          const ci = Math.min(255, (total * 3.0 * 255)|0);
          const c4 = ci * 4;
          const di = (py * w + px) * 4;
          hmDataElec[di]   = COLORMAP[c4];   hmDataElec[di+1] = COLORMAP[c4+1];
          hmDataElec[di+2] = COLORMAP[c4+2];
          hmDataElec[di+3] = (COLORMAP[c4+3] * maskAlpha + 0.5) | 0;
        }
      }
    }
  }

  if (hmComposite.width !== fullW || hmComposite.height !== fullH) {
    hmComposite.width = fullW; hmComposite.height = fullH;
  }
  hmcCtx.clearRect(0, 0, fullW, fullH);
  hmcCtx.imageSmoothingEnabled = true;
  hmcCtx.imageSmoothingQuality = 'high';
  hmCtx.putImageData(hmImgElec, 0, 0);
  hmcCtx.drawImage(hmCanvas, 0, 0, fullW, fullH);
  ctx.drawImage(hmComposite, 0, 0);
  heatmapDirty = false;
}

// ─── Cloud outline — evenly-spaced scallop circles on a ring ─────────────────
function outerIntersection(c1, c2, R, ncx, ncy) {
  const dx = c2.x - c1.x, dy = c2.y - c1.y;
  const d  = Math.sqrt(dx * dx + dy * dy);
  const h  = Math.sqrt(Math.max(0, R * R - (d / 2) * (d / 2)));
  const mx = (c1.x + c2.x) / 2, my = (c1.y + c2.y) / 2;
  const px = -dy / d * h,  py =  dx / d * h;
  const p1 = { x: mx + px, y: my + py };
  const p2 = { x: mx - px, y: my - py };
  const d1 = (p1.x - ncx) ** 2 + (p1.y - ncy) ** 2;
  const d2 = (p2.x - ncx) ** 2 + (p2.y - ncy) ** 2;
  return d1 > d2 ? p1 : p2;
}

function drawCloudOutline(cx, cy, sphereR) {
  const R = PARTICLE_RADIUS;
  const N = Math.max(6, Math.round(2 * Math.PI * sphereR / (R * 1.5)));

  const centers = Array.from({ length: N }, (_, k) => {
    const a = k * 2 * Math.PI / N;
    return { x: cx + sphereR * Math.cos(a), y: cy + sphereR * Math.sin(a) };
  });

  const arcs = centers.map((c, k) => {
    const prev = centers[(k - 1 + N) % N];
    const next = centers[(k + 1)     % N];
    const sp   = outerIntersection(c, prev, R, cx, cy);
    const ep   = outerIntersection(c, next, R, cx, cy);
    return {
      cx: c.x, cy: c.y,
      startAngle: Math.atan2(sp.y - c.y, sp.x - c.x),
      endAngle:   Math.atan2(ep.y - c.y, ep.x - c.x),
    };
  });

  ctx.save();
  ctx.shadowColor = 'rgba(80,160,255,0.9)';
  ctx.shadowBlur  = 22;
  ctx.strokeStyle = 'rgba(160,215,255,0.95)';
  ctx.lineWidth   = 4;
  ctx.beginPath();

  ctx.moveTo(arcs[0].cx + R * Math.cos(arcs[0].startAngle),
             arcs[0].cy + R * Math.sin(arcs[0].startAngle));

  for (const arc of arcs) {
    ctx.arc(arc.cx, arc.cy, R, arc.startAngle, arc.endAngle, false);
  }

  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

// ─── Fission outline — union-of-two-circles scalloped boundary ───────────────
function sampleUnionBoundary(cx1, cy1, r1, cx2, cy2, r2) {
  const R = PARTICLE_RADIUS;
  const ddx = cx2 - cx1, ddy = cy2 - cy1;
  const d = Math.sqrt(ddx * ddx + ddy * ddy);
  const frame = Math.atan2(ddy, ddx);

  if (d < 1) {
    const avgR = (r1 + r2) / 2;
    const N = Math.max(6, Math.round(2 * Math.PI * avgR / (R * 1.5)));
    return Array.from({ length: N }, (_, k) => {
      const a = k * 2 * Math.PI / N;
      return { x: cx1 + avgR * Math.cos(a), y: cy1 + avgR * Math.sin(a),
               refCx: cx1, refCy: cy1 };
    });
  }

  const a = (r1 * r1 - r2 * r2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, r1 * r1 - a * a));
  if (h < 1) return null;

  const r1bot = Math.atan2(-h, a); const r1top = Math.atan2(h, a);
  const span1 = 2 * Math.PI - (r1top - r1bot);
  const start1 = r1top;

  const r2top = Math.atan2(h, a - d); const r2bot = Math.atan2(-h, a - d);
  const span2 = r2top - r2bot;
  const start2 = r2bot;

  const len1 = span1 * r1, len2 = span2 * r2;
  const n1 = Math.max(3, Math.round(len1 / (R * 1.5)));
  const n2 = Math.max(3, Math.round(len2 / (R * 1.5)));

  const pts = [];
  for (let k = 0; k < n1; k++) {
    const wa = frame + start1 + (k / n1) * span1;
    pts.push({ x: cx1 + r1 * Math.cos(wa), y: cy1 + r1 * Math.sin(wa), refCx: cx1, refCy: cy1 });
  }
  for (let k = 0; k < n2; k++) {
    const wa = frame + start2 + (k / n2) * span2;
    pts.push({ x: cx2 + r2 * Math.cos(wa), y: cy2 + r2 * Math.sin(wa), refCx: cx2, refCy: cy2 });
  }
  return pts;
}

function drawFissionOutline(cx1, cy1, r1, cx2, cy2, r2) {
  const R = PARTICLE_RADIUS;
  const d = Math.sqrt((cx2-cx1)**2 + (cy2-cy1)**2);

  if (d >= r1 + r2) {
    drawCloudOutline(cx1, cy1, r1);
    drawCloudOutline(cx2, cy2, r2);
    return;
  }

  const pts = sampleUnionBoundary(cx1, cy1, r1, cx2, cy2, r2);
  if (!pts) { drawCloudOutline(cx1, cy1, r1); drawCloudOutline(cx2, cy2, r2); return; }
  const N = pts.length;

  const arcs = pts.map((c, k) => {
    const prev = pts[(k - 1 + N) % N];
    const next = pts[(k + 1)     % N];
    const sp   = outerIntersection(c, prev, R, c.refCx, c.refCy);
    const ep   = outerIntersection(c, next, R, c.refCx, c.refCy);
    return {
      cx: c.x, cy: c.y,
      startAngle: Math.atan2(sp.y - c.y, sp.x - c.x),
      endAngle:   Math.atan2(ep.y - c.y, ep.x - c.x),
    };
  });

  ctx.save();
  ctx.shadowColor = 'rgba(80,160,255,0.9)';
  ctx.shadowBlur  = 22;
  ctx.strokeStyle = 'rgba(160,215,255,0.95)';
  ctx.lineWidth   = 4;
  ctx.beginPath();

  ctx.moveTo(arcs[0].cx + R * Math.cos(arcs[0].startAngle),
             arcs[0].cy + R * Math.sin(arcs[0].startAngle));
  for (const arc of arcs) {
    ctx.arc(arc.cx, arc.cy, R, arc.startAngle, arc.endAngle, false);
  }

  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

// ─── Neutron — plain circle outline matching the cloud border style ───────────
function drawNeutronOutline(x, y) {
  const R = PARTICLE_RADIUS;
  ctx.save();
  ctx.shadowColor = 'rgba(80,160,255,0.9)';
  ctx.shadowBlur  = 22;
  ctx.strokeStyle = 'rgba(160,215,255,0.95)';
  ctx.lineWidth   = 4;
  ctx.beginPath();
  ctx.arc(x, y, R, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function drawNeutron(x, y) {
  if (showParticles) {
    // Full particle viz — same style as drawParticles for neutrons
    const R = PARTICLE_RADIUS;
    const baseGrad = ctx.createRadialGradient(x, y, 0, x, y, R * 1.1);
    baseGrad.addColorStop(0, '#70707f'); baseGrad.addColorStop(0.82, '#70707f'); baseGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = baseGrad;
    ctx.beginPath(); ctx.arc(x, y, R * 1.1, 0, Math.PI * 2); ctx.fill();
    const innerGlow = ctx.createRadialGradient(x, y, 0, x, y, R);
    innerGlow.addColorStop(0, '#b0b0c4'); innerGlow.addColorStop(0.5, '#b0b0c4'); innerGlow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save(); ctx.shadowColor = '#b0b0c4'; ctx.shadowBlur = 8; ctx.globalAlpha = 0.82;
    ctx.fillStyle = innerGlow; ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
  } else {
    drawNeutronOutline(x, y);
  }
}

// ─── v11-style particle renderer — stochastic jitter + fuzzy glow ────────────
const particleJitter = [];
// slow=false (default): step=1.8, decay=0.72 — σ≈1.83px, autocorr ~3.6 frames (used during fission/daughters)
// slow=true:            step=1.1, decay=0.90 — σ≈1.78px (same magnitude), autocorr ~10 frames (pre-neutron)
function updateParticleJitter(count, strength = 1, slow = false) {
  const step  = slow ? 1.1 : 1.8;
  const decay = slow ? 0.90 : 0.72;
  while (particleJitter.length < count) particleJitter.push({ x: 0, y: 0 });
  for (let i = 0; i < count; i++) {
    particleJitter[i].x += (Math.random() - 0.5) * step * strength;
    particleJitter[i].y += (Math.random() - 0.5) * step * strength;
    particleJitter[i].x *= decay;
    particleJitter[i].y *= decay;
  }
}

function drawParticles(particles, jitterScale = 1) {
  const R = PARTICLE_RADIUS;
  // z ascending = back to front; protons after neutrons at same depth
  const sorted = [...particles].sort((a, b) =>
    ((a.z || 0) - (b.z || 0)) || ((a.type === 'proton') - (b.type === 'proton'))
  );
  for (const p of sorted) {
    const j  = (p.i != null && particleJitter[p.i]) ? particleJitter[p.i] : { x: 0, y: 0 };
    const px = p.x + j.x * jitterScale, py = p.y + j.y * jitterScale;
    const isProton = p.type === 'proton';
    const mid  = isProton ? '#ff1a65' : '#70707f';
    const core = isProton ? '#ff80b0' : '#b0b0c4';

    // Base fill — soft edge fade
    const baseGrad = ctx.createRadialGradient(px, py, 0, px, py, R * 1.1);
    baseGrad.addColorStop(0,    mid);
    baseGrad.addColorStop(0.82, mid);
    baseGrad.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.fillStyle = baseGrad;
    ctx.beginPath(); ctx.arc(px, py, R * 1.1, 0, Math.PI * 2); ctx.fill();

    // Inner glow with shadowBlur for fuzzy halo
    const innerGlow = ctx.createRadialGradient(px, py, 0, px, py, R);
    innerGlow.addColorStop(0,   core);
    innerGlow.addColorStop(0.5, core);
    innerGlow.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.save();
    ctx.shadowColor = core;
    ctx.shadowBlur  = 8;
    ctx.globalAlpha = 0.82;
    ctx.fillStyle = innerGlow;
    ctx.beginPath(); ctx.arc(px, py, R, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;

    // + label on protons
    if (isProton) {
      ctx.fillStyle = 'rgba(255,255,255,0.88)';
      ctx.font = 'bold 11px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('+', px, py + 1);
    }
  }
}

// ─── Excited nucleus glow ─────────────────────────────────────────────────────
// 30 stable pseudo-random positions inside the nucleus, seeded once.
// Each spot fires continuously — each cycle is 0.1–0.8s, chosen fresh each time.
const EXCITED_SPOTS = (() => {
  const spots = [];
  let s = 0xdeadbeef;
  const rand = () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };
  for (let i = 0; i < 30; i++) {
    spots.push({
      angle:  rand() * Math.PI * 2,
      radius: Math.sqrt(rand()) * 0.82,
      cycleStart: null,
      cycleDur:   null,
    });
  }
  return spots;
})();

function resetExcitedSpots() {
  for (const sp of EXCITED_SPOTS) { sp.cycleStart = null; sp.cycleDur = null; }
}

function drawExcitedGlow(cx, cy, sphereR, intensity) {
  if (intensity <= 0) return;
  const now = performance.now();
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  const glowRadius = PARTICLE_RADIUS * 2.8;
  for (const sp of EXCITED_SPOTS) {
    // Initialise with a random stagger so they don't all peak at once
    if (sp.cycleStart === null) {
      sp.cycleDur   = 100 + Math.random() * 700;
      sp.cycleStart = now - Math.random() * sp.cycleDur;  // start mid-cycle
    }

    let elapsed = now - sp.cycleStart;
    // Roll over into the next cycle whenever one finishes
    while (elapsed >= sp.cycleDur) {
      elapsed      -= sp.cycleDur;
      sp.cycleStart = now - elapsed;
      sp.cycleDur   = 100 + Math.random() * 700;
    }

    const flashT = elapsed / sp.cycleDur;
    const pulse  = Math.sin(flashT * Math.PI);
    const alpha  = Math.min(1, (0.5 + pulse * 0.7) * intensity);
    const sx = cx + Math.cos(sp.angle) * sp.radius * sphereR;
    const sy = cy + Math.sin(sp.angle) * sp.radius * sphereR;
    const r  = glowRadius * (0.8 + pulse * 0.7);
    const g  = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
    g.addColorStop(0,   `rgba(255,100,40,${Math.min(1, alpha)})`);
    g.addColorStop(0.5, `rgba(255,40,0,${Math.min(1, alpha * 0.6)})`);
    g.addColorStop(1,   'rgba(255,0,0,0)');
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
  }
  ctx.restore();
}

// ─── Animation state ──────────────────────────────────────────────────────────
let currentSeed = Math.floor(Math.random() * 1e9);
let viewZoom = 1.0;
let currentTab = 'fission';

// Piecewise zoom mapping: slider -1..0..1, default at centre (v=0)
// Fission:       v=-1 → 0.83 (20% wider),  v=0 → 1.0,  v=1 → 2.0
// Chain Reaction: v=-1 → 0.15 (very wide),  v=0 → 0.35, v=1 → 0.80
function zoomFromSlider(v) {
  if (currentTab === 'fission') {
    return v <= 0 ? 1.0 + v * 0.17 : 1.0 + v * 1.0;
  } else {
    return v <= 0 ? 0.35 + v * 0.20 : 0.35 + v * 0.45;
  }
}

function applyTab(tab) {

  if (playbackRAF) { cancelAnimationFrame(playbackRAF); playbackRAF = null; }

  currentScrubFrac    = 0;
  maxRevealedFrac     = 0;

  enrichSites         = [];
  document.getElementById('goBtn').textContent = '▶';
  document.getElementById('goBtn').classList.remove('running');
  document.getElementById('replayBtn').disabled = true;
  document.getElementById('scrubReplayBtn').disabled = true;
  document.getElementById('scrubBar').classList.remove('visible');
  document.getElementById('scrubSlider').value = 0;
  document.getElementById('scrubPct').textContent = '0%';

  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
  const slider = document.getElementById('zoomSlider');
  slider.value = 0;
  viewZoom = zoomFromSlider(0);
  document.getElementById('enrichBtn').style.display = tab === 'chain' ? '' : 'none';
  heatmapDirty = true;
  if (typeof drawStaticFrame === 'function') drawStaticFrame();
}
let showParticles = true;
let currentScrubFrac = 0;
let maxRevealedFrac  = 0;   // high-water mark — graph line never erases back
let egZoomStart = 0, egZoomEnd = 1;
let egDragStartPx = null, egDragCurPx = null;
let animParent = null, animProd1 = null, animProd2 = null;
let animMap = [];
let prod1R = 0, prod2R = 0;  // daughter radii, fixed at product size

// Phase boundaries (t = 0..1)
const PH1_END = 0.30;
const PH2_END = 0.375;

const ANIM_T_START = 0.27;
const ANIM_T_END   = 0.47;
const ANIM_RANGE   = ANIM_T_END - ANIM_T_START;
const FISS_STOP_T  = PH2_END + 0.50 * (ANIM_T_END - PH2_END);  // playback endpoint
const NORMAL_DURATION       = 5000;  // ms — main nucleus phase 3 separation
const CHAIN_NORMAL_DURATION = 5000;  // ms — chain-site daughters
let SHAKE_DURATION  = 1000;  // ms — randomised on each hit (500–1500)

// Wobble mode, picked randomly each time a nucleus is hit:
//   'dip1'   50% — 1 KE dip  : nucleus elongates once then fissions
//   'dip2'   20% — 2 KE dips : one full wobble back to circular, then elongates and fissions
//   'dip3'   15% — 3 KE dips : two full wobbles, then elongates and fissions
//   'stable' 15% — 3 KE dips : three full wobbles, nucleus returns to circular (no fission)
let wobbleMode = 'dip1';

function pickWobbleMode() {
  const r = Math.random();
  if (r < 0.50) return 'dip1';
  if (r < 0.70) return 'dip2';
  if (r < 0.85) return 'dip3';
  return 'stable';
}

// General wobble signal — ph2 ∈ [0,1], returns normWobble ∈ [0,1].
// Continuously differentiable everywhere (zero derivative at all segment joins).
//
//   dip1:   [0,1]       half-cosine 0→1 (pure elongation, 1 minimum at end)
//   dip2:   [0,½]       full cycle 0→1→0  +  [½,1] half-cosine 0→1
//   dip3:   [0,⅓][⅓,⅔] two full cycles  +  [⅔,1]  half-cosine 0→1
//   stable: [0,⅓][⅓,⅔][⅔,1] three full cycles (ends at 0 → no fission)
function wobbleSignal(ph2, mode) {
  if (mode === 'dip1') {
    return (1 - Math.cos(Math.PI * ph2)) / 2;
  }
  const nFull = mode === 'dip2' ? 1 : 2;   // full cycles before elongation (stable uses all 3 as full)
  const nSegs = mode === 'stable' ? 3 : nFull + 1;
  const T = 1 / nSegs;
  if (mode !== 'stable' && ph2 > nFull * T) {
    // Final half-cosine elongation
    const p = (ph2 - nFull * T) / T;
    return (1 - Math.cos(Math.PI * p)) / 2;
  }
  // Full cosine cycle
  const i = Math.min(nSegs - 1, Math.floor(ph2 / T));
  const p = (ph2 - i * T) / T;
  return (1 - Math.cos(2 * Math.PI * p)) / 2;
}

function initNuclei() {
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;

  animParent = generateNucleus(78, 172, cx, cy, currentSeed);
  animProd1  = generateNucleus(47, 103, cx, cy, currentSeed * 1001 + 7);
  animProd2  = generateNucleus(31,  69, cx, cy, currentSeed * 1003 + 13);

  // Daughter radii are fixed — no shrinking as they fly
  prod1R = animProd1.sphereR * 0.7;
  prod2R = animProd2.sphereR * 0.7;

  const byX = (type) => animParent.particles
    .map((p, i) => ({ i, x: p.x }))
    .filter(({i}) => animParent.particles[i].type === type)
    .sort((a, b) => a.x - b.x);

  const toIdx = (prod, type) => prod.particles
    .map((p, i) => ({ i, x: p.x }))
    .filter(({i}) => prod.particles[i].type === type)
    .sort((a, b) => a.x - b.x)
    .map(({i}) => i);

  const parentP = byX('proton');
  const parentN = byX('neutron');
  const p1P = toIdx(animProd1, 'proton');
  const p1N = toIdx(animProd1, 'neutron');
  const p2P = toIdx(animProd2, 'proton');
  const p2N = toIdx(animProd2, 'neutron');

  animMap = [];
  for (let k = 0; k < 47; k++)  animMap.push({ fromIdx: parentP[k].i,      prod: 1, toIdx: p1P[k] });
  for (let k = 0; k < 31; k++)  animMap.push({ fromIdx: parentP[47+k].i,   prod: 2, toIdx: p2P[k] });
  for (let k = 0; k < 103; k++) animMap.push({ fromIdx: parentN[k].i,      prod: 1, toIdx: p1N[k] });
  for (let k = 0; k < 69; k++)  animMap.push({ fromIdx: parentN[103+k].i,  prod: 2, toIdx: p2N[k] });

}

// ─── Frame content renderer — called inside renderAtFrac's zoom transform ─────
function drawAnimContent(t) {
  const showElec = document.getElementById('showElectric').checked;
  const parentMask = [{ cx: animParent.cx, cy: animParent.cy, r: animParent.sphereR + PARTICLE_RADIUS * 3.5 }];

  // Phase 1: still
  if (t <= PH1_END) {
    if (showElec) drawElectricHeatmap(animParent.particles, 0.5, 1.0, parentMask);
    if (!showParticles) drawCloudOutline(animParent.cx, animParent.cy, animParent.sphereR);
    if (showParticles) drawParticles(animParent.particles, 0.5);   // 2x jitter in static scene
    return;
  }

  // Phase 2: excited state
  if (t <= PH2_END) {
    const ph2Frac = (t - PH1_END) / (PH2_END - PH1_END);
    if (showElec) drawElectricHeatmap(animParent.particles, 0.5, 1.0, parentMask);

    // Wobble: mode-driven signal (dip1/dip2/dip3/stable), all smooth, no kinks.
    // deformAmp reaches full by ph2=0.10 so the first wobble is at full visual amplitude.
    const deformAmp  = 0.15 * Math.min(1, ph2Frac / 0.10);
    const normWobble = wobbleSignal(ph2Frac, wobbleMode);    // 0=circular, 1=max oblong
    const wobble     = deformAmp * normWobble;
    const scaleAlong = 1 + wobble;
    const scalePerp  = 1 / (1 + wobble * 0.7);
    const jitterS    = 0.85 * (1 - normWobble * 0.88);

    const outAmp = PARTICLE_RADIUS * 0.035 * Math.min(1, ph2Frac / 0.12);
    const jx = outAmp * Math.sin(t * 180);
    const jy = outAmp * Math.cos(t * 150);

    const glowIntensity = Math.min(1, ph2Frac / 0.3);

    const ncx = animParent.cx, ncy = animParent.cy;
    const cosA = Math.cos(staticFissAngle), sinA = Math.sin(staticFissAngle);

    if (!showParticles) {
      // Outline: ctx.scale to deform the scalloped circle into an ellipse
      ctx.save();
      ctx.translate(jx, jy);
      ctx.translate(ncx, ncy);
      ctx.rotate(staticFissAngle);
      ctx.scale(scaleAlong, scalePerp);
      ctx.rotate(-staticFissAngle);
      ctx.translate(-ncx, -ncy);
      drawCloudOutline(ncx, ncy, animParent.sphereR);
      ctx.restore();
    } else {
      // Particles: actually move each one along the deformation axis + modulated jitter
      const deformed = animParent.particles.map(p => {
        const rx = p.x - ncx, ry = p.y - ncy;
        const along = rx * cosA + ry * sinA;
        const perp  = -rx * sinA + ry * cosA;
        return { ...p,
          x: ncx + along * scaleAlong * cosA - perp * scalePerp * sinA + jx,
          y: ncy + along * scaleAlong * sinA + perp * scalePerp * cosA + jy,
        };
      });
      drawParticles(deformed, jitterS);
    }
    return;
  }

  // Phase 3: separation (skipped for stable mode — nucleus returned to circular)
  if (wobbleMode === 'stable') {
    if (!showParticles) drawCloudOutline(animParent.cx, animParent.cy, animParent.sphereR);
    if (showParticles)  drawParticles(animParent.particles, 0.5);
    return;
  }
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;
  const sepT      = (t - PH2_END) / (1.0 - PH2_END);
  const shootT    = Math.min(1, sepT / 0.075);
  const shootEase = Math.min(1, 3 * shootT * shootT * shootT);  // s = 3t³
  const rearT     = Math.min(1, sepT / 0.05);
  const rearEase  = rearT * rearT * (3 - 2 * rearT);

  const cosA = Math.cos(staticFissAngle), sinA = Math.sin(staticFissAngle);
  // Scale shoot distance so daughters exit the visible area at any zoom level
  const exitDiag = Math.sqrt(W * W + H * H);
  const base1 = Math.max(cx + prod1R + PARTICLE_RADIUS + 30 + W * 0.2,
                         exitDiag / (2 * viewZoom) + prod1R + PARTICLE_RADIUS + 30);
  const base2 = Math.max(cx + prod2R + PARTICLE_RADIUS + 30 + W * 0.2,
                         exitDiag / (2 * viewZoom) + prod2R + PARTICLE_RADIUS + 30);
  const sh1dx = -cosA * base1, sh1dy = -sinA * base1;
  const sh2dx =  cosA * base2, sh2dy =  sinA * base2;

  const grp1cx = cx + sh1dx * shootEase;
  const grp1cy = cy + sh1dy * shootEase;
  const grp2cx = cx + sh2dx * shootEase;
  const grp2cy = cy + sh2dy * shootEase;

  const radiusT    = Math.min(1, sepT / 0.0075);
  const radiusEase = radiusT * radiusT * (3 - 2 * radiusT);
  const r1 = animParent.sphereR + (prod1R - animParent.sphereR) * radiusEase;
  const r2 = animParent.sphereR + (prod2R - animParent.sphereR) * radiusEase;

  const pos1 = [], pos2 = [];
  for (const m of animMap) {
    const from = animParent.particles[m.fromIdx];
    const to   = m.prod === 1 ? animProd1.particles[m.toIdx] : animProd2.particles[m.toIdx];
    const sdx  = m.prod === 1 ? sh1dx : sh2dx;
    const sdy  = m.prod === 1 ? sh1dy : sh2dy;
    let x = from.x + (to.x - from.x) * rearEase + sdx * shootEase;
    let y = from.y + (to.y - from.y) * rearEase + sdy * shootEase;
    const residualAmp = PARTICLE_RADIUS * 0.275 * Math.max(0, 1 - sepT / 0.15);
    if (residualAmp > 0) {
      const i = m.fromIdx;
      x += residualAmp * (Math.sin(t*157+i*1.73)*0.45 + Math.sin(t*241+i*3.07)*0.35 + Math.sin(t*389+i*5.31)*0.20);
      y += residualAmp * (Math.sin(t*179+i*2.39)*0.45 + Math.sin(t*263+i*4.13)*0.35 + Math.sin(t*421+i*6.71)*0.20);
    }
    const toZ = (m.prod === 1 ? animProd1 : animProd2).particles[m.toIdx].z;
    const z   = from.z + (toZ - from.z) * rearEase;
    (m.prod === 1 ? pos1 : pos2).push({ x, y, z, type: from.type, i: m.fromIdx });
  }

  if (showElec) {
    // Per-daughter field — translate trick keeps viz visible even when off-screen
    const sh1x = cx - grp1cx, sh1y = cy - grp1cy;
    const pos1c = pos1.map(p => ({ ...p, x: p.x + sh1x, y: p.y + sh1y }));
    const mask1 = [{ cx, cy, r: r1 + PARTICLE_RADIUS * 3.5, bleed: PARTICLE_RADIUS * 2.5 }];
    heatmapDirty = true;
    ctx.save(); ctx.translate(-sh1x, -sh1y);
    drawElectricHeatmap(pos1c, 0.5, 1.0, mask1);
    ctx.restore();

    const sh2x = cx - grp2cx, sh2y = cy - grp2cy;
    const pos2c = pos2.map(p => ({ ...p, x: p.x + sh2x, y: p.y + sh2y }));
    const mask2 = [{ cx, cy, r: r2 + PARTICLE_RADIUS * 3.5, bleed: PARTICLE_RADIUS * 2.5 }];
    heatmapDirty = true;
    ctx.save(); ctx.translate(-sh2x, -sh2y);
    drawElectricHeatmap(pos2c, 0.5, 1.0, mask2);
    ctx.restore();

    // Cross-daughter interaction — combined field in the gap between daughters.
    // Uses expanded bounds so off-screen particles still contribute to visible pixels.
    // 'screen' compositing adds this layer without erasing the per-daughter fields above.
    heatmapDirty = true;
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    drawElectricHeatmap([...pos1, ...pos2], 0.5, 1.0, [{
      type: 'capsule',
      cx1: grp1cx, cy1: grp1cy, r1: r1 + PARTICLE_RADIUS * 2,
      cx2: grp2cx, cy2: grp2cy, r2: r2 + PARTICLE_RADIUS * 2,
      bleed: PARTICLE_RADIUS * 5
    }], canvas.width);
    ctx.restore();
  }

  if (!showParticles) drawFissionOutline(grp1cx, grp1cy, r1, grp2cx, grp2cy, r2);
  if (showParticles) drawParticles([...pos1, ...pos2]);

  const PHASE3_MAX_SEPT = (ANIM_T_END - PH2_END) / (1.0 - PH2_END);
  const neutronFrac = sepT / PHASE3_MAX_SEPT;
  const screenDiag  = Math.max(canvas.width, canvas.height);
  for (const n of fissionNeutrons) {
    if (n.absorbed) continue;
    const dist = neutronFrac * n.speed * screenDiag;
    const nx = cx + Math.cos(n.angle) * dist;
    const ny = cy + Math.sin(n.angle) * dist;
    const margin = PARTICLE_RADIUS * 2;
    const halfVW = canvas.width  / (2 * viewZoom);
    const halfVH = canvas.height / (2 * viewZoom);
    if (nx > cx - halfVW - margin && nx < cx + halfVW + margin &&
        ny > cy - halfVH - margin && ny < cy + halfVH + margin) {
      drawNeutron(nx, ny);
    }
  }
}

// ─── Canonical renderer — single source of truth for any scrub position ───────
function renderAtFrac(frac) {
  ctx.fillStyle = '#05040f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!animParent) { drawEnergyGraph(); return; }

  ctx.save();
  const _W = canvas.width, _H = canvas.height;
  ctx.translate(_W / 2, _H / 2);
  ctx.scale(viewZoom, viewZoom);
  ctx.translate(-_W / 2, -_H / 2);

  const showElec = document.getElementById('showElectric').checked;
  const parentMask = [{ cx: animParent.cx, cy: animParent.cy, r: animParent.sphereR + PARTICLE_RADIUS * 3.5 }];

  if (frac < NEUTRON_FRAC) {
    // Neutron flying zone
    if (showElec) drawElectricHeatmap(animParent.particles, 0.5, 1.0, parentMask);
    if (!showParticles) drawCloudOutline(animParent.cx, animParent.cy, animParent.sphereR);
    if (neutronState !== 'idle') {
      const nf = frac / NEUTRON_FRAC;
      const nx = (-PARTICLE_RADIUS - 5) + nf * (neutronImpactX() - (-PARTICLE_RADIUS - 5));
      drawNeutron(nx, animParent.cy);
    }
    if (showParticles) drawParticles(animParent.particles, 0.85);
  } else {
    // Fission zone
    const ff = (frac - NEUTRON_FRAC) / (1 - NEUTRON_FRAC);
    const t = PH1_END + ff * (FISS_STOP_T - PH1_END);
    drawAnimContent(t);
  }

  drawChainOverlay();
  ctx.restore();
  drawEnergyGraph();
  captureFrame();
}

// ─── Prompt fission neutrons ──────────────────────────────────────────────────
let fissionNeutrons = [];  // [{angle, speed}] — generated fresh each Go press

function genFissionNeutrons() {
  const count = Math.random() < 0.5 ? 2 : 3;
  fissionNeutrons = [];
  for (let i = 0; i < count; i++) {
    fissionNeutrons.push({
      angle: Math.random() * Math.PI * 2,
      speed: 2.5 + Math.random() * 1.5,   // 2.5–4.0× normalized, off-screen in first ~25–40%
      absorbed: false,
    });
  }
}

// ─── Neutron state machine ────────────────────────────────────────────────────
let neutronState    = 'idle';
let neutronX        = 0;
let neutronY        = 0;
let neutronLast     = 0;
let neutronRAF      = null;
let staticFissStart = 0;
let staticFissT     = 0;
let staticFissAngle = 0;
let staticNeutronIX = 0;
let staticNeutronIY = 0;

const NEUTRON_FRAC = 0.2;
const ENRICH_ZOOM_SHOW = 0.6;  // show Enrich button at this zoom or below

// ─── Enrich / chain-reaction system ──────────────────────────────────────────
let enrichSites   = [];    // [{cx,cy,state,fissStart,fissT,angle,shakeDur,neutronsEmitted}]
let chainNeutrons = [];    // [{sourceCx,sourceCy,angle,speed,startTime,x,y}]
let chainRAF      = null;
let mainNeutronsEmitted = false;

function emitChainNeutrons(cx, cy) {
  const now  = performance.now();
  const dirs = Array.from(
    { length: 2 + (Math.random() < 0.5 ? 1 : 0) },
    () => Math.random() * Math.PI * 2
  );
  for (const angle of dirs) {
    chainNeutrons.push({
      sourceCx: cx, sourceCy: cy, angle,
      speed: 0.25 + Math.random() * 0.25,  // world px/ms
      startTime: now, x: cx, y: cy,
    });
  }
  ensureChainLoop();
}

function triggerEnrichSite(site) {
  site.state          = 'fission';
  site.fissStart      = performance.now();
  site.angle          = Math.random() * Math.PI * 2;
  site.wobbleMode      = pickWobbleMode();
  site.shakeDur        = (5 + Math.random() * 10) * 100;
  site.fissT           = PH1_END;
  site.neutronsEmitted = false;
}

function updateChain(now) {
  const W = canvas.width, H = canvas.height;
  const sphereR  = animParent ? animParent.sphereR : 40;
  const captureR = sphereR + PARTICLE_RADIUS * 2;
  const playbackSpeed = parseFloat(document.getElementById('playbackSpeed').value);

  // Update neutron positions + check collisions
  for (let i = chainNeutrons.length - 1; i >= 0; i--) {
    const n = chainNeutrons[i];

    const age = now - n.startTime;
    n.x = n.sourceCx + Math.cos(n.angle) * n.speed * age;
    n.y = n.sourceCy + Math.sin(n.angle) * n.speed * age;

    // Remove when well off the visible world
    const margin = 300;
    const vHalfW = W / (2 * viewZoom), vHalfH = H / (2 * viewZoom);
    if (n.x < W/2 - vHalfW - margin || n.x > W/2 + vHalfW + margin ||
        n.y < H/2 - vHalfH - margin || n.y > H/2 + vHalfH + margin) {
      chainNeutrons.splice(i, 1); continue;
    }

    // Check collision with idle enriched sites
    for (const site of enrichSites) {
      if (site.state !== 'idle') continue;
      if (Math.hypot(n.x - site.cx, n.y - site.cy) < captureR) {
        triggerEnrichSite(site);
        chainNeutrons.splice(i, 1);
        break;
      }
    }
  }

  // Advance enriched site fission animations
  for (const site of enrichSites) {
    if (site.state !== 'fission') continue;
    const elapsed = (now - site.fissStart) * playbackSpeed;
    if (elapsed < site.shakeDur) {
      site.fissT = PH1_END + (elapsed / site.shakeDur) * (PH2_END - PH1_END);
    } else {
      site.fissT = PH2_END + Math.min(1, (elapsed - site.shakeDur) / CHAIN_NORMAL_DURATION)
                           * (ANIM_T_END - PH2_END);
    }
    if (site.wobbleMode === 'stable') {
      // No fission — wobble completes, nucleus stabilises, no chain neutrons emitted
      if (site.fissT >= ANIM_T_END) site.state = 'done';
    } else {
      if (!site.neutronsEmitted && site.fissT >= PH2_END) {
        site.neutronsEmitted = true;
        emitChainNeutrons(site.cx, site.cy);
      }
      if (site.fissT >= ANIM_T_END) site.state = 'done';
    }
  }
}

function drawChainOverlay() {
  const sphereR = animParent ? animParent.sphereR : 40;

  for (const site of enrichSites) {
    if (site.state === 'idle') {
      drawCloudOutline(site.cx, site.cy, sphereR);
    } else if (site.state === 'fission') {
      const t = site.fissT;
      const cx = site.cx, cy = site.cy;
      if (t <= PH2_END) {
        const ph2 = (t - PH1_END) / (PH2_END - PH1_END);

        const deformAmp  = 0.15 * Math.min(1, ph2 / 0.10);
        const wobble     = deformAmp * wobbleSignal(ph2, site.wobbleMode || 'dip1');
        const scaleAlong = 1 + wobble;
        const scalePerp  = 1 / (1 + wobble * 0.7);

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(site.angle);
        ctx.scale(scaleAlong, scalePerp);
        ctx.rotate(-site.angle);
        ctx.translate(-cx, -cy);
        drawCloudOutline(cx, cy, sphereR);
        ctx.restore();

        // Excited glow ring (also deformed)
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(site.angle);
        ctx.scale(scaleAlong, scalePerp);
        ctx.rotate(-site.angle);
        ctx.translate(-cx, -cy);
        ctx.beginPath(); ctx.arc(cx, cy, sphereR * (1 + ph2 * 0.08), 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255,45,120,${0.3 + ph2 * 0.5})`;
        ctx.lineWidth   = 3 + ph2 * 5;
        ctx.shadowBlur  = 18 * ph2;
        ctx.shadowColor = '#ff2d78';
        ctx.stroke();
        ctx.restore();
      } else if (site.wobbleMode === 'stable') {
        // No fission — draw stabilised circular nucleus
        drawCloudOutline(cx, cy, sphereR);
      } else {
        const sepT = (t - PH2_END) / (ANIM_T_END - PH2_END);
        const shootEase = Math.min(1, sepT);  // ramp over full CHAIN_NORMAL_DURATION
        const W = canvas.width, H = canvas.height;
        const exitDiag = Math.sqrt(W * W + H * H);
        const base = Math.max(cx + sphereR * 0.7 + 30 + W * 0.2,
                              exitDiag / (2 * viewZoom) + sphereR * 0.7 + 30);
        const d1cx = cx + Math.cos(site.angle + Math.PI) * base * shootEase;
        const d1cy = cy + Math.sin(site.angle + Math.PI) * base * shootEase;
        const d2cx = cx + Math.cos(site.angle)           * base * shootEase;
        const d2cy = cy + Math.sin(site.angle)           * base * shootEase;
        drawFissionOutline(d1cx, d1cy, sphereR * 0.7, d2cx, d2cy, sphereR * 0.6);
      }
    }
  }

  for (const n of chainNeutrons) drawNeutron(n.x, n.y);
}

function ensureChainLoop() {
  if (chainRAF || (neutronState === 'flying' || neutronState === 'fission')) return;
  function chainTick(now) {
    updateChain(now);
    drawStaticFrame();
    const stillActive = chainNeutrons.length > 0 ||
                        enrichSites.some(s => s.state === 'fission');
    chainRAF = stillActive ? requestAnimationFrame(chainTick) : null;
    if (!chainRAF) markPrerenderDone();
  }
  chainRAF = requestAnimationFrame(chainTick);
}

function neutronImpactX() {
  return animParent.cx - animParent.sphereR - PARTICLE_RADIUS;
}

function drawStaticFrame() {
  renderAtFrac(currentScrubFrac);
}

function scrubVal(frac) { return Math.round(frac * 1000); }
function scrubPct(frac) { return Math.round(frac * 100) + '%'; }


function neutronTick(now) {
  if (neutronState !== 'flying') return;
  const dt    = neutronLast ? now - neutronLast : 16;
  neutronLast = now;
  const speed = parseFloat(document.getElementById('neutronSpeed').value);
  neutronX   += speed * 0.25 * dt;

  const nf = Math.max(0, Math.min(1, (neutronX - (-PARTICLE_RADIUS - 5)) /
                                     (neutronImpactX() - (-PARTICLE_RADIUS - 5))));
  currentScrubFrac = nf * NEUTRON_FRAC;
  document.getElementById('scrubSlider').value = scrubVal(currentScrubFrac);
  document.getElementById('scrubPct').textContent = scrubPct(currentScrubFrac);

  if (neutronX + PARTICLE_RADIUS >= animParent.cx - animParent.sphereR) {
    staticNeutronIX  = animParent.cx - animParent.sphereR * 0.85;
    staticNeutronIY  = animParent.cy;
    neutronState     = 'fission';
    staticFissStart  = now;
    wobbleMode     = isFirstFission ? 'dip1' : pickWobbleMode();
    isFirstFission = false;
    SHAKE_DURATION = (5 + Math.random() * 10) * 100;   // 500–1500 ms (1 unit = 100 ms)
    resetExcitedSpots();
    staticFissT      = PH1_END;
    currentScrubFrac = NEUTRON_FRAC;
    document.getElementById('scrubSlider').value = scrubVal(NEUTRON_FRAC);
    document.getElementById('scrubPct').textContent = scrubPct(NEUTRON_FRAC);
    neutronRAF = requestAnimationFrame(fissionTick);
    return;
  }

  updateParticleJitter(animParent.particles.length, 1, true);  // slow before neutron hits
  renderAtFrac(currentScrubFrac);
  neutronRAF = requestAnimationFrame(neutronTick);
}

function fissionTick(now) {
  if (neutronState !== 'fission') return;
  updateParticleJitter(animParent.particles.length);
  const playbackSpeed = parseFloat(document.getElementById('playbackSpeed').value);
  const elapsed = (now - staticFissStart) * playbackSpeed;
  if (elapsed < SHAKE_DURATION) {
    staticFissT = PH1_END + (elapsed / SHAKE_DURATION) * (PH2_END - PH1_END);
  } else {
    staticFissT = Math.min(FISS_STOP_T, PH2_END + ((elapsed - SHAKE_DURATION) / NORMAL_DURATION) * (ANIM_T_END - PH2_END));
  }
  // Check fission neutron collisions with enriched sites every frame after split
  if (staticFissT > PH2_END) {
    const sepT2 = (staticFissT - PH2_END) / (1.0 - PH2_END);
    const PMAX  = (ANIM_T_END - PH2_END) / (1.0 - PH2_END);
    const nFrac = Math.min(1, sepT2 / PMAX);
    const ncx   = canvas.width / 2, ncy = canvas.height / 2;
    const nDiag = Math.max(canvas.width, canvas.height);
    const sphR  = animParent.sphereR;
    const capR  = sphR + PARTICLE_RADIUS * 2;
    for (const n of fissionNeutrons) {
      if (n.absorbed) continue;
      const dist = nFrac * n.speed * nDiag;
      const nx = ncx + Math.cos(n.angle) * dist;
      const ny = ncy + Math.sin(n.angle) * dist;
      for (const site of enrichSites) {
        if (site.state !== 'idle') continue;
        if (Math.hypot(nx - site.cx, ny - site.cy) < capR) {
          n.absorbed = true;
          triggerEnrichSite(site);
          break;
        }
      }
    }
  }
  updateChain(now);
  const ff = (staticFissT - PH1_END) / (FISS_STOP_T - PH1_END);
  currentScrubFrac = NEUTRON_FRAC + Math.min(1, ff) * (1 - NEUTRON_FRAC);
  document.getElementById('scrubSlider').value = scrubVal(currentScrubFrac);
  document.getElementById('scrubPct').textContent = scrubPct(currentScrubFrac);
  renderAtFrac(currentScrubFrac);
  if (staticFissT < FISS_STOP_T) {
    neutronRAF = requestAnimationFrame(fissionTick);
  } else {
    neutronState = 'done';
    document.getElementById('goBtn').textContent = '▶';
    document.getElementById('goBtn').classList.remove('running');
    document.getElementById('replayBtn').disabled = false;
    document.getElementById('scrubReplayBtn').disabled = false;
    ensureChainLoop();
    // If no chain reaction sites are active, mark pre-render done now
    if (!chainRAF) markPrerenderDone();
  }
}

// ─── Speed lines (neutron speed indicator) ────────────────────────────────────
function drawSpeedLines() {
  const canvas = document.getElementById('speedLinesCanvas');
  if (!canvas) return;
  const c = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const slider = document.getElementById('neutronSpeed');
  const min = parseFloat(slider.min), max = parseFloat(slider.max);
  const t   = (parseFloat(slider.value) - min) / (max - min);  // 0..1

  c.clearRect(0, 0, w, h);

  // 3 right-aligned horizontal lines; lengths scale with slider
  const maxLen  = w - 2;
  const scales  = [0.65, 1.0, 0.80];
  const ys      = [h * 0.25, h * 0.5, h * 0.75];

  scales.forEach((scale, i) => {
    const tFloor = 0.18 + 0.82 * t;  // minimum ~18% even at slider min
    const len = tFloor * maxLen * scale;
    const x = w - len;
    const y = Math.round(ys[i]);

    // outer glow
    c.save();
    c.strokeStyle = 'rgba(180,180,210,0.25)';
    c.lineWidth = 4;
    c.beginPath(); c.moveTo(x, y); c.lineTo(w, y); c.stroke();

    // core
    c.strokeStyle = 'rgba(210,210,230,0.85)';
    c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(x, y); c.lineTo(w, y); c.stroke();
    c.restore();
  });
}

// ─── Neutron icon ─────────────────────────────────────────────────────────────
const neutronIconJitter = { x: 0, y: 0 };

function drawNeutronIconToCanvas(canvas) {
  if (!canvas) return;
  const c = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const R  = Math.min(w, h) * 0.32;
  const cx = w / 2 + neutronIconJitter.x;
  const cy = h / 2 + neutronIconJitter.y;

  c.clearRect(0, 0, w, h);

  // Base fill
  const baseGrad = c.createRadialGradient(cx, cy, 0, cx, cy, R * 1.1);
  baseGrad.addColorStop(0,    '#70707f');
  baseGrad.addColorStop(0.82, '#70707f');
  baseGrad.addColorStop(1,    'rgba(0,0,0,0)');
  c.fillStyle = baseGrad;
  c.beginPath(); c.arc(cx, cy, R * 1.1, 0, Math.PI * 2); c.fill();

  // Inner glow
  const innerGlow = c.createRadialGradient(cx, cy, 0, cx, cy, R);
  innerGlow.addColorStop(0,   '#b0b0c4');
  innerGlow.addColorStop(0.5, '#b0b0c4');
  innerGlow.addColorStop(1,   'rgba(0,0,0,0)');
  c.globalAlpha = 0.82;
  c.fillStyle = innerGlow;
  c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2); c.fill();
  c.globalAlpha = 1;
}

function drawNeutronIcon() {
  drawNeutronIconToCanvas(document.getElementById('neutronIconCanvas'));
}

function neutronIconLoop() {
  neutronIconJitter.x += (Math.random() - 0.5) * 0.7;
  neutronIconJitter.y += (Math.random() - 0.5) * 0.7;
  neutronIconJitter.x *= 0.78;
  neutronIconJitter.y *= 0.78;
  drawNeutronIcon();
  requestAnimationFrame(neutronIconLoop);
}
neutronIconLoop();

// ─── Nucleus button icon (New button) ─────────────────────────────────────────
// ~62 particles (25% of main 250-nucleon nucleus), sphere-packed, fixed seed.
// Same gradient+shadowBlur style as drawParticles().
const nucleusIconParticles = (() => {
  const ICON_R = 4;   // particle radius in icon px
  const nP = 20, nN = 42, nTotal = nP + nN;
  const packFrac = 0.62;
  const vol    = nTotal * (4/3 * Math.PI * ICON_R ** 3) / packFrac;
  const sphR   = Math.cbrt(vol * 3 / (4 * Math.PI)) * 1.05;
  const minD2  = (ICON_R * 2.05) ** 2;

  let s = 0x9e3779b9;
  const rand = () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };

  const pts = [];
  let tries = 0;
  while (pts.length < nTotal && tries < nTotal * 300) {
    tries++;
    const r3 = rand(), th = Math.acos(2 * rand() - 1), ph = rand() * 2 * Math.PI;
    const r  = sphR * Math.cbrt(r3);
    const ox = r * Math.sin(th) * Math.cos(ph);
    const oy = r * Math.sin(th) * Math.sin(ph);
    const oz = r * Math.cos(th);
    let ok = true;
    for (const q of pts) {
      if ((ox-q.ox)**2 + (oy-q.oy)**2 + (oz-q.oz)**2 < minD2) { ok = false; break; }
    }
    if (ok) pts.push({ ox, oy, oz, type: pts.length < nP ? 'proton' : 'neutron', jx: 0, jy: 0 });
  }
  return pts.sort((a, b) => a.oz - b.oz);  // back-to-front
})();

function drawNucleusIcon(canvas) {
  if (!canvas) return;
  const c = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const cx = w / 2 - 6, cy = h / 2;
  const R = 4;

  c.clearRect(0, 0, w, h);

  for (const p of nucleusIconParticles) {
    const px = cx + p.ox + p.jx;
    const py = cy + p.oy + p.jy;
    const isProton = p.type === 'proton';
    const mid  = isProton ? '#ff1a65' : '#70707f';
    const core = isProton ? '#ff80b0' : '#b0b0c4';

    const baseGrad = c.createRadialGradient(px, py, 0, px, py, R * 1.1);
    baseGrad.addColorStop(0,    mid);
    baseGrad.addColorStop(0.82, mid);
    baseGrad.addColorStop(1,    'rgba(0,0,0,0)');
    c.fillStyle = baseGrad;
    c.beginPath(); c.arc(px, py, R * 1.1, 0, Math.PI * 2); c.fill();

    const innerGlow = c.createRadialGradient(px, py, 0, px, py, R);
    innerGlow.addColorStop(0,   core);
    innerGlow.addColorStop(0.5, core);
    innerGlow.addColorStop(1,   'rgba(0,0,0,0)');
    c.save();
    c.shadowColor = core;
    c.shadowBlur  = 4;
    c.globalAlpha = 0.82;
    c.fillStyle = innerGlow;
    c.beginPath(); c.arc(px, py, R, 0, Math.PI * 2); c.fill();
    c.restore();
    c.globalAlpha = 1;
  }
}

function nucleusIconLoop() {
  for (const p of nucleusIconParticles) {
    p.jx += (Math.random() - 0.5) * 0.7;
    p.jy += (Math.random() - 0.5) * 0.7;
    p.jx *= 0.78;
    p.jy *= 0.78;
  }
  drawNucleusIcon(document.getElementById('newBtnNucleus'));
  requestAnimationFrame(nucleusIconLoop);
}
nucleusIconLoop();

// ─── Controls ─────────────────────────────────────────────────────────────────
// ─── Pre-render + smooth playback ─────────────────────────────────────────────
let isFirstFission   = true;  // first run always uses dip1 mode
let prerenderFrames  = [];   // ImageBitmap[]
let prerenderFracs   = [];   // currentScrubFrac at each frame
let prerenderTimes   = [];   // performance.now() at capture
let prerenderActive  = false;
let prerenderPending = 0;
let prerenderAllDone = false;
let prerenderSlot    = 0;
let playbackRAF      = null;
let playbackStartT   = 0;
let playbackStartRealT     = 0;
let pausedInPrerender      = false;   // paused during prerender playback
let pausedPlaybackElapsed  = 0;       // raw ms elapsed when paused

function captureFrame() {
  if (!prerenderActive) return;
  const slot = prerenderSlot++;
  prerenderFrames.push(null);
  prerenderFracs.push(currentScrubFrac);
  prerenderTimes.push(performance.now());
  prerenderPending++;
  createImageBitmap(canvas).then(bmp => {
    prerenderFrames[slot] = bmp;
    prerenderPending--;
    if (prerenderAllDone && prerenderPending === 0) startPlayback();
  });
}

function markPrerenderDone() {
  if (!prerenderActive || prerenderAllDone) return;
  prerenderAllDone = true;
  if (prerenderPending === 0) startPlayback();
}

function startPlayback() {
  prerenderActive = false;
}

function playbackLoop(now) {
  const n = prerenderFrames.length;
  if (!n) return;

  const speed   = parseFloat(document.getElementById('playbackSpeed').value);
  const elapsed = (now - playbackStartRealT) * speed;
  const animEnd = prerenderTimes[n - 1] - prerenderTimes[0];

  // Binary search for the frame whose capture time <= elapsed
  let lo = 0, hi = n - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (prerenderTimes[mid] - prerenderTimes[0] <= elapsed) lo = mid; else hi = mid - 1;
  }
  const idx = lo;

  if (prerenderFracs[idx] !== undefined) {
    currentScrubFrac = prerenderFracs[idx];
    renderAtFrac(currentScrubFrac);
    document.getElementById('scrubSlider').value = scrubVal(currentScrubFrac);
    document.getElementById('scrubPct').textContent = scrubPct(currentScrubFrac);
  }

  if (elapsed < animEnd) {
    playbackRAF = requestAnimationFrame(playbackLoop);
  } else {
    // Hold last frame, mark done
    playbackRAF = null;
    document.getElementById('goBtn').textContent = '▶';
    document.getElementById('goBtn').classList.remove('running');
    document.getElementById('replayBtn').disabled = false;
    document.getElementById('scrubReplayBtn').disabled = false;
  }
}

function resetPrerender() {
  if (playbackRAF) { cancelAnimationFrame(playbackRAF); playbackRAF = null; }
  prerenderFrames = []; prerenderFracs = []; prerenderTimes = [];
  prerenderActive = false; prerenderAllDone = false;
  prerenderPending = 0; prerenderSlot = 0;
  pausedInPrerender = false;
}

document.getElementById('goBtn').addEventListener('click', () => {
  const btn = document.getElementById('goBtn');

  // ── STOP = PAUSE: freeze in place; Go resumes from here ──────────────────
  if (btn.textContent === '⏸') {
    if (neutronRAF)  { cancelAnimationFrame(neutronRAF);  neutronRAF  = null; }
    if (playbackRAF) {
      pausedPlaybackElapsed = performance.now() - playbackStartRealT;
      pausedInPrerender = true;
      cancelAnimationFrame(playbackRAF);
      playbackRAF = null;
    } else {
      pausedInPrerender = false;
    }
    btn.textContent = '▶';
    btn.classList.remove('running');
    return;
  }

  // ── GO: resume if paused, or start fresh ─────────────────────────────────

  // Resume prerender playback from exact pause point
  if (pausedInPrerender) {
    pausedInPrerender  = false;
    playbackStartRealT = performance.now() - pausedPlaybackElapsed;
    btn.textContent = '⏸';
    btn.classList.add('running');
    playbackRAF = requestAnimationFrame(playbackLoop);
    return;
  }

  // Resume live animation from current scrub position
  if (neutronState === 'flying' || neutronState === 'fission') {
    const frac = currentScrubFrac;
    const now  = performance.now();
    if (frac < NEUTRON_FRAC) {
      const nf = frac / NEUTRON_FRAC;
      neutronX    = (-PARTICLE_RADIUS - 5) + nf * (neutronImpactX() - (-PARTICLE_RADIUS - 5));
      neutronY    = animParent.cy;
      neutronLast = 0;
    } else {
      const ff = (frac - NEUTRON_FRAC) / (1 - NEUTRON_FRAC);
      staticFissT = PH1_END + ff * (ANIM_T_END - PH1_END);
      let elapsedAtPos;
      if (staticFissT <= PH2_END) {
        elapsedAtPos = (staticFissT - PH1_END) / (PH2_END - PH1_END) * SHAKE_DURATION;
      } else {
        elapsedAtPos = SHAKE_DURATION + (staticFissT - PH2_END) / (ANIM_T_END - PH2_END) * NORMAL_DURATION;
      }
      const pbSpeed = parseFloat(document.getElementById('playbackSpeed').value);
      staticFissStart = now - elapsedAtPos / pbSpeed;
    }
    btn.textContent = '⏸';
    btn.classList.add('running');
    neutronRAF = requestAnimationFrame(frac < NEUTRON_FRAC ? neutronTick : fissionTick);
    return;
  }

  // Fresh start — choose fission axis before wobble so elongation and split
  // always go in the same direction.
  resetPrerender();
  prerenderActive  = true;
  prerenderAllDone = false;
  prerenderPending = 0;
  prerenderSlot    = 0;
  prerenderFrames  = [];
  prerenderFracs   = [];
  prerenderTimes   = [];

  mainNeutronsEmitted = false;
  chainNeutrons       = [];
  for (const s of enrichSites) s.state = 'idle';
  heatmapDirty    = true;
  staticFissAngle = (Math.random() - 0.5) * Math.PI;   // fission axis chosen early
  genFissionNeutrons();
  neutronState = 'flying';
  neutronX     = -PARTICLE_RADIUS - 5;
  neutronY     = animParent.cy;
  neutronLast  = 0;
  egCtx.clearRect(0, 0, egCanvas.width, egCanvas.height);
  maxRevealedFrac = 0;
  document.getElementById('scrubBar').classList.add('visible');
  document.getElementById('scrubSlider').value = 0;
  document.getElementById('scrubPct').textContent = '0%';
  document.getElementById('replayBtn').disabled = false;
  document.getElementById('scrubReplayBtn').disabled = false;
  btn.textContent = '⏸';
  btn.classList.add('running');
  neutronRAF = requestAnimationFrame(neutronTick);
});

document.getElementById('neutronSpeed').addEventListener('input', function () {
  drawSpeedLines();
});

function doReplay() {
  if (!animParent || !prerenderFrames.length) return;
  if (neutronRAF)  { cancelAnimationFrame(neutronRAF);  neutronRAF  = null; }
  if (playbackRAF) { cancelAnimationFrame(playbackRAF); playbackRAF = null; }
  currentScrubFrac = 0;
  maxRevealedFrac  = 0;
  egCtx.clearRect(0, 0, egCanvas.width, egCanvas.height);
  document.getElementById('scrubSlider').value = 0;
  document.getElementById('scrubPct').textContent = '0%';
  playbackStartRealT = performance.now();
  document.getElementById('goBtn').textContent = '⏸';
  document.getElementById('goBtn').classList.add('running');
  playbackRAF = requestAnimationFrame(playbackLoop);
}
document.getElementById('replayBtn').addEventListener('click', doReplay);
document.getElementById('scrubReplayBtn').addEventListener('click', doReplay);

document.getElementById('scrubSlider').addEventListener('input', function () {
  if (neutronRAF)  { cancelAnimationFrame(neutronRAF);  neutronRAF  = null; }
  if (playbackRAF) { cancelAnimationFrame(playbackRAF); playbackRAF = null; }
  if (neutronState === 'flying' || neutronState === 'fission') neutronState = 'done';
  const gbtn = document.getElementById('goBtn');
  if (gbtn.textContent === '⏸') { gbtn.textContent = '▶'; gbtn.classList.remove('running'); }
  currentScrubFrac = parseInt(this.value) / 1000;
  document.getElementById('scrubPct').textContent = scrubPct(currentScrubFrac);
  heatmapDirty = true;
  renderAtFrac(currentScrubFrac);
});

document.getElementById('enrichBtn').addEventListener('click', () => {
  if (!animParent) return;
  const W = canvas.width, H = canvas.height;
  const vHalfW = W / (2 * viewZoom);
  const vHalfH = H / (2 * viewZoom);
  const pad = 80;
  const minDist = (animParent.sphereR || 50) * 3.5;
  // Try to place 5 nuclei; skip any candidate that lands too close to existing sites
  for (let n = 0; n < 5; n++) {
    let cx, cy, attempts = 0;
    do {
      cx = W/2 - vHalfW + pad + Math.random() * (vHalfW * 2 - pad * 2);
      cy = H/2 - vHalfH + pad + Math.random() * (vHalfH * 2 - pad * 2);
      attempts++;
    } while (attempts < 60 && (
      Math.hypot(cx - animParent.cx, cy - animParent.cy) < minDist ||
      enrichSites.some(s => Math.hypot(cx - s.cx, cy - s.cy) < minDist)
    ));
    if (attempts < 60) enrichSites.push({ cx, cy, state: 'idle', fissStart: 0, fissT: PH1_END,
                                          angle: 0, shakeDur: 600, neutronsEmitted: false });
  }
  drawStaticFrame();
});

let idleParticleRAF = null;
